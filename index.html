r Supplying Medicines\n●\n\nThe Central Supply of Medicines (Central de Aprovisionamento de\nMedicamentos) (CAME) is an institution under the Ministry of Health to supply\nthe Sao Tomean market with medicines and hospital consumables. The CAME in\nconnection with the National Medicines Fund (Fundo Nacional de\nMedicamentos) (FNM), a semi-autonomous governmental organization, is\nresponsible for procuring, stocking and distributing essential medicines for the\npublic sector on behalf of Ministry of Health (Ministry of Health of STP, n.d.-b).\n\n●\n\nAll medicines in Sao Tome and Principe are imported (Martinho do Rosário,\n2008). As of 2007, drugs are procured through the International Dispensary\nAssociation (IDA). The IDA ensures quality, though prices are low (Martinho do\nRosário, 2008).\n\nReference: Sao Tome principe | AUDA-NEPAD- AMRH\n2.6.5 Residence Visa\nFor longer stays, this visa leads to residency and is categorized by purpose. It\nrequires a valid travel document and, for minors, parental authorization.\nApplications are submitted at STP embassies or consulates, with processing up to 30\ndays.\n\f●\n\nFor Subordinate Professional Activity: Submit an employment contract with\na favorable opinion from the Ministry of Labor (issued within 20 days),\nverifying contractual terms and lack of suitable local candidates. Foreign\nworker quotas apply (preference for locals).\n\n●\n\nFor Independent Professional Activity: Prove foreign investment or sufficient\nfunds for self-employment, plus qualifications where needed.\n\n●\n\nFor Research or Highly Qualified Positions: Affiliation with recognized\nresearch centers, a job offer, and return guarantees if stay becomes irregular.\n\n●\n\nFor Study, Exchange, Internship, or Volunteer: Valid travel document;\nminors need parental consent.\n\n●\n\nFor Family Reunification: SMF notifies the Ministry of Foreign Affairs for\nimmediate issuance post-approval.\n\nAuthorizations and Procedures for Obtaining Residency\nTemporary Residence Certificate:Permanent Residence Certificate:\nOnce in STP on a residence visa, apply for a residence certificate at the SMF office or\nthrough a legal representative. General conditions include a valid visa, police\nclearance, health certificate, and proof of accommodation/funds. Processing takes\n15-30 days, with fees around STN 5,000-10,000 ($220-450).\nTemporary Residence Certificate:Valid for one year from issuance, renewable\nannually or upon changes in details. Allows work/study as per visa.\nPermanent Residence Certificate:No expiry but renew every five years or on\nchanges. Granted after several years of temporary residency, demonstrating\nintegration (e.g., language, contributions).\nExceptional Regimes\nPer a Government Decree from April 2017, citizens of certain countries (e.g., EU,\nUSA, Canada) enjoy visa-free entry for up to 15 days for tourism/business. US\ncitizens can stay up to 30 days visa-free. Chinese holders of diplomatic/special\npassports get 15 days exemption, following diplomatic reestablishment. Recent visa\nwaivers (ratified 2025) with Ghana, Mozambique, Colombia, and Dominica allow\nreciprocal 15-day stays, enhancing regional ties. Extensions are possible via SMF for\njustified reasons.\nReference: Visa and Residency for Foreigners in São Tomé and Príncipe ::\nSaoTomeExpert\n\n\f2.6.6 Religious Freedom Laws\n2.6.6.1 Constitutional Guarantees\nThe Constitution of the Democratic Republic of São Tomé and Príncipe, in its most\nrecent revision of 2003, provides robust guarantees of religious freedom. Article 27\nexplicitly declares that freedom of conscience, religion, and worship is inviolable\nspecifying that no citizen may be persecuted, deprived of rights, or exempted from\ncivic duties on account of religious conviction or practice. Article 8 establishes São\nTomé and Príncipe as a secular (lay) state, stipulating a clear separation between state\ninstitutions and all religious institutions. Article 265 criminalizes 'religious coercion',\ndefined as compelling a person to participate or abstain from religious worship, and\nprovides for up to six months' imprisonment for violations.\nReference:\n●\n●\n\nConstitute Project. Constitution of São Tomé and Príncipe (2003).\nFreedom of Thought Report: São Tomé and Príncipe. Op. cit. Humanists\nInternational.\n\n2.6.6.2 Religious Registration Process\nReligious groups must register with the government of São Tomé and Príncipe;\nhowever, the process is not onerous or discriminatory. The U.S. State Department's\n2019 and 2020 Religious Freedom Reports confirm that no group has ever been denied\nregistration, and no unregistered group has been restricted from operation. The\nregistration procedure requires:\n•\n•\n•\n•\n•\n\nSubmission of a written letter requesting authorization from the Ministry of\nJustice and Human Rights.\nSubmission of the group's statutes and meeting minutes to a notary public,\nsigned by the president and secretary.\nCertification from the Registrar's Office that no existing organization bears\nthe same name.\nPayment of notarial fees (historically approximately USD 45–50).\nPublication of approval in the official government gazette.\n\nOnce registered, a religious group enjoys the same tax-exempt status as registered\nnonprofit organizations and need not re-register. Foreign religious groups that fail to\nregister are subject to fines and possible expulsion, making timely registration a\npriority for the Coptic mission team.\n\n\fReferences :\nU.S. Department of State. 2019 Report on International Religious Freedom: São\nTomé and Príncipe.", "references": []}]}, "3": {"name": "Country Segmentation", "num": 3, "sections": [{"num": "3.1", "title": "Population Overview (2024–2026 Estimates)", "content": "3.1 Population Overview (2024–2026 Estimates)\nThe population of São Tomé and Príncipe is characterized by steady growth and a\nhigh level of urbanization.\nTotal Population (2026 projection): ~244,994\n● Total Population (2024 estimate): ~235,536\n● Annual Growth Rate: ~1.97% to 2.02%\n● Population Density: 255 people per km² – the ideal healthy density is 100-150\nper km²\n● Urban Population: 78.9% (approximately 193,300 people)\n● Population density: 257.7 per km2\n● The demographics of Sao Tome and Principe ( 2025 )\nConstitutes of ~124,000 women and 123,000 men, which means there are 992 men\nper 1000 women.\n●\n\nAge distribution:\n50.2% of population (123,994) is 19 or younger,\n46.5% of population (114,756) is between age 20 and 64 and\n3.1% of population (7,583) is over 65.\n●\n\nReference: Population of Sao Tome and Principe. 2026 demographics: density,\nratios, growth rate, clock, rate of men to women.", "references": []}, {"num": "3.2", "title": "Age Structure and Youth Demographics", "content": "3.2 Age Structure and Youth Demographics\nThe country has one of the youngest populations in the world, with a median age of\napproximately 19.7 to 20.5 years.\n\fAge Group\n\nPercentage of Population\n\n0–14 years\n\n~37% to 39%\n\n15–64 years\n\n~57% to 59%\n\n65+ years\n\n~2.9% to 4%\n\nKey Characteristics\nRepresents a high \"youth\nbulge\" and future labor force.\nThe primary working-age\npopulation.\nA very small elderly cohort.\n\nDetailed 5-Year Cohorts\nAge Range\n\nShare of\nPopulation\n\nNotable Trends\n\n0–4 years\n\n13.2%\n\nThe largest cohort; reflects high birth rates (~22–23 per\n1,000).\n\n5–9 years\n\n12.2%\n\nHigh demand for primary education infrastructure.\n\n10–14 years\n\n12.1%\n\nSignificant \"youth momentum\" for the coming decade.\n\n15–19 years\n\n11.5%\n\nTransition into the labor market and higher education.\n\n20–24 years\n\n9.5%\n\nPrimary group for internal migration to urban centers.\n\n25–34 years\n\n13.8%\n\n35–49 years\n\n14.2%\n\n50–64 years\n\n9.6%\n\n65+ years\n\n3.9%\n\nCore of the young professional and parenting\ndemographic.\nEstablished workforce; population starts to thin\nsignificantly here.\nTransition toward senior status; lower life expectancy in\npast decades.\nVery small percentage compared to global averages\n(World avg ~10%).\n\nFertility Rate: 3.5 to 3.6 children born per woman (declining from over 6.0 in\nthe 1970s).\n● Life Expectancy: 70.3 years total (Female: 74.3, Male: 66.7).\n●", "references": []}, {"num": "3.3", "title": "Race and Ethnic Groups", "content": "3.3 Race and Ethnic Groups\nThe population is overwhelmingly of African and mixed-race descent, stemming from\ncenturies of migration and the legacy of the plantation (roça) system.\nRacial Breakdown: African: ~70%\n● Mixed (Mestiço): ~30% (primarily of Portuguese and African ancestry)\nIdentifiable Ethnic Groups:\n●\n\n\f●\n●\n●\n●\n●\n●\n\nMestiços: Descendants of Portuguese colonists and African slaves.\nAngolares: Descendants of Angolan shipwreck survivors (traditionally fishers).\nForros: Descendants of freed slaves from the era of abolition.\nServiçais: Contract laborers from Angola, Mozambique, and Cape Verde.\nTongas: Children of serviçais born on the islands.\nEuropeans: Primarily Portuguese", "references": []}, {"num": "3.4", "title": "Population Distribution", "content": "3.4 Population Distribution\n●\n\nCapital City (São Tomé): The largest urban center, holding nearly 150,000\nresidents.\n\n●\n\nPríncipe Island: Home to approximately 4% of the population (~9,800 people).\n\n●\n\nRegional Trends: * Urbanization: Growth is concentrated in the capital and\nsurrounding districts (such as Água Grande).\n\n●\n\nPríncipe Status: Príncipe is an autonomous region with its own local government.", "references": []}, {"num": "3.5", "title": "Vital Statistics & Family Composition", "content": "3.5 Vital Statistics & Family Composition\n3.5.1. Birth Rate\nThe crude birth rate for São Tomé and Príncipe in 2024 was approximately 30.0\nbirths per 1,000 population, rising 6.4% from the 2023 figure of 28.2 per 1,000.\n[Macrotrends / World Bank, 2024]\n3.5.2. Death Rate\nIn 2022, the crude death rate for São Tomé and Príncipe was 5.8 deaths per 1,000\npopulation, having declined steadily from 12.1 per 1,000 in 1973.\n[Knoema / World Bank, 2022]\nFor comparison, a 2021 CIA World Factbook estimate placed the death rate at 6.33\ndeaths per 1,000 population.\n[IndexMundi / CIA World Factbook, 2021 est.]\n3.5.3. Marriage Rate\nFormal civil marriages are not common in São Tomé and are practiced mainly by the\neducated elite; the conventional conjugal bond is the customary or informal union.\nPolygamy is also widespread, with a legally wedded man often being romantically\ninvolved with several other women.\n[Transcontinental Times, 2022]\nNo internationally standardized crude marriage rate (marriages per 1,000\npopulation) is currently published for São Tomé and Príncipe by the UN or World\nBank, due to incomplete civil registration data. UNICEF has noted that the civil\n\fregistration system in São Tomé and Príncipe is still developing its capacity to reliably\nrecord all vital events including marriages and deaths.\n[UNICEF CRVS Country Profile]\n3.5.4. Divorce Rate\nNo standalone national divorce rate statistic is available for São Tomé and Príncipe\nfrom major international databases, primarily due to gaps in civil registration.\nDivorce data for sub-Saharan African countries are limited, but where data exist,\ndivorce rates are substantially lower than in Western nations.\n[Healthy Marriage Info / National Fatherhood Initiative, Marriage Trends in Africa]\nUnder the country's Family Code, both husband and wife have equal rights to file for\ndivorce, which can be granted based on mutual consent or fault of one spouse;\nparental responsibility is shared after divorce is finalized.\n[Marry on Chain / São Tomé and Príncipe Family Law, 2025]\n3.5.5. Single Mother / Female-Headed Household Rate\nAccording to World Bank data, 39% of households in São Tomé and Príncipe were\nheaded by women as of 2009 — the most recent internationally reported figure\navailable.\n[CEIC Data / World Bank, 2009]\nA Pew Research Center global survey found that approximately 19% of children in\nSão Tomé and Príncipe live in single-parent households, placing the country among\nthe highest globally — ranking third worldwide after the United States and the\nUnited Kingdom.\n[Pew Research Center, 2019 (via Finances Online)]\nA São Tomé social protection registry found that of families living in extreme\npoverty, 73% are headed by women and 27% by men — a pattern directly attributed\nto the high number of single mothers responsible for their families.\n[Rio Times Online / São Tomé Social Protection Registry, 2023]\nMore than 71.3% of women-led households in São Tomé and Príncipe experience\nextreme poverty, compared to 64.3% of male-led households.\n[The Borgen Project, Women's Rights in São Tomé and Príncipe]\n3.5.6 Summary Table\n\nIndicator\n\nValue\n\nYear\n\nSource\n\nBirth Rate\n\n~30.0 per 1,000\n\n2024\n\nWorld Bank / Macrotrends\n\nDeath Rate\n\n~5.8 per 1,000\n\n2022\n\nWorld Bank / Knoema\n\n\fIndicator\n\nValue\n\nYear\n\nSource\n\nMarriage Rate\n\nNot standardized\n\n—\n\nUNICEF CRVS\n\nDivorce Rate\n\nNot standardized\n\n—\n\nCivil reg. gaps\n\nFemale-Headed Households\n\n~39% of HH\n\n2009\n\nWorld Bank / CEIC\n\nChildren in Single-Parent HH\n\n~19% of children\n\n2019\n\nPew Research Center\n\nFemale-Headed HH in Extreme\nPoverty\n\n73% of poor\nfamilies\n\n2023\n\nSTP Social Protection\nRegistry\n\nNote:\nStandardized marriage and divorce rates per 1,000 population are not reliably\navailable for São Tomé and Príncipe due to gaps in the country's civil registration\nsystem, as acknowledged by UNICEF. Figures from different sources may vary slightly\nbased on methodology and year", "references": []}, {"num": "3.6", "title": "Migration Trends", "content": "3.6 Migration Trends\n● São Tomé and Príncipe (STP) has experienced rising emigration over 2020–2025.\nBy 2023 about 18–20% of the population lived abroad[1][2]. Outflow surged after\n2020’s Covid dip: departures by air fell ~55% in 2020 vs. 2019 but then\nrebounded to ~24,200 in 2023[3] (over +100% relative to 2019).\n● Migration is balanced by sex and skewed young. Recent data show roughly 49–\n51% male vs. female[4]. Over half of emigrants are under age 30 (52% in 2023 vs.\n31% in 2018)[5], reflecting STP’s youthful population.\n● Portugal is the primary destination (~52% of emigrants), followed by Angola\n(17%), Gabon (16%), Cabo Verde (5%), and Equatorial Guinea (5%)[6][7].\nTogether these five countries host ~95% of the diaspora. Immigration into STP is\nminimal (<1% of population)[8].\n● Remittances are very low and falling. Inflows to STP dropped from US$25.2 m in\n2014 to only US$7.7 m in 2022[9]. On average a São Toméan migrant sends just\n≈US$266/year[10]. High transfer costs and lack of formal channels limit\nremittances’ impact.\n● Economic factors drive migration. High youth unemployment (~21% in 2022) and\nlack of jobs/power to grow the economy are cited by migrants[11][12].\nEnvironmental risks (e.g. floods in 2021) and political stability are noted but less\nprominent.\n● STP has no asylum policy or refugee system[13][14]. In late 2022 it joined the\nCPLP visa-free mobility pact, easing migration to Portugal[15]. Government steps\ninclude new tax incentives for emigrants[16]. However, comprehensive migration\nmanagement remains limited.\n\f3.6.1 Migration Flows and Trends\nSão Tomé and Príncipe’s migration is dominated by outflows. In 2020 the diaspora\n(São Toméans living abroad) was ~39,600 people (18.1% of 2020 population)[7].\nRemoteness and lack of local jobs mean net migration is strongly negative. Official\nflight data (STP Customs) show 11,714 departures in 2019, plunging to 5,281 in 2020\n(Covid year) and then rebounding to 24,156 in 2023[3]. (Preliminary Jan–Feb 2024\ndata show 18,641 departures, already exceeding 2019’s total[17].) This trend is\nillustrated below: departures have more than doubled from pre-pandemic levels[3].\n(No up-to-date 2024–2025 totals are yet published by STP or KNOMAD.)\n\nYear\n\nOutbound Departures\n\n% Change vs 2019\n\nNotes\n\n2019\n\n11,714\n\nBaseline\n\nPre-COVID\nbaseline\n\n2020\n\n5,281\n\n–55%\n\nCOVID-19 impact\n\n2021\n\n9,487\n\n–19%\n\nPartial recovery\n\n2022\n\n16,332\n\n+39%\n\nStrong rebound\n\n2023\n\n24,156\n\n+106%\n\nSignificant\nincrease\n\nDespite the surge in departures, official data on immigration inflows are negligible:\nin 2020 only 2,139 foreign residents were recorded (<1% of population)[8], mainly\nfrom Lusophone neighbors. Thus, net migration has been persistently negative\n(more people leaving than arriving) throughout 2020–2023.\n3.6.2 Demographic Profile of Migrants\n● Gender: Migration is nearly gender-balanced. For example, 2020 data show\n52.5% of emigrants were women[7]. Surveys and customs records find ~49%\nmale vs. 51% female[4]. In STP’s small sample surveys, households report\nsimilarly sized shares of male and female migrants[4].\n● Age: Migrants are overwhelmingly young. Customs data show more than half of\ntravelers are under age 30 as of 2023[5] (up from 31% in 2018). This aligns with\nSTP’s population (median age ≈18.6)[18]. Focus groups cite “youth\nunemployment” and desire for education or work abroad. The peak emigrant age\nrange is roughly 20–34.\n● Household role: Most migrants are children of household heads. In surveyed\nmigrant households, migrants were usually sons or daughters[19]. When one\nparent migrates, the other typically remains. Consequences include “care gaps”\nfor the left-behind generation[20][19].\n\f● Internal migration: More than 50% of STP families report at least one internal\nmover (often to the capital)[21]. Rural youth also relocate seasonally (e.g.,\nfishermen). However, STP’s internal flows are modest compared to international\nmigration.\n3.6.3 Destinations and Origins\nSão Toméan emigrants concentrate in a few countries. Destinations: As of 2021,\nabout 51.7% of the diaspora lived in Portugal, 17.2% in Angola, 16.4% in Gabon, with\nCabo Verde and Equatorial Guinea at ~4–5% each[6]. These five countries combined\nhost ~95% of all emigrants[7][6]. (Other destinations, including France and various\nAfrican or European nations, account for the remaining ~5%.) See Table below for\nthe latest shares and estimated counts.\nYear\n\nDestination\n\nShare\n(%)\n\nEst.\nnumber\n\nNotes (Source)\n\n2020\n\nPortugal\n\n51.9%\n\n20,557\n\nIOM/Migrants&Refugees\n(2023)[7]\n\n2020\n\nAngola\n\n17.3%\n\n6,852\n\nIOM/Migrants&Refugees\n(2023)[7]\n\n2020\n\nGabon\n\n16.5%\n\n6,535\n\nIOM/Migrants&Refugees\n(2023)[7]\n\n2020\n\nCabo Verde\n\n4.6%\n\n1,822\n\nIOM/Migrants&Refugees\n(2023)[7]\n\n2020\n\nEquatorial\nGuinea\n\n4.5%\n\n1,782\n\nIOM/Migrants&Refugees\n(2023)[7]\n\n2020\n\nOthers\n\n5.2%\n\n2,053\n\n(remainder)\n\n2021\n\nPortugal\n\n51.7%\n\n20,552\n\nWorld Bank (2025)[6]\n\n2021\n\nAngola\n\n17.2%\n\n6,852\n\nWorld Bank (2025)[6]\n\n2021\n\nGabon\n\n16.4%\n\n6,539\n\nWorld Bank (2025)[6]\n\n2021\n\nCabo Verde\n\n4.5%\n\n1,809\n\nWorld Bank (2025)[6]\n\n2021\n\nEquatorial\nGuinea\n\n4.5%\n\n1,794\n\nWorld Bank (2025)[6]\n\n2021\n\nOthers\n\n5.7%\n\n2,106\n\n(remainder)\n\nCaption: Shares of São Tomé emigrants in top destinations. 2020 data come from an\nIOM/Vatican profile (citing 2020 figures)[7]; 2021 data from World Bank\n(KNOMAD)[6]. “Others” includes all remaining countries.\n\n\f3.6.4 Migration Types and Status\n● Economic and labor migration: Virtually all international emigration is economic\nor family-related. São Toméan migrants generally depart by plane on legal visas\n(work, study, reunification). There is no major guest-worker program; many\nobtain work/residence in Portugal under CPLP terms. Seasonal irregular labor\n(e.g. fishing) is minimal due to no open borders by sea[22].\n● Immigration: Immigration into STP is very low (2,139 in 2020)[8]. Most\nimmigrants are from neighboring lusophone countries (Cape Verde, Angola,\nGabon, Equatorial Guinea) as noted above[23]. There is no formal refugee intake\nor asylum processing[13]; STP does not grant asylum status.\n● Asylum/Refugees: STP signed the 1951 Refugee Convention but has no domestic\nasylum law[14]. UNHCR records show zero registered refugees or asylum-seekers\nin STP as of 2021[24]. Any São Toméans needing protection generally seek it\nabroad (not within STP).\n● Irregular migration: Cases are negligible. STP’s island geography means nearly all\nmovements are documented at airports. The only irregular pattern is visaoverstay, and Frontex reports only a single known irregular São Toméan entry\ninto the EU in 15 years[25]. STP is not a significant transit route or trafficking\nsource (TIP reports have no entries).\n● Internal displacement: Internal (internal) migration mainly follows rural→urban\npaths. Heavy rains/flooding displaced ~500 people in 2021[26], but such\nenvironmental displacement is rare. There is no large-scale displacement crisis.\n3.6.5 Remittances\n● Trends: Remittance inflows to STP are very small and falling. The World Bank\nreports STP received only US$7.7 million in remittances in 2022, down from\nUS$25.2 m in 2014[9] (a >70% drop). Outflows (money sent abroad by emigrants)\ngrew modestly to US$4.38 m in 2022[27].\n● Net flows: As of 2023, STP was still a slight net receiver (net +US$3.3 m)[28].\nGiven GDP ≈US$500 m, remittances contribute only ~1–2% of GDP. The decline is\nattributed to weaker economic ties and possibly tighter banking controls[29].\n● Per-migrant: São Toméan migrants remit far less than peers. A 2025 blog notes\nSão Tomé’s diaspora remits ~US$266 per capita annually, compared to US$1,525\nfor Cabo Verdeans[10]. (Remittance portal data rank STP’s average cost of\nsending at ~12%, higher than regional average[30].)\n● Channels: Remittances in STP are mostly informal cash transfers; formal banking\nnetworks are limited. High fees and lack of access mean many rural families rely\non visitors or postal services. The costly and irregular nature of transfers likely\ndepresses remittance volumes[31][9].\n\f● Household impact: For the poorest households, even small remittances matter\n(e.g. for food or school fees). But overall migration to date has yielded scant\ninvestment in São Tomé’s economy. Social research finds most remittances are\nused for immediate consumption in vulnerable households[9][32].\n3.6.6 Drivers of Migration\n● Economic factors: By far the largest drivers are economic. STP’s economy was\nstagnant (~0% growth in 2022[33]) and offers few formal jobs. Youth\nunemployment (~21% in 2023[11]) and underemployment push young people to\nseek work abroad. Focus groups cited “high food prices and low wages” as key\npush factors[12]. Two-thirds of São Toméans are under 35[11], creating high job\ncompetition.\n● Social and educational factors: Education opportunities motivate migration.\nLimited tertiary education on the islands means many students study abroad and\nstay on. Language/cultural ties to Portugal (colonial legacy) and CPLP channels\nserve as pull factors. Portuguese consular data show many family and student\nvisa applications to Europe.\n● Environmental factors: STP is vulnerable to climate (cyclones, sea-level rise) but\nso far migration for environmental reasons is minimal. The notable event was\nfloods in mid-2021 (500 people displaced)[26]. Some agricultural decline (e.g.\ncocoa shocks) may indirectly push families to diversify through migration, but no\nlarge-scale climate-driven migration has been documented yet.\n● Political context: São Tomé has been politically stable (no conflict-driven\ndiaspora). The main political influences on migration have been policy changes,\ne.g. Angola’s 2000s labor pacts and the 2022 CPLP visa-free agreement[15].\nThere was also minor political unrest in the 1990s-2000s, but not on a scale to\ncreate refugees.\ntimeline\ntitle Key Migration Events (2020–2025)\n2020 : COVID-19 travel restrictions cause ~55% drop in departures[3]\n2021 : Diaspora ~18% of population; internal floods displace 500[7] [26]\n2022 : CPLP visa-free mobility pact signed[15]\n2023 : Departures exceed pre-COVID levels (+106% vs 2019) [3]\n2024 : Preliminary data (Jan–Feb) show continued high outflows[17]\n\n3.6.8 Data Gaps and Resources\n● Coverage: There are no annual official migration statistics published by the STP\ngovernment. Most data come from infrequent surveys or external sources. We\n\n\frely on the 2020 census-based migration profile[7] and a World Bank 2025 study\n(using customs and survey data up to 2023)[2][3].\n● Recent years: Data for 2024–2025 are largely unavailable. We have only early\n2024 border data[17]. The diaspora share for 2023 is projected (World Bank) but\nnot from a new census.\n● Discrepancies: Minor inconsistencies exist between sources. For example, the\nIOM profile[7] and the World Bank 2025 report[6] give virtually identical\ndistributions for 2020 vs. 2021 (differing by ~0.2–0.5% in each category). We\nprioritized the most recent (World Bank 2025) for trend analysis, and used the\nIOM profile for 2020 baselines.\n● Sources checked: We examined STP’s census, IOM/UN migration profiles, World\nBank data portals, UN DESA (KNOMAD), and major development reports. We\nfound no standalone Portuguese-language official migration statistics beyond\ncensus figures. Key data (flows, remittances) come from World Bank and IMF\ndatabases[9][28].\n[1] [13] migrants-refugees.va\nhttps://migrants-refugees.va/it/wp-content/uploads/sites/3/2023/02/2022-CP-SaoTome-and-Principe-.pdf\n[2] [3] [4] [5] [6] [9] [12] [15] [17] [18] [19] [20] [22] [25] [27] [28] [29] [30] [31] [32]\n[33] World Bank Document\nhttps://openknowledge.worldbank.org/bitstreams/ef660a2c-15a3-43c6-abc0940369e16fac/download\n[7] [8] [14] [16] [21] [23] [24] [26] São Tomé and Príncipe - Migrants & Refugees\nSection\nhttps://migrants-refugees.va/country-profile/sao-tome-and-principe/\n[10] [11] Falling Short: Rethinking Migration in São Tomé and Príncipe\nhttps://blogs.worldbank.org/en/peoplemove/falling-short--rethinking-migration-insao-tome-and-principe", "references": [{"source": "migrants-refugees.va", "url": "https://migrants-refugees.va/it/wp-content/uploads/sites/3/2023/02/2022-CP-SaoTome-and-Principe-.pdf"}, {"source": "openknowledge.worldbank.org", "url": "https://openknowledge.worldbank.org/bitstreams/ef660a2c-15a3-43c6-abc0940369e16fac/download"}, {"source": "migrants-refugees.va", "url": "https://migrants-refugees.va/country-profile/sao-tome-and-principe/"}, {"source": "blogs.worldbank.org", "url": "https://blogs.worldbank.org/en/peoplemove/falling-short--rethinking-migration-insao-tome-and-principe"}]}, {"num": "3.7", "title": "Employment Segmentation", "content": "3.7 Employment Segmentation\nThe labor force is segmented into three primary areas, with a notable shift toward\nthe service sector in recent years,\nThe Main employment sectors are services, agriculture, and tourism.\n3.7.1 Sector Breakdown\nSector\nEstimated % of Labor Force\n\nKey Activities\n\n\fServices\n\n~60-65%\n\nAgriculture\n\n~15-20%\n\nIndustry\n\n~15-19%\n\nPublic administration, tourism, retail, and\nsmall-scale trade.\nCocoa (the main export), coffee, palm oil,\nand subsistence fishing.\nConstruction, light manufacturing (textiles,\nsoap, beer), and energy.\n\n3.7.2 Labor Indicators\nUnemployment Rate: Currently hovering around 9.2%.\n● Youth Unemployment (15–24): Relatively stable compared to regional neighbors\nat approximately 8.6%, though underemployment remains a challenge.\n● Informal Economy: A significant portion (estimated over 40%) of workers are\nself-employed or work in the informal sector, often in street vending or artisanal\nfishing.\n● Gender: The labor force is nearly evenly split by gender (approx. 49.7% female),\nthough women are more frequently found in the informal trade and service\nsectors.\n3.7.3 Cost Of Living\n●\n\n● Wages and Salaries by Sector: To combat inflation, the statutory minimum\nwage was increased to 3,000 STN (approximately $123 USD) per month as of\nOctober 2025.1 Salaries vary significantly by sector: public sector professionals\ntypically earn between €400 and €800 per month, tourism and hospitality\nworkers earn between €300 and €600, and agricultural workers earn the lowest\nformal wages at around €200 to €400.2\n● Cost of Living and Daily Expenses: Because the island imports most of its\nmanufactured goods and food, living expenses can be high.3 A 3-bedroom city\napartment costs around $650 per month, monthly utilities for a family are about\n$70, and basic groceries range from $250 to $300. Dining out at a local\nrestaurant generally costs between €10 and €20 for a meal.\n● Labor Market and the Informal Economy: The island faces a severe\nunemployment crisis, with a national rate of 15.7%.4 This disproportionately\naffects youth (21.3%) and women (14.6%).4 Consequently, many residents are\nforced into the \"informal sector\" (unregistered daily labor or street retail),\nwhich is quite large and accounts for roughly 28.7% of the GDP, leaving many\nworkers with unstable incomes and no social safety nets.5\n\nReferences\nMinimum Wage in Sao Tome and Principe for 2026 - Remote People, accessed\nMarch 19, 2026, https://remotepeople.com/countries/sao-tome-andprincipe/employer-of-record/minimum-wage/\n\fWork in São Tomé and Príncipe - VisitWorld.Today, accessed March 19, 2026,\nhttps://visitworld.today/sao-tome-and-principe/work/info\nSao Tome and Principe | Economic Indicators | Moody's Analytics - Economy.com,\naccessed March 19, 2026, https://www.economy.com/sao-tome-andprincipe/indicators\nSão Tomé and Príncipe Economic Outlook, accessed March 19, 2026,\nhttps://www.afdb.org/en/countries-southern-africa-republic-sao-tome-andprincipe/sao-tome-and-principe-economic-outlook\nSão Tomé and Príncipe - ISS African Futures, accessed March 19, 2026,\nhttps://futures.issafrica.org/geographic/countries/sao-tome-and-principe/\nSao Tome and Principe graduates from least developed country ..., accessed\nMarch 19, 2026, https://unctad.org/news/sao-tome-and-principe-graduates-leastdeveloped-country-status", "references": [{"source": "March 19, 2026,", "url": "https://remotepeople.com/countries/sao-tome-andprincipe/employer-of-record/minimum-wage/"}, {"source": "visitworld.today", "url": "https://visitworld.today/sao-tome-and-principe/work/info"}, {"source": "accessed March 19, 2026,", "url": "https://www.economy.com/sao-tome-andprincipe/indicators"}, {"source": "www.afdb.org", "url": "https://www.afdb.org/en/countries-southern-africa-republic-sao-tome-andprincipe/sao-tome-and-principe-economic-outlook"}, {"source": "futures.issafrica.org", "url": "https://futures.issafrica.org/geographic/countries/sao-tome-and-principe/"}, {"source": "March 19, 2026,", "url": "https://unctad.org/news/sao-tome-and-principe-graduates-leastdeveloped-country-status"}]}, {"num": "3.8", "title": "Education", "content": "3.8 Education\n3.8.1 System Structure, Access and Enrollment\nThe system follows a 6-3-3 model & Portuguese is the language of instruction at all\nlevels\n● 6 years of compulsory primary (ages 6–11)\n● 3 years of lower secondary\n● 3 years of upper secondary\nPrimary enrollment is very high (95%–98%) One of the highest rates in Sub-Saharan\nAfrica & Only about 70% complete primary school whereas Less than 60% transition\nto lower secondary\n3.8.2 Literacy, Enrollment & Key Demographics\nAdult literacy rose from 74.9% a decade ago to 93% by 2023, driven by the Quality\nEducation for All Project since 2014, which boosted teacher training and\ninfrastructure.\nYouth (15-24) literacy nears universality, though 2% have no formal education and\n36% incomplete primary, per older EPDC data.\nEnrollment Breakdown\nPrimary completion stands at 87%, with 96% net enrollment, but secondary\ntransition dips below 60% and completion lower, especially in rural areas\nKey Educational Demographics (2026 Estimates)\nMetric\n\nStatistic\n\nContext\n\n\fLiteracy Rate\n\n~94%\n\nYouth Literacy (15–\n24)\n\n~98%\n\nTertiary Enrollment\n\n~16-18%\n\nVocational Share\n\n~25-30%\n\nOne of the highest in Africa, though\nfunctional literacy in Portuguese varies.\nReflects the success of recent primary\neducation initiatives.\nAccess to university remains a bottleneck\nfor most of the population.\nGrowing emphasis on trades (electricity,\nmechanics, tourism) at the secondary\nlevel.\n\nReference: São Tomé and Príncipe: Education Country Brief | International Institute\nfor Capacity Building in Africa\nhttps://www.aacrao.org/edge/country/sao-tome-and-principe", "references": [{"source": "www.aacrao.org", "url": "https://www.aacrao.org/edge/country/sao-tome-and-principe"}]}]}, "4": {"name": "Religious Overview", "num": 4, "sections": [{"num": "4.1", "title": "Dominant Religions & Beliefs", "content": "4.1 Dominant Religions & Beliefs\n● São Tomé and Príncipe is one of Africa's most thoroughly Christianized nations.\nAccording to multiple authoritative sources, Christianity in one form or other\naccounts for approximately 97% of the total population's religious affiliation—\nmaking it an overwhelmingly Christian society with deep historical roots in Roman\nCatholicism inherited from five centuries of Portuguese colonial presence.\nReference: Opera News / WorldAtlas. African Countries Where Christianity is the\nLargest Religion. Retrieved March 2026.\n4.1.1 Roman Catholicism — The Dominant Faith\n● Roman Catholicism is the single largest religious denomination in São Tomé and\nPríncipe, constituting an estimated 55.7% of the national population according to\nthe CIA World Factbook's 2012 census-based estimate. Earlier data pointed to\nhigher figures: the nation's encyclopedia (Britannica) records that over threequarters of the population was Roman Catholic as of the year 2000, and the\nNations Encyclopedia notes a figure of approximately 80% for 2002. The decline in\nthe Catholic share since then reflects the significant growth of Protestant and\nevangelical denominations, not a general decline in Christian affiliation.\n● Catholicism was introduced to the islands by Portuguese colonists from the late\n15th century onward. The Diocese of São Tomé and Príncipe—one of Africa's\noldest Catholic dioceses—was established by Pope Clement VII on 31 January\n1533. At its height, its jurisdiction extended to Catholics in Angola and\nMozambique. The first permanent church on the islands, Nossa Senhora da Graça\n(built in 1504 by Augustinian missionaries), still stands and serves as the Cathedral\nof São Tomé. Today, the single Catholic diocese is headquartered in São Tomé city.\nReference:\n\nIndex Mundi / CIA World Factbook. Sao Tome and Principe Religions. Available at:\nhttps://www.indexmundi.com/sao_tome_and_principe/religions.html (Accessed: 7\nMay 2026).\n\n\fEncyclopedia.com. Worldmark Encyclopaedia of Religious Practices: São Tomé and\nPríncipe. Available at: https://www.encyclopedia.com/religion/encyclopediasalmanacs-transcripts-and-maps/sao-tome-and-principe (Accessed: 7 May 2026).\nWikipedia contributors. Religion in São Tomé and Príncipe. Wikipedia, The Free\nEncyclopedia. Available at:\nhttps://en.wikipedia.org/wiki/Religion_in_São_Tomé_and_Príncipe (Accessed: 7\nMay 2026).\n4.1.2 Protestant and Evangelical Christianity\n•\n\nProtestant Christianity constitutes the second-largest Christian grouping in the\ncountry. The CIA World Factbook (2012) records specific Protestant\ndenominations as follows: Seventh-day Adventist (4.1%), Assembly of God\n(3.4%), New Apostolic Church (2.9%), Universal Kingdom of God (2%), and\nJehovah's Witnesses (1.2%). Evangelical churches have shown significant growth\nin recent decades owing to active missionary work. By 2002, Protestants as a\ncombined group were estimated to account for approximately 15% of the\npopulation, though some sources have placed this figure as high as 23% more\nrecently.\n\n4.1.3 Seventh-day Adventist Church\n•\n\nThe Seventh-day Adventist Church operates one of only two private religious\nschools in the country (alongside a Catholic school), with both schools open to\nmembers and non-members alike and subject to Ministry of Education curriculum\noversight. Protestant leaders, especially Seventh-day Adventist leaders, have\ndemonstrated civic engagement—for example, participating in government\nCOVID-19 awareness campaigns and broadcasting prevention messages.\n\nReference: U.S. Department of State. 2020 Report on International Religious\nFreedom: São Tomé and Príncipe. https://www.state.gov/reports/2020-report-oninternational-religious-freedom/sao-tome-and-principe\n4.1.4 Islam\n● The Muslim population of São Tomé and Príncipe is small but growing, estimated\nat between 1% and 3% of the total population depending on the source and year.\nThe U.S. State Department's World Religion Profile estimates 3% Muslim, while a\n2012 CIA report records approximately 3% as well. Most Muslims are migrants\nfrom Nigeria and Cameroon who have arrived over the last two decades. The\nproximity of the islands to the West African mainland has facilitated this\nimmigration.\nReference: Association of Religion Data Archives. National Profiles: World Religion.\nhttps://www.thearda.com/world-religion/national-profiles?u=195c\n\n\f4.1.5 Other Minor Faiths\n● Small communities of the Bahá'í Faith, Judaism (historically present since the 15th\ncentury when thousands of Jewish children were forcibly deported to the island),\nHinduism, and Buddhism also exist on the islands, comprising a combined share of\napproximately 0.1–1% each. The Jewish community, though demographically\nnegligible at 0.1% of the population according to the Pew Research Center, has left\na lasting cultural imprint on Creole customs and traditions.\nReference: Religion in São Tomé and Príncipe. Wikipedia. Op. cit. Citing Pew\nResearch\nCenter data.\n\nRELIGIOUS BREAKDOWN — SÃO TOMÉ AND PRÍNCIPE (2012 CIA EST.)\nRoman Catholic: 55.7%\nSeventh-day Adventist: 4.1%\nAssembly of God: 3.4%\nNew Apostolic: 2.9%\nMana Church: 2.3%\nUniversal Kingdom of God: 2.0%\nJehovah's Witnesses: 1.2%\nOther Christian: 6.2%\nNo religion / Unaffiliated: 21.2%\nUnspecified: 1.0%\n\nReference: CIA World Factbook. Sao Tome and Principe: Demographics. Sourced\nfrom IndexMundi.\nhttps://www.indexmundi.com/sao_tome_and_principe/religions.html\n4.1.6 Syncretic and Traditional African Beliefs\n● Despite over five centuries of Roman Catholic influence, traditional African beliefs\nand practices remain widespread, often coexisting with nominal Christian\naffiliation. Black slaves brought to the islands from Benin, Gabon, the Republic of\nthe Congo, and Angola introduced animism, totemism, and mortuary cults. Over\ncenturies, these merged with Catholicism to produce syncretic expressions of\nfaith. For instance, the notion of Sum d'Océ (meaning 'Lord of the Heavens')\ncombines the Christian creator God with a controller of wealth drawn from African\ncosmology. Small plantation-era chapels combined Catholic crosses with African\ncharms.\n\f● A Melanesian belief system is also recorded, with followers constituting\napproximately 2.9% of the total population. Reports also indicate that witchcraftrelated persecution occurs on both islands—particularly targeting elderly women\naccused of 'fitxicêlu' (witchcraft in the Forro language)—suggesting a persistent\nundercurrent of African spiritual worldview that orthodox Christian catechesis has\nhistorically not addressed adequately.\nReference: Freedom of Thought Report: São Tomé and Príncipe. Humanists\nInternational.\nhttps://fot.humanists.international/countries/africa-middle-africa/sao-tome-andprincipe/\nEncyclopedia.com. Op. cit.", "references": [{"source": "(Accessed: 7", "url": "https://www.indexmundi.com/sao_tome_and_principe/religions.html"}, {"source": "Príncipe. Available at:  (Accessed: 7 May 2026).", "url": "https://www.encyclopedia.com/religion/encyclopediasalmanacs-transcripts-and-maps/sao-tome-and-principe"}, {"source": "(Accessed: 7", "url": "https://en.wikipedia.org/wiki/Religion_in_São_Tomé_and_Príncipe"}, {"source": "Freedom: São Tomé and Príncipe.", "url": "https://www.state.gov/reports/2020-report-oninternational-religious-freedom/sao-tome-and-principe"}, {"source": "www.thearda.com", "url": "https://www.thearda.com/world-religion/national-profiles?u=195c"}, {"source": "fot.humanists.international", "url": "https://fot.humanists.international/countries/africa-middle-africa/sao-tome-andprincipe/"}]}, {"num": "4.2", "title": "Size of Christian Population", "content": "4.2 Size of Christian Population\n4.2.1 Príncipe Island — Christian Population Estimate\n● Príncipe island has a much\nsmaller population—estimated at\n9,830 by the Instituto Nacional\nde Estatística in 2024. The\nAutonomous Region of Príncipe\nshares the national religious\nprofile, with Christianity\n(predominantly Catholic) as the\nfaith of the vast majority.\nApplying the national religious\nproportions, the estimated\nChristian population on Príncipe\nis approximately 9,500 persons.\n● While Príncipe's population is\nsmall, it is geographically isolated\nand has historically received less\nattention from any denomination.\nThe island has no airport with\nregular international connections\nand is accessible mainly via interisland flights from São Tomé. A\nCoptic mission on Príncipe—even\na periodic pastoral visit—would\nrepresent\na\nunique\nand\nuncontested Christian witness.\nThe isolation of Príncipe's\ncommunity, its strong rural and\n\fclose-knit identity, and the near-total absence of any non-Catholic Christian\ninstitution make it fertile ground for the Coptic Church's first outreach.\nReference: Autonomous Region of Príncipe. Government Portal. Op. cit. Príncipe.\nWikipedia. Op. cit.\n4.2.2 The Unchurched and Syncretical Believing Population\n● Approximately 21.2% of the population identifies as having 'no religion', according\nto the CIA's 2012 estimate. However, Encyclopedia Britannica notes that 'about\none-fifth of the population identifies as nonreligious'—these individuals, while not\nformally affiliated, often continue to participate in life-cycle rituals such as\nbaptisms, funerals, and communal celebrations. This cohort represents a\nsignificant population open to re-evangelization.\n● Additionally, those who practice syncretic blends of Catholicism and African\ntraditionalism represent a spiritually open demographic. The Coptic Orthodox\nChurch's ancient African roots, its non-colonial identity, its rich patristic tradition,\nand its distinctive liturgical practice could serve as powerful points of attraction\nfor both the unchurched and the disillusioned within the existing Catholic\ncommunity.\nReference: Britannica. Sao Tome and Principe. Retrieved March 2026.\nhttps://www.britannica.com/place/Sao-Tome-and-Principe", "references": [{"source": "www.britannica.com", "url": "https://www.britannica.com/place/Sao-Tome-and-Principe"}]}, {"num": "4.3", "title": "Existing Mission Efforts & Organizations", "content": "4.3 Existing Mission Efforts & Organizations\n4.3.1 Roman Catholic Church\nThe Roman Catholic Church remains the dominant and best-resourced religious\norganization in São Tomé and Príncipe. The country has a single diocese—the Diocese\nof São Tomé and Príncipe—headquartered in São Tomé city. The diocese was\noriginally established in 1534 as part of Portugal's Metropolitan Archdiocese of\nFunchal. The main Catholic church is the Cathedral of Our Lady of Grace in São Tomé,\nwhich bears the Cross of São Tomé as its ecclesiastical symbol. Since independence in\n1975, the Church has been run primarily by expatriate priests. Catholic institutions\ninclude one private school (open to all). The Church exercises significant cultural\ninfluence through baptism, funerary rites, and patron saint festivals across all districts.\n\n\fReference: WorldAtlas. Religion In Sao Tome And Principe.\nhttps://www.worldatlas.com/articles/religion-in-sao-tome-and-principe.html\n\n4.3.2 Protestant and Evangelical Organizations\nProtestant Christianity has grown markedly since independence. Key organizations\ncurrently operating in São Tomé and Príncipe include:\n•\n\nSeventh-day Adventist Church (SDA): One of the two recognized private religious\nschools; active in healthcare messaging and public awareness campaigns.\n• Assembly of God: 3.4% of the national population; evangelical Pentecostal\nbackground.\n• New Apostolic Church: 2.9% of the population; increasingly active in urban areas.\n• Universal Church of the Kingdom of God (UCKG): Has faced some incidents of\nvandalism (2019); services resumed and facilities repaired by 2020.\n• Jehovah's Witnesses: 1.2% of population; regular door-to-door outreach\nactivities.\n• Thokoist Church, Evangelical Assembly of Christ, Universal Church of Christ:\nSmaller groups with a combined following of approximately 8,000 persons.\nReference: U.S. Department of State. 2020 Report on International Religious\nFreedom: São Tomé and Príncipe. Op. cit.\n4.3.3 Mana Church\n● The Mana Church, which originated in Lisbon, Portugal in 1984, has an established\npresence in São Tomé and Príncipe representing approximately 2.3% of the\npopulation. The movement believes in supernatural forces and powers attributed\nto persons, spirits, and natural objects, drawing on a syncretic blend of African\ntraditionalism and Christian elements. It was brought to the islands by the\nPortuguese colonial network in a manner analogous to Catholicism. The Mana\nChurch's appeal to supernatural and ancestral dimensions indicates that São\nToméan Christians remain spiritually receptive to traditions that engage the\n\f● mystical and transcendent—a dimension in which the Coptic Orthodox liturgical\nand ascetic tradition is exceptionally strong.\nReference: WorldAtlas. Religion In Sao Tome And Principe. Op. cit.\n4.3.4 Bahá'í Faith\n● The Bahá'í community in São Tomé and Príncipe has been growing steadily since\nthe late 20th century. Bahá'í missionaries have been active in the country,\nemphasizing education, social development, and interfaith dialogue. The Bahá'í\ncommunity's model of community-building and its lack of formal clergy make its\npresence non-competitive with the Coptic Orthodox mission model.\n4.3.5 Absence of Orthodox Christian Presence\n● Neither the Coptic Orthodox Church (Oriental Orthodox) nor the Greek Orthodox\nPatriarchate of Alexandria and All Africa (Eastern Orthodox) have any established\npresence in São Tomé and Príncipe. This is a remarkable gap, given that the\nPatriarchate of Alexandria has canonical jurisdiction over all African nations. The\nnearest Coptic Orthodox mission points are in Nigeria (Lagos and Calabar,\nestablished 2005) and Cameroon (covered by the Metropolitan of Accra, who has\njurisdiction over 22 West African countries). The Greek Orthodox Patriarchate of\nAlexandria has active missions in Ghana, Nigeria, and Cameroon but no presence\nrecorded in São Tomé and Príncipe.\nReference: Coptic Mission. About Us: Country Missions. https://copticmission.org/about-us\nOrthodox Mission in Tropical Africa. Missions Institute of Orthodox Christianity.\nhttps://missions.hchc.edu/articles/articles/orthodox-mission-in-tropical-africa", "references": [{"source": "www.worldatlas.com", "url": "https://www.worldatlas.com/articles/religion-in-sao-tome-and-principe.html"}, {"source": "Reference: Coptic Mission. About Us: Country Missions.", "url": "https://copticmission.org/about-us"}, {"source": "missions.hchc.edu", "url": "https://missions.hchc.edu/articles/articles/orthodox-mission-in-tropical-africa"}]}, {"num": "4.4", "title": "COPTIC ORTHODOX CHURCH — AFRICAN MISSION PRECEDENT", "content": "4.4 COPTIC ORTHODOX CHURCH — AFRICAN MISSION PRECEDENT\n4.4.1 Historical Overview of Coptic Missions in Sub-Saharan Africa\nThe Coptic Orthodox Church of Alexandria holds canonical and historical primacy over\nall of Africa, having been founded by St. Mark the Evangelist in Alexandria in\napproximately AD 61. Since the demise of the Latin North African Archdiocese of\nCarthage in the 8th century, Alexandria has been the sole Apostolic See with\njurisdiction over the entire continent. The modern era of active Coptic mission in subSaharan Africa began in earnest in 1976 when His Grace Bishop Antonius Markos\n(Anthony Mark) was consecrated by Pope Shenouda III as General Bishop for African\nAffairs and Patriarchal Exarch in West and South Africa. A second bishop, His Grace\nBishop Paul (Boulos), was consecrated in the 1990s as General Bishop for Evangelism\nand Mission and Patriarchal Exarch in East and Central Africa.\nReference: Coptic Orthodox Church in Africa. Wikipedia.\nhttps://en.wikipedia.org/wiki/Coptic_Orthodox_Church_in_Africa\nCoptic Mission. About Us. Op. cit.\n4.4.2 Current Coptic Presence in West Africa — Closest Neighbors\nThe Coptic Church's closest established mission to São Tomé and Príncipe is in Nigeria,\nwhere the first Coptic Orthodox Church was established in Lagos in 2005. In 2006, four\nadditional churches were established in Calabar, which has become the heart of the\n\fNigerian Coptic community. The mission in Nigeria is served by rotating priests and\ndeacons, with a dedicated Coptic Centre built in Calabar. Nigeria is geographically the\nclosest jurisdiction to São Tomé and Príncipe (approximately 800 km), making it the\nmost logical platform from which to support and sustain a new mission in São Tomé\nand Príncipe.\nReference: Coptic Mission. About Us: Nigeria. Op. cit.\n4.4.3 Parallels from Comparable Island Missions\nThe Coptic Church's successful establishment of missions in geographically isolated\ncontexts offers instructive precedent for São Tomé and Príncipe. The mission in\nMadagascar—an island nation of comparable remoteness—was pioneered by\nArchimandrite Nectarios Kellis in 1994, who began by personally visiting towns and\nvillages to explain the Orthodox Christian faith. Within a short period, new\ncongregations were established, liturgical services were translated into local\nlanguages, and a local priest was ordained. The Madagascar model—personal\nevangelism, liturgical inculturation, and rapid development of local clergy—is directly\napplicable to São Tomé and Príncipe.\nReference: Hayes, Stephen. Orthodox Mission in Tropical Africa. Missions Institute of\nOrthodox Christianity. Op. cit.\n4.4.4 The Organization of African Instituted Churches (OAIC) Connection\n● The Organization of African Instituted Churches (OAIC) was founded in 1978 at an\nhistoric conference in Cairo convened by His Holiness Pope Shenouda III, upon the\ninitiative of His Grace Bishop Markos. With chapters now operating in Kenya,\nUganda, Tanzania, Botswana, Zimbabwe, Western Cape, Eastern Cape, Ghana,\nMadagascar, Nigeria, and the Democratic Republic of Congo, the OAIC constitutes\na pan-African ecumenical network through which the Coptic Church can make\ninitial contact with local African Instituted Churches in São Tomé and Príncipe and\nuse them as bridges for contextual outreach.\nReference: World Council of Churches. Organization of African Instituted Churches.", "references": [{"source": "en.wikipedia.org", "url": "https://en.wikipedia.org/wiki/Coptic_Orthodox_Church_in_Africa"}]}]}, "5": {"name": "SWOT Analysis", "num": 5, "sections": [{"num": "5", "title": "SWOT Analysis", "content": "Chapter 5: SWOT Analysis\n\nStrengths\n\nWeaknesses\n\nCan provide the Bible in their local language\nPortuguese-language liturgical alignment\nPortuguese Speaking servants\nPope Shenouda III mission legacy\nExceptional History in attracting young men and\nChildren to the church\nFlexibility in Resource Allocation\nA Coptic parish offering structured sacramental\nrecords\nAbility to Combine Service + Sustainability\nGood fluency and profession in English and\nFrench languages\nAbility to Use Simple Digital Tools Effectively\nAbility to Combine Online / Offline Models\nfamiliarity with the diseases they are facing\nAbility to Work Through Informal Networks\nExperience in creating Awareness\nThe presence of church farms in Egypt\n\nLimited Portuguese Digital Content\nUnfamiliarity with the country’s traditions\nThere are no previous Coptic missions to this\ncountry\nThere is no sister church in the country\nThere are no local Coptic clergy\nCost Inefficiency for Travel & Logistics\nHigh single-parenthood creates financial strain\non community giving\n\n\fOpportunities\n\nThreats\n\nlow income, high need for jobs and Limited job\nopportunities\nVery large sector of youth\nAbility to Build Deep Personal Relationships\nChurch-Based Entry Model\nEducation Gap (Learning Crisis)\nLimited Healthcare Awareness\nWeak civil registration\nSimple Lifestyle (Leve Leve)\nHigh Poverty = High Need for Services\nSmall Economy = Easy Influence\nThe presence of many catholic churches in the\ncapital\nGrowing Internet Penetration (~61.5%), high\nmobile usage 64% ⁠Rapid growth of internet access and social media\naccess\nThe outbreaks of many diseases, Weak health\nservices and lack of resources - NGOs for medical\nPolitical Openness to External Support\nMultiparty System\nAdopting climate-smart agriculture.\nInternational Support (UNDP / World Bank)\nFocus on Renewable Energy & Sustainability\nTheir need to import food supplies\nWater Issues (Quality & Supply)\nHigh tourism potential due to natural beauty and\neco-tourism sites like Príncipe Island\nOpen Investment Environment‫ و‬Tax Incentives &\nSupport\nOIF / Lusophone institutional ties\n\nHigh Interest Rates (~10%)\nWeak Infrastructure\nDigital Inequality (Urban vs Rural)\nLand Concession System\nNo Registered Entity Yet & Registration\nRequirements\nPolitical Instability\nHigh immigration rates\nPolygamous household structures create canon\nlaw conflict at scale\nExtreme female poverty may trigger dependency\nrather than discipleship\nVisa and residency constraints for clergy\nCatholic Church institutional resistance", "references": []}]}, "6": {"name": "Stakeholders Mapping", "num": 6, "sections": [{"num": "6.1", "title": "Non-Governmental Organizations (NGOs)", "content": "6.1. Non-Governmental Organizations (NGOs)\nKey NGOs operating in STP with potential for partnership in mission work — social\nservices, healthcare, education, and community development.\n6.1.1 Caritas São Tomé and Príncipe\nField\n\nDetails\n\nContact\n\n+239 2222 565 | caritas_stp@cstome.net | caritas-africa.org\n\nSpecialty\n\nCharity — food programs, agricultural training, child welfare\n\nLocation\n(HQ)\n\nNo. 438, Via Portugal, São Tomé e Príncipe\n\nEstablishe\nd\n\n1981 (45 years operating in STP)\n\nKey\nImpact\n\nContributed to cancellation of STP's $317M external debt (2007).\nPrograms: food aid for the poor, agricultural youth training, sewing\nclasses, 'Maison des petits enfants' (child home for under-7s). Current\nproject: 'Bridge of Hope' — remote child sponsorship.\n\nDiocese\nStructure\n\nSingle diocese covering the whole country with 14 parishes (13 on\nSão Tomé, 1 on Príncipe)\n\nMission\nRelevanc\ne\n\nHigh — Catholic NGO with established community trust; potential for\nrespectful dialogue and joint social service projects\n\n6.1.2 Fundação Príncipe\nField\n\nDetails\n\nContact\n\n+239 9803640 | INFO@FUNDACAOPRINCIPE.ORG |\nfundacaoprincipe.org\n\nSpecialty\n\nMarine & terrestrial conservation; community engagement\n\nEstablish\ned\n\nApril 2015\n\n\fField\n\nDetails\n\nKey\nImpact\n\nFlora of Príncipe (plant documentation, rare species protection);\nPríncipe Thrush conservation; Obô Giant Snail protection; COBIO-NET\nmarine research; fisheries data & marine protection zones;\nalternative income & vocational training for local communities\n\nLinked To\n\nFounded through Mark Shuttleworth's HBD Príncipe initiative; also\nlinked to MOVE MOVE and Missão Dimix\n\nMission\nRelevanc\ne\n\nMedium — key partner for any Príncipe Island mission activity; strong\ncommunity credibility\n\n6.1.3 IFRC — São Tomé and Príncipe Red Cross\nField\n\nDetails\n\nWebsite\n\nifrc.org/national-societies-directory/sao-tome-and-principe-redcross\n\nSpecialty\n\nMedical and public health\n\nEstablishe\nd\n\n1976\n\n5 Regional\nBranches\n\nÁgua Grande · Lembá · Cantagalo · Caué · Príncipe\n\nKey Impact\n\nDisease awareness (dengue, HIV, COVID); emergency response\nteams; elderly medical center (20+ years) providing food, care and\npsychological support; direct collaboration with Ministry of Health\n\nMission\nRelevance\n\nHigh — healthcare mission partnership opportunities; covers all\ndistricts including Príncipe\n\n\f6.1.4 FAO — Food and Agriculture Organization\nField\n\nDetails\n\nContact\n\n(+39) 06 57051\n\nSpecialty\n\nAgriculture — sustainable farming, farmer training, food quality,\nincome improvement\n\nHQ\n(Regional)\n\nSubregional Office for Central Africa, Libreville, Gabon\n\nKey\nPrograms\n\nOrganic farming / agroecology; farmer skills training; food quality\nand nutrition improvement; agricultural income support\n\nMission\nRelevance\n\nLow-medium — useful for agricultural or food security components\nof mission social programs\n\n6.1.5 MOVE MOVE\nField\n\nDetails\n\nContact\n\nmoveong.pt\n\nSpecialty\n\nEntrepreneurship — fighting poverty through sustainable income\ngeneration\n\nHQ\n\nLisbon, Portugal (international NGO)\n\nEstablished\n\n2011\n\nMethodolog\ny\n\n3-phase: WAKE (ideate) → SHAKE (develop) → MAKE (launch and\nsustain)\n\nStatistics\n\n+1,300 people trained; +200 projects launched; operates via\nground-level volunteers\n\nMission\nRelevance\n\nMedium — vocational and entrepreneurship angle; useful for\neconomic empowerment within mission community outreach\n\n\f6.1.6 IMVF — Instituto Marquês de Valle Flôr\nField\n\nDetails\n\nContact\n\n+239 2222 199 (António Lima) | imvf.stp@imvf.org | imvf.org\n\nAddress\n\nAvenida Marginal 12 de Julho, Casa nr. 100Z, Caixa Postal 280\n\nEstablishe\nd in STP\n\n1988 (founded 1951 as Portuguese public utility institution)\n\nSpeciality\n\nDevelopment cooperation — healthcare, agriculture, education,\nenvironment\n\nHealthcare\nImpact\n\n'Health for All' (Saúde para Todos): national coverage from 2007;\ntelemedicine platform; ~1,282 health providers trained; NCD\nprotocols for diabetes and hypertension\n\nAgriculture\nImpact\n\nOrganic farming export support (cocoa, coffee); ~25% of agricultural\nland now organic; school feeding policy linked to local production\n\nEducation\nImpact\n\n~400 teachers supported; indirectly impacting 20,000+ students\n\nCOVID\nResponse\n\nKey implementation partner; secured €500,000+ for emergency\nresponse\n\nMission\nRelevance\n\nVery High — longest-standing and most impactful NGDO in STP;\nideal first partner contact; strong institutional track record\n\n6.1.7 Additional International Bodies\nOrganizatio\nn\n\nSpecialty\n\nContact / Website\n\nMission\nRelevance\n\nWACA\nProgram\n(World\nBank)\n\nCoastal\nadaptation,\ncommunity\nresilience,\nfisheries safety\n\nwaca@worldbank.org |\nwacaprogram.org\n\nLow —\nenvironmental\nfocus\n\nUNFPA São\nTomé\n\nReproductive\nhealth, family\n\n239 222 1529 | unfpa.org\n| facebook: unfpasaotome\n\nMedium —\nyouth and\nwomen's\n\n\fOrganizatio\nn\n\nSpecialty\n\nContact / Website\n\nplanning, gender\n& youth\n\nMission\nRelevance\nprogramming\nalignment\n\nUN MultiPartner\nTrust Fund\n\nSDG pooled\nfunding; $8.4M\ninvested since\n2016\n\nmptf.undp.org/country/saotome-and-principe\n\nLow-medium —\nfunding\nintelligence only\n\nUNICEF São\nTomé\n\nChild rights,\neducation,\nhealth\n\nunicef.stp@gmail.com |\nfacebook:\nunicefsaotomeeprincipe |\n9.7K followers\n\nMedium — child\nwelfare\nalignment\n\nUNDP /\nPNUD STP\n\nDevelopment;\nSDGs\n\nregistry.st@undp.org | 239\n984 8158 | 7.8K followers\n\nLow —\ninstitutional\nawareness only\n\n\f6.2. Public Figures and Key Individuals\nInfluential individuals and families whose engagement may facilitate missi
