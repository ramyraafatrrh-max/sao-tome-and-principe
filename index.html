ecumenical cooperation on shared social\nprogrammes (education, healthcare) while\nmaintaining the Coptic mission's distinct apostolic\nand patristic identity.\n\nSmall, immigrant Muslim\ncommunity\n\nNot a structurally dominant opposition. Social\nintegration and charitable service create natural\nrelationship bridges.\n\nReligious freedom\nguaranteed by\nconstitution since 1990\n\nLegal environment is favourable. All religious\norganisations must register with the government —\nearly registration should be a priority for any formal\nCoptic presence.", "references": [], "contentBlocks": [{"type": "text", "html": "<p>7.6. Key Conclusions and Mission Implications Finding</p>\n<p>Mission Implication</p>\n<p>Dominant nominal Catholicism with active ATR syncretism</p>\n<p>Priority is catechesis and pastoral formation, not only evangelism. A presence-based, community-rooted model is required.</p>\n<p>Djambí ritual involves spirit possession within a Catholic framework</p>\n<p>Coptic liturgical and patristic resources on spiritual warfare, liberation, and discernment of spirits are directly applicable. The Coptic tradition has unique credibility here.</p>\n<p>Growing evangelical Protestant presence</p>\n<p>Potential for ecumenical cooperation on shared social programmes (education, healthcare) while maintaining the Coptic mission's distinct apostolic and patristic identity.</p>\n<p>Small, immigrant Muslim community</p>\n<p>Not a structurally dominant opposition. Social integration and charitable service create natural relationship bridges.</p>\n<p>Religious freedom guaranteed by constitution since 1990</p>\n<p>Legal environment is favourable. All religious organisations must register with the government — early registration should be a priority for any formal Coptic presence.</p>"}, {"type": "table", "html": "<div class=\"table-caption\">7.6. Key Conclusions and Mission Implications</div><div class=\"table-wrap\"><table class=\"data-table\"><thead><tr><th></th><th>Finding</th><th>Mission Implication</th></tr></thead><tbody><tr><td></td><td>Dominant nominal</td><td>Priority is catechesis and pastoral formation, not only</td></tr><tr><td></td><td>Catholicism with active</td><td>evangelism. A presence-based, community-rooted</td></tr><tr><td></td><td>ATR syncretism</td><td>model is required.</td></tr><tr><td>Djambí ritual involves spirit possession within a Catholic framework</td><td>Djambí ritual involves</td><td>Coptic liturgical and patristic resources on spiritual</td></tr><tr><td></td><td>spirit possession within a</td><td>warfare, liberation, and discernment of spirits are</td></tr><tr><td></td><td>Catholic framework</td><td>directly applicable. The Coptic tradition has unique</td></tr><tr><td></td><td></td><td>credibility here.</td></tr><tr><td>Growing evangelical Protestant presence</td><td>Growing evangelical</td><td>Potential for ecumenical cooperation on shared social</td></tr><tr><td></td><td>Protestant presence</td><td>programmes (education, healthcare) while</td></tr><tr><td></td><td></td><td>maintaining the Coptic mission&#x27;s distinct apostolic</td></tr><tr><td></td><td></td><td>and patristic identity.</td></tr><tr><td>Small, immigrant Muslim community</td><td>Small, immigrant Muslim</td><td>Not a structurally dominant opposition. Social</td></tr><tr><td></td><td>community</td><td>integration and charitable service create natural</td></tr><tr><td></td><td></td><td>relationship bridges.</td></tr><tr><td>Religious freedom guaranteed by constitution since 1990</td><td>Religious freedom</td><td>Legal environment is favourable. All religious</td></tr><tr><td></td><td>guaranteed by</td><td>organisations must register with the government —</td></tr><tr><td></td><td>constitution since 1990</td><td>early registration should be a priority for any formal</td></tr><tr><td></td><td></td><td>Coptic presence.</td></tr></tbody></table></div>"}], "tables": [{"caption": "7.6. Key Conclusions and Mission Implications", "headers": ["", "Finding", "Mission Implication"], "rows": [["", "Dominant nominal", "Priority is catechesis and pastoral formation, not only"], ["", "Catholicism with active", "evangelism. A presence-based, community-rooted"], ["", "ATR syncretism", "model is required."], ["Djambí ritual involves spirit possession within a Catholic framework", "Djambí ritual involves", "Coptic liturgical and patristic resources on spiritual"], ["", "spirit possession within a", "warfare, liberation, and discernment of spirits are"], ["", "Catholic framework", "directly applicable. The Coptic tradition has unique"], ["", "", "credibility here."], ["Growing evangelical Protestant presence", "Growing evangelical", "Potential for ecumenical cooperation on shared social"], ["", "Protestant presence", "programmes (education, healthcare) while"], ["", "", "maintaining the Coptic mission's distinct apostolic"], ["", "", "and patristic identity."], ["Small, immigrant Muslim community", "Small, immigrant Muslim", "Not a structurally dominant opposition. Social"], ["", "community", "integration and charitable service create natural"], ["", "", "relationship bridges."], ["Religious freedom guaranteed by constitution since 1990", "Religious freedom", "Legal environment is favourable. All religious"], ["", "guaranteed by", "organisations must register with the government —"], ["", "constitution since 1990", "early registration should be a priority for any formal"], ["", "", "Coptic presence."]]}]}]}, "8": {"name": "Country Entry", "num": 8, "sections": [{"num": "8.1", "title": "Visa & Resident Visa Guide", "content": "8.1 Visa & Resident Visa Guide\n8.1.1 Introduction\nSão Tomé and Príncipe (STP) is a small, stable island nation in the Gulf of Guinea off\nthe west coast of Central Africa. With a population of approximately 232,000 and a\nprojected GDP growth of 3.1% in 2025, STP is increasingly attracting foreign\nnationals through investor-friendly immigration policies, its natural beauty, and its\nstrategic position within the Community of Portuguese Language Countries (CPLP).\nThe legal framework governing immigration is anchored in Law No. 1/91 on the Legal\nStatus of Foreigners, supplemented by subsequent government decrees. The\nMigration and Borders Service (Serviço de Migração e Fronteiras – SMF) is the\nprimary authority overseeing entry, residence, and work permits. The eVisaST\nplatform serves as the primary digital gateway for visa and permit applications.\n8.1.2 Overview of Entry & Visa Categories\nBefore pursuing residency, foreign nationals must understand the entry pathway\nthat applies to their nationality. STP recognizes the following categories:\n8.1.2.1 Visa-Free Entry\nCitizens of a range of countries — including EU member states, the USA, Canada, and\nrecent signatories such as Ghana, Mozambique, Colombia, and Dominica — may\nenter STP without a prior visa for short stays. US citizens may stay up to 30 days;\nmost other qualifying nationals receive up to 15 days. These short-stay privileges do\nnot confer any right of residency.\n8.1.2.2 Electronic Visa (e-Visa via eVisaST)\nFor nationalities not benefiting from visa-free entry, an electronic visa is available\nthrough the eVisaST platform. The e-Visa is a single-entry document valid for up to\n30 days from the date of entry and must be used within 30 days of issue. It is valid\nfor tourism, business visits, and transit. E-Visa holders do not qualify for residency;\nonly long-stay visa holders may pursue residency status.\n•\n•\n•\n•\n•\n\nApply online at the SMF eVisaST portal.\nUpload a single PDF (under 2 MB) containing passport copy, travel ticket, and\naccommodation or contact details.\nSave the generated process/reference number to track application status.\nNo changes are permitted post-submission — accuracy is critical.\nProcessing time: typically, up to 7 days.\n\nVisa Fees & Airport Stamping: Upon arrival at São Tomé International Airport, you\nare required to pay a stamping fee in cash to receive the official visa stamp in your\npassport. Please ensure you have the exact amount ready:\n\f●\n\n€20 for a single-entry 1-month Tourist Visa.\n\n●\n\n€30 for a single-entry 1-month Business Visa.\n\n●\n\nNote: Children under 18 pay half the standard fee. (Reference: São Tomé\nIslands FAQ)\n\n8.1.2.3 Business / Commercial Visa\nDesigned for commercial activities such as meetings, negotiations, or short-term\nengagements that do not constitute local employment. Valid for up to 30 days,\navailable as single or multiple entry. Applications are submitted via the eVisaST\nplatform using the same document upload procedure described above.\n8.1.2.4 Long-Stay Visa (Visto de Longa Duração)\nForeign nationals intending to reside in STP for more than 90 days must obtain a\nlong-stay visa prior to arrival. This visa is the prerequisite for subsequent applications\nfor temporary or permanent residence permits. Applications are submitted at STP\nembassies or consulates abroad, with a processing period of up to 30 days. The visa\ncategory determines the basis for the applicant’s stay:\n•\n•\n•\n•\n•\n•\n\nSubordinate employment (with a confirmed employment contract)\nIndependent professional or self-employed activity\nResearch or highly qualified professional positions\nStudy, exchange, internship, or voluntary work\nFamily reunification\nInvestment or business establishment\n\n8.1.2.5 Visa Extension Process\nIf you need to extend your stay, the responsible authority is the Serviço de Migração\ne Fronteiras (Immigration and Borders Service).\n•\n\nPractical Steps for Extension:\n\n1. Apply Early: Submit your extension request 7 to 14 days before your current\nvisa expires. Do not wait until the last day.\n2. Visit the Immigration Office: Go to the headquarters in the capital, São\nTomé, and request an \"Extension of stay\" or \"Visa extension.\"\n3. Prepare Required Documents: You will generally need:\n\n•\n\nYour original passport.\n\n•\n\nA copy of your entry stamp or current visa.\n\n•\n\nA recent personal passport photo.\n\n\f•\n\nProof of accommodation (hotel booking or residential address).\n\n•\n\nA tentative departure flight ticket or travel plan.\n\n•\n\nProof of sufficient funds (not always requested, but highly\nrecommended).\n\n•\n\nA valid reason for the extension (e.g., tourism, personal\ncircumstances, or family visit).\n\n4. Pay the Fees: Extension fees vary based on the requested duration and are\npaid directly at the immigration office.\n5. Wait for Approval: Approval can be granted on the same day or take a few\ndays, though it may take longer in certain cases.\n•\n\nExtension Duration & Important Warnings:\n\n●\n\nDuration: Extensions are typically granted for an additional 15 to 30 days.\nLonger extensions are possible but not guaranteed.\n\n●\n\nPenalties: Applying late may result in a fine. Overstaying your visa can lead to\ncomplications upon departure or the outright rejection of your extension\nrequest.\n\n●\n\nNote: An extension is an administrative approval granted by immigration, not\nan automatic right.\n\nPro Tip: If you plan to stay for up to 3 months from the beginning, it is best to enter\nwith your initial visa and a clear extension plan, or ensure you have strong\ndocumented reasons (like a business or family.\n8.1.3 Health & Vaccination Requirements\n8.1.3.1 Mandatory Vaccinations:\n● Yellow Fever: This is strictly required only if you are arriving from a country\nwith a risk of Yellow Fever transmission, or if you had a long transit in an atrisk African country. In this case, you must present an International\nCertificate of Vaccination (Yellow Card).\n8.1.3.2Highly Recommended Vaccinations:\n● Hepatitis A: Recommended to prevent infection through contaminated food\nor water.\n●\n\nHepatitis B: Recommended if you plan a longer stay or might be exposed to\nmedical procedures.\n\n●\n\nTyphoid: Highly recommended to prevent infection through contaminated\nfood or water.\n\n●\n\nTetanus, Diphtheria, and Pertussis (Tdap): Ensure you have had a booster\nshot within the last 10 years.\n\n\f●\n\nMeasles, Mumps, Rubella (MMR): Important if you have not been previously\nvaccinated.\nMalaria Prevention: While there is no vaccine for Malaria, there is a low-tomoderate risk in the country depending on the specific region you visit.\n\n●\n\nIt is strongly advised to take prescribed anti-malarial medication before and\nduring your travel.\n\n●\n\nAlways use a strong, effective insect repellent.\n\n(Reference: CDC Guidelines for São Tomé and Príncipe\n8.1.4 Flight Information (Egypt to Sao Tome)\n●\n\nDeparture: Cairo International Airport (CAI)\n\n●\n\nDestination: São Tomé International Airport (TMS)\n\n●\n\nDirect Flights: There are no direct flights from Egypt to São Tomé. All routes\nrequire 1 to 2 layovers.\n\n8.1.4.1 Available Airlines & Common Routes:\n● Ethiopian Airlines / ASKY Airlines: This is one of the most common and\npractical options for this route. Flights typically connect through Addis Ababa\n(ADD) and sometimes have an additional stop in a West African hub.\n●\n\nTAP Air Portugal: A popular and reliable route that usually requires a layover\nin Lisbon (LIS), Portugal before heading south to São Tomé.\n\n●\n\nEgyptAir & Royal Air Maroc: You can also find combined itineraries using\nthese airlines, which usually connect through Casablanca (CMN), Morocco.\n\n8.1.4.2 Approximate Prices & Duration:\n● One-Way Ticket: Prices typically start around $750 to $900 USD (approx.\n36,000 to 43,000 EGP), depending on how early you book.\n●\n\nRound-Trip Ticket: Usually around $1,500 USD (approx. 72,000 EGP).\n\n●\n\nTravel Time: Due to layovers, expect your total travel duration to range\nanywhere from 16 to 22+ hours.\n\n8.1.4.3 Flying via Angola (Luanda)\nThere are no direct flights that cover the entire route from Cairo to São Tomé via\nAngola, so your journey will be broken into two main segments.\nThe Route, Airlines, & Travel Time:\n●\n\nLeg 1: Cairo (CAI) to Luanda, Angola (LAD/NBJ): * Airlines: You will typically\nfly with EgyptAir (which occasionally offers direct flights) or Ethiopian\nAirlines (which includes a layover in Addis Ababa).\n\n\fo\n\n●\n\nFlight Duration: If you manage to catch a direct flight, it takes about 6\nhours. If you fly with a layover (like on Ethiopian Airlines), expect this\nleg to take anywhere from 10 to 15 hours.\n\nLeg 2: Luanda to São Tomé (TMS): * Airlines: Once in Luanda, you will\nconnect to a regional flight. The most reliable carrier for this segment is\nTAAG Angola Airlines (the national airline of Angola), which flies this route a\nfew days a week.\no\n\nFlight Duration: This is a relatively short, direct flight taking\napproximately 2 hours and 15 minutes to 2 hours and 40 minutes.\n\nTotal Estimated Travel Time:\n●\n\nDepending heavily on how long your layover is in Luanda, your total travel\ntime will generally range from 14 to 24+ hours.\n\n●\n\nNote: TAAG Angola Airlines does not fly to São Tomé every single day, so you\nmay have a longer overnight layover in Luanda depending on the day of the\nweek you arrive from Cairo.\n\nApproximate Prices: Because this route combines major international flights with\nregional African carriers, the price can vary depending on whether you book the\njourney on a single ticket or piece it together separately.\n●\n\nOne-Way Total: Expect to pay roughly $750 to $950 USD (approx. 36,000 to\n45,500 EGP).\n\n●\n\nRound-Trip Total: Generally, ranges between $1,300 and $1,700 USD\n(approx. 62,500 to 81,500 EGP).\n\nPro Tip: Pay close attention to your layover time in Luanda. If you have to selftransfer (meaning you booked the two legs on separate tickets and need to re-check\nyour bags) or if you have a very long layover, you may be required to apply for an\nAngolan Transit Visa in advance. Always ask the airline if your luggage can be\nchecked all the way through to São Tomé!\nPro Tip: When booking flights with layovers in places like Lisbon or Casablanca,\ndouble-check if you will need a transit visa based on the layover duration and the\nterminal layout of those specific airports.\n\nFlight\nEst.\nSegments (Leg Total\nRoundConfirmed 2026 Visa & Transit\nPrimary Route Path 1 → Leg 2)\nDuration Trip Price Status\n\nThe East African\n(Ethiopian/ASKY)\n\nLeg 1: CAI\n,Addis Ababa\n(ADD)\n\n16 – 22\nhrs.\n\n~$1,500\nUSD\n\nVISA-FREE TRANSIT: Egyptians\ncan transit ADD without a visa if the\nlayover under12 hrs.\n\n\fLeg 2: ADD ,\nSão Tomé\n(TMS)\n\n(~72,000\nEGP)\n\nNote: Airline Layover Provided by\nAirline Free (on Ethiopian Airlines) if\ntransit from 8 -24 hrs.\n\nLeg 1: CAI ,\nLisbon (LIS)\n\n~$1,500\nUSD\n\nATV REQUIRED: Egyptian\ncitizens usually need a Schengen\nAirport Transit Visa for Lisbon. Most\nexpensive route due to visa fees\nand VFS processing.\n\nThe European (TAP Leg 2: LIS , São 18 – 22\nPortugal)\nTomé (TMS)\nhrs.\nLeg 1: CAI\n,Casablanca\n(CMN)\n\nThe North African\n(RAM / EgyptAir)\n\nLeg 2: CMN ,\nSão Tomé\n(TMS)\n\n~$1,500\nUSD\n17 – 20\nhrs.\n\nLeg 1: CAI ,\nLuanda (LAD)\nLeg 2: LAD ,\nThe Central African São Tomé\n(EgyptAir / TAAG) (TMS)\n\n(~72,000\nEGP)\n\n(~72,000\nEGP)\n\n24H EXEMPTION: No visa\nneeded if the layover is under 24\nhours and you remain in the transit\narea. Ideal for budget-conscious\ntravelers.\n\n$1,300 –\n$1,700\nUSD\n14 – 24\nhrs.\n\nTRANSIT LIMIT: No visa if under\n24h in the airport. Transit Visa ($50)\n(~62.5k – required if staying overnight or re81.5k EGP) checking bags (self-transfer).\n\n8.1.5 Temporary Residence Permit\nA temporary residence permit is required for any foreign national wishing to remain\nin STP for more than 90 days. It is typically issued for an initial period of one year and\nis renewable, subject to continued compliance with the conditions under which it\nwas granted.\n8.1.5.1 Eligibility\nTo qualify for a temporary residence permit, the applicant must:\n•\n•\n\n•\n•\n\nHold a valid long-stay visa appropriate to their purpose of stay.\nDemonstrate an ongoing legitimate reason to remain: active employment\ncontract, registration of a business, enrolment in a recognized study\nprogramme, or documented family ties to a lawful STP resident.\nProve financial self-sufficiency or have regular income.\nHave no disqualifying criminal record.\n\n8.1.5.2 Documentation Required\nThe following documents are generally required when applying to the SMF for a\ntemporary residence permit:\n\n\fDocument\n\nNotes / Specifications\n\nValid Passport\n\nMinimum 6 months’ validity beyond the intended\nperiod of stay. All pages required.\n\nLong-Stay Visa\n\nConfirming the authorized purpose of entry\n(employment, study, investment, etc.).\n\nApplication Form\n\nStandard SMF form, completed in Portuguese or with a\ncertified translation.\n\nProof of\nAccommodation\n\nRental contract, hotel booking confirmation, or\nnotarized letter from host.\n\nProof of Financial\nMeans\n\nBank statements, employment contract specifying\nsalary, or investment documentation.\n\nCriminal Background\nCheck\n\nIssued by the applicant’s country of origin; must be\napostilled where applicable.\n\nHealth Certificate\n\nCertificate of good health; some circumstances may\nrequire a medical examination.\n\nYellow Fever\nCertificate\n\nMandatory for entry into STP; must be presented at the\nborder and at SMF.\n\nPassport-Sized\nPhotographs\n\nTypically, 2–4 recent color photographs against a white\nbackground.\n\nEmployment Contract\n(if applicable)\n\nMust carry a favorable opinion from the Ministry of\nLabor confirming the absence of suitable local\ncandidates.\n\nBusiness Registration\n(if applicable)\n\nCompany incorporation documents showing active\ninvestment activity in STP.\n\nProof of Enrolment (if\napplicable)\n\nFor students: letter of acceptance from a recognized\nSTP educational institution.\n\n8.1.5.3 Employment-Based Temporary Residency: Additional Requirements\nFor foreign nationals applying under the employment category, the Santomean\ngovernment applies a local-labour preference policy. The employer must:\n•\n\nSubmit an employment contract to the Ministry of Labour.\n\n\f•\n\n•\n\nObtain a favorable opinion from the Ministry within 20 days, confirming that\nthe contractual terms meet legal standards and that no suitable local\ncandidate is available.\nComply with foreign worker quota requirements that priorities local\nemployment.\n\n8.1.5.4 Independent Professional / Investor Residency\nFor self-employed professionals and investors, the applicant must demonstrate:\n•\n•\n•\n\nEvidence of registered foreign investment or sufficient capital to sustain\nindependent activity.\nProfessional qualifications where the activity requires them.\nA clear business or professional plan aligned with STP’s development\npriorities (tourism, agriculture, renewable energy, and infrastructure).\n\n8.1.5.5 Application Procedure\nThe application for a temporary residence permit is made in person at the SMF office\nin São Tomé, following legal entry into the country:\n1. Step 1 — Obtain Long-Stay Visa: Apply at the nearest STP embassy or\nconsulate in your home country before travelling.\n2. Step 2 — Enter STP: Present your long-stay visa and yellow fever certificate\nat the port of entry. Ensure your passport has at least 6 months’ validity.\n3. Step 3 — Compile Documentation: Gather all required documents, ensuring\nall foreign-language documents are translated into Portuguese by a certified\ntranslator. Have apostilles applied as required.\n4. Step 4 — Submit to SMF: Present your application in person at the Serviço de\nMigração e Fronteiras (SMF) office. Pay the applicable processing fee.\n5. Step 5 — Await Processing: Processing times can vary. Bureaucratic delays\nare common; applicants should submit early and allow a generous lead time.\n6. Step 6 — Collect Permit: Upon approval, collect your temporary residence\ncard from SMF. This document must be kept on your person at all times.\n7. Step 7 — Renew Annually: The permit is typically valid for one year. Renewal\napplications should be initiated at least 30 days before expiry.\n8.1.6 Permeant Residence Permit\nPermanent residency in STP may be obtained after five years of continuous and lawful\ntemporary residence. This represents the standard residency pathway for long-term\nforeign nationals, including workers, self-employed professionals, and family\nmembers.\n8.1.6.1 Eligibility Criteria\n• Minimum 5 years of uninterrupted legal residence in STP under a valid\ntemporary residence permit.\n• Demonstrated financial stability: steady income from employment, selfemployment, or investment.\n\n\f•\n•\n•\n\nNo major criminal convictions or breaches of STP immigration law during the\nresidence period.\nEstablished ties to the country: employment, family, business ownership, or\nproperty ownership.\nBasic working knowledge of Portuguese is strongly advisable, as the\nimmigration process is conducted in Portuguese.\n\n8.1.6.2 Documentation Required\nIn addition to the standard documents listed for temporary residency, permanent\nresidency applications require:\n•\n•\n•\n•\n•\n\nProof of continuous and legal residence for the full 5-year period (residency\npermit renewal stamps, tax filings, employment records, or utility bills).\nCurrent valid temporary residence permit.\nUpdated criminal background check from both the applicant’s home country\nand STP judicial authorities.\nEvidence of financial self-sufficiency (bank statements for the preceding 12\nmonths).\nUpdated health certificate and yellow fever card.\n\n8.1.6.3 Rights and Benefits\nPermanent residents of STP enjoy the following:\n•\n•\n•\n•\n•\n\nThe right to reside in STP indefinitely without annual renewals.\nThe right to work without a separate work permit.\nAccess to most public services and administrative rights afforded to citizens,\nexcept the right to vote.\nThe ability to sponsor family members for family reunification visas.\nEligibility, after meeting additional criteria, to apply for STP citizenship\n(typically after a further period of residence).\n\n8.1.7 Special Residency Pathways\n8.1.7.1 Investment Visa and Investor Residency\nSTP actively encourages foreign direct investment, particularly in tourism,\nagriculture, and renewable energy. Foreign investors who demonstrate job creation\nor meaningful contribution to the national economy may be eligible for expedited\nspecial residency permits. Permanent residency for investors is available to those\nmaking significant contributions, such as establishing a business or funding\ninfrastructure projects.\n8.1.7.2 Citizenship by Investment (CBI) Programme\nNew Programme — Effective 1 August 2025 (Decreto-Lei n.º 07/2025)\nFor foreign nationals who wish to skip the standard 5-year residency pathway\nentirely, STP launched a Citizenship by Investment (CBI) programme in August\n2025. This represents the fastest route to legal status in STP.\n\n\f• Minimum investment: USD 90,000 (single applicant) — non-refundable\ncontribution to the National Transformation Fund\n• Family of 2–4 members: USD 95,000 (+ USD 5,000 per additional dependent)\n• Processing time: approximately 6–8 weeks from complete application\nsubmission\n• No residency requirement, no interview, no language test\n• Dual citizenship permitted; no requirement to renounce original nationality\n• Process can be completed entirely remotely through a licensed agent\n• Dependants eligible: spouse, children under 30, parents and grandparents\naged 55+\n• First passports issued January 2026 following 27 approvals\n• Passport provides visa-free or visa-on-arrival access to approximately 60–70+\ncountries\n• CPLP membership facilitates preferential treatment within Portuguesespeaking states\n8.1.7.3 CPLP Mobility Agreement\nSTP is a member of the Community of Portuguese Language Countries (CPLP). This\nmembership provides STP citizens and certain CPLP nationals with preferential\nmobility arrangements within member states — including access to simplified\nresidence permit processes in Portugal. However, CPLP membership does not\nconstitute automatic residency or immigration rights in other member states;\nnational immigration laws continue to apply.\n8.1.8 Key Practical Considerations\n8.1.8.1 Language\nPortuguese is the official language of STP. All immigration processes, forms, and\nofficial correspondence are conducted in Portuguese. Foreign-language documents\nmust be translated by a certified translator before submission to the SMF.\nProficiency in Portuguese, while not formally tested at the temporary residency\nstage, is practically essential for navigating daily life and bureaucratic processes.\n8.1.8.2 Yellow Fever Vaccination\nA valid yellow fever vaccination certificate is mandatory for all travelers entering\nSTP, regardless of nationality. This requirement applies at the border and must also\nbe presented as part of residency documentation.\n8.1.8.3 Healthcare and Infrastructure\nMedical services in STP are limited. There are no adequate trauma or ambulance\nservices on the islands. Even minor health issues may require medical evacuation at\nthe individual’s expense. All foreign residents are strongly advised to maintain\ncomprehensive international health insurance including medical evacuation\ncoverage.\n\n\f8.1.8.4 Financial Considerations\nThe official currency is the São Toméan Dobra (STN), pegged to the Euro.\nInternational credit cards (Visa) can be used at selected ATMs, stores, and hotels.\nUSD and Euros are widely accepted for exchange at banks. For exit from STP, a\nreport is required when leaving with €10,000 or more; financial statements must\nprove that no more is being exported than was brought in.\n8.1.8.5 Processing Times and Bureaucracy\nLike many small island nations, STP can experience delays in administrative\nprocessing. Long-term residency and work permit applications are particularly\nsusceptible. Applicants should plan well in advance, allow buffer time before any\nbusiness commencement date, and consider retaining a local legal representative or\nimmigration agent to navigate the process efficiently.\n8.1.9 Summary\nPathway\n\nDuration\n\nMin. Requirement\n\nKey Notes\n\nVisa-Free\nEntry\n\n15–30 days\n\nValid passport; yellow\nfever card\n\nNo residency rights;\nentry only\n\ne-Visa /\nBusiness\nVisa\n\nUp to 30\ndays\n\neVisaST application;\nsupporting docs\n\nSingle entry; no\nresidency qualification\n\nLong-Stay\nVisa\n\nUp to 90\ndays\n\nEmbassy/consulate Prerequisite to residency\napplication\npermits\n\nTemporary\nResidence\n\n1 year\n(renewable)\n\nLong-stay visa + SMF\napplication + 5-year path\n\nRequired for stays >90\ndays; work-specific\ncategories\n\nPermanent\nResidence\n\nIndefinite\n\n5 years continuous\nlawful residence\n\nRequires financial\nstability + ties to STP\n\nCBI\nProgramme\n\nImmediate\ncitizenship\n\nUSD 90,000+ to National\nTransformation Fund\n\nLaunched Aug 2025; no\nresidency requirement\n\n8.1.10 Useful Contacts and Resources\nPathway\nVisa-Free\nEntry\n\nDuration\n15–30 days\n\nMin. Requirement\nValid passport; yellow\nfever card\n\nKey Notes\nNo residency rights;\nentry only\n\n\fe-Visa /\nBusiness\nVisa\n\nUp to 30\ndays\n\neVisaST application;\nsupporting docs\n\nSingle entry; no\nresidency qualification\n\nLong-Stay\nVisa\n\nUp to 90\ndays\n\nEmbassy/consulate Prerequisite to residency\napplication\npermits\n\nTemporary\nResidence\n\n1 year\n(renewable)\n\nLong-stay visa + SMF\napplication + 5-year path\n\nRequired for stays >90\ndays; work-specific\ncategories\n\nPermanent\nResidence\n\nIndefinite\n\n5 years continuous\nlawful residence\n\nRequires financial\nstability + ties to STP\n\nCBI\nProgramme\n\nImmediate\ncitizenship\n\nUSD 90,000+ to National\nTransformation Fund\n\nLaunched Aug 2025; no\nresidency requirement", "references": [], "contentBlocks": [{"type": "text", "html": "<h3 class=\"content-h\">8.1 Visa & Resident Visa Guide</h3>"}, {"type": "text", "html": "<h3 class=\"content-h\">8.1.1 Introduction</h3>\n<p>São Tomé and Príncipe (STP) is a small, stable island nation in the Gulf of Guinea off the west coast of Central Africa. With a population of approximately 232,000 and a projected GDP growth of 3.1% in 2025, STP is increasingly attracting foreign nationals through investor-friendly immigration policies, its natural beauty, and its strategic position within the Community of Portuguese Language Countries (CPLP). The legal framework governing immigration is anchored in Law No. 1/91 on the Legal Status of Foreigners, supplemented by subsequent government decrees. The Migration and Borders Service (Serviço de Migração e Fronteiras – SMF) is the primary authority overseeing entry, residence, and work permits. The eVisaST platform serves as the primary digital gateway for visa and permit applications.</p>"}, {"type": "text", "html": "<h3 class=\"content-h\">8.1.2 Overview of Entry & Visa Categories</h3>\n<p>Before pursuing residency, foreign nationals must understand the entry pathway that applies to their nationality. STP recognizes the following categories:</p>"}, {"type": "text", "html": "<h3 class=\"content-h\">8.1.2.1 Visa-Free Entry</h3>\n<p>Citizens of a range of countries — including EU member states, the USA, Canada, and recent signatories such as Ghana, Mozambique, Colombia, and Dominica — may enter STP without a prior visa for short stays. US citizens may stay up to 30 days; most other qualifying nationals receive up to 15 days. These short-stay privileges do not confer any right of residency.</p>"}, {"type": "text", "html": "<h3 class=\"content-h\">8.1.2.2 Electronic Visa (e-Visa via eVisaST)</h3>\n<p>For nationalities not benefiting from visa-free entry, an electronic visa is available through the eVisaST platform. The e-Visa is a single-entry document valid for up to</p>"}, {"type": "text", "html": "<h3 class=\"content-h\">30 days from the date of entry and must be used within 30 days of issue. It is valid</h3>\n<p>for tourism, business visits, and transit. E-Visa holders do not qualify for residency; only long-stay visa holders may pursue residency status. • • • • •</p>\n<p>Apply online at the SMF eVisaST portal. Upload a single PDF (under 2 MB) containing passport copy, travel ticket, and accommodation or contact details. Save the generated process/reference number to track application status. No changes are permitted post-submission — accuracy is critical. Processing time: typically, up to 7 days.</p>\n<p>Visa Fees & Airport Stamping: Upon arrival at São Tomé International Airport, you are required to pay a stamping fee in cash to receive the official visa stamp in your passport. Please ensure you have the exact amount ready:</p>\n<p>●</p>\n<p>€20 for a single-entry 1-month Tourist Visa.</p>\n<p>●</p>\n<p>€30 for a single-entry 1-month Business Visa.</p>\n<p>●</p>\n<p>Note: Children under 18 pay half the standard fee. (Reference: São Tomé Islands FAQ)</p>"}, {"type": "text", "html": "<h3 class=\"content-h\">8.1.2.3 Business / Commercial Visa</h3>\n<p>Designed for commercial activities such as meetings, negotiations, or short-term engagements that do not constitute local employment. Valid for up to 30 days, available as single or multiple entry. Applications are submitted via the eVisaST platform using the same document upload procedure described above.</p>"}, {"type": "text", "html": "<h3 class=\"content-h\">8.1.2.4 Long-Stay Visa (Visto de Longa Duração)</h3>\n<p>Foreign nationals intending to reside in STP for more than 90 days must obtain a long-stay visa prior to arrival. This visa is the prerequisite for subsequent applications for temporary or permanent residence permits. Applications are submitted at STP embassies or consulates abroad, with a processing period of up to 30 days. The visa category determines the basis for the applicant’s stay: • • • • • •</p>\n<p>Subordinate employment (with a confirmed employment contract) Independent professional or self-employed activity Research or highly qualified professional positions Study, exchange, internship, or voluntary work Family reunification Investment or business establishment</p>"}, {"type": "text", "html": "<h3 class=\"content-h\">8.1.2.5 Visa Extension Process</h3>\n<p>If you need to extend your stay, the responsible authority is the Serviço de Migração e Fronteiras (Immigration and Borders Service). •</p>\n<p>Practical Steps for Extension:</p>\n<p>1. Apply Early: Submit your extension request 7 to 14 days before your current visa expires. Do not wait until the last day. 2. Visit the Immigration Office: Go to the headquarters in the capital, São Tomé, and request an \"Extension of stay\" or \"Visa extension.\" 3. Prepare Required Documents: You will generally need:</p>\n<p>•</p>\n<p>Your original passport.</p>\n<p>•</p>\n<p>A copy of your entry stamp or current visa.</p>\n<p>•</p>\n<p>A recent personal passport photo.</p>\n<p>•</p>\n<p>Proof of accommodation (hotel booking or residential address).</p>\n<p>•</p>\n<p>A tentative departure flight ticket or travel plan.</p>\n<p>•</p>\n<p>Proof of sufficient funds (not always requested, but highly recommended).</p>\n<p>•</p>\n<p>A valid reason for the extension (e.g., tourism, personal circumstances, or family visit).</p>\n<p>4. Pay the Fees: Extension fees vary based on the requested duration and are paid directly at the immigration office. 5. Wait for Approval: Approval can be granted on the same day or take a few days, though it may take longer in certain cases. •</p>\n<p>Extension Duration & Important Warnings:</p>\n<p>●</p>\n<p>Duration: Extensions are typically granted for an additional 15 to 30 days. Longer extensions are possible but not guaranteed.</p>\n<p>●</p>\n<p>Penalties: Applying late may result in a fine. Overstaying your visa can lead to complications upon departure or the outright rejection of your extension request.</p>\n<p>●</p>\n<p>Note: An extension is an administrative approval granted by immigration, not an automatic right.</p>\n<p>Pro Tip: If you plan to stay for up to 3 months from the beginning, it is best to enter with your initial visa and a clear extension plan, or ensure you have strong documented reasons (like a business or family.</p>"}, {"type": "text", "html": "<h3 class=\"content-h\">8.1.3 Health & Vaccination Requirements</h3>"}, {"type": "text", "html": "<h3 class=\"content-h\">8.1.3.1 Mandatory Vaccinations:</h3>\n<ul class=\"bullets\">\n<li>● Yellow Fever: This is strictly required only if you are arriving from a country</li>\n<p>with a risk of Yellow Fever transmission, or if you had a long transit in an atrisk African country. In this case, you must present an International Certificate of Vaccination (Yellow Card). 8.1.3.2Highly Recommended Vaccinations:</p>\n<li>● Hepatitis A: Recommended to prevent infection through contaminated food</li>\n<p>or water. ●</p>\n</ul>\n<p>Hepatitis B: Recommended if you plan a longer stay or might be exposed to medical procedures.</p>\n<p>●</p>\n<p>Typhoid: Highly recommended to prevent infection through contaminated food or water.</p>\n<p>●</p>\n<p>Tetanus, Diphtheria, and Pertussis (Tdap): Ensure you have had a booster shot within the last 10 years.</p>\n<p>●</p>\n<p>Measles, Mumps, Rubella (MMR): Important if you have not been previously vaccinated. Malaria Prevention: While there is no vaccine for Malaria, there is a low-tomoderate risk in the country depending on the specific region you visit.</p>\n<p>●</p>\n<p>It is strongly advised to take prescribed anti-malarial medication before and during your travel.</p>\n<p>●</p>\n<p>Always use a strong, effective insect repellent.</p>\n<p>(Reference: CDC Guidelines for São Tomé and Príncipe</p>"}, {"type": "text", "html": "<h3 class=\"content-h\">8.1.4 Flight Information (Egypt to Sao Tome)</h3>\n<p>●</p>\n<p>Departure: Cairo International Airport (CAI)</p>\n<p>●</p>\n<p>Destination: São Tomé International Airport (TMS)</p>\n<p>●</p>\n<p>Direct Flights: There are no direct flights from Egypt to São Tomé. All routes require 1 to 2 layovers.</p>"}, {"type": "text", "html": "<h3 class=\"content-h\">8.1.4.1 Available Airlines & Common Routes:</h3>\n<ul class=\"bullets\">\n<li>● Ethiopian Airlines / ASKY Airlines: This is one of the most common and</li>\n<p>practical options for this route. Flights typically connect through Addis Ababa (ADD) and sometimes have an additional stop in a West African hub. ●</p>\n</ul>\n<p>TAP Air Portugal: A popular and reliable route that usually requires a layover in Lisbon (LIS), Portugal before heading south to São Tomé.</p>\n<p>●</p>\n<p>EgyptAir & Royal Air Maroc: You can also find combined itineraries using these airlines, which usually connect through Casablanca (CMN), Morocco.</p>"}, {"type": "text", "html": "<h3 class=\"content-h\">8.1.4.2 Approximate Prices & Duration:</h3>\n<ul class=\"bullets\">\n<li>● One-Way Ticket: Prices typically start around $750 to $900 USD (approx.</li>\n<p>36,000 to 43,000 EGP), depending on how early you book. ●</p>\n</ul>\n<p>Round-Trip Ticket: Usually around $1,500 USD (approx. 72,000 EGP).</p>\n<p>●</p>\n<p>Travel Time: Due to layovers, expect your total travel duration to range anywhere from 16 to 22+ hours.</p>"}, {"type": "text", "html": "<h3 class=\"content-h\">8.1.4.3 Flying via Angola (Luanda)</h3>\n<p>There are no direct flights that cover the entire route from Cairo to São Tomé via Angola, so your journey will be broken into two main segments. The Route, Airlines, & Travel Time: ●</p>\n<p>Leg 1: Cairo (CAI) to Luanda, Angola (LAD/NBJ): * Airlines: You will typically fly with EgyptAir (which occasionally offers direct flights) or Ethiopian Airlines (which includes a layover in Addis Ababa).</p>\n<p>o</p>\n<p>●</p>\n<p>Flight Duration: If you manage to catch a direct flight, it takes about 6 hours. If you fly with a layover (like on Ethiopian Airlines), expect this leg to take anywhere from 10 to 15 hours.</p>\n<p>Leg 2: Luanda to São Tomé (TMS): * Airlines: Once in Luanda, you will connect to a regional flight. The most reliable carrier for this segment is TAAG Angola Airlines (the national airline of Angola), which flies this route a few days a week. o</p>\n<p>Flight Duration: This is a relatively short, direct flight taking approximately 2 hours and 15 minutes to 2 hours and 40 minutes.</p>\n<p>Total Estimated Travel Time: ●</p>\n<p>Depending heavily on how long your layover is in Luanda, your total travel time will generally range from 14 to 24+ hours.</p>\n<p>●</p>\n<p>Note: TAAG Angola Airlines does not fly to São Tomé every single day, so you may have a longer overnight layover in Luanda depending on the day of the week you arrive from Cairo.</p>\n<p>Approximate Prices: Because this route combines major international flights with regional African carriers, the price can vary depending on whether you book the journey on a single ticket or piece it together separately. ●</p>\n<p>One-Way Total: Expect to pay roughly $750 to $950 USD (approx. 36,000 to 45,500 EGP).</p>\n<p>●</p>\n<p>Round-Trip Total: Generally, ranges between $1,300 and $1,700 USD (approx. 62,500 to 81,500 EGP).</p>\n<p>Pro Tip: Pay close attention to your layover time in Luanda. If you have to selftransfer (meaning you booked the two legs on separate tickets and need to re-check your bags) or if you have a very long layover, you may be required to apply for an Angolan Transit Visa in advance. Always ask the airline if your luggage can be checked all the way through to São Tomé! Pro Tip: When booking flights with layovers in places like Lisbon or Casablanca, double-check if you will need a transit visa based on the layover duration and the terminal layout of those specific airports.</p>\n<p>Flight Est. Segments (Leg Total RoundConfirmed 2026 Visa & Transit Primary Route Path 1 → Leg 2) Duration Trip Price Status</p>\n<p>The East African (Ethiopian/ASKY)</p>\n<p>Leg 1: CAI ,Addis Ababa (ADD)</p>"}, {"type": "text", "html": "<h3 class=\"content-h\">16 – 22</h3>\n<p>hrs.</p>\n<p>~$1,500 USD</p>\n<p>VISA-FREE TRANSIT: Egyptians can transit ADD without a visa if the layover under12 hrs.</p>\n<p>Leg 2: ADD , São Tomé (TMS)</p>\n<p>(~72,000 EGP)</p>\n<p>Note: Airline Layover Provided by Airline Free (on Ethiopian Airlines) if transit from 8 -24 hrs.</p>\n<p>Leg 1: CAI , Lisbon (LIS)</p>\n<p>~$1,500 USD</p>\n<p>ATV REQUIRED: Egyptian citizens usually need a Schengen Airport Transit Visa for Lisbon. Most expensive route due to visa fees and VFS processing.</p>\n<p>The European (TAP Leg 2: LIS , São 18 – 22 Portugal) Tomé (TMS) hrs. Leg 1: CAI ,Casablanca (CMN)</p>\n<p>The North African (RAM / EgyptAir)</p>\n<p>Leg 2: CMN , São Tomé (TMS)</p>\n<p>~$1,500 USD</p>"}, {"type": "text", "html": "<h3 class=\"content-h\">17 – 20</h3>\n<p>hrs.</p>\n<p>Leg 1: CAI , Luanda (LAD) Leg 2: LAD , The Central African São Tomé (EgyptAir / TAAG) (TMS)</p>\n<p>(~72,000 EGP)</p>\n<p>(~72,000 EGP)</p>\n<p>24H EXEMPTION: No visa needed if the layover is under 24 hours and you remain in the transit area. Ideal for budget-conscious travelers.</p>\n<p>$1,300 – $1,700 USD</p>"}, {"type": "text", "html": "<h3 class=\"content-h\">14 – 24</h3>\n<p>hrs.</p>\n<p>TRANSIT LIMIT: No visa if under 24h in the airport. Transit Visa ($50) (~62.5k – required if staying overnight or re81.5k EGP) checking bags (self-transfer).</p>"}, {"type": "text", "html": "<h3 class=\"content-h\">8.1.5 Temporary Residence Permit</h3>\n<p>A temporary residence permit is required for any foreign national wishing to remain in STP for more than 90 days. It is typically issued for an initial period of one year and is renewable, subject to continued compliance with the conditions under which it was granted.</p>"}, {"type": "text", "html": "<h3 class=\"content-h\">8.1.5.1 Eligibility</h3>\n<p>To qualify for a temporary residence permit, the applicant must: • •</p>\n<p>• •</p>\n<p>Hold a valid long-stay visa appropriate to their purpose of stay. Demonstrate an ongoing legitimate reason to remain: active employment contract, registration of a business, enrolment in a recognized study programme, or documented family ties to a lawful STP resident. Prove financial self-sufficiency or have regular income. Have no disqualifying criminal record.</p>"}, {"type": "text", "html": "<h3 class=\"content-h\">8.1.5.2 Documentation Required</h3>\n<p>The following documents are generally required when applying to the SMF for a temporary residence permit:</p>\n<p>Document</p>\n<p>Notes / Specifications</p>\n<p>Valid Passport</p>\n<p>Minimum 6 months’ validity beyond the intended period of stay. All pages required.</p>\n<p>Long-Stay Visa</p>\n<p>Confirming the authorized purpose of entry (employment, study, investment, etc.).</p>\n<p>Application Form</p>\n<p>Standard SMF form, completed in Portuguese or with a certified translation.</p>\n<p>Proof of Accommodation</p>\n<p>Rental contract, hotel booking confirmation, or notarized letter from host.</p>\n<p>Proof of Financial Means</p>\n<p>Bank statements, employment contract specifying salary, or investment documentation.</p>\n<p>Criminal Background Check</p>\n<p>Issued by the applicant’s country of origin; must be apostilled where applicable.</p>\n<p>Health Certificate</p>\n<p>Certificate of good health; some circumstances may require a medical examination.</p>\n<p>Yellow Fever Certificate</p>\n<p>Mandatory for entry into STP; must be presented at the border and at SMF.</p>\n<p>Passport-Sized Photographs</p>\n<p>Typically, 2–4 recent color photographs against a white background.</p>\n<p>Employment Contract (if applicable)</p>\n<p>Must carry a favorable opinion from the Ministry of Labor confirming the absence of suitable local candidates.</p>\n<p>Business Registration (if applicable)</p>\n<p>Company incorporation documents showing active investment activity in STP.</p>\n<p>Proof of Enrolment (if applicable)</p>\n<p>For students: letter of acceptance from a recognized STP educational institution.</p>"}, {"type": "table", "html": "<div class=\"table-caption\">8.1.5.2</div><div class=\"table-wrap\"><table class=\"data-table\"><thead><tr><th></th><th>Leg 2: ADD , São Tomé (TMS)</th><th>(~72,000 EGP)</th><th>Note: Airline Layover Provided by Airline Free (on Ethiopian Airlines) if transit from 8 -24 hrs.</th></tr></thead><tbody><tr><td>The European (TAP Portugal)</td><td>Leg 1: CAI , Lisbon (LIS) Leg 2: LIS , São Tomé (TMS) 18 – 22 hrs.</td><td>~$1,500 USD (~72,000 EGP)</td><td>ATV REQUIRED: Egyptian citizens usually need a Schengen Airport Transit Visa for Lisbon. Most expensive route due to visa fees and VFS processing.</td></tr><tr><td>The North African (RAM / EgyptAir)</td><td>Leg 1: CAI ,Casablanca (CMN) Leg 2: CMN , São Tomé (TMS) 17 – 20 hrs.</td><td>~$1,500 USD (~72,000 EGP)</td><td>24H EXEMPTION: No visa needed if the layover is under 24 hours and you remain in the transit area. Ideal for budget-conscious travelers.</td></tr><tr><td>The Central African (EgyptAir / TAAG)</td><td>Leg 1: CAI , Luanda (LAD) Leg 2: LAD , São Tomé (TMS) 14 – 24 hrs.</td><td>$1,300 – $1,700 USD (~62.5k – 81.5k EGP)</td><td>TRANSIT LIMIT: No visa if under 24h in the airport. Transit Visa ($50) required if staying overnight or re- checking bags (self-transfer).</td></tr></tbody></table></div>"}, {"type": "text", "html": "<h3 class=\"content-h\">8.1.5.3 Employment-Based Temporary Residency: Additional Requirements</h3>\n<p>For foreign nationals applying under the employment category, the Santomean government applies a local-labour preference policy. The employer must: •</p>\n<p>Submit an employment contract to the Ministry of Labour.</p>\n<p>•</p>\n<p>•</p>\n<p>Obtain a favorable opinion from the Ministry within 20 days, confirming that the contractual terms meet legal standards and that no suitable local candidate is available. Comply with foreign worker quota requirements that priorities local employment.</p>"}, {"type": "table", "html": "<div class=\"table-caption\">8.1.5.3</div><div class=\"table-wrap\"><table class=\"data-table\"><thead><tr><th></th><th>Document</th><th>Notes / Specifications</th></tr></thead><tbody><tr><td>Valid Passport</td><td>Valid Passport</td><td>Minimum 6 months’ validity beyond the intended</td></tr><tr><td></td><td></td><td>period of stay. All pages required.</td></tr><tr><td>Long-Stay Visa</td><td>Long-Stay Visa</td><td>Confirming the authorized purpose of entry</td></tr><tr><td></td><td></td><td>(employment, study, investment, etc.).</td></tr><tr><td>Application Form</td><td>Application Form</td><td>Standard SMF form, completed in Portuguese or with a</td></tr><tr><td></td><td></td><td>certified translation.</td></tr><tr><td></td><td>Proof of</td><td>Rental contract, hotel booking confirmation, or</td></tr><tr><td></td><td>Accommodation</td><td>notarized letter from host.</td></tr><tr><td></td><td>Proof of Financial</td><td>Bank statements, employment contract specifying</td></tr><tr><td></td><td>Means</td><td>salary, or investment documentation.</td></tr><tr><td></td><td>Criminal Background</td><td>Issued by the applicant’s country of origin; must be</td></tr><tr><td></td><td>Check</td><td>apostilled where applicable.</td></tr><tr><td>Health Certificate</td><td>Health Certificate</td><td>Certificate of good health; some circumstances may</td></tr><tr><td></td><td></td><td>require a medical examination.</td></tr><tr><td></td><td>Yellow Fever</td><td>Mandatory for entry into STP; must be presented at the</td></tr><tr><td></td><td>Certificate</td><td>border and at SMF.</td></tr><tr><td></td><td>Passport-Sized</td><td>Typically, 2–4 recent color photographs against a white</td></tr><tr><td></td><td>Photographs</td><td>background.</td></tr><tr><td>Employment Contract (if applicable)</td><td>Employment Contract</td><td>Must carry a favorable opinion from the Ministry of</td></tr><tr><td></td><td>(if applicable)</td><td>Labor confirming the absence of suitable local</td></tr><tr><td></td><td></td><td>candidates.</td></tr><tr><td></td><td>Business Registration</td><td>Company incorporation documents showing active</td></tr><tr><td></td><td>(if applicable)</td><td>investment activity in STP.</td></tr><tr><td></td><td>Proof of Enrolment (if</td><td>For students: letter of acceptance from a recognized</td></tr><tr><td></td><td>applicable)</td><td>STP educational institution.</td></tr></tbody></table></div>"}, {"type": "text", "html": "<h3 class=\"content-h\">8.1.5.4 Independent Professional / Investor Residency</h3>\n<p>For self-employed professionals and investors, the applicant must demonstrate: • • •</p>\n<p>Evidence of registered foreign investment or sufficient capital to sustain independent activity. Professional qualifications where the activity requires them. A clear business or professional plan aligned with STP’s development priorities (tourism, agriculture, renewable energy, and infrastructure).</p>"}, {"type": "text", "html": "<h3 class=\"content-h\">8.1.5.5 Application Procedure</h3>\n<p>The application for a temporary residence permit is made in person at the SMF office in São Tomé, following legal entry into the country: 1. Step 1 — Obtain Long-Stay Visa: Apply at the nearest STP embassy or consulate in your home country before travelling. 2. Step 2 — Enter STP: Present your long-stay visa and yellow fever certificate at the port of entry. Ensure your passport has at least 6 months’ validity. 3. Step 3 — Compile Documentation: Gather all required documents, ensuring all foreign-language documents are translated into Portuguese by a certified translator. Have apostilles applied as required. 4. Step 4 — Submit to SMF: Present your application in person at the Serviço de Migração e Fronteiras (SMF) office. Pay the applicable processing fee. 5. Step 5 — Await Processing: Processing times can vary. Bureaucratic delays are common; applicants should submit early and allow a generous lead time. 6. Step 6 — Collect Permit: Upon approval, collect your temporary residence card from SMF. This document must be kept on your person at all times. 7. Step 7 — Renew Annually: The permit is typically valid for one year. Renewal applications should be initiated at least 30 days before expiry.</p>"}, {"type": "text", "html": "<h3 class=\"content-h\">8.1.6 Permeant Residence Permit</h3>\n<p>Permanent residency in STP may be obtained after five years of continuous and lawful temporary residence. This represents the standard residency pathway for long-term foreign nationals, including workers, self-employed professionals, and family members.</p>"}, {"type": "text", "html": "<h3 class=\"content-h\">8.1.6.1 Eligibility Criteria</h3>\n<ul class=\"bullets\">\n<li>• Minimum 5 years of uninterrupted legal residence in STP under a valid</li>\n<p>temporary residence permit.</p>\n<li>• Demonstrated financial stability: steady income from employment, selfemployment, or investment.</li>\n</ul>\n<p>• • •</p>\n<p>No major criminal convictions or breaches of STP immigration law during the residence period. Established ties to the country: employment, family, business ownership, or property ownership. Basic working knowledge of Portuguese is strongly advisable, as the immigration process is conducted in Portuguese.</p>"}, {"type": "text", "html": "<h3 class=\"content-h\">8.1.6.2 Documentation Required</h3>\n<p>In addition to the standard documents listed for temporary residency, permanent residency applications require: • • • • •</p>\n<p>Proof of continuous and legal residence for the full 5-year period (residency permit renewal stamps, tax filings, employment records, or utility bills). Current valid temporary residence permit. Updated criminal background check from both the applicant’s home country and STP judicial authorities. Evidence of financial self-sufficiency (bank statements for the preceding 12 months). Updated health certificate and yellow fever card.</p>"}, {"type": "text", "html": "<h3 class=\"content-h\">8.1.6.3 Rights and Benefits</h3>\n<p>Permanent residents of STP enjoy the following: • • • • •</p>\n<p>The right to reside in STP indefinitely without annual renewals. The right to work without a separate work permit. Access to most public services and administrative rights afforded to citizens, except the right to vote. The ability to sponsor family members for family reunification visas. Eligibility, after meeting additional criteria, to apply for STP citizenship (typically after a further period of residence).</p>"}, {"type": "text", "html": "<h3 class=\"content-h\">8.1.7 Special Residency Pathways</h3>"}, {"type": "text", "html": "<h3 class=\"content-h\">8.1.7.1 Investment Visa and Investor Residency</h3>\n<p>STP actively encourages foreign direct investment, particularly in tourism, agriculture, and renewable energy. Foreign investors who demonstrate job creation or meaningful contribution to the national economy may be eligible for expedited special residency permits. Permanent residency for investors is available to those making significant contributions, such as establishing a business or funding infrastructure projects.</p>"}, {"type": "text", "html": "<h3 class=\"content-h\">8.1.7.2 Citizenship by Investment (CBI) Programme</h3>\n<p>New Programme — Effective 1 August 2025 (Decreto-Lei n.º 07/2025) For foreign nationals who wish to skip the standard 5-year residency pathway entirely, STP launched a Citizenship by Investment (CBI) programme in August 2025. This represents the fastest route to legal status in STP.</p>\n<ul class=\"bullets\">\n<li>• Minimum investment: USD 90,000 (single applicant) — non-refundable</li>\n<p>contribution to the National Transformation Fund</p>\n<li>• Family of 2–4 members: USD 95,000 (+ USD 5,000 per additional dependent)</li>\n<li>• Processing time: approximately 6–8 weeks from complete application</li>\n<p>submission</p>\n<li>• No residency requirement, no interview, no language test</li>\n<li>• Dual citizenship permitted; no requirement to renounce original nationality</li>\n<li>• Process can be completed entirely remotely through a licensed agent</li>\n<li>• Dependants eligible: spouse, children under 30, parents and grandparents</li>\n<p>aged 55+</p>\n<li>• First passports issued January 2026 following 27 approvals</li>\n<li>• Passport provides visa-free or visa-on-arrival access to approximately 60–70+</li>\n<p>countries</p>\n<li>• CPLP membership facilitates preferential treatment within Portuguesespeaking states</li>\n</ul>"}, {"type": "text", "html": "<h3 class=\"content-h\">8.1.7.3 CPLP Mobility Agreement</h3>\n<p>STP is a member of the Community of Portuguese Language Countries (CPLP). This membership provides STP citizens and certain CPLP nationals with preferential mobility arrangements within member states — including access to simplified residence permit processes in Portugal. However, CPLP membership does not constitute automatic residency or immigration rights in other member states; national immigration laws continue to apply.</p>"}, {"type": "text", "html": "<h3 class=\"content-h\">8.1.8 Key Practical Considerations</h3>"}, {"type": "text", "html": "<h3 class=\"content-h\">8.1.8.1 Language</h3>\n<p>Portuguese is the official language of STP. All immigration processes, forms, and official correspondence are conducted in Portuguese. Foreign-language documents must be translated by a certified translator before submission to the SMF. Proficiency in Portuguese, while not formally tested at the temporary residency stage, is practically essential for navigating daily life and bureaucratic processes.</p>"}, {"type": "text", "html": "<h3 class=\"content-h\">8.1.8.2 Yellow Fever Vaccination</h3>\n<p>A valid yellow fever vaccination certificate is mandatory for all travelers entering STP, regardless of nationality. This requirement applies at the border and must also be presented as part of residency documentation.</p>"}, {"type": "text", "html": "<h3 class=\"content-h\">8.1.8.3 Healthcare and Infrastructure</h3>\n<p>Medical services in STP are limited. There are no adequate trauma or ambulance services on the islands. Even minor health issues may require medical evacuation at the individual’s expense. All foreign residents are strongly advised to maintain comprehensive international health insurance including medical evacuation coverage.</p>"}, {"type": "text", "html": "<h3 class=\"content-h\">8.1.8.4 Financial Considerations</h3>\n<p>The official currency is the São Toméan Dobra (STN), pegged to the Euro. International credit cards (Visa) can be used at selected ATMs, stores, and hotels. USD and Euros are widely accepted for exchange at banks. For exit from STP, a report is required when leaving with €10,000 or more; financial statements must prove that no more is being exported than was brought in.</p>"}, {"type": "text", "html": "<h3 class=\"content-h\">8.1.8.5 Processing Times and Bureaucracy</h3>\n<p>Like many small island nations, STP can experience delays in administrative processing. Long-term residency and work permit applications are particularly susceptible. Applicants should plan well in advance, allow buffer time before any business commencement date, and consider retaining a local legal representative or immigration agent to navigate the process efficiently.</p>"}, {"type": "text", "html": "<h3 class=\"content-h\">8.1.9 Summary</h3>\n<p>Pathway</p>\n<p>Duration</p>\n<p>Min. Requirement</p>\n<p>Key Notes</p>\n<p>Visa-Free Entry</p>\n<p>15–30 days</p>\n<p>Valid passport; yellow fever card</p>\n<p>No residency rights; entry only</p>\n<p>e-Visa / Business Visa</p>\n<p>Up to 30 days</p>\n<p>eVisaST application; supporting docs</p>\n<p>Single entry; no residency qualification</p>\n<p>Long-Stay Visa</p>\n<p>Up to 90 days</p>\n<p>Embassy/consulate Prerequisite to residency application permits</p>\n<p>Temporary Residence</p>"}, {"type": "table", "html": "<div class=\"table-caption\">8.1.9 Summary</div><div class=\"table-wrap\"><table class=\"data-table\"><thead><tr><th>Pathwa p>\n<p>USD 90,000+ to National Transformation Fund</p>\n<p>Launched Aug 2025; no residency requirement</p>"}, {"type": "text", "html": "<h3 class=\"content-h\">8.1.10 Useful Contacts and Resources</h3>\n<p>Pathway Visa-Free Entry</p>\n<p>Duration 15–30 days</p>\n<p>Min. Requirement Valid passport; yellow fever card</p>\n<p>Key Notes No residency rights; entry only</p>\n<p>e-Visa / Business Visa</p>\n<p>Up to 30 days</p>\n<p>eVisaST application; supporting docs</p>\n<p>Single entry; no residency qualification</p>\n<p>Long-Stay Visa</p>\n<p>Up to 90 days</p>\n<p>Embassy/consulate Prerequisite to residency application permits</p>\n<p>Temporary Residence</p>"}, {"type": "table", "html": "<div class=\"table-caption\">8.1.10 Useful Contacts and Resources</div><div class=\"table-wrap\"><table class=\"data-table\"><thead><tr><th>Pathway</th><th>Duration</th><th>Min. Requirement</th><th>Key Notes</th></tr></thead><tbody><tr><td>Visa-Free 15–30 days</td><td>15–30 days</td><td>Valid passport; yellow</td><td>No residency rights;</td></tr><tr><td>Entry</td><td></td><td>fever card</td><td>entry only</td></tr></tbody></table></div>"}, {"type": "text", "html": "<h3 class=\"content-h\">1 year</h3>\n<p>(renewable)</p>\n<p>Long-stay visa + SMF application + 5-year path</p>\n<p>Required for stays >90 days; work-specific categories</p>\n<p>Permanent Residence</p>\n<p>Indefinite</p>"}, {"type": "text", "html": "<h3 class=\"content-h\">5 years continuous</h3>\n<p>lawful residence</p>\n<p>Requires financial stability + ties to STP</p>\n<p>CBI Programme</p>\n<p>Immediate citizenship</p>\n<p>USD 90,000+ to National Transformation Fund</p>\n<p>Launched Aug 2025; no residency requirement</p>"}], "tables": [{"caption": "8.1.5.2", "headers": ["", "Leg 2: ADD , São Tomé (TMS)", "(~72,000 EGP)", "Note: Airline Layover Provided by Airline Free (on Ethiopian Airlines) if transit from 8 -24 hrs."], "rows": [["The European (TAP Portugal)", "Leg 1: CAI , Lisbon (LIS) Leg 2: LIS , São Tomé (TMS) 18 – 22 hrs.", "~$1,500 USD (~72,000 EGP)", "ATV REQUIRED: Egyptian citizens usually need a Schengen Airport Transit Visa for Lisbon. Most expensive route due to visa fees and VFS processing."], ["The North African (RAM / EgyptAir)", "Leg 1: CAI ,Casablanca (CMN) Leg 2: CMN , São Tomé (TMS) 17 – 20 hrs.", "~$1,500 USD (~72,000 EGP)", "24H EXEMPTION: No visa needed if the layover is under 24 hours and you remain in the transit area. Ideal for budget-conscious travelers."], ["The Central African (EgyptAir / TAAG)", "Leg 1: CAI , Luanda (LAD) Leg 2: LAD , São Tomé (TMS) 14 – 24 hrs.", "$1,300 – $1,700 USD (~62.5k – 81.5k EGP)", "TRANSIT LIMIT: No visa if under 24h in the airport. Transit Visa ($50) required if staying overnight or re- checking bags (self-transfer)."]]}, {"caption": "8.1.5.3", "headers": ["", "Document", "Notes / Specifications"], "rows": [["Valid Passport", "Valid Passport", "Minimum 6 months’ validity beyond the intended"], ["", "", "period of stay. All pages required."], ["Long-Stay Visa", "Long-Stay Visa", "Confirming the authorized purpose of entry"], ["", "", "(employment, study, investment, etc.)."], ["Application Form", "Application Form", "Standard SMF form, completed in Portuguese or with a"], ["", "", "certified translation."], ["", "Proof of", "Rental contract, hotel booking confirmation, or"], ["", "Accommodation", "notarized letter from host."], ["", "Proof of Financial", "Bank statements, employment contract specifying"], ["", "Means", "salary, or investment documentation."], ["", "Criminal Background", "Issued by the applicant’s country of origin; must be"], ["", "Check", "apostilled where applicable."], ["Health Certificate", "Health Certificate", "Certificate of good health; some circumstances may"], ["", "", "require a medical examination."], ["", "Yellow Fever", "Mandatory for entry into STP; must be presented at the"], ["", "Certificate", "border and at SMF."], ["", "Passport-Sized", "Typically, 2–4 recent color photographs against a white"], ["", "Photographs", "background."], ["Employment Contract (if applicable)", "Employment Contract", "Must carry a favorable opinion from the Ministry of"], ["", "(if applicable)", "Labor confirming the absence of suitable local"], ["", "", "candidates."], ["", "Business Registration", "Company incorporation documents showing active"], ["", "(if applicable)", "investment activity in STP."], ["", "Proof of Enrolment (if", "For students: letter of acceptance from a recognized"], ["", "applicable)", "STP educational institution."]]}, {"caption": "8.1.9 Summary", "headers": ["Pathway", "Duration", "Min. Requirement", "Key Notes"], "rows": [["Visa-Free 15–30 days", "15–30 days", "Valid passport; yellow", "No residency rights;"], ["Entry", "", "fever card", "entry only"], ["e-Visa / Up to 30 days", "Up to 30 eVisaST application; supporting docs", "eVisaST application; Single entry; no residency qualification", "Single entry; no"], ["Business", "days", "supporting docs", "residency qualification"], ["Visa", "", "", ""], ["Long-Stay", "Up to 90", "Embassy/consulate", "Prerequisite to residency"], ["Visa", "days", "application", "permits"], ["Temporary 1 year (renewable)", "1 year Long-stay visa + SMF application + 5-year path", "Long-stay visa + SMF", "Required for stays >90"], ["Residence", "(renewable)", "application + 5-year path", "days; work-specific"], ["", "", "", "categories"], ["Permanent Indefinite", "Indefinite", "5 years continuous", "Requires financial"], ["Residence", "", "lawful residence", "stability + ties to STP"], ["CBI", "Immediate", "USD 90,000+ to National", "Launched Aug 2025; no"], ["Programme", "citizenship", "Transformation Fund", "residency requirement"]]}, {"caption": "8.1.10 Useful Contacts and Resources", "headers": ["Pathway", "Duration", "Min. Requirement", "Key Notes"], "rows": [["Visa-Free 15–30 days", "15–30 days", "Valid passport; yellow", "No residency rights;"], ["Entry", "", "fever card", "entry only"]]}]}, {"num": "8.2", "title": "Accommodation Options", "content": "8.2 Accommodation Options\n8.2.1 Hotels — São Tomé Island\nSão Tomé's hotel sector is anchored by a handful of dependable properties, ranging\nfrom luxury beach resorts to well-run mid-range options.\nOmali São Tomé (4-star)\nLocated near the airport at Praia Lagarto, Omali is widely regarded as the most\noperationally reliable hotel on the island. It functions as a largely self-contained\ncompound with direct beach access, a pool, restaurant, and spa. First choice for\nbusiness travelers and first-time visitors who priorities infrastructure stability —\nseamless generator backup and international card acceptance. Guest rating: 9.4/10\n(Expedia). A 15–20-minute walk from the city center, or a short taxi ride.\nPestana São Tomé (5-star)\nThe group's flagship São Tomé property. Beachfront location with an infinity pool,\nkayaking, snorkeling, and proximity to the city center. Guest rating: 8.0/10 (Expedia).\nFree airport transfers included.\nPestana Miramar São Tomé (4-star)\nAn older colonial-style property set in dense tropical gardens, adjacent to the main\nPestana hotel. Atmospheric and well-priced, with a large garden pool and access to\nthe main Pestana facilities. Named by CNN as one of the 20 best places to visit.\nGenerator shared with main Pestana; generally reliable.\nSH Boutique Hotel & Hotel Kenito\n\n\fSH Boutique Hotel (~$85/night) is a newer, well-reviewed mid-range option rated\nExcellent (8.7). Hotel Kenito offers budget-friendly rates with a nice pool; manual\ngenerator switchover (2–5 min outage during power failures). Good value for nonluxury stays.\n8.2.2 Hotels — Príncipe Island\nPríncipe is serviced by two flagship eco-luxury resorts set within the UNESCO-listed\nPríncipe Biosphere Reserve, both approximately 2 km from the island's airport:\nSundy Praia (5-star) — premium eco-resort, holistic spa, immersive nature\nwalks\n● Bom Bom Island Resort (4-star) — boutique eco-resort on a private peninsula\n●\n\nImportant: Cash is the norm on Príncipe. Card terminals are largely unavailable. Bring\nsufficient Euro cash before travelling to the island.\n8.2.3 Airbnb & Self-Catering\nAirbnb availability on both islands is active and well-reviewed (overall rating: 4.6–4.8\nout of 5). Key categories include:\nEcolodges & Beach Bungalows\nMonte Mar Ecolodge (near Tamarindos Beach) and Jalé Beach bungalows in the\nsouth — from ~$20–$60/night. Breakfast and Wi-Fi often included. Rated 4.67/5\nwith 75+ reviews.\nOrganic Plantation Farmhouses\nStays on vanilla and spice plantations with sea views and private beach access (Porto\nAlegre / Caué district) — ~$50–$120/night. Restaurant and traditional meals\navailable on-site.\nForest & Nature Cabins (Neves area)\nChalets with private bathrooms, panoramic sea views, and veranda. Rated 4.83/5\nwith 48 reviews. 30+ endemic bird species in the vicinity — the best sunset on the\nisland.\nCity-Centre Guesthouses (São Tomé capital)\nFrom $30–$80/night. Walkable access to the Mercado Municipal, waterfront, and\nrestaurants.\nLong-Stay / Remote Work Rentals\nFully furnished monthly options with dedicated workspaces and kitchens. Special\nmonthly rates available with single payment and no additional paperwork.\nA tourist tax of €2.10 per person per night is standard and charged on-site at most\nproperties.\n\n\f8.3 Accommodation Prices — Reference Rates\nProperty / Type\n\nApprox. Price /\nNight\n\nNotes\n\nOmali São Tomé (4★)\n\n$150 – $220\n\nMost reliable infrastructure; near\nairport\n\nPestana São Tomé\n(5★)\n\n$180 – $250+\n\nFree airport transfer; beachfront\n\nPestana Miramar\n(4★)\n\n$107 – $160\n\nCheapest in March (~$87/night)\n\nSH Boutique Hotel\n\n~$85\n\nGood value; mid-range\n\nAirbnb bungalow /\ncabin\n\n$20 – $100\n\nWide range; check breakfast\ninclusion\n\nPlantation farmhouse\n\n$50 – $120\n\nOften includes meals; sea views\n\nPríncipe eco-resorts\n\n$250 – $500+\n\nAll-inclusive packages available\n\nAverage 4-star hotel price in São Tomé: ~$220/night. Prices are lowest January–\nMarch (off-peak season).", "references": [], "contentBlocks": [{"type": "text", "html": "<h3 class=\"content-h\">8.2 Accommodation Options</h3>"}, {"type": "text", "html": "<h3 class=\"content-h\">8.2.1 Hotels — São Tomé Island</h3>\n<p>São Tomé's hotel sector is anchored by a handful of dependable properties, ranging from luxury beach resorts to well-run mid-range options. Omali São Tomé (4-star) Located near the airport at Praia Lagarto, Omali is widely regarded as the most operationally reliable hotel on the island. It functions as a largely self-contained compound with direct beach access, a pool, restaurant, and spa. First choice for business travelers and first-time visitors who priorities infrastructure stability — seamless generator backup and international card acceptance. Guest rating: 9.4/10 (Expedia). A 15–20-minute walk from the city center, or a short taxi ride. Pestana São Tomé (5-star) The group's flagship São Tomé property. Beachfront location with an infinity pool, kayaking, snorkeling, and proximity to the city center. Guest rating: 8.0/10 (Expedia). Free airport transfers included. Pestana Miramar São Tomé (4-star) An older colonial-style property set in dense tropical gardens, adjacent to the main Pestana hotel. Atmospheric and well-priced, with a large garden pool and access to the main Pestana facilities. Named by CNN as one of the 20 best places to visit. Generator shared with main Pestana; generally reliable. SH Boutique Hotel & Hotel Kenito</p>\n<p>SH Boutique Hotel (~$85/night) is a newer, well-reviewed mid-range option rated Excellent (8.7). Hotel Kenito offers budget-friendly rates with a nice pool; manual generator switchover (2–5 min outage during power failures). Good value for nonluxury stays.</p>"}, {"type": "text", "html": "<h3 class=\"content-h\">8.2.2 Hotels — Príncipe Island</h3>\n<p>Príncipe is serviced by two flagship eco-luxury resorts set within the UNESCO-listed Príncipe Biosphere Reserve, both approximately 2 km from the island's airport: Sundy Praia (5-star) — premium eco-resort, holistic spa, immersive nature walks</p>\n<ul class=\"bullets\">\n<li>● Bom Bom Island Resort (4-star) — boutique eco-resort on a private peninsula</li>\n<p>●</p>\n</ul>\n<p>Important: Cash is the norm on Príncipe. Card terminals are largely unavailable. Bring sufficient Euro cash before travelling to the island.</p>"}, {"type": "text", "html": "<h3 class=\"content-h\">8.2.3 Airbnb & Self-Catering</h3>\n<p>Airbnb availability on both islands is active and well-reviewed (overall rating: 4.6–4.8 out of 5). Key categories include: Ecolodges & Beach Bungalows Monte Mar Ecolodge (near Tamarindos Beach) and Jalé Beach bungalows in the south — from ~$20–$60/night. Breakfast and Wi-Fi often included. Rated 4.67/5 with 75+ reviews. Organic Plantation Farmhouses Stays on vanilla and spice plantations with sea views and private beach access (Porto Alegre / Caué district) — ~$50–$120/night. Restaurant and traditional meals available on-site. Forest & Nature Cabins (Neves area) Chalets with private bathrooms, panoramic sea views, and veranda. Rated 4.83/5 with 48 reviews. 30+ endemic bird species in the vicinity — the best sunset on the island. City-Centre Guesthouses (São Tomé capital) From $30–$80/night. Walkable access to the Mercado Municipal, waterfront, and restaurants. Long-Stay / Remote Work Rentals Fully furnished monthly options with dedicated workspaces and kitchens. Special monthly rates available with single payment and no additional paperwork. A tourist tax of €2.10 per person per night is standard and charged on-site at most properties.</p>"}, {"type": "text", "html": "<h3 class=\"content-h\">8.3 Accommodation Prices — Reference Rates</h3>\n<p>Property / Type</p>\n<p>Approx. Price / Night</p>\n<p>Notes</p>\n<p>Omali São Tomé (4★)</p>\n<p>$150 – $220</p>\n<p>Most reliable infrastructure; near airport</p>\n<p>Pestana São Tomé (5★)</p>\n<p>$180 – $250+</p>\n<p>Free airport transfer; beachfront</p>\n<p>Pestana Miramar (4★)</p>\n<p>$107 – $160</p>\n<p>Cheapest in March (~$87/night)</p>\n<p>SH Boutique Hotel</p>\n<p>~$85</p>\n<p>Good value; mid-range</p>\n<p>Airbnb bungalow / cabin</p>\n<p>$20 – $100</p>\n<p>Wide range; check breakfast inclusion</p>\n<p>Plantation farmhouse</p>\n<p>$50 – $120</p>\n<p>Often includes meals; sea views</p>\n<p>Príncipe eco-resorts</p>\n<p>$250 – $500+</p>\n<p>All-inclusive packages available</p>\n<p>Average 4-star hotel price in São Tomé: ~$220/night. Prices are lowest January– March (off-peak season).</p>"}], "tables": []}, {"num": "8.4", "title": "Reservation Policies", "content": "8.4 Reservation Policies\nBooking Platforms: Hotels.com, Booking.com, Expedia, Airbnb,Flatio and direct\nhotel websites all active for São Tomé and Príncipe properties.\nCancellation Policy: Most major hotels (Pestana, Omali) offer fully refundable rates\non standard bookings. Policies vary by room type and booking date — always check\nconditions at time of reservation.\nCheck-in / Check-out: Standard check-out is 12:00 noon (e.g., Pestana Miramar).\nLate check-out is available on request and subject to availability.\nPayment: The country operates almost entirely on cash, and ATMs do not accept\ninternational Visa or Mastercard, International credit cards accepted reliably at\nOmali and Pestana. Hit-or-miss at mid-range hotels due to mobile network\ninstability. Rent and large deposits should be negotiated and paid via international\nbank transfer to European accounts before arriving. Always carry sufficient Euro or\nDobra cash to settle your full bill in case terminals fail on check-out day.\nAirbnb: Standard Airbnb booking and cancellation policies apply. Tourist tax (€2.10\npp/night) charged on arrival.\nPeak Season Booking: June–September and December–March. Book well in\nadvance during these windows as quality properties fill quickly.\n\n\fLocal Long-Term Leases: Standard local rental contracts often require an upfront\nsecurity deposit equivalent to 1 or 2 months of rent.", "references": [], "contentBlocks": [{"type": "text", "html": "<h3 class=\"content-h\">8.4 Reservation Policies</h3>\n<p>Booking Platforms: Hotels.com, Booking.com, Expedia, Airbnb,Flatio and direct hotel websites all active for São Tomé and Príncipe properties. Cancellation Policy: Most major hotels (Pestana, Omali) offer fully refundable rates on standard bookings. Policies vary by room type and booking date — always check conditions at time of reservation. Check-in / Check-out: Standard check-out is 12:00 noon (e.g., Pestana Miramar). Late check-out is available on request and subject to availability. Payment: The country operates almost entirely on cash, and ATMs do not accept international Visa or Mastercard, International credit cards accepted reliably at Omali and Pestana. Hit-or-miss at mid-range hotels due to mobile network instability. Rent and large deposits should be negotiated and paid via international bank transfer to European accounts before arriving. Always carry sufficient Euro or Dobra cash to settle your full bill in case terminals fail on check-out day. Airbnb: Standard Airbnb booking and cancellation policies apply. Tourist tax (€2.10 pp/night) charged on arrival. Peak Season Booking: June–September and December–March. Book well in advance during these windows as quality properties fill quickly.</p>\n<p>Local Long-Term Leases: Standard local rental contracts often require an upfront security deposit equivalent to 1 or 2 months of rent.</p>"}], "tables": []}, {"num": "8.5", "title": "Where on the Two Islands — Location of Accommodation", "content": "8.5 Where on the Two Islands — Location of Accommodation\n8.5.1 São Tomé Island\nThe island is approximately 50 km long by 30 km wide. Accommodation clusters in\nfour main zones:\nZone\n\nCharacter\n\nKey Properties\n\nSão Tomé Capital\n(north)\n\nUrban, walkable,\nwaterfront promenade\n\nOmali, Pestana São Tomé,\nMiramar, SH Boutique, Kenito\n\nTamarindos / Neves\n(north-west)\n\nBeaches, endemic\nbirdlife, quiet nature\n\nMonte Mar Ecolodge, nature\ncabins (4.83★)\n\nSantana / Cantagalo\n(east)\n\nSurf beaches, cocoa\nfarms, turtles\n\nEcolodges, guesthouses\n\nCaué / Porto Alegre\n(south)\n\nWild beaches, organic\nplantations, turtles\n\nJalé Beach bungalows, organic\nfarmhouses\n\n8.5.2 Príncipe Island\nAccommodation is centered near Santo António (the capital) and the island's\nnorthern beaches. Sundy Praia and Bom are the flagship properties. The island is\nsmall (~140 km²), remote, and highly protected. Serviced by domestic flights from\nSão Tomé (approximately 30 minutes, operated by STP Airways). Car hires essential\nonce on the island.", "references": [], "contentBlocks": [{"type": "text", "html": "<h3 class=\"content-h\">8.5 Where on the Two Islands — Location of Accommodation</h3>"}, {"type": "text", "html": "<h3 class=\"content-h\">8.5.1 São Tomé Island</h3>\n<p>The island is approximately 50 km long by 30 km wide. Accommodation clusters in four main zones: Zone</p>\n<p>Character</p>\n<p>Key Properties</p>\n<p>São Tomé Capital (north)</p>\n<p>Urban, walkable, waterfront promenade</p>\n<p>Omali, Pestana São Tomé, Miramar, SH Boutique, Kenito</p>\n<p>Tamarindos / Neves (north-west)</p>\n<p>Beaches, endemic birdlife, quiet nature</p>\n<p>Monte Mar Ecolodge, nature cabins (4.83★)</p>\n<p>Santana / Cantagalo (east)</p>\n<p>Surf beaches, cocoa farms, turtles</p>\n<p>Ecolodges, guesthouses</p>\n<p>Caué / Porto Alegre (south)</p>\n<p>Wild beaches, organic plantations, turtles</p>\n<p>Jalé Beach bungalows, organic farmhouses</p>"}, {"type": "table", "html": "<div class=\"table-caption\">8.5.1 São Tomé Island</div><div class=\"table-wrap\"><table class=\"data-table\"><thead><tr><th>Zone</th><th>Character</th><th>Key Properties</th></tr></thead><tbody><tr><td>São Tomé Capital</td><td>Urban, walkable,</td><td>Omali, Pestana São Tomé,</td></tr><tr><td>(north)</td><td>waterfront promenade</td>
