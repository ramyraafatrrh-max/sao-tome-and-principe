><tr><td></td><td></td><td>Adult Sup.)</td><td>proper hand washing techniques using it.</td></tr></tbody></table></div>"}, {"type": "text", "html": "<h3 class=\"content-h\">9.2.5 Impact on Coptic Orthodox Church Evangelism</h3>\n<p>The medical mission serves as a practical expression of the Church’s ministry, potentially transforming its evangelistic reach in São Tomé and Príncipe through several key channels: 1. Building Social Trust through Service By addressing the \"Problem Statement\" of limited medical care, the Church demonstrates a tangible commitment to the well-being of the Santomean people. This \"mercy ministry\" can open doors for spiritual dialogue in communities that might otherwise be hesitant to engage with a new ecclesiastical presence. 2. Holistic Community Engagement The mission targets every demographic—from children in schools to seniors in hospitals. This broad reach allows the Church to establish a presence across various social strata, moving beyond simple preaching to becoming a vital community partner in public health. 3. Sustainable Presence and Integration The focus on long-term solutions, such as ToT programs and pharmaceutical agreements, ensures that the Church’s impact is not seen as a \"one-off\" event. By investing in the local workforce and legal healthcare framework, the Church fosters</p>\n<p>deep-rooted relationships with both the government and the citizenry, providing a stable platform for long-term evangelism. 4. Direct Outreach via Educational Content Interactive workshops and \"Sketch Ideas\" provide a unique opportunity to blend health education with Christian values of stewardship and care for the body. Programs like \"Protect Your Mind & Eyes\" for teens allow the Church to provide guidance on modern lifestyle challenges, positioning it as a relevant voice for the younger generation.</p>\n<p>Draft reports as Provided by the WHO</p>\n<p>Page. 144</p>\n<p>Page. 145</p>"}], "tables": [{"caption": "9.2.3 Proposed Solutions: const CH_ICONS = {"1": "🧭", "2": "🏛️", "3": "👥", "4": "⛪", "5": "📊", "6": "🤝", "7": "📖", "8": "✈️", "9": "🎯"};
const state = { chapter:null, section:null };

function showPage(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  const el=document.getElementById(id);
  if(el) el.classList.add('active');
  window.scrollTo(0,0);
}

function navigate(where){
  if(where==='home') return showPage('homePage');
  if(where==='chapter') return showPage('chapterPage');
  if(where==='section') return showPage('sectionPage');
  return showPage(where);
}

function buildHome(){
  const grid=document.getElementById('homeGrid');
  const entries=Object.entries(DATA).sort((a,b)=>Number(a[0])-Number(b[0]));
  grid.innerHTML = entries.map(([k,ch])=>{
    const n=(ch.sections||[]).length;
    return `<div class="chapter-card" onclick="openChapter('${k}')">
      <div class="card-title">${CH_ICONS[k]||'📁'} ${ch.name}</div>
      <div class="card-meta">${n} sections</div>
    </div>`;
  }).join('');
}

function openChapter(k){
  state.chapter=k; state.section=null;
  const ch=DATA[k];
  document.getElementById('chapterTitle').textContent = ch.name;
  document.getElementById('chapterCrumb').innerHTML = `Home <span class="breadcrumb-sep">›</span> ${ch.name}`;
  const grid=document.getElementById('sectionsGrid');
  grid.innerHTML = (ch.sections||[]).map((sec,i)=>{
    return `<div class="section-card" onclick="openSection('${k}',${i})">
      <div class="sec-tag">${sec.num || ('Section '+(i+1))}</div>
      <div class="sec-title">${sec.title}</div>
      <div class="sec-arrow">Read →</div>
    </div>`;
  }).join('');
  navigate('chapter');
}

function buildRefs(refs){
  if(!refs || !refs.length) return '<div class="no-refs">No references recorded for this section.</div>';
  const rows = refs.map((r,i)=>{
    const src = (r.source||'').toString();
    const url = (r.url||'').toString();
    return `<tr><td>${i+1}</td><td>${src}</td><td><a href="${url}" target="_blank" rel="noopener">${url}</a></td></tr>`;
  }).join('');
  return `<div class="refs-wrap">
    <div class="refs-heading">References</div>
    <table class="refs-table"><thead><tr><th>#</th><th>Source</th><th>URL</th></tr></thead><tbody>${rows}</tbody></table>
  </div>`;
}

function openSection(k,i){
  state.chapter=k; state.section=i;
  const ch=DATA[k];
  const sec=ch.sections[i];
  document.getElementById('sectionTitle').textContent = sec.title;
  document.getElementById('sectionCrumb').innerHTML = `Home <span class="breadcrumb-sep">›</span> ${ch.name} <span class="breadcrumb-sep">›</span> ${sec.title}`;
  const body=document.getElementById('sectionBody');
  const blocks = sec.contentBlocks || [];
  const html = blocks.map(b=>`<div class="content-card">${b.html}</div>`).join('');
  body.innerHTML = html + buildRefs(sec.references);
  navigate('section');
}

buildHome();
</script>
