<script>
const DATA = {"1": {"name": "Overview", "num": 1, "sections": [{"num": "1.1", "title": "Basic Facts", "content": "1.1 Basic Facts\nLocation\nSão Tomé and Príncipe is located in West Africa, in the Gulf of Guinea. It consists of\nthe islands of São Tomé, Príncipe, Pedras Tinhosas, Caroço, and Rôlas.\nArea\nThe country has a total area of 1,001 sq km (386 sq. mi.), making it the smallest\ncountry in Africa.\nPopulation\nThe estimated population is approximately 235,536 people.\nMain Cities\nThe capital city is São Tomé. Other important cities include Trinidade, Santana,\nAngolares, Neves, and Santo Antonio.\nReference:\nhttps://www.saotomeexpert.pt/en/sao-tome-and-principe-factsheet-geographyclimate/", "references": [{"source": "www.saotomeexpert.pt", "url": "https://www.saotomeexpert.pt/en/sao-tome-and-principe-factsheet-geographyclimate/"}]}, {"num": "1.2", "title": "Geography & Climate", "content": "1.2 Geography & Climate\nThe country is characterized by two main mountainous islands that are part of a\nchain of extinct volcanoes. The terrain is largely volcanic and tropical.\nSão Tomé and Príncipe has a tropical climate with wet and dry seasons. Weather\nconditions are strongly influenced by the mountainous landscape. The country also\nfaces environmental challenges such as rising sea levels and floods due to climate\nchange.\nReference: Sao Tome and Principe (06/08)\nSao Tome and Principe (07/03)", "references": []}, {"num": "1.3", "title": "Culture", "content": "1.3 Culture\n1.3.1 Language\nPortuguese is the official and most widely spoken language, used by approximately\n98.4% of the population. Several Portuguese-based creole languages are also\nspoken, including Forro, Cape Verdean Creole, Angolar, and Principense.\nFrench and English are taught as foreign languages in schools.\n1.3.2 Customs & Traditions\nOne of the country’s most important cultural traditions is “Tchiloli,” a traditional\ntheatrical performance that represents themes of justice and social values. It is\nrecognized by UNESCO as an Intangible Cultural Heritage.\n\f1.3.3 Social Habits\nReligion plays an important role in society, with Roman Catholicism and Evangelical\nProtestantism being the dominant religions.\nSocial life is strongly connected to local traditions, community activities, and cultural\ncelebrations.\nReference: Video: Tchiloli, living theatre of Sao Tome and Principe in the quest of\njustice - UNESCO Intangible Cultural Heritage\nSao Tome and Principe - BeingAfrican", "references": []}, {"num": "1.4", "title": "Economy & Education", "content": "1.4 Economy & Education\n1.4.1 General Wealth\nSão Tomé and Príncipe is considered a developing economy. In December 2024, the\ncountry graduated from the “Least Developed Countries” (LDC) category. Its Gross\nNational Income (GNI) per capita reached approximately $2,271 during 2020–2022.\nThe economy remains highly dependent on commodity exports, especially cocoa\nbeans, which accounted for about 69% of merchandise exports between 2021 and\n2023. The country also faces economic challenges including debt distress, geographic\nisolation, and slow economic growth.\nReference: Sao Tome and Principe | World Bank Group\n1.4.2 Education & Literacy Rates\nThe literacy rate is approximately 84.9%. The country has implemented educational\nreforms through the Lei de Bases do Sistema Educativo (LBSE). In addition, the\nHuman Assets Index increased significantly from 59.3 in 2002 to 91.4 in 2024,\nreflecting improvements in education and human development.\nReference: São Tomé and Príncipe Languages • Family Search Educativo (LBSE) - Lei\nn.° 2 / 2003. The country’s Human Assets Index score rose significantly from 59.3 in\n2002 to 91.4 in 2024. São Tomé and Príncipe Languages • FamilySearch", "references": []}]}, "2": {"name": "PESTEL", "num": 2, "sections": [{"num": "2.1", "title": "Political", "content": "2.1 Political\n2.1.1. Government\nType: Presidential-parliamentary democracy with a multi-party system. The\nPresident is directly elected for up to two consecutive five-year terms, while\nthe Prime Minister, who holds most executive powers, is appointed by the\nPresident based on legislative election results.\n● Stability: Governments are often short-lived due to proportional\nrepresentation, which encourages coalition or minority governments.\n● Civil Liberties: Civil liberties are generally respected, though poverty and\ncorruption weaken some institutions and reduce judicial efficiency.\n● Judicial Independence: The judiciary is partially independent but susceptible\nto political influence and corruption. A three-year judicial modernization\nprogram was launched in 2020 to enhance judicial and prosecutorial\nindependence.\n●\n\nReference:https://freedomhouse.org/country/sao-tome-andprincipe/freedom-world/2021\n\n\fReference: https://stp.gov.st/membros_governo\n2.1.2. Trade (Political Context)\nSão Tomé and Príncipe has a weakly integrated trade system, as it is not yet\na member of the WTO. Although it applied for accession in 2005, the process\nremains stalled, limiting alignment with global trade standards and reducing\ninternational trade credibility.\nReference:https://www.wto.org/english/thewto_e/acc_e/a1_sao_tome_prin\ncipe_e.htm?utm_source=chatgpt.com\n● Trade is highly concentrated geographically, with exports mainly directed to\nEuropean countries (e.g., Netherlands, Belgium, Portugal, Germany, and\nSpain), while imports are dominated by Portugal and a few African and\ninternational partners (e.g., Togo, Angola, Japan, and Turkey).\nReference:https://wits.worldbank.org/CountryProfile/en/Country/STP/Year/\nLTST/TradeFlow/Import/Partner/all\n●\n\n\fTrade structure:\nThe country exhibits a significant trade imbalance, with imports (≈ $165 million in\n2024) far exceeding exports, which remain very limited and narrow in scope\n\nReference: https://statbase.org/data/stp-merchandise-imports-wto/ 2024\n●\n\nThe export base is undiversified, relying primarily on cocoa and low-value\nmaterials, while imports consist mainly of food, manufactured goods, and\nessential commodities indicating strong dependence on external markets.\n\n\fReference: https://tradingeconomics.com/sao-tome-and-principe/exports\n2025\n●\n\nTrade policies remain relatively flexible, with moderate tariff levels (~10%),\nbut the absence of WTO membership results in a lack of binding\ncommitments and weaker positioning in global trade negotiations.\n\nReference: https://ttd.wto.org/en/profiles/sao-tome-and-principe 2019\n●\n\nOverall trade volume is very small on a global scale, as reflected by minimal\ntrade relations with major economies (e.g., total trade with the United States\n≈ $1.6 million in 2024).\nReference:\n\nustr.gov/countries\n\n2025\n\n2.1.3. Tax Policies (Political / Fiscal Context)\n●\n\nSão Tomé and Príncipe operates a developing tax system with limited\nadministrative capacity and enforcement challenges.\nReference: https://www.imf.org/en/Countries/STP\n\n●\n\nSão Tomé and Príncipe operates a structured tax system under the Ministry of\nEconomy and Finance, with progressive personal income tax rates reaching up\nto 25% and social security contributions totaling 14% (8% employer and 6%\nemployee).\n\n●\n\nThe government introduced a Value Added Tax (VAT) at a standard rate of 10%\nto modernize the tax system and improve revenue collection in line with\ninternational recommendations.\n\n●\n\nThe fiscal framework also includes withholding taxes on dividends (10–15%),\ninterest (10%), royalties (10%), and technical service fees (15%), indicating a\nrelatively defined and organized tax structure.\n\n\f●\n\nThe tax system incorporates multiple regimes (general and simplified) and\nprovides incentives such as tax exemptions, reduced import duties, and\ndeductions to support investment and small businesses.\n\n●\n\nHowever, the effectiveness of tax policies is limited by weak administrative\ncapacity, tax evasion, and a large informal sector, resulting in low revenue\nefficiency and continued reliance on indirect taxation and external financial\nsupport.\nReference:\nhttps://www.globalexpansion.com/hubfs/Countrypedia%20PDFs/In%20use/S\nao%20Tome%20and%20Principe%20-%20Global%20Employer%20Guide.pdf\nhttps://www.britacom.org/zt/ThemeDay/Tenth/SEMINAR/202510/P0202510\n21566751498936.pdf\n\n2.1.4. General political issues\nSão Tomé and Príncipe faces several governance and institutional challenges despite\nmaintaining a generally democratic system. Key concerns include limited government\n\n\faccountability, as reflected in reported cases of police abuse and delayed or\nincomplete investigations into misconduct.\n●\n\nFreedom of expression is constitutionally guaranteed and generally respected;\nhowever, media independence is constrained by political influence, selfcensorship, and limited access to official information, particularly in stateowned media.\n\n●\n\nThe country experiences weak transparency and information accessibility,\nwith journalists reporting difficulties in obtaining official data and concerns\nover biased media coverage favoring the ruling coalition.\n\n●\n\nAlthough labor laws formally guarantee rights such as unionization and\ncollective bargaining, enforcement remains weak, with limited inspections,\nlack of penalties, and ineffective protection against labor violations.\n\n●\n\nA significant structural issue is the large informal sector (estimated at around\n68% of the workforce), which undermines regulatory effectiveness, tax\ncollection, and overall economic governance.\n\n●\n\nMore broadly, institutional capacity constraints, including limited human\nresources, weak enforcement mechanisms, and insufficient regulatory\noversight, continue to affect policy implementation and governance efficiency.\nReference: https://www.state.gov/reports/2024-country-reports-on-humanrights-practices/sao-tome-and-principe\n2024\n\n2.1.5. Change in Leadership\n●\n\nSão Tomé and Príncipe transitioned from a one-party state (1975–1991) to a\nmulti-party democracy with multiple peaceful power transfers.\n\n●\n\nKey recent changes: 2016 presidential election dispute; 2018 legislative\nelections led to coalition government formation; 2020 legislation prevented\ncitizens born abroad from running for president, targeting ADI party leader\nPatrice Trovoada.\n\n2.1.6. Regulations\n●\n\nElectoral Laws: Generally fair, though implementation suffers from limited\nresources and staff.\n\n●\n\nLegislative Actions: National Assembly enacts laws affecting elections and\ngovernance, such as restricting presidential candidacy for citizens born abroad\nand appointing election commissioners.\n\n●\n\nGovernment Transparency: Access to information is partially available; no\nspecific law guarantees full transparency.\n\n●\n\nJudiciary: Laws provide judicial independence, but political influence and\ncorruption remain concerns.\n\n\f2.1.7. Political Trends\n●\n\nMultiparty Competition: Free and vigorous competition among ADI, MLSTPPSD, PCD-UDD-MDFM, and other parties, despite occasional factional splits.\n\n●\n\nDemocratic Stability: Multiple peaceful democratic transitions demonstrate\nresilience, with real opportunities for opposition parties.\n\n●\n\nCivil Society: NGOs, including human rights and governance organizations,\noperate freely, though underfunded.\n\nChallenges: Corruption, weak institutions, societal discrimination against women and\nLGBT+ groups, and limited enforcement capacity for social and economic regulations.\nReference:\nworld/2023\n\nhttps://freedomhouse.org/country/sao-tome-and-principe/freedom-\n\n\f2.2 Economical", "references": [{"source": "Reference:", "url": "https://freedomhouse.org/country/sao-tome-andprincipe/freedom-world/2021"}, {"source": "Reference:", "url": "https://stp.gov.st/membros_governo"}, {"source": "Reference:", "url": "https://www.wto.org/english/thewto_e/acc_e/a1_sao_tome_prin"}, {"source": "Reference:", "url": "https://wits.worldbank.org/CountryProfile/en/Country/STP/Year/"}, {"source": "Reference:  2024", "url": "https://statbase.org/data/stp-merchandise-imports-wto/"}, {"source": "Reference:", "url": "https://tradingeconomics.com/sao-tome-and-principe/exports"}, {"source": "Reference:  2019", "url": "https://ttd.wto.org/en/profiles/sao-tome-and-principe"}, {"source": "Reference:", "url": "https://www.imf.org/en/Countries/STP"}, {"source": "www.globalexpansion.com", "url": "https://www.globalexpansion.com/hubfs/Countrypedia%20PDFs/In%20use/S"}, {"source": "www.britacom.org", "url": "https://www.britacom.org/zt/ThemeDay/Tenth/SEMINAR/202510/P0202510"}, {"source": "Reference:", "url": "https://www.state.gov/reports/2024-country-reports-on-humanrights-practices/sao-tome-and-principe"}, {"source": "freedomhouse.org", "url": "https://freedomhouse.org/country/sao-tome-and-principe/freedom-"}]}, {"num": "2.2", "title": "Economical", "content": "2.2.1 Inflation\nSão Tomé and Príncipe experiences relatively high but declining inflation, reaching\napproximately 9.5% in January 2026, down from 10.3% in December 2025, marking\nthe lowest level since early 2022.\n●\n\nDespite recent improvements, inflation remains elevated compared to global\naverages, reflecting ongoing cost-of-living pressures.\n\n●\n\nHistorically, inflation has been high and volatile, averaging around 14.5% since\n1997, with extreme fluctuations ranging from a peak of 86.8% to lows near\n3.5%, indicating structural instability in price levels.\n\n●\n\nIn Sao Tome and Principe, the main components of the Consumer Price Index\nare: Food & Non-alcoholic Beverages (73% of the total weight), Housing &\nUtilities (6%) and Transport (4%). Household Contents, Equipment &\nMaintenance accounts for 4%, Alcoholic Beverages & Tobacco for 4%, and\nClothing & Footwear for 3%. Others include: Communications (2%),\nRestaurants & Hotels (2%), Miscellaneous Goods & Services (2%), Recreation\n&\nCulture\n(1%),\nEducation\n(0.44%),\nand\nHealth\n(0.41%).\nOverall, while inflation is showing signs of stabilization, it continues to pose a\n\nkey economic challenge affecting purchasing power and economic stability.\nReference: https://tradingeconomics.com/sao-tome-and-principe/inflation-cpi 2026\n\n\f2.2.2. Interest rate\nThe benchmark interest rate in São Tomé and Príncipe is approximately 10%,\nreflecting a relatively high cost of borrowing in the economy.\n● Historically, interest rates have remained elevated, averaging around 14.3%\nsince 1998, with significant volatility ranging from a peak of 29.5% to a low of\n9%, indicating periods of monetary instability.\n● The relatively high interest rate is primarily used as a tool to control inflation,\nwhich has been persistently high in the country.\n● However, elevated borrowing costs may limit private investment and\neconomic expansion, particularly in a small and developing economy.\n●\n\nReference: https://tradingeconomics.com/sao-tome-and-principe/interestrate\n2.2.3. Exchange rate\n●\n●\n●\n●\n\n●\n\nThe São Tomé and Príncipe dobra (STN) is relatively weak, with an exchange\nrate of approximately 21.4 STN per USD (March 2026).\nIn the short term, the currency has shown slight depreciation (around 2.3%\nover the past month), indicating ongoing pressure on the local currency.\nHowever, over the past year, the dobra has appreciated by approximately\n6.5%, suggesting a degree of medium-term stabilization.\nThe exchange rate is supported by a currency peg to the euro, which helps\nmaintain stability and control inflation but increases dependence on external\nreserves and limits monetary policy flexibility.\nOverall, while the exchange rate shows relative stability, it remains\nvulnerable to external shocks and foreign exchange constraints.\n\n\fReference:\n2026\n\nhttps://tradingeconomics.com/sao-tome-and-principe/currency\n\n2.2.4. Economic Growth\n●\n\nSão Tomé and Príncipe recorded modest economic growth of approximately\n1.7% in 2024, reflecting a slight recovery from 0.5% in 2023, but remaining\nbelow its historical average of around 4.1%.\n\n●\n\nThe economy is very small, with a GDP of approximatley $0.76 billion and low\nincome levels (GDP per capita ≈ $1,365), highlighting its developing status.\n\n●\n\nEconomic activity is largely concentrated in agriculture (especially cocoa) and\ntourism, with declining cocoa production due to droughts and\nmismanagement affecting overall growth performance.\n\n●\n\nThe country is increasingly dependent on foreign aid and highly vulnerable to\nexternal shocks, particularly fluctuations in global food and fuel prices.\n\n●\n\nPolitical instability remains a potential risk that could negatively impact\neconomic growth and foreign direct investment.\n\n●\n\nHowever, the discovery of oil reserves in the Gulf of Guinea presents a\npotential long-term opportunity to boost economic growth, if successfully\ndeveloped.\n\n\fReference:\nannual\n\nhttps://tradingeconomics.com/sao-tome-and-principe/gdp-growth-\n\n2.2.5. Unemployment rate\n●\n\nUnemployment in São Tomé and Príncipe remains relatively stable, averaging\naround 9–10% between 2020 and 2025, with only slight fluctuations over\ntime.\n\n●\n\nWhile there was a modest decline from approximately 9.7% in 2020 to around\n9.0% in 2022, unemployment levels have since remained largely unchanged,\nindicating limited job creation.\n\n●\n\nA key structural challenge is the large informal sector (estimated at around\n68% of the workforce), which distorts official unemployment figures and\nreflects widespread underemployment and job insecurity.\n\n●\n\nAs a result, the labor market is characterized by low productivity, weak job\nquality, and limited formal employment opportunities, despite relatively\nstable\nunemployment\nrates.\n\n\fReference:\nhttps://data.worldbank.org/indicator/SL.UEM.TOTL.ZS?end=2025&locations=ST&sta\nrt=2020&view=chart 2025", "references": [{"source": "Reference:  2026", "url": "https://tradingeconomics.com/sao-tome-and-principe/inflation-cpi"}, {"source": "Reference:", "url": "https://tradingeconomics.com/sao-tome-and-principe/interestrate"}, {"source": "tradingeconomics.com", "url": "https://tradingeconomics.com/sao-tome-and-principe/currency"}, {"source": "tradingeconomics.com", "url": "https://tradingeconomics.com/sao-tome-and-principe/gdp-growth-"}, {"source": "data.worldbank.org", "url": "https://data.worldbank.org/indicator/SL.UEM.TOTL.ZS?end=2025&locations=ST&sta"}]}, {"num": "2.3", "title": "Social", "content": "2.3 Social\n2.3.1 Demographics\n● Capital: São Tomé\n● Total Population: 247,000\n● Coastline: 209 km around a land area of 1,001 km2\nReference: https://www.wacaprogram.org/country/sao-tome-and-principe\nPopulation of Sao Tome and Principe. 2026 demographics: density, ratios, growth rate,\nclock, rate of men to women.\n2.3.2 General country information\n●\n●\n●\n●\n●\n●\n\nFull name of country: Democratic Republic of São Tomé and Principe\nRegion: Africa\nOfficial language: Portuguese\nNationality: Sao Tomean(s) (noun), Sao Tomean (adjective)\nLand area: 964 sq km (372 sq miles)\nNational anthem: \"Independencia total\" (Total Independence), by Alda Neves\nDa Graca Do Espirito Santo/Manuel Dos Santos Barreto De Sousa E Almeida\n● National holiday: Independence Day, July 12 (1975)\n● Time zone: UTC +0\n\n\f● Flag: The flag of the Democratic Republic of São Tomé and Príncipe consists\nof a horizontal triband (green-yellow-green) design with a scarlet isosceles\ntriangle based on the hoist (left) side. The central yellow band is one and a\nhalf times wider than the other two green bands. In the center stripe are two\nfive-pointed black stars, which represent the two islands. Symbolically, the\ncolor red stands for the country’s struggle for freedom and independence.\nThe other colors—black, yellow, and green—are pan-African colors.\n● Motto: “Unidade, Disciplina, Trabalho” (Unity, Discipline, Work)\n● Independence: July 12, 1975 (from Portugal)\n● Government type: semi-presidential republic\n● Suffrage: 18 years of age; universal\nReference: https://www.ebsco.com/research-starters/social-sciences-andhumanities/sao-tome-and-principe\n2.3.2.1 People\n● Nationality: Noun and adjective--Sao Tomean(s).\n● Population (2026 est.): 247,000\n● Annual growth rate (2026 est.): 2.0-2.1%.\n● Ethnic groups: Mixed African, Portuguese-African.\n● Religions: Christian (Roman Catholic, Evangelical Protestant, Seventh-day\nAdventist) 80%.\n● Language: Portuguese (official).\n● Education: Literacy (census 2001)--68.1%. Years compulsory--to secondary\nlevel.\n● Health: Life expectancy (2008 est.)--68 yrs. Infant mortality rate (2008 est.)-38.36/1,000.\n● Work force (by household, 2000 UN Development Program est.):\nAgriculture--15.3%; industry, commerce, services--36.5%; government-11.5%.\nReference: https://20092017.state.gov/outofdate/bgn/saotomeandprincipe/106168.htm\n2.3.2.2 Demographics and population\n● Population growth:\nSão Tomé and Príncipe's population is growing steadily at about 2.0-2.1%\nannually, reaching around 247,000 in 2026 from 242,000 in 2025.\nGrowth Drivers\n● High fertility rates (around 3.95 children per woman) and a youthful\ndemographic fuel natural increase of about 5,000 people yearly, outpacing\nnet migration losses of roughly 900.\n● This continues a decades-long trend from 2.0% in the 1990s to peaks near\n2.7% in the 1970s, with density rising to 258 people per km².\n\n\f2.3.2.3 Future Projections\n● Projections show sustained growth to 268,000 by 2030 and 380,000 by 2050\nat 1.6-2.0%, shifting toward an aging profile with median age climbing from\n24.0 to 28.4 years.\nUrbanization accelerates, hitting 70% by 2030, pressuring infrastructure amid\nVision 2030 goals for sustainable development.\nReference: ENDS-2026-2040-Executive-Summary.pdf\n2.3.2.4 Age distribution:\n● São Tomé and Príncipe has a youthful population with a median age around\n20.3-20.5 years, reflecting a classic expansive pyramid typical of developing\nisland nations.\n2.3.2.5 Broad Age Groups\nThe population splits into three main categories based on recent 2025-2026\nestimates for roughly 236,000-240,000 people.\n●\n\n0-14 years (youth): 37.8-42.4% (about 90,000-100,000 people), with the\nlargest shares in 0-4 (13.2%), 5-9 (12.2%), and 10-14 (12.1%) groups.\n\n●\n\n15-64 years (working age): 58.3-68.4%, peaking in younger adults like 15-19\n(11.5%) and declining gradually to 1-2% per group in 50s-60s.\n\n●\n\n65+ years (elderly): 3.9-7.4%, with low concentrations (under 1% per 5-year\nband) and a slight female skew.\n\nReference: Sao Tome and Principe Population Pyramid 2025 - Demographics & Birth\nStatistics | 15 Daily Births | Population Pyramids\n2.3.2.6 Dependency Insights\n● A high young-age dependency ratio (64.9%) underscores needs for education\nand youth jobs, while old-age dependency remains low at 6.7%. This\nstructure supports Vision 2030 goals like human capital investment.\nReference: Sao Tome demographics data 1960-2026: Median Age Growth\nPopulation of Sao Tome and Principe. 2026 demographics: density, ratios, growth\nrate, clock, rate of men to women.\nSao Tome and Principe Population Pyramid 2025 - Demographics & Birth Statistics |\n15 Daily Births | Population Pyramids\n2.3.3 culture lifestyle attitudes\n● São Tomé and Príncipe residents embrace a relaxed \"Leve Leve\" lifestyle,\nemphasizing simplicity, community harmony, and resilience shaped by their\nisland paradise and Luso-African heritage.\n\n\f2.3.3.1 Core Values\n● People prioritize elder respect, social unity, and strength in adversity, rooted\nin colonial and slavery histories that fostered mutual support.\nPeaceful coexistence prevails in a mestizo society blending Portuguese,\nAfrican, and creole influences, with Christianity dominant but coexisting with\ntraditional practices.\nReference: São Tomé and Príncipe Heritage: Museums, Landmarks & Culture\nLeve Leve Lifestyle in São Tomé: Culture, Gastronomy & Traditions\nSão Tomé and Príncipe Values | NationValues\nSão Tomé and Príncipe - Freedom of Thought Report\n2.3.3.2 Daily Attitudes\n● A laid-back approach—\"go slowly\"—defines routines, with strong family\nbonds, communal living in rural areas, and growing gender equality in\nmodern sectors.\n● Lifestyle revolves around fresh seafood, tropical fruits, music/dance like\ntchiloli, and festivals celebrating independence or saints, reflecting optimism\nand cultural pride\nReference: Cultural Experiences on São Tomé and Príncipe | Principe Collection\nThe Culture Of Sao Tome And Principe\n2.3.4 Educational levels\n● Educational Outcomes and Human Capital\n● In 2024, São Tomé and Príncipe, like many other African countries, is facing a\nlearning crisis. In sub-Saharan Africa, learning poverty, defined as the share of\nchildren unable to read and understand an age-appropriate text by age 10, is\nestimated at 89 percent by the World Bank,\nReference: https://www.iicba.unesco.org/en/sao-tome-and-principe\n● In 2023, São Tomé and Príncipe has made strides in education, with primary\nenrollment near 98% and adult literacy at 93%, but challenges persist in\ncompletion rates and quality.\n2.3.4.1 Literacy and Access\n● Adult literacy rose from 74.9% a decade ago to 93% by 2023, driven by the\nQuality Education for All Project since 2014, which boosted teacher training\nand infrastructure.\n● Youth (15-24) literacy nears universality, though 2% have no formal\neducation and 36% incomplete primary, per older EPDC data.\n2.3.4.2 Enrollment Breakdown\n● Primary completion stands at 87%, with 96% net enrollment, but secondary\ntransition dips below 60% and completion lower, especially in rural areas.\n\n\f● The 6-3-3 system sees high primary access but dropouts due to poverty;\nhigher education remains limited, aligning with Vision 2030 human capital\ngoals.\nSao Tomeans segment their education into pre-primary, primary, secondary and\ntertiary levels, and while education is legally mandated for children between 6\nand 14 years old, many children, particularly young girls, face challenges in\nattending school. Often, people encourage them to stay home and learn the\ntraditional role of women rather than skills to join the workforce.\nReference: ENDS-2026-2040-Executive-Summary.pdf\nEPDC_NEP_2018_SaoTomeandPrincipe.pdf\nImproving Education in Sao Tome and Principe - The Borgen Project\nAddressing Comprehensive Educational Challenges in São Tomé and Príncipe –\nBroken Chalk\nhttps://borgenproject.org/womens-rights-in-sao-tome-and-principe/\n2.3.5-Buying habits\n● São Tomé and Príncipe residents prioritize essential goods amid economic\npressures, with household consumption dominating at 81.4% of GDP and\nheavy reliance on imported food, fuel, and staples.\nSpending Priorities\n● High inflation (peaking above 20% recently) squeezes purchasing power,\ndriving focus on necessities like rice, fish, vegetables, and price-controlled\nbasics, with government exemptions aiding affordability.\n● Limited disposable income (GDP per capita ~$2,400) favors informal markets,\nlocal produce, and subsistence in rural areas, while urban households\nallocate more to utilities and remittances. Consumption Patterns\n● Imports dwarf exports (35% vs. 3.6% of GDP), reflecting import-dependent\nhabits for consumer goods, with low savings and debt distress curbing luxury\nor durable purchases.\n● Emerging tourism boosts demand for services, but inequality (Gini 40.7)\nmeans poorer 44.6% live near poverty lines, emphasizing value-for-money\nand community sharing.\n\nReference: Spotlighting The World Factbook as We Bid a Fond Farewell - CIA\nCDP-PL-2025-STP.pdf\nSão Tomé and Príncipe - STP\n\n\f2.3.6-Religion\n\nReference: https://www.worldatlas.com/articles/religion-in-sao-tome-andprincipe.html\n2.3.7-Leaders and Cabinet Members\n● Type: Republic.\n● Independence: July 12, 1975 (from Portugal).\n● Constitution: November 5, 1975; revised September 1990, following a\nnational referendum, -revised again January 2003.\n● Branches: Executive--president and prime minister. Legislative--National Assembly. Judicial--Supreme Court.\n● Administrative subdivisions: Seven counties, six on Sao Tome and one on\nPrincipe.\n● Political parties: Movement for the Liberation of Sao Tome and Principe\n(MLSTP), Party of -Democratic Convergence (PCD), Independent Democratic\nAction (ADI), Democratic Movement Force of Change (MDFM), Christian\nDemocratic Front-Socialist Union Party (FDC-PSU), Santomean Workers Party\n(PTS); Popular Party of Progress (PPP), and National Union for Democracy and\nProgress (UNDP).\n● Suffrage: Universal adult.\nReference: https://20092017.state.gov/outofdate/bgn/saotomeandprincipe/106168.htm\nGovernment\nLast Updated: 2/9/2026\n●\n●\n●\n\nPresident: Carlos Manuel VILA NOVA\nPrime Minster: Americo RAMOS\nMin. of Agriculture, Fisheries, & Rural Development: Nilton Garrido de\nSousa PONTES\n\n\f●\n●\n●\n●\n●\n●\n\n●\n●\n●\n●\n●\n\nMin. of Defense & Home Affairs: Horacio Castro da Trindade DE SOUSA, Brig.\nGen.\nMin. of Economy & Finance: Gareth Haddad do Espirito Santo\nGUADALUPE, Dr.\nMin. of Education, Culture, Science, & Higher Education: Isabel Maria\nCorreia Viegas DE ABREU, Dr.\nMin. of Environment, Youth, & Sustainable Tourism: Nilda Borges DA\nMATA, Dr.\nMin. for Foreign Affairs, Cooperation, & Communities: Ilza Maria dos Santos\nAmado VAZ, Dr.\nMin. of Health: Celso Vaz do Nascimento MATOS, Dr.\nMin. of Infrastructure & Natural Resources: Nelson Mario de Carvalho Rosa\nCARDOSO\nMin. of Justice, Parliamentary Affairs, & Women's Rights: Vera Maria\nAssuncao Gomes CRAVID, Dr.\nMin. of Labor, Solidarity, & Social Security: Joucerli Tiny dos RAMOS, Dr.\nGovernor, Bank of Sao Tome & Principe: Americo BARROS\nAttorney General: Carlos STOCK\n\nReference: https://www.cia.gov/resources/world-leaders/foreign-governments/saotome-and-principe/\n2.3.8-Saõ Tóme and Príncipe Holidays and Festivals\n●\n\nInternational Workers’ Day, or Labor Day as it is locally known, takes place on\nMay 1 every year\n\n●\n\nOn July 12, São Tomé e Príncipe celebrates the attainment of full sovereignty\nfrom the colonial rule of the Portuguese. This public holiday is filled with\ndisplays of tradition and culture in many different cities.\n\n●\n\nEvery year on November 26, São Tomé celebrates the national holiday of\nArgel Accord Day. Prior to the nation being granted independence, the Argel\nAccords\n\n●\n\nSão Tomé has a large Christian population, accounting for about 80 percent\nof people in the country. Understandably then, Christian religious holidays\nlike Christmas Day on December 25 are a big deal. Christmas marks the birth\nof the Christian messiah Jesus. The day is celebrated by going to mass and the\nenjoyment of feasts with friends and family. The day has taken on a cultural\naspect as well as it is considered a non-working day and most people in the\ncountry, religious or not, partake in the festivities.\n\n●\n\nIn São Tomé and Príncipe, the weekend days are Saturday and Sunday and\nthe Workweek is from Monday to Friday\n\n●\n\nGlobally, some progress on women’s rights has been achieved. In Sao Tome\nand Principe, the adolescent birth rate is 0.4 per 1,000 women aged 15–19 as\nof 2018, down from 93.47 per 1,000 in 2017. In 2019, 57.7% of women of\n\n\freproductive age (15-49 years) had their need for family planning satisfied\nwith modern methods.\nReference: https://www.iexplore.com/articles/travel-guides/africa/sao-tome-andprincipe/festivals-and-events\nhttps://data.unwomen.org/country/sao-tome-and-principe\n\n2.3.9. Health and Healthcare System\n2.3.9.1 What is healthcare in Sao Tome and Principe like?\nHealth consciousness:\n● São Tomé and Príncipe shows mixed health consciousness, with rising\nawareness of some risks but persistent unhealthy behaviors amid NCD\nprogram efforts.\nKey Trends (2008-2019)\n● Overweight/obesity climbed to 51%, especially among women (58.1%),\nsignaling low focus on diet control despite better fruit/vegetable intake\n(down to 53.3%).\n● Physical inactivity doubled to 30.9%, with women more affected, while\ntobacco use (8.8%) and hypertension (33.5%) stayed stable.\n● Positive shifts include reduced frequent alcohol (24.8%) and diabetes (1.2%),\nmore among men, tied to partial NCD integration in primary care.\nAwareness Factors\n● Higher education links to less alcohol and poor diets but more obesity,\nsuggesting nutrition knowledge gaps in urban/educated groups.\n● Limited campaigns on activity, tobacco, and diet hinder progress, per WHO\nreports, despite STEPS surveys boosting data-driven interventions.\nWhat about the medical facilities?\n● Medical facilities in São Tomé and Príncipe are extremely limited. There is\none hospital in the country on the island of São Tomé, Hospital Central Ayres\nde Menezes, phone number 239 2-221-222. A few clinics also exist, but the\nservice provided is very basic. For all but minor medical needs, it is necessary\nto travel to Libreville (Gabon), Lisbon (Portugal), or elsewhere. You should\ncarry an ample supply of properly labeled prescription drugs and other\nmedications with you; an adequate supply of prescription or over-thecounter drugs in local stores or pharmacies is generally not available.\n● Tap water may not be potable and you should drink and cook with bottled\nwater only. Schistosomiasis, also known as bilharzia, is endemic to São Tomé\nand Príncipe. Schistosomiasisis a parasite that can penetrate intact skin of\nthose swimming or bathing in fresh water from lakes, rivers and streams. It is\n\n\frecommended to avoid contact with untreated fresh water to prevent\nschistosomiasis infection.\nReference:\nhttps://www.countryreports.org/country/SaoTomeandPrincipe/health.htm\nFrontiers | Trends in bio-behavioural risk factors of non-communicable diseases\namong adults in Sao Tome and Principe\n2.3.9.2 The Four Most Common Diseases in Sao Tome and Principe:\n1. Tuberculosis (TB) is a bacterial disease easily communicable in the first few\nweeks of visible symptoms.\n2. Malaria, spread through mosquitoes, is an endemic for most impoverished\nAfrican countries, including Sao Tome Principe.\n3. Cholera is actively transmitted in many impoverished countries, including Sao\nTome and Principe.\n4. Necrotizing cellulitis is a rare disease, but an outbreak earlier this year has\nleft Sao Tome and Principe vulnerable.\nNote: More than 1,300 cases of necrotizing cellulitis, a severe skin infection known\nfor intense pain and swollen tissues, have been reported since September 2016. To\ndate, every health district in the country has reported cases, and the country’s\n190,000 inhabitants are at risk. Cases have been increasing but no deaths directly\nlinked to the disease have been recorded.\n2.3.9.3 Healthcare Infrastructure in São Tomé and Príncipe\n1.Hospital Central de São Tomé (São Tomé Central Hospital)\n●\n●\n●\n●\n●\n\nLocation: São Tomé, São Tomé and Príncipe\nSpecialties: General Surgery, Pediatrics, Obstetrics, Emergency Care\nAccreditations: National Health System Certified\nNumber of Beds: 200+\nNumber of Doctors: 80+\n\n2. Hospital Dr. Ayres de Menezes\n●\n●\n●\n●\n●\n\nLocation: São Tomé, São Tomé and Príncipe\nSpecialties: Cardiology, Internal Medicine, Dermatology, Ophthalmology\nAccreditations: ISO Certified\nNumber of Beds: 150\nNumber of Doctors: 60+\n\n3. Hospital de Caué\n●\n●\n●\n●\nLocation: Caué, São Tomé and Príncipe\nSpecialties: General Medicine, Surgery, Maternity Services, Pediatrics\nAccreditations: National Health System Certified\nNumber of Beds: 100+\n\n\f●\n\nNumber of Doctors: 40+\n\n4. Ospedale de São João\nLocation: São João, São Tomé and Príncipe\nSpecialties: Urology, Gastroenterology, Dermatology\nAccreditations: National Health System Certified\nNumber of Beds: 80+\nNumber of Doctors: 35+\nReference: https://www.mymedicplus.com/blog/best-hospitals-in-sao-tome-andprincipe/\nhttps://www.borgenmagazine.com/common-diseases-in-sao-tome-and-principe/\n●\n●\n●\n●\n●\n\n2.3.10. Transportation and Daily Life\nTaxis and Car Rental\n● Car rentals are available in the country and there are a few international\ncompanies that have a presence but the more popular options are often\nthrough local companies, which are cheaper and offer equally reliable\nservices. The network of roads in the country is extensive, adding up to about\n230 miles. That said, most of the roads are in poor condition and several are\nunpaved. If travelers are intent on renting a vehicle, they should consider a\nfour-wheel drive, which is far better equipped to deal with the unpredictable\nnature of many routes in the country.\n● There are a few private taxi services in the country, mainly operating the\nroute between São Tomé International Airport and the city center. There are\nalso shared taxis in most of the cities, which are identifiable by their bright\nyellow color and can simply be flagged down at the side of the road. Journeys\nwithin cities have fixed prices and travelers simply need to pass the money to\nthe front of the taxi at some point during the journey. The prices of journeys\noutside of the city need to be negotiated beforehand.\nTrains and Buses\n● São Tomé once had a thriving railway system but this network has since been\nabandoned. Today, there are no rail services in the country and while\nsightseeing, travelers may even stumble upon the ruins of a few old railway\nstations and abandoned carriages.\n● There are no private bus companies or coach services in the country. The\nonly way to navigate between regions is to take a minibus taxi, which can be\nflagged down in cities or found waiting at communal taxi ranks. The fares for\nlong distance trips should be agreed upon prior to departure as there are no\nset routes. Travelers who wish to navigate their way between islands can do\nso either by ferry or local airline.\nReference: https://www.iexplore.com/articles/travel-guides/africa/sao-tome-andprincipe/transportation\nRenting a Car in Sao Tome Island with No Security Deposit\n\f● When you pick up the car, you'll often be required to leave a deposit on your\ncredit card or debit card. Deposits vary significantly subject to the size of the\nvehicle and the excess amount. Car rental Security deposits in Sao Tome\nIsland can be anywhere between £100 and £2,500.\nReference: https://www.stressfreecarrental.com/en/car-hire-locations/sao-tomeand-principe/sao-tome-island\n2.3.11 Current Situation of Existing Inequalities in São Tomé and Príncipe\nPost-Independence Evolution (1975-Present)After independence in 1975, São Tomé and Príncipe struggled to address historical\ninequalities. The Forros, composed of approximately 50% of the population,\ncontinued to dominate political and economic life, while the serviçais (30%) and\nAngolares (10%) remained marginalized.\nEconomic Disparities:\nThe 2021 Annual Report by the Central Bank of São Tomé and Príncipe noted high\npoverty rates, with about half the population living below the poverty line,\nparticularly in rural areas. The decline of cocoa production exacerbated economic\nchallenges, leaving rural communities—primarily comprised of serviçais and\nAngolares—with limited access to infrastructure and economic opportunities. Urban\nareas, where Forros are more concentrated, enjoy better access to services and\nhigher income levels, as highlighted in a 2012 study by the São Tomé and Príncipe\nInstitute for Social and Economic Research (INEP), which showed educational and\nincome disparities between forros and other groups.\nEthnic and Social Inequalities:\nCultural values among the Forro population, such as clientelism and corruption, have\nbeen cited as persistent obstacles to development. Serviçais, descendants of\ncontract laborers, often work in informal economies as \"candongueiros\" (informal\ntraders), while Angolares, primarily involved in fishing, continue to face challenges\ndue to their geographic isolation in southern areas like São João dos Angolares. The\nland reforms of the 1990s, supported by the World Bank, aimed to redistribute land\nto ex-serviçais but did not entirely alleviate socioeconomic disparities, particularly\nfor rural ex-serviçais and Angolares.\nUrban-Rural Divide:\nA significant urban-rural divide exists in the country, with about 60% of the\npopulation living in urban areas that have better access to education, healthcare,\nand economic opportunities. Rural populations, disproportionately comprising\nserviçais and Angolares, suffer from higher poverty rates, with a 2020 poverty\nheadcount ratio at $1.90 a day (2011 PPP) standing at 35.6%. This divide is\nexacerbated by the vulnerability of rural agricultural communities to external shocks,\nincluding climate change.\n\fGender and Regional Disparities:\nA 2019 UNDP report highlights gender inequalities, noting that women in São Tomé\nand Príncipe have lower literacy rates and limited access to economic opportunities.\nRegional disparities also persist, particularly with Príncipe being less developed than\nSão Tomé. Rural women, often from serviçais or Angolares backgrounds, face\ncompounded disadvantages due to these intersecting factors.\nReference: Inequalities in São Tomé and Príncipe", "references": [{"source": "Reference:", "url": "https://www.wacaprogram.org/country/sao-tome-and-principe"}, {"source": "Reference:", "url": "https://www.ebsco.com/research-starters/social-sciences-andhumanities/sao-tome-and-principe"}, {"source": "Reference:", "url": "https://20092017.state.gov/outofdate/bgn/saotomeandprincipe/106168.htm"}, {"source": "Reference:", "url": "https://www.iicba.unesco.org/en/sao-tome-and-principe"}, {"source": "borgenproject.org", "url": "https://borgenproject.org/womens-rights-in-sao-tome-and-principe/"}, {"source": "Reference:", "url": "https://www.worldatlas.com/articles/religion-in-sao-tome-andprincipe.html"}, {"source": "Reference:", "url": "https://www.cia.gov/resources/world-leaders/foreign-governments/saotome-and-principe/"}, {"source": "Reference:", "url": "https://www.iexplore.com/articles/travel-guides/africa/sao-tome-andprincipe/festivals-and-events"}, {"source": "data.unwomen.org", "url": "https://data.unwomen.org/country/sao-tome-and-principe"}, {"source": "www.countryreports.org", "url": "https://www.countryreports.org/country/SaoTomeandPrincipe/health.htm"}, {"source": "Reference:", "url": "https://www.mymedicplus.com/blog/best-hospitals-in-sao-tome-andprincipe/"}, {"source": "www.borgenmagazine.com", "url": "https://www.borgenmagazine.com/common-diseases-in-sao-tome-and-principe/"}, {"source": "Reference:", "url": "https://www.iexplore.com/articles/travel-guides/africa/sao-tome-andprincipe/transportation"}, {"source": "Reference:", "url": "https://www.stressfreecarrental.com/en/car-hire-locations/sao-tomeand-principe/sao-tome-island"}]}, {"num": "2.4", "title": "Technological", "content": "2.4 Technological\n2.4.1 Level of Technology at schools\n● Technology in schools in São Tomé and Príncipe is still developing. According to\nthe World Bank, many schools have limited access to computers and internet,\nand teachers often lack digital training. However, international organizations like\nUNICEF and UNESCO are helping improve the situation by introducing digital\nlearning programs, training teachers, and supporting modern education systems.\nAt the university level, institutions such as the University of São Tomé and\nPríncipe offer technology-related courses, helping students gain digital skills.\nOverall, technology in education is growing but still faces challenges like\ninfrastructure and access.\n2.4.2 Main Challenges\n●\n\nLimited internet access in schools\n\n●\n\nLack of devices (computers/tablets)\n\n●\n\nTeachers need more ICT training\n\n●\n\nWeak infrastructure\n\n●\n\nImprovements Happening\n\n●\n\nDigital classrooms (UNICEF)\n\n●\n\nTeacher training programs\n\n●\n\nGovernment digital education strategies\n\n●\n\nGrowing access to internet\n\nReference: https://www.unicef.org/innocenti/stories/transforming-educationthrough-digital-learning-s%C3%A3o-tom%C3%A9-and-pr%C3%ADncipe\n\n\f2.4.3 Digital Transformation in Sao Tome & Principe\nRanking according to international reports\n● When it comes to e-government, Sao Tome and Principe’s position is\ndishearteningly low, ranking 154th globally in e-government and a dismal 187th\nin e-participation according to the UN’s metrics. This reflects not just a deficiency\nin online service provision but a systemic lag in harnessing digital tools for\ngovernance and citizen engagement. Such rankings show a glaring gap between\ninfrastructure development and the capacity to effectively utilize it for public\nbenefit.\nReference: E-Government Survey 2022 The Future of Digital Government – a Study\nby the the United Nations- Department of Economic and Social Affairs\nThe “Digital State” in São Tomé and Príncipe by end of 2025 :\n●\n\nWhile many people rely mainly on mobile phones rather than advanced\ntechnologies like computers or broadband internet, reports from the Internet\nSociety indicate that the country has low digital infrastructure capacity and\nlimited internet service options, which affects the quality and availability of\ntechnology. Overall, this shows that while technology is growing and\nbecoming more common, it is not yet fully developed or accessible to\neveryone, especially in rural or low-income areas.\n\n●\n\nA total of 154 thousand cellular mobile connections were active in São Tomé\nand Príncipe in late 2025, equivalent to 63.9 percent of the total population.\nHowever, note that some of these connections may only include services\nsuch as voice and SMS, and some may not include access to the internet.\n\n●\n\nThere were 148 thousand individuals using the internet in São Tomé and\nPríncipe at the end of 2025, when online penetration stood at 61.5 percent.\n\n●\n\nSão Tomé and Príncipe was home to 73.2 thousand social media user\nidentities in October 2025, equating to 30.3 percent of the total population.\n\nMobile connections in São Tomé and Príncipe in late 2025:\n●\n\nData from GSMA Intelligence shows that there were 154 thousand cellular\nmobile connections in São Tomé and Príncipe at the end of 2025.\n\n●\n\nGSMA Intelligence’s numbers indicate that mobile connections in São Tomé\nand Príncipe were equivalent to 63.9 percent of the total population in\nOctober 2025.\n\n●\n\nLooking at trends over time, the number of mobile connections in São Tomé\nand Príncipe increased by 4,826 (+3.2 percent) between the end of 2024 and\nthe end of 2025.\n\nReference: Digital 2026: São Tomé & Príncipe — DataReportal – Global Digital\nInsights\n\n\fWith insights from The ITU (the International Telecommunication Union), which is\nthe United Nations’ specialized agency for digital technologies\n&GSMA a global organization that represents the mobile Communication Industry\nand its members\nAnother Statistics By the end of 2024 :\nBased on the Digital Development Dashboard for São Tomé and Príncipe:\nConnectivity and Access\n●\n\nMobile broadband subscriptions: 44.6 per 100 people (2024).\n\n●\n\nMobile phone ownership: 70.9% of individuals (2024).\n\n●\n\nHousehold internet access: No recent data available.\n\nInternet Use\n●\n\nIndividuals using the Internet: 59.1% of the population (2024).\n\n●\n\nFixed broadband traffic: 2.9K GB per subscription (2005 data, no recent\nupdates).\n\n●\n\nMobile broadband traffic: 38 GB per subscription (2024).\n\nNetwork Coverage\n●\n\nPopulation coverage by mobile networks (2024):\n●\n\nAt least 2G: 97%\n\n●\n\nAt least 3G: 96%\n\n●\n\nAt least LTE/WiMAX: 96%\n\n●\n\nAt least 5G: No data\n\nKey Observations\n●\n\nSão Tomé and Príncipe has high mobile phone ownership and strong mobile\nnetwork coverage (almost universal for 2G–LTE).\n\n●\n\nInternet use is growing, with over half the population online.\n\n●\n\nBroadband traffic data is limited, but mobile broadband usage shows steady\ngrowth.\n\n●\n\nHousehold-level internet access data is missing, which makes it harder to\nmeasure digital inclusion at the family level.\n\nReference: Sao Tome and Principe data - ITU DataHub\nInternet use in São Tomé and Príncipe in Late 2025\n\n\f● At the time of report production, Kepios’s analysis of the latest available data\nindicated that there were 148 thousand internet users in São Tomé and\nPríncipe in October 2025.\n● São Tomé and Príncipe’s internet penetration rate stood at 61.5 percent of\nthe total population at the end of the year.\n● Kepios’s analysis of this data indicates that the number of internet users in\nSão Tomé and Príncipe increased by 2,904 (+2.0 percent) between\nOctober 2024 and October 2025.\n● And for added perspective, São Tomé and Príncipe’s internet adoption\nrate (i.e. the percentage of the total population that uses the internet)\nremained unchanged during the same period.\n● But these user figures also suggest that 93.0 thousand people in São Tomé\nand Príncipe did not use the internet at the end of 2025, suggesting\nthat 38.5 percent of the population\n2.4.4 Social media statistics for São Tomé and Príncipe in Late 2025\n● Proprietary analysis indicates that there were 73.2 thousand active social\nmedia user identities in São Tomé and Príncipe in October 2025.\n● For perspective, this figure was equivalent to 30.3 percent of São Tomé and\nPríncipe’s total population at the end of 2025.\n● Analysis shows that social media user identities in São Tomé and\nPríncipe increased by 8,050 (+12.4 percent) between late 2024 and the end\nof 2025.\n● Turning our attention to user demographics, data published in the ad\nplanning tools of top social media platforms indicates that there\nwere 72.6 thousand user identities aged 18 and above using social media in\nSão Tomé and Príncipe at the end of 2025, which was equivalent\nto 54.1 percent of the total population aged 18 and above.\n● At that time, 44.7 percent of São Tomé and Príncipe’s social media user\nidentities were female, while 55.3 percent were male.\n● And for added context, it may be helpful to know that 49.3 percent of São\nTomé and Príncipe’s total internet user base (regardless of age) used at least\none social media platfo\nReference: Digital 2026: São Tomé & Príncipe — DataReportal – Global Digital\nInsights\nFacebook users in São Tomé and Príncipe in Late 2025\nData published in Meta’s advertising resources indicate\nthat Facebook had 73.2 thousand users in São Tomé and Príncipe in late\n2025.\n● It may be useful to know that the company’s data indicates\nthat 54.1 percent of adults aged 18 and above in São Tomé and Príncipe used\nFacebook at the end of 2025.\n●\n\n\fAnd for additional context, Facebook’s ad reach in São Tomé and Príncipe\nwas equivalent to 49.3 percent of the local internet user base (regardless of\nage) in October 2025.\n● At the end of 2025, 47.3 percent of Facebook’s adult ad audience in São\nTomé and Príncipe was female, while 52.7 percent was male.\n●\n\nInstagram users in São Tomé and Príncipe in 2026\n●\n\n●\n\n●\n\n●\n\n●\n\n●\n\nNumbers published in Meta’s advertising tools indicate\nthat Instagram had 10.8 thousand users in São Tomé and Príncipe in late\n2025.\nThe company’s regularly revised figures suggest that Instagram’s ad reach in\nSão Tomé and Príncipe was equivalent to 4.5 percent of the total population\nat the end of the year.\nHowever, Meta only allows people aged 13 and above to use Instagram, so\nit’s also worth highlighting that 6.6 percent of the “eligible” audience in São\nTomé and Príncipe used Instagram at the time of report production.\nMeanwhile, data published in the company’s ad tools indicate\nthat 8.0 percent of adults aged 18 and above in São Tomé and Príncipe used\nInstagram at the end of 2025.\nSimilarly, it may be helpful to know that Instagram’s ad reach in São Tomé\nand Príncipe at the end of 2025 was equivalent to 7.2 percent of the local\ninternet user base (regardless of age).\nIn late 2025, 43.5 percent of Instagram’s adult ad audience in São Tomé and\nPríncipe was female, while 54.6 percent was male.\n\nReference: Digital 2026: São Tomé & Príncipe — DataReportal – Global Digital\nInsights\nTikTok users in São Tomé and Príncipe in Late 2025\nFigures published in TikTok’s advertising resources indicate\nthat TikTok had 62.0 thousand users aged 18 and above in São Tomé and\nPríncipe in late 2025.\n● Note that TikTok allows marketers to target TikTok ads to users aged 13 and\nabove via its advertising tools, but these tools only show audience data for\nusers aged 18 and above.\n● And for context, TikTok’s figures indicate that TikTok ads\nreached 46.2 percent of all adults aged 18 and above in São Tomé and\nPríncipe at the end of 2025.\n● In late 2025, 30.6 percent of TikTok’s adult ad audience in São Tomé and\nPríncipe was female, whereas 69.4 percent was male.\n●\n\n\fLinkedIn users in São Tomé and Príncipe in Late 2025:\n● Figures published in LinkedIn’s advertising resources indicate\nthat LinkedIn had 15.0 thousand “members” in São Tomé and Príncipe in late\n2025.\n● Note that LinkedIn’s advertising tools publish audience reach data based\non total registered members, rather than the monthly active users that form\nthe basis of the ad reach figures published by most other social media\nplatforms.\n● As a result, these LinkedIn figures are not directly comparable with the\nfigures for other social media platforms published on this page, or those\nshown in our Digital 2026 reports.\n● But caveats aside, the company’s own advertising reach figures suggest that\nLinkedIn’s audience in São Tomé and Príncipe was equivalent\nto 6.2 percent of the total population at the end of 2025.\n● LinkedIn’s advertising tools only publish data for users aged 18 and\nabove though, so it may be more representative to state that LinkedIn’s ads\nreached 11.2 percent of São Tomé and Príncipe’s population aged 18 and\nabove in late 2025.\n● Meanwhile, LinkedIn’s ad reach in São Tomé and Príncipe was equivalent\nto 10.1 percent of the local internet user base (regardless of age) at the end\nof the year.\n● In late 2025, 33.0 percent of LinkedIn’s ad audience in São Tomé and Príncipe\nwas female, while 67.0 percent was male.\nReference: Digital 2026: São Tomé & Príncipe — DataReportal – Global Digital\nInsights\n2.4.5 Summary\nThe Country of Sao Tome and Principe has undergone a TNA ( Technology\nNeeds Assessment) that was completed by the end of 2023 to Identify\nwhat kind of technologies are best suited to a country’s specific climate\nchange situation and assess and analyse the country’s specific needs, as\nrelates to its specific set of circumstances and utilize this data to set priorities\nand identify appropriate technologies.\n● The Main Findings and Conclusions of the study can be summarized in the\nfollowing points:\n●\n\n●\n\nFocus sectors: Energy and Transport, chosen for their high emissions and\nstrategic importance.\n\n●\n\nSão Tomé and Príncipe remains a net carbon sink but faces rising emissions in\nenergy and transport.\n\n●\n\nPrioritized technologies will guide future mitigation projects and support the\ntransition to a low-carbon, climate-resilient economy.\n\n\fThe chosen sectors for adaptation were agroforestry and water, and for mitigation,\nenergy and transport. The corresponding prioritised technologies for these sectors\nwere:\n●\n\nAgroforestry: protected cultivation integrated in greenhouses, sustainable\nagricultural land management, agro-silvo-pastoral system\n\n●\n\nWater: integrated management of hydrographic basins, water safety plan,\nconstruction and maintenance of existing dams and water reservoirs\n\n●\n\nEnergy: solar photovoltaic power plant, hydroelectric power, efficient\nmanagement of the electricity system\n\n●\n\nTransport: electric light cars, electric motorcycles, electric public transport\nwith photovoltaic roofs\n\nReference: São Tomé and Principe - Technology Needs Assessment ( Could Support\nin Enviromental too)\n\n\f2.5 Environmental", "references": [{"source": "Reference:", "url": "https://www.unicef.org/innocenti/stories/transforming-educationthrough-digital-learning-s%C3%A3o-tom%C3%A9-and-pr%C3%ADncipe"}]}, {"num": "2.5", "title": "Environmental", "content": "2.5.1 Overview\n\nSão Tomé and Príncipe is the second smallest country in Africa and is a Small\nIsland Developing State. The country faces significant challenges in the face of\nclimate change including land degradation caused by commercial logging,\nunsustainable agriculture and competing demands for food, energy, and space,\nand increasing ocean acidification, coastal floods, and marine degradation\n● The NDC identified the most vulnerable sectors as agriculture, fisheries, and\nlivestock. Horticultural and vegetable production are highly exposed to extreme\nweather events, such as floods, droughts, and heavy rains.\n● These crops are drastically affected by pests, requiring substantial agricultural\ninputs and agrochemicals, which increases land-based waste that ends up in\ngroundwater layers and the sea.\n● The country consists of an archipelago with two main islands, São Tomé Island\nwhich is 50 km long and 30 km wide, and Príncipe Island which is about 30 km\nlong and 6 km wide. The coastal zone includes the slopes of extinct volcanoes,\nwithin which the environment is under stress from soil degradation and coastal\nerosion.\n●\n\nA Multi-Sector Investment Plan (MSIP) was developed for the country which\nemphasized the need for policy reforms that promote more sustainable and adaptive\nmanagement of the coastal zones, a new institutional framework for disaster risk\nmanagement, and a strong community engagement for coastal protection.\nReference: https://www.adaptation-undp.org/projects/scala-sao-tome-and-principe\nMulti-Sector Investment Plan (MSIP)\n\n\f2.5.2 WACA Interventions\n●\n\nOngoing activities focus on natural-based solutions through community\napproaches and hybrid solutions, when hard solutions are indispensable, beach\nnourishment, drainage, breakwaters, and coastal and riverbank revetments. On\npolicy interventions, a new law on sand extraction is being supported.\nCommunity-based adaptation is a center of the approach in Sao Tome and\nPrincipe, including support to schemes for routine maintenance of coastal\nprotection infrastructure in collaboration with district governments.\n\nKey agencies\n●\n\nThe Ministry of Infrastructure, Natural Resources and Environment is the lead\nagency for coastal resilience efforts. It has established a project implementation\nunit to coordinate project activities supported by multiple partners.\n\nReference: https://www.wacaprogram.org/country/sao-tome-and-principe\n2.5.3 Geography\n●\n●\n●\n●\n●\n\nLocation: Western Africa; islands straddling the equator in the Gulf of Guinea\nwest of Gabon.\nArea: 1,001 sq. km. (386 sq. mi.); about the size of metropolitan Indianapolis, or\none-third the size of Rhode Island.\nCities: Capital--Sao Tome. Other cities--Trinidade, Santana, Angolares, Neves,\nSanto Antonio.\nTerrain: Two small, volcanic islands.\nClimate: Tropical, with wet and dry seasons, influenced by the mountainous\ntopography.\n\nThe islands of Sao Tome and Principe, situated in the equatorial Atlantic about 300\nand 250 kilometres (200 mi. and 150 mi.), respectively, off the northwest coast of\nGabon, constitute Africa's smallest country. Both are part of an extinct volcanic\nmountain range, which also includes the island of Bioko in Equatorial Guinea to the\nnorth and Mount Cameroon on the African west coast. Sao Tome is 50 kilometres\n(31 mi.) long and 32 kilometres (20 mi.) wide and the more mountainous of the two\nislands. Its peaks reach 2,024 meters (6,640 ft.). Principe is about 30 kilometres (19\nmi.) long and 6 kilometres (4 mi.) wide. Swift streams radiating down the mountains\nthrough lush forest and cropland to the sea cross both islands.\nAt sea level, the climate is tropical--hot and humid with average yearly temperatures\nof about 27oC (80oF) and little daily variation. At the interior's higher altitudes, the\naverage yearly temperature is 20oC (68oF), and nights are generally cool. Annual\nrainfall varies from 500 centimetres (200 in.) on the southwestern slopes to 100\ncentimetres (40 in.) in the northern lowlands. The rainy season runs from October to\nMay.\nReference: https://20092017.state.gov/outofdate/bgn/saotomeandprincipe/106168.htm\n\f2.5.4 Climate:\nSão Tomé's climate is classified as tropical. The winter months are much rainier\nthan the summer months in São Tomé. This location is classified as by Köppen\nand Geiger. The average annual temperature in São Tomé is 24.7 °C | 76.4 °F.\nApproximately 1382 mm | 54.4 inch of rainfall occurs on a yearly basis.\n● São Tomé is situated close to the equator and therefore the summers are not\neasy to define. It is recommended that the optimal period for embarking on a\njourney would be during January, February, April, May, June, July, August,\nSeptember.\n●\n\nReference: https://en.climate-data.org/africa/sao-tome-and-principe/sao-tomeprovince/sao-tome-3633/\n2.5.5 What are the challenges that Sao tome and Principe facing in climate?\n1. Sea-level rise and coastal erosion\n●\n\nRising sea levels are causing coastal erosion and flooding along beaches and\nsettlements.\n\n●\n\nMany villages, roads, and infrastructure are located near the coast, making\nthem vulnerable to storms and higher waves.\n\n●\n\nCoastal erosion also threatens fishing areas, tourism sites, and homes.\n\nReference:https://www.gfdrr.org/fr/sao-tome-et-principe?utm_source=chatgpt.com\n2. More frequent floods and heavy rainfall\n●\n\nClimate change has increased intense rainfall, which leads to flash floods\nand landslides.\n\n●\n\nCities like São Tomé and Santo António often experience flooding because\ndrainage systems were not built to handle heavy rain.\n\n●\n\nFloods damage houses, roads, bridges, and crops.\n\n\fReference: https://www.worldbank.org/en/news/feature/2024/05/06/climatesmart-road-rehab-a-crucial-upgrade-for-afe-sao-tome-andprincipe?utm_source=chatgpt.com\n3. Threats to agriculture and food security\n●\n\nAgriculture is a key livelihood for many people in the country.\n\n●\n\nClimate changes such as drought, soil erosion, and unpredictable rainfall\naffect crops like cocoa and coffee.\n\n●\n\nThese changes can lead to lower food production and income for farmers.\n\nReference: https://unfccc.int/topics/resilience/workstreams/national-adaptationprogrammes-of-action/ldc-portal/country-experiences-with-napa-process/SaoTome-and-Principe?utm_source=chatgpt.com\n4. Water supply and water quality problems\n●\n\nHeavy rainfall increases runoff and sediment in rivers, making water\ntreatment difficult.\n\n●\n\nAs a result, water systems sometimes shut down, causing water shortages\nfor many people.\n\nReference: https://www.adaptation-undp.org/projects/enhance-adaptive-capacityfloods-and-water-security-sao-tome-and-principe?utm_source=chatgpt.com\n5. Limited resources to adapt to\n●\n\nAs a small developing island nation, São Tomé and Príncipe has limited\nfinancial and technical capacity to deal with climate impacts.\n\n●\n\nInfrastructure such as roads and drainage systems often cannot withstand\nstronger storms and floods.\n\nReference: https://www.worldbank.org/en/news/feature/2024/05/06/climatesmart-road-rehab-a-crucial-upgrade-for-afe-sao-tome-andprincipe?utm_source=chatgpt.com\nSão Tomé and Príncipe has started solving some of these climate problems:\nbut most solutions are still ongoing and not fully solved yet. The country is working\nwith organizations like the World Bank, UNDP, and African Development Bank to\nadapt to climate change.\n1. Coastal protection projects\nThe government built and planned projects to protect the coast from erosion and\nflooding.\n\n\f●\n\nCoastal defenses and reconstruction along the Marginal Road in São Tomé\ncity help protect the shoreline from erosion and strong waves.\n\n●\n\nThese projects include coastal barriers, road upgrades, and better\ninfrastructure to make the capital more climate resilient.\n\nThey are also restoring mangroves and beaches, which act as natural barriers\nagainst waves and floods.\nReference: https://irdeng.com/2025/07/28/project-update-agua-grande-coastalprotection-and-reconstruction-of-the-marginal-road-sao-tome-eprincipe/?utm_source=chatgpt.com\n2. Flood control and water management\nProjects are being implemented to reduce flooding and improve water systems.\n●\n\nA UNDP project is helping cities like São Tomé and Santo António improve\ndrainage systems and manage water better.\n\n●\n\nThis includes better waste management, stronger drainage, and improved\nwater supply systems.\n\nReference: https://www.adaptation-undp.org/projects/enhance-adaptive-capacityfloods-and-water-security-sao-tome-and-principe?utm_source=chatgpt.com\n3. Climate-resilient roads and infrastructure\nThe government is rebuilding roads so they can survive heavy rains and floods.\n●\n\nThe EN-1 road between São Tomé and Guadalupe was rebuilt with better\ndrainage and stronger materials.\n\n●\n\nThese roads are designed to handle strong rainfall and landslides caused by\nclimate change.\n\nReference: https://www.worldbank.org/en/news/feature/2024/05/06/climatesmart-road-rehab-a-crucial-upgrade-for-afe-sao-tome-andprincipe?utm_source=chatgpt.com\nhttps://www.cia.gov/resources/world-leaders/foreign-governments/sao-tome-andprincipe/\n\n\f2.6 Legal", "references": [{"source": "Reference:", "url": "https://www.adaptation-undp.org/projects/scala-sao-tome-and-principe"}, {"source": "Reference:", "url": "https://www.wacaprogram.org/country/sao-tome-and-principe"}, {"source": "Reference:", "url": "https://20092017.state.gov/outofdate/bgn/saotomeandprincipe/106168.htm"}, {"source": "Reference:", "url": "https://en.climate-data.org/africa/sao-tome-and-principe/sao-tomeprovince/sao-tome-3633/"}, {"source": "Reference:", "url": "https://www.gfdrr.org/fr/sao-tome-et-principe?utm_source=chatgpt.com"}, {"source": "Reference:", "url": "https://www.worldbank.org/en/news/feature/2024/05/06/climatesmart-road-rehab-a-crucial-upgrade-for-afe-sao-tome-andprincipe?utm_source=chatgpt.com"}, {"source": "Reference:", "url": "https://unfccc.int/topics/resilience/workstreams/national-adaptationprogrammes-of-action/ldc-portal/country-experiences-with-napa-process/SaoTome-and-Principe?utm_source=chatgpt.com"}, {"source": "Reference:", "url": "https://www.adaptation-undp.org/projects/enhance-adaptive-capacityfloods-and-water-security-sao-tome-and-principe?utm_source=chatgpt.com"}, {"source": "Reference:", "url": "https://irdeng.com/2025/07/28/project-update-agua-grande-coastalprotection-and-reconstruction-of-the-marginal-road-sao-tome-eprincipe/?utm_source=chatgpt.com"}, {"source": "www.cia.gov", "url": "https://www.cia.gov/resources/world-leaders/foreign-governments/sao-tome-andprincipe/"}]}, {"num": "2.6", "title": "Legal", "content": "2.6.1 2023 Report on International Religious Freedom\nSao Tome and Principe\n●\n\nThe constitution and the law on religious freedom provide for freedom of\nreligion and worship and equality for all, irrespective of religious belief, and\nprovide for judicial protection to all religious denominations. Both the\nconstitution and the religious freedom law grant religious groups\nautonomy and the right to teach their religion. Religious groups must register\nwith the government. Registration requires at least 500 member signatures and\nMinistry of Justice approval\n\nReligious education is not a part of the official public-school curriculum. There\nare two schools run by religious groups, one Catholic and one Seventh-day\nAdventist; both provide a general education and require all students to take\nreligion classes and the The Ministry of Education provides oversight on the\ncurricula of religious schools.\n● Article 8 from the General Constitutional Provisions enshrines the separation of\nthe state from religion.\n●\n\nReference: Sao Tome and Principe - United States Department of State\n2.6.2 The legal system in São Tomé and Príncipe\n●\n\nFormal legislation molded in diverse ways–namely as laws, law decrees, decrees,\nregulations, regional decrees, and executive regional decrees–are the primary\ninternal sources of law in São Tomé. Customary Laws also play a role in certain\nmatters, mostly to explain or go beyond the plain meaning, but only if not in\ncontradiction with the formal laws (secundum legis).\n\n●\n\nIt plays a crucial role in upholding the principles of governance and ensuring a\njust society. As a fundamental framework, it is designed to maintain order,\nsafeguard individual rights, and provide a mechanism for resolving disputes\namong individuals, organizations, and the state. The legal system is anchored in\nthe country’s Constitution, which establishes the rule of law as a cornerstone for\ndemocratic governance and civil rights.\n\n●\n\nThe Legal system is heavily influenced by Portuguese law, due to its colonial\npast, and incorporates other elements pertinent to the unique context of the\nislands. This blend of legal traditions creates a system that is both complex and\nadaptable, allowing for the evolution of legal norms in response to contemporary\nsocietal needs.\n\n●\n\nThe legal framework in São Tomé and Príncipe comprises several court types,\neach with defined functions and jurisdictions that form the backbone of the\njudiciary. The primary courts include the Constitutional Court, Administrative\nCourt, and Ordinary Courts, each serving unique roles in the legal system.\n\n\fReference: A Comprehensive Overview of the Legal System in São Tomé and Príncipe\nDiário da República of São Tomé and Príncipe (28 February 2025)\n●\n\nIt’s a Decree-Law (No. 02/2025) that sets out the structure and organization of\nthe 19th Constitutional Government of São Tomé and Príncipe. In simple terms,\nit explains how the government is arranged, which ministries exist, ( as\npreviously Stated in the Political Section) and what each one is responsible for.\n\nThe Modern Legal Foundation for Investment\nSince 2016, São Tomé and Príncipe has fundamentally overhauled its investment\nframework, creating one of the more progressive legal structures in the region. Two\ncornerstone laws define the current environment:\nInvestment Code (Decree-Law No. 19/2016) establishes the terms, conditions, and\nguarantees for all investments in STP.\nTax Benefits Code (Decree-Law No. 15/2016) details the financial and fiscal\nincentives available to investors, defining exceptional measures that reduce or\neliminate taxes to encourage economic development in priority sectors.\nTogether, these laws create a clear regulatory foundation focused on attracting\nforeign capital while ensuring equal treatment between domestic and foreign\ninvestors guarantee enshrined in both legislation and the country's Constitution.\nThe types of investment that are subject to the Investment Code are broadly\ndefined. They should relate to economic activities that are developed by companies\nthat are organized under the laws of São Tomé or that are registered within the\njurisdiction.\nThe investment framework operates on a tiered system based on project value, with\ndifferent incentive levels corresponding to investment size:\nMinimum Threshold: To qualify for guarantees and tax incentives, investments must\nequal or exceed €50,000. This relatively low barrier makes STP accessible to small\nand medium-sized investors, not just major corporations.\n2.6.2 Investments in Sao Tome and Principe\nThree Investment Regimes:\n1. Simplified Regime (€50,000 to €249,999): Projects receive 50% of the\nincentives described in the Tax Benefits Code\n2. General Regime (€250,000 to €4,999,999): Full access to standard incentives\n3. Special Regime (€5,000,000 or more): Maximum incentive package with\nnegotiated terms\nTo access these benefits, investors must enter into an Administrative Investment\nContract (AIC) with the state. This contract requires several elements: investors must\npossess at least 20% of the proposed capital available, demonstrate stable financial\n\fstanding, present clearance certificates showing no debts with the state or social\nsecurity, and provide a feasibility study demonstrating job creation and social\nresponsibility.\nCore Investment Guarantees\nThe Investment Code provides fundamental protections that address investors'\nprimary concerns:\nEqual Treatment: The law guarantees non-discriminatory treatment between\nnationals and foreigners, regardless of capital origin. Importantly, there are no\nlegal restrictions on foreign ownership of São Toméan companies—100% foreign\nownership is permitted in most sectors.\n● Expropriation Protection: The state guarantees that investment assets will not\nbe nationalized, expropriated, or requisitioned except for weighty public interest\nreasons. Even then, fair, prior, and effective compensation must be paid.\n● Management Autonomy: Public non-interference in private enterprise\nmanagement is guaranteed, except in cases expressly provided by law.\n● International Arbitration: STP is a signatory to the ICSID Convention\n(Washington Convention of 1965) and the New York Convention on arbitration,\nproviding independent dispute resolution mechanisms and reducing political risk.\n●\n\nThe Administrative Investment Contract (CAI):\nThe CAI is a formal contract between you (the investor) and the State of São Tomé\nand Príncipe. Think of it as a bilateral agreement where both parties make binding\ncommitments:\nYou commit to:\n●\n●\n●\n●\n\nInvesting a specific amount of capital\nMeeting implementation timelines\nCreating jobs and training local workers\nAchieving defined economic and social objectives\n\nThe government commits to:\n●\n●\n●\n●\n\nGranting specific tax incentives and benefits\nProtecting your investment against expropriation\nAllowing profit repatriation (subject to forex rules)\nNot interfering in your business management\n\nThis mutual commitment structure is what makes the CAI powerful. Unlike general\nlaws that can be changed by parliament, your CAI is a contract—it can only be\naltered by mutual agreement or if you violate its terms.\nPolicies toward Foreign Direct Investment\nAccording to Article 4 of the Investment Code, both domestic and foreign investors\nare free to establish and own business enterprises, as well as engage in all forms of\nbusiness activity in São Tomé and Príncipe, except in the sectors defined by law as\n\freserved for the state, specifically military and paramilitary activities, and Central\nBank operations.\nReference : São Tomé and Príncipe - United States Department of State\nAccording to Article 6 of the Investment Code (Decree-Law No. 19/2016) , it\nidentifies some areas for investment.\n●\n●\n●\n●\n●\n\nBoth citizens and foreigners can invest (while preserving and guarantying the\nfollowing\nInvestor’s Protection against discrimination (foreign and local investors are\ntreated equally).\nInvestments will not be unfairly taken away (“expropriated”) without proper\ncompensation.\nInvestments can be in areas like agriculture, tourism, energy, infrastructure, and\nservices.\nThe government encourages projects that bring technology, training, and\ninnovation.\n\nReference : Sao Tome and Principe - Investment Law 2016 | Investment Laws\nNavigator | UNCTAD Investment Policy Hub\n2.6.3 Land Access in Sao Tome and Principe\nLand access is often the most complex issue for foreign investors—and São Tomé\nand Príncipe is no exception\nAfter independence. The state became the dominant landowner & much of the\ncountry's productive land remains state-owned.\nThe restriction: São Toméan law prohibits foreign investors from possessing state\nlands.\nThe general limit: Foreign nationals can own maximum two hectares of private land.\nLand access in São Tomé and Príncipe is possible through renewable concessions,\nbut success depends less on paperwork and more on community engagement and\ncareful due diligence. The legal rights are clear, but the “social license to operate” is\nwhat determines whether a project can move forward smoothly.\nConcession System\nMechanism: Investors don’t own land outright; they receive 20-year\nconcessions, renewable automatically.\n● Rights granted: Possession, use, and enjoyment of land; lease agreements;\nexploitation rights.\n● Termination: Either party can end with 2 years’ notice.\n● Fees: Agricultural concessions cost about $10–20 per hectare/year;\ntourism/infrastructure fees are negotiated.\n●\n\nReference: Access to Land:: SaoTomeExpert\n\fArticle 17. from the General Constitutional Provisions: Foreigners in São Tomé and\nPríncipe\n●\n\nThe exercise of public office only will be permitted to foreigners provided it has a\npredominantly technical nature.\n\n●\n\nSubject to reciprocal terms, the law may grant foreign citizens resident in the\nnational territory active and passive electoral capacity for the election of the\nholders of the organs of local government.\n\n●\n\nArticle 17 of the Constitution protects the rights and integrity of foreigners.\nForeigners and displaced persons who reside or stay in São Tomé and Príncipe\nenjoy the same rights and are subject to the same obligations as a São Tomean\ncitizen, except insofar as are concerned political rights, the exercise of public\noffice, and other rights and obligations expressly reserved by law for the national\ncitizen.\n\nArticle 15. Principles of Equality\n●\n\nAll citizens are equal before the law, enjoy the same rights and are subject to the\nsame obligations\n\n●\n\nWoman is equal to man in rights and obligations, being guaranteed to her full\nparticipation in political, economic, social and cultural life.\n\nReference :São Tomé and Príncipe Legal System and Research - Globalex\n2.6.4 Regulatory Authority fo
