<script>
const DATA = {"1": {"name": "Overview", "num": 1, "sections": [{"num": "1.1", "title": "Basic Facts", "content": "1.1 Basic Facts\nLocation\nSão Tomé and Príncipe is located in West Africa, in the Gulf of Guinea. It consists of\nthe islands of São Tomé, Príncipe, Pedras Tinhosas, Caroço, and Rôlas.\nArea\nThe country has a total area of 1,001 sq km (386 sq. mi.), making it the smallest\ncountry in Africa.\nPopulation\nThe estimated population is approximately 235,536 people.\nMain Cities\nThe capital city is São Tomé. Other important cities include Trinidade, Santana,\nAngolares, Neves, and Santo Antonio.\nReference:\nhttps://www.saotomeexpert.pt/en/sao-tome-and-principe-factsheet-geographyclimate/", "references": [{"source": "saotomeexpert.pt", "url": "https://www.saotomeexpert.pt/en/sao-tome-and-principe-factsheet-geographyclimate/"}], "contentBlocks": [{"type": "text", "html": "<h3 class=\"content-h\">1.1 Basic Facts</h3>\n<p>Location São Tomé and Príncipe is located in West Africa, in the Gulf of Guinea. It consists of the islands of São Tomé, Príncipe, Pedras Tinhosas, Caroço, and Rôlas. Area The country has a total area of 1,001 sq km (386 sq. mi.), making it the smallest country in Africa. Population The estimated population is approximately 235,536 people. Main Cities The capital city is São Tomé. Other important cities include Trinidade, Santana, Angolares, Neves, and Santo Antonio. Reference: <a href=\"https://www.saotomeexpert.pt/en/sao-tome-and-principe-factsheet-geographyclimate/\" target=\"_blank\" rel=\"noopener\">https://www.saotomeexpert.pt/en/sao-tome-and-principe-factsheet-geographyclimate/</a></p>"}], "tables": []}, {"num": "1.2", "title": "Geography & Climate", "content": "1.2 Geography & Climate\nThe country is characterized by two main mountainous islands that are part of a\nchain of extinct volcanoes. The terrain is largely volcanic and tropical.\nSão Tomé and Príncipe has a tropical climate with wet and dry seasons. Weather\nconditions are strongly influenced by the mountainous landscape. The country also\nfaces environmental challenges such as rising sea levels and floods due to climate\nchange.\nReference: Sao Tome and Principe (06/08)\nSao Tome and Principe (07/03)", "references": [], "contentBlocks": [{"type": "text", "html": "<h3 class=\"content-h\">1.2 Geography & Climate</h3>\n<p>The country is characterized by two main mountainous islands that are part of a chain of extinct volcanoes. The terrain is largely volcanic and tropical. São Tomé and Príncipe has a tropical climate with wet and dry seasons. Weather conditions are strongly influenced by the mountainous landscape. The country also faces environmental challenges such as rising sea levels and floods due to climate change. Reference: Sao Tome and Principe (06/08) Sao Tome and Principe (07/03)</p>"}], "tables": []}, {"num": "1.3", "title": "Culture", "content": "1.3 Culture\n1.3.1 Language\nPortuguese is the official and most widely spoken language, used by approximately\n98.4% of the population. Several Portuguese-based creole languages are also\nspoken, including Forro, Cape Verdean Creole, Angolar, and Principense.\nFrench and English are taught as foreign languages in schools.\n1.3.2 Customs & Traditions\nOne of the country’s most important cultural traditions is “Tchiloli,” a traditional\ntheatrical performance that represents themes of justice and social values. It is\nrecognized by UNESCO as an Intangible Cultural Heritage.\n\f1.3.3 Social Habits\nReligion plays an important role in society, with Roman Catholicism and Evangelical\nProtestantism being the dominant religions.\nSocial life is strongly connected to local traditions, community activities, and cultural\ncelebrations.\nReference: Video: Tchiloli, living theatre of Sao Tome and Principe in the quest of\njustice - UNESCO Intangible Cultural Heritage\nSao Tome and Principe - BeingAfrican", "references": [], "contentBlocks": [{"type": "text", "html": "<h3 class=\"content-h\">1.3 Culture</h3>"}, {"type": "text", "html": "<h3 class=\"content-h\">1.3.1 Language</h3>\n<p>Portuguese is the official and most widely spoken language, used by approximately 98.4% of the population. Several Portuguese-based creole languages are also spoken, including Forro, Cape Verdean Creole, Angolar, and Principense. French and English are taught as foreign languages in schools.</p>"}, {"type": "text", "html": "<h3 class=\"content-h\">1.3.2 Customs & Traditions</h3>\n<p>One of the country’s most important cultural traditions is “Tchiloli,” a traditional theatrical performance that represents themes of justice and social values. It is recognized by UNESCO as an Intangible Cultural Heritage.</p>"}, {"type": "text", "html": "<h3 class=\"content-h\">1.3.3 Social Habits</h3>\n<p>Religion plays an important role in society, with Roman Catholicism and Evangelical Protestantism being the dominant religions. Social life is strongly connected to local traditions, community activities, and cultural celebrations. Reference: Video: Tchiloli, living theatre of Sao Tome and Principe in the quest of justice - UNESCO Intangible Cultural Heritage Sao Tome and Principe - BeingAfrican</p>"}], "tables": []}, {"num": "1.4", "title": "Economy & Education", "content": "1.4 Economy & Education\n1.4.1 General Wealth\nSão Tomé and Príncipe is considered a developing economy. In December 2024, the\ncountry graduated from the “Least Developed Countries” (LDC) category. Its Gross\nNational Income (GNI) per capita reached approximately $2,271 during 2020–2022.\nThe economy remains highly dependent on commodity exports, especially cocoa\nbeans, which accounted for about 69% of merchandise exports between 2021 and\n2023. The country also faces economic challenges including debt distress, geographic\nisolation, and slow economic growth.\nReference: Sao Tome and Principe | World Bank Group\n1.4.2 Education & Literacy Rates\nThe literacy rate is approximately 84.9%. The country has implemented educational\nreforms through the Lei de Bases do Sistema Educativo (LBSE). In addition, the\nHuman Assets Index increased significantly from 59.3 in 2002 to 91.4 in 2024,\nreflecting improvements in education and human development.\nReference: São Tomé and Príncipe Languages • Family Search Educativo (LBSE) - Lei\nn.° 2 / 2003. The country’s Human Assets Index score rose significantly from 59.3 in\n2002 to 91.4 in 2024. São Tomé and Príncipe Languages • FamilySearch", "references": [], "contentBlocks": [{"type": "text", "html": "<h3 class=\"content-h\">1.4 Economy & Education</h3>"}, {"type": "text", "html": "<h3 class=\"content-h\">1.4.1 General Wealth</h3>\n<p>São Tomé and Príncipe is considered a developing economy. In December 2024, the country graduated from the “Least Developed Countries” (LDC) category. Its Gross National Income (GNI) per capita reached approximately $2,271 during 2020–2022. The economy remains highly dependent on commodity exports, especially cocoa beans, which accounted for about 69% of merchandise exports between 2021 and 2023. The country also faces economic challenges including debt distress, geographic isolation, and slow economic growth. Reference: Sao Tome and Principe | World Bank Group</p>"}, {"type": "text", "html": "<h3 class=\"content-h\">1.4.2 Education & Literacy Rates</h3>\n<p>The literacy rate is approximately 84.9%. The country has implemented educational reforms through the Lei de Bases do Sistema Educativo (LBSE). In addition, the Human Assets Index increased significantly from 59.3 in 2002 to 91.4 in 2024, reflecting improvements in education and human development. Reference: São Tomé and Príncipe Languages • Family Search Educativo (LBSE) - Lei n.° 2 / 2003. The country’s Human Assets Index score rose significantly from 59.3 in</p>"}, {"type": "text", "html": "<h3 class=\"content-h\">2002 to 91.4 in 2024. São Tomé and Príncipe Languages • FamilySearch</h3>"}], "tables": []}]}, "2": {"name": "PESTEL", "num": 2, "sections": [{"num": "2.1", "title": "Political", "content": "2.1 Political\n2.1.1. Government\nType: Presidential-parliamentary democracy with a multi-party system. The\nPresident is directly elected for up to two consecutive five-year terms, while\nthe Prime Minister, who holds most executive powers, is appointed by the\nPresident based on legislative election results.\n● Stability: Governments are often short-lived due to proportional\nrepresentation, which encourages coalition or minority governments.\n● Civil Liberties: Civil liberties are generally respected, though poverty and\ncorruption weaken some institutions and reduce judicial efficiency.\n● Judicial Independence: The judiciary is partially independent but susceptible\nto political influence and corruption. A three-year judicial modernization\nprogram was launched in 2020 to enhance judicial and prosecutorial\nindependence.\n●\n\nReference:https://freedomhouse.org/country/sao-tome-andprincipe/freedom-world/2021\n\n\fReference: https://stp.gov.st/membros_governo\n2.1.2. Trade (Political Context)\nSão Tomé and Príncipe has a weakly integrated trade system, as it is not yet\na member of the WTO. Although it applied for accession in 2005, the process\nremains stalled, limiting alignment with global trade standards and reducing\ninternational trade credibility.\nReference:https://www.wto.org/english/thewto_e/acc_e/a1_sao_tome_prin\ncipe_e.htm?utm_source=chatgpt.com\n● Trade is highly concentrated geographically, with exports mainly directed to\nEuropean countries (e.g., Netherlands, Belgium, Portugal, Germany, and\nSpain), while imports are dominated by Portugal and a few African and\ninternational partners (e.g., Togo, Angola, Japan, and Turkey).\nReference:https://wits.worldbank.org/CountryProfile/en/Country/STP/Year/\nLTST/TradeFlow/Import/Partner/all\n●\n\n\fTrade structure:\nThe country exhibits a significant trade imbalance, with imports (≈ $165 million in\n2024) far exceeding exports, which remain very limited and narrow in scope\n\nReference: https://statbase.org/data/stp-merchandise-imports-wto/ 2024\n●\n\nThe export base is undiversified, relying primarily on cocoa and low-value\nmaterials, while imports consist mainly of food, manufactured goods, and\nessential commodities indicating strong dependence on external markets.\n\n\fReference: https://tradingeconomics.com/sao-tome-and-principe/exports\n2025\n●\n\nTrade policies remain relatively flexible, with moderate tariff levels (~10%),\nbut the absence of WTO membership results in a lack of binding\ncommitments and weaker positioning in global trade negotiations.\n\nReference: https://ttd.wto.org/en/profiles/sao-tome-and-principe 2019\n●\n\nOverall trade volume is very small on a global scale, as reflected by minimal\ntrade relations with major economies (e.g., total trade with the United States\n≈ $1.6 million in 2024).\nReference:\n\nustr.gov/countries\n\n2025\n\n2.1.3. Tax Policies (Political / Fiscal Context)\n●\n\nSão Tomé and Príncipe operates a developing tax system with limited\nadministrative capacity and enforcement challenges.\nReference: https://www.imf.org/en/Countries/STP\n\n●\n\nSão Tomé and Príncipe operates a structured tax system under the Ministry of\nEconomy and Finance, with progressive personal income tax rates reaching up\nto 25% and social security contributions totaling 14% (8% employer and 6%\nemployee).\n\n●\n\nThe government introduced a Value Added Tax (VAT) at a standard rate of 10%\nto modernize the tax system and improve revenue collection in line with\ninternational recommendations.\n\n●\n\nThe fiscal framework also includes withholding taxes on dividends (10–15%),\ninterest (10%), royalties (10%), and technical service fees (15%), indicating a\nrelatively defined and organized tax structure.\n\n\f●\n\nThe tax system incorporates multiple regimes (general and simplified) and\nprovides incentives such as tax exemptions, reduced import duties, and\ndeductions to support investment and small businesses.\n\n●\n\nHowever, the effectiveness of tax policies is limited by weak administrative\ncapacity, tax evasion, and a large informal sector, resulting in low revenue\nefficiency and continued reliance on indirect taxation and external financial\nsupport.\nReference:\nhttps://www.globalexpansion.com/hubfs/Countrypedia%20PDFs/In%20use/S\nao%20Tome%20and%20Principe%20-%20Global%20Employer%20Guide.pdf\nhttps://www.britacom.org/zt/ThemeDay/Tenth/SEMINAR/202510/P0202510\n21566751498936.pdf\n\n2.1.4. General political issues\nSão Tomé and Príncipe faces several governance and institutional challenges despite\nmaintaining a generally democratic system. Key concerns include limited government\n\n\faccountability, as reflected in reported cases of police abuse and delayed or\nincomplete investigations into misconduct.\n●\n\nFreedom of expression is constitutionally guaranteed and generally respected;\nhowever, media independence is constrained by political influence, selfcensorship, and limited access to official information, particularly in stateowned media.\n\n●\n\nThe country experiences weak transparency and information accessibility,\nwith journalists reporting difficulties in obtaining official data and concerns\nover biased media coverage favoring the ruling coalition.\n\n●\n\nAlthough labor laws formally guarantee rights such as unionization and\ncollective bargaining, enforcement remains weak, with limited inspections,\nlack of penalties, and ineffective protection against labor violations.\n\n●\n\nA significant structural issue is the large informal sector (estimated at around\n68% of the workforce), which undermines regulatory effectiveness, tax\ncollection, and overall economic governance.\n\n●\n\nMore broadly, institutional capacity constraints, including limited human\nresources, weak enforcement mechanisms, and insufficient regulatory\noversight, continue to affect policy implementation and governance efficiency.\nReference: https://www.state.gov/reports/2024-country-reports-on-humanrights-practices/sao-tome-and-principe\n2024\n\n2.1.5. Change in Leadership\n●\n\nSão Tomé and Príncipe transitioned from a one-party state (1975–1991) to a\nmulti-party democracy with multiple peaceful power transfers.\n\n●\n\nKey recent changes: 2016 presidential election dispute; 2018 legislative\nelections led to coalition government formation; 2020 legislation prevented\ncitizens born abroad from running for president, targeting ADI party leader\nPatrice Trovoada.\n\n2.1.6. Regulations\n●\n\nElectoral Laws: Generally fair, though implementation suffers from limited\nresources and staff.\n\n●\n\nLegislative Actions: National Assembly enacts laws affecting elections and\ngovernance, such as restricting presidential candidacy for citizens born abroad\nand appointing election commissioners.\n\n●\n\nGovernment Transparency: Access to information is partially available; no\nspecific law guarantees full transparency.\n\n●\n\nJudiciary: Laws provide judicial independence, but political influence and\ncorruption remain concerns.\n\n\f2.1.7. Political Trends\n●\n\nMultiparty Competition: Free and vigorous competition among ADI, MLSTPPSD, PCD-UDD-MDFM, and other parties, despite occasional factional splits.\n\n●\n\nDemocratic Stability: Multiple peaceful democratic transitions demonstrate\nresilience, with real opportunities for opposition parties.\n\n●\n\nCivil Society: NGOs, including human rights and governance organizations,\noperate freely, though underfunded.\n\nChallenges: Corruption, weak institutions, societal discrimination against women and\nLGBT+ groups, and limited enforcement capacity for social and economic regulations.\nReference:\nworld/2023\n\nhttps://freedomhouse.org/country/sao-tome-and-principe/freedom-\n\n\f2.2 Economical", "references": [{"source": "freedomhouse.org", "url": "https://freedomhouse.org/country/sao-tome-andprincipe/freedom-world/2021Reference:https://stp.gov.st/membros_governo2.1.2.Trade"}, {"source": "wto.org", "url": "https://www.wto.org/english/thewto_e/acc_e/a1_sao_tome_principe_e.htm?utm_source=chatgpt.com"}, {"source": "wits.worldbank.org", "url": "https://wits.worldbank.org/CountryProfile/en/Country/STP/Year/LTST/TradeFlow/Import/Partner/all"}, {"source": "statbase.org", "url": "https://statbase.org/data/stp-merchandise-imports-wto/2024"}, {"source": "tradingeconomics.com", "url": "https://tradingeconomics.com/sao-tome-and-principe/exports2025"}, {"source": "ttd.wto.org", "url": "https://ttd.wto.org/en/profiles/sao-tome-and-principe2019"}, {"source": "imf.org", "url": "https://www.imf.org/en/Countries/STP"}, {"source": "globalexpansion.com", "url": "https://www.globalexpansion.com/hubfs/Countrypedia%20PDFs/In%20use/Sao%20Tome%20and%20Principe%20-%20Global%20Employer%20Guide.pdfhttps://www.britacom.org/zt/ThemeDay/Tenth/SEMINAR/202510/P020251021566751498936.pdf2.1.4.GeneralpoliticalissuesSãoToméandPríncipefacesseveralgovernanceandinstitutionalchallengesdespitemaintainingagenerallydemocraticsystem.Keyconcernsincludelimitedgovernmentaccountability,asreflectedinreportedcasesofpoliceabuseanddelayedorincompleteinvestigationsintomisconduct"}, {"source": "state.gov", "url": "https://www.state.gov/reports/2024-country-reports-on-humanrights-practices/sao-tome-and-principe20242.1.5.ChangeinLeadership"}, {"source": "freedomhouse.org", "url": "https://freedomhouse.org/country/sao-tome-and-principe/freedom-2.2Economical"}], "contentBlocks": [{"type": "text", "html": "<h3 class=\"content-h\">2.1 Political</h3>\n<p>2.1.1. Government Type: Presidential-parliamentary democracy with a multi-party system. The President is directly elected for up to two consecutive five-year terms, while the Prime Minister, who holds most executive powers, is appointed by the President based on legislative election results.</p>\n<ul class=\"bullets\">\n<li>● Stability: Governments are often short-lived due to proportional</li>\n<p>representation, which encourages coalition or minority governments g exports, which remain very limited and narrow in scope</p>\n<p>Reference: <a href=\"https://statbase.org/data/stp-merchandise-imports-wto/2024\" target=\"_blank\" rel=\"noopener\">https://statbase.org/data/stp-merchandise-imports-wto/2024</a> ●</p>\n<p>The export base is undiversified, relying primarily on cocoa and low-value materials, while imports consist mainly of food, manufactured goods, and essential commodities indicating strong dependence on external markets.</p>\n<p>Reference: <a href=\"https://tradingeconomics.com/sao-tome-and-principe/exports2025\" target=\"_blank\" rel=\"noopener\">https://tradingeconomics.com/sao-tome-and-principe/exports2025</a> ●</p>\n<p>Trade policies remain relatively flexible, with moderate tariff levels (~10%), but the absence of WTO membership results in a lack of binding commitments and weaker positioning in global trade negotiations.</p>\n<p>Reference: <a href=\"https://ttd.wto.org/en/profiles/sao-tome-and-principe2019\" target=\"_blank\" rel=\"noopener\">https://ttd.wto.org/en/profiles/sao-tome-and-principe2019</a> ●</p>\n<p>Overall trade volume is very small on a global scale, as reflected by minimal trade relations with major economies (e.g., total trade with the United States ≈ $1.6 million in 2024). Reference:</p>\n<p>ustr.gov/countries</p>\n<p>2025</p>\n<p>2.1.3. Tax Policies (Political / Fiscal Context) ●</p>\n<p>São Tomé and Príncipe operates a developing tax system with limited administrative capacity and enforcement challenges. Reference: <a href=\"https://www.imf.org/en/Countries/STP\" target=\"_blank\" rel=\"noopener\">https://www.imf.org/en/Countries/STP</a></p>\n<p>●</p>\n<p>São Tomé and Príncipe operates a structured tax system under the Ministry of Economy and Finance, with progressive personal income tax rates reaching up to 25% and social security contributions totaling 14% (8% employer and 6% employee).</p>\n<p>●</p>\n<p>The government introduced a Value Added Tax (VAT) at a standard rate of 10% to modernize the tax system and improve revenue collection in line with international recommendations.</p>\n<p>●</p>\n<p>The fiscal framework also includes withholding taxes on dividends (10–15%), interest (10%), royalties (10%), and technical service fees (15%), indicating a relatively defined and organized tax structure.</p>\n<p>●</p>\n<p>The tax system incorporates multiple regimes (general and simplified) and provides incentives such as tax exemptions, reduced import duties, and deductions to support investment and small businesses.</p>\n<p>●</p>\n<p>However, the effectiveness of tax policies is limited by weak administrative capacity, tax evasion, and a large informal sector, resulting in low revenue efficiency and continued reliance on indirect taxation and external financial support. Reference: <a href=\"https://www.globalexpansion.com/hubfs/Countrypedia%20PDFs/In%20use/Sao%20Tome%20and%20Principe%20-%20Global%20Employer%20Guide.pdfhttps://www.britacom.org/zt/ThemeDay/Tenth/SEMINAR/202510/P020251021566751498936.pdf2.1.4.GeneralpoliticalissuesSãoToméandPríncipefacesseveralgovernanceandinstitutionalchallengesdespitemaintainingagenerallydemocraticsystem.Keyconcernsincludelimitedgovernmentaccountability,asreflectedinreportedcasesofpoliceabuseanddelayedorincompleteinvestigationsintomisconduct\" target=\"_blank\" rel=\"noopener\">https://www.globalexpansion.com/hubfs/Countrypedia%20PDFs/In%20use/Sao%20Tome%20and%20Principe%20-%20Global%20Employer%20Guide.pdfhttps://www.britacom.org/zt/ThemeDay/Tenth/SEMINAR/202510/P020251021566751498936.pdf2.1.4.GeneralpoliticalissuesSãoToméandPríncipefacesseveralgovernanceandinstitutionalchallengesdespitemaintainingagenerallydemocraticsystem.Keyconcernsincludelimitedgovernmentaccountability,asreflectedinreportedcasesofpoliceabuseanddelayedorincompleteinvestigationsintomisconduct</a> ●</p>\n<p>Freedom of expression is constitutionally guaranteed and generally respected; however, media independence is constrained by political influence, selfcensorship, and limited access to official information, particularly in stateowned media.</p>\n<p>●</p>\n<p>The country experiences weak transparency and information accessibility, with journalists reporting difficulties in obtaining official data and concerns over biased media coverage favoring the ruling coalition.</p>\n<p>●</p>\n<p>Although labor laws formally guarantee rights such as unionization and collective bargaining, enforcement remains weak, with limited inspections, lack of penalties, and ineffective protection against labor violations.</p>\n<p>●</p>\n<p>A significant structural issue is the large informal sector (estimated at around 68% of the workforce), which undermines regulatory effectiveness, tax collection, and overall economic governance.</p>\n<p>●</p>\n<p>More broadly, institutional capacity constraints, including limited human resources, weak enforcement mechanisms, and insufficient regulatory oversight, continue to affect policy implementation and governance efficiency. Reference: <a href=\"https://www.state.gov/reports/2024-country-reports-on-humanrights-practices/sao-tome-and-principe20242.1.5.ChangeinLeadership\" target=\"_blank\" rel=\"noopener\">https://www.state.gov/reports/2024-country-reports-on-humanrights-practices/sao-tome-and-principe20242.1.5.ChangeinLeadership</a> ●</p>\n<p>São Tomé and Príncipe transitioned from a one-party state (1975–1991) to a multi-party democracy with multiple peaceful power transfers.</p>\n<p>●</p>\n<p>Key recent changes: 2016 presidential election dispute; 2018 legislative elections led to coalition government formation; 2020 legislation prevented citizens born abroad from running for president, targeting ADI party leader Patrice Trovoada.</p>\n<p>2.1.6. Regulations ●</p>\n<p>Electoral Laws: Generally fair, though implementation suffers from limited resources and staff.</p>\n<p>●</p>\n<p>Legislative Actions: National Assembly enacts laws affecting elections and governance, such as restricting presidential candidacy for citizens born abroad and appointing election commissioners.</p>\n<p>●</p>\n<p>Government Transparency: Access to information is partially available; no specific law guarantees full transparency.</p>\n<p>●</p>\n<p>Judiciary: Laws provide judicial independence, but political influence and corruption remain concerns.</p>\n<p>2.1.7. Political Trends ●</p>\n<p>Multiparty Competition: Free and vigorous competition among ADI, MLSTPPSD, PCD-UDD-MDFM, and other parties, despite occasional factional splits.</p>\n<p>●</p>\n<p>Democratic Stability: Multiple peaceful democratic transitions demonstrate resilience, with real opportunities for opposition parties.</p>\n<p>●</p>\n<p>Civil Society: NGOs, including human rights and governance organizations, operate freely, though underfunded.</p>\n<p>Challenges: Corruption, weak institutions, societal discrimination against women and LGBT+ groups, and limited enforcement capacity for social and economic regulations. Reference: world/2023</p>\n<p><a href=\"https://freedomhouse.org/country/sao-tome-and-principe/freedom-\" target=\"_blank\" rel=\"noopener\">https://freedomhouse.org/country/sao-tome-and-principe/freedom-</a></p>"}, {"type": "text", "html": "<h3 class=\"content-h\">2.2 Economical</h3>"}], "tables": []}, {"num": "2.2", "title": "Economical", "content": "2.2.1 Inflation\nSão Tomé and Príncipe experiences relatively high but declining inflation, reaching\napproximately 9.5% in January 2026, down from 10.3% in December 2025, marking\nthe lowest level since early 2022.\n●\n\nDespite recent improvements, inflation remains elevated compared to global\naverages, reflecting ongoing cost-of-living pressures.\n\n●\n\nHistorically, inflation has been high and volatile, averaging around 14.5% since\n1997, with extreme fluctuations ranging from a peak of 86.8% to lows near\n3.5%, indicating structural instability in price levels.\n\n●\n\nIn Sao Tome and Principe, the main components of the Consumer Price Index\nare: Food & Non-alcoholic Beverages (73% of the total weight), Housing &\nUtilities (6%) and Transport (4%). Household Contents, Equipment &\nMaintenance accounts for 4%, Alcoholic Beverages & Tobacco for 4%, and\nClothing & Footwear for 3%. Others include: Communications (2%),\nRestaurants & Hotels (2%), Miscellaneous Goods & Services (2%), Recreation\n&\nCulture\n(1%),\nEducation\n(0.44%),\nand\nHealth\n(0.41%).\nOverall, while inflation is showing signs of stabilization, it continues to pose a\n\nkey economic challenge affecting purchasing power and economic stability.\nReference: https://tradingeconomics.com/sao-tome-and-principe/inflation-cpi 2026\n\n\f2.2.2. Interest rate\nThe benchmark interest rate in São Tomé and Príncipe is approximately 10%,\nreflecting a relatively high cost of borrowing in the economy.\n● Historically, interest rates have remained elevated, averaging around 14.3%\nsince 1998, with significant volatility ranging from a peak of 29.5% to a low of\n9%, indicating periods of monetary instability.\n● The relatively high interest rate is primarily used as a tool to control inflation,\nwhich has been persistently high in the country.\n● However, elevated borrowing costs may limit private investment and\neconomic expansion, particularly in a small and developing economy.\n●\n\nReference: https://tradingeconomics.com/sao-tome-and-principe/interestrate\n2.2.3. Exchange rate\n●\n●\n●\n●\n\n●\n\nThe São Tomé and Príncipe dobra (STN) is relatively weak, with an exchange\nrate of approximately 21.4 STN per USD (March 2026).\nIn the short term, the currency has shown slight depreciation (around 2.3%\nover the past month), indicating ongoing pressure on the local currency.\nHowever, over the past year, the dobra has appreciated by approximately\n6.5%, suggesting a degree of medium-term stabilization.\nThe exchange rate is supported by a currency peg to the euro, which helps\nmaintain stability and control inflation but increases dependence on external\nreserves and limits monetary policy flexibility.\nOverall, while the exchange rate shows relative stability, it remains\nvulnerable to external shocks and foreign exchange constraints.\n\n\fReference:\n2026\n\nhttps://tradingeconomics.com/sao-tome-and-principe/currency\n\n2.2.4. Economic Growth\n●\n\nSão Tomé and Príncipe recorded modest economic growth of approximately\n1.7% in 2024, reflecting a slight recovery from 0.5% in 2023, but remaining\nbelow its historical average of around 4.1%.\n\n●\n\nThe economy is very small, with a GDP of approximatley $0.76 billion and low\nincome levels (GDP per capita ≈ $1,365), highlighting its developing status.\n\n●\n\nEconomic activity is largely concentrated in agriculture (especially cocoa) and\ntourism, with declining cocoa production due to droughts and\nmismanagement affecting overall growth performance.\n\n●\n\nThe country is increasingly dependent on foreign aid and highly vulnerable to\nexternal shocks, particularly fluctuations in global food and fuel prices.\n\n●\n\nPolitical instability remains a potential risk that could negatively impact\neconomic growth and foreign direct investment.\n\n●\n\nHowever, the discovery of oil reserves in the Gulf of Guinea presents a\npotential long-term opportunity to boost economic growth, if successfully\ndeveloped.\n\n\fReference:\nannual\n\nhttps://tradingeconomics.com/sao-tome-and-principe/gdp-growth-\n\n2.2.5. Unemployment rate\n●\n\nUnemployment in São Tomé and Príncipe remains relatively stable, averaging\naround 9–10% between 2020 and 2025, with only slight fluctuations over\ntime.\n\n●\n\nWhile there was a modest decline from approximately 9.7% in 2020 to around\n9.0% in 2022, unemployment levels have since remained largely unchanged,\nindicating limited job creation.\n\n●\n\nA key structural challenge is the large informal sector (estimated at around\n68% of the workforce), which distorts official unemployment figures and\nreflects widespread underemployment and job insecurity.\n\n●\n\nAs a result, the labor market is characterized by low productivity, weak job\nquality, and limited formal employment opportunities, despite relatively\nstable\nunemployment\nrates.\n\n\fReference:\nhttps://data.worldbank.org/indicator/SL.UEM.TOTL.ZS?end=2025&locations=ST&sta\nrt=2020&view=chart 2025", "references": [{"source": "tradingeconomics.com", "url": "https://tradingeconomics.com/sao-tome-and-principe/inflation-cpi20262.2.2.InterestrateThebenchmarkinterestrateinSãoToméandPríncipeisapproximately10%,reflectingarelativelyhighcostofborrowingintheeconomy"}, {"source": "tradingeconomics.com", "url": "https://tradingeconomics.com/sao-tome-and-principe/interestrate2.2.3.Exchangerate"}, {"source": "tradingeconomics.com", "url": "https://tradingeconomics.com/sao-tome-and-principe/currency2.2.4.EconomicGrowth"}, {"source": "tradingeconomics.com", "url": "https://tradingeconomics.com/sao-tome-and-principe/gdp-growth-2.2.5.Unemploymentrate"}, {"source": "data.worldbank.org", "url": "https://data.worldbank.org/indicator/SL.UEM.TOTL.ZS?end=2025&locations=ST&start=2020&view=chart2025"}], "contentBlocks": [{"type": "text", "html": "<h3 class=\"content-h\">2.2.1 Inflation</h3>\n<p>São Tomé and Príncipe experiences relatively high but declining inflation, reaching approximately 9.5% in January 2026, down from 10.3% in December 2025, marking the lowest level since early 2022. ●</p>\n<p>Despite recent improvements, inflation remains elevated compared to global averages, reflecting ongoing cost-of-living pressures.</p>\n<p>●</p>\n<p>Historically, inflation has been high and volatile, averaging around 14.5% since 1997, with extreme fluctuations ranging from a peak of 86.8% to lows near 3.5%, indicating structural instability in price levels.</p>\n<p>●</p>\n<p>In Sao Tome and Principe, the main components of the Consumer Price Index are: Food & Non-alcoholic Beverages (73% of the total weight), Housing & Utilities (6%) and Transport (4%). Household Contents, Equipment & Maintenance accounts for 4%, Alcoholic Beverages & Tobacco for 4%, and Clothing & Footwear for 3%. Others include: Communications (2%), Restaurants & Hotels (2%), Miscellaneous Goods & Services (2%), Recreation & Culture (1%), Education (0.44%), and Health (0.41%). Overall, while inflation is showing signs of stabilization, it continues to pose a</p>\n<p>key economic challenge affecting purchasing power and economic stability. Reference: <a href=\"https://tradingeconomics.com/sao-tome-and-principe/inflation-cpi20262.2.2.InterestrateThebenchmarkinterestrateinSãoToméandPríncipeisapproximately10%,reflectingarelativelyhighcostofborrowingintheeconomy\" target=\"_blank\" rel=\"noopener\">https://tradingeconomics.com/sao-tome-and-principe/inflation-cpi20262.2.2.InterestrateThebenchmarkinterestrateinSãoToméandPríncipeisapproximately10%,reflectingarelativelyhighcostofborrowingintheeconomy</a></p>\n<ul class=\"bullets\">\n<li>● Historically, interest rates have remained elevated, averaging around 14.3%</li>\n<p>since 1998, with significant volatility ranging from a peak of 29.5% to a low of 9%, indicating periods of monetary instability.</p>\n<li>● The relatively high interest rate is primarily used as a tool to control inflation,</li>\n<p>which has been persistently high in the country.</p>\n<li>● However, elevated borrowing costs may limit private investment and</li>\n<p>economic expansion, particularly in a small and developing economy. ●</p>\n</ul>\n<p>Reference: <a href=\"https://tradingeconomics.com/sao-tome-and-principe/interestrate2.2.3.Exchangerate\" target=\"_blank\" rel=\"noopener\">https://tradingeconomics.com/sao-tome-and-principe/interestrate2.2.3.Exchangerate</a> ● ● ● ●</p>\n<p>●</p>\n<p>The São Tomé and Príncipe dobra (STN) is relatively weak, with an exchange rate of approximately 21.4 STN per USD (March 2026). In the short term, the currency has shown slight depreciation (around 2.3% over the past month), indicating ongoing pressure on the local currency. However, over the past year, the dobra has appreciated by approximately 6.5%, suggesting a degree of medium-term stabilization. The exchange rate is supported by a currency peg to the euro, which helps maintain stability and control inflation but increases dependence on external reserves and limits monetary policy flexibility. Overall, while the exchange rate shows relative stability, it remains vulnerable to external shocks and foreign exchange constraints.</p>\n<p>Reference: 2026</p>\n<p><a href=\"https://tradingeconomics.com/sao-tome-and-principe/currency2.2.4.EconomicGrowth\" target=\"_blank\" rel=\"noopener\">https://tradingeconomics.com/sao-tome-and-principe/currency2.2.4.EconomicGrowth</a> ●</p>\n<p>São Tomé and Príncipe recorded modest economic growth of approximately 1.7% in 2024, reflecting a slight recovery from 0.5% in 2023, but remaining below its historical average of around 4.1%.</p>\n<p>●</p>\n<p>The economy is very small, with a GDP of approximatley $0.76 billion and low income levels (GDP per capita ≈ $1,365), highlighting its developing status.</p>\n<p>●</p>\n<p>Economic activity is largely concentrated in agriculture (especially cocoa) and tourism, with declining cocoa production due to droughts and mismanagement affecting overall growth performance.</p>\n<p>●</p>\n<p>The country is increasingly dependent on foreign aid and highly vulnerable to external shocks, particularly fluctuations in global food and fuel prices.</p>\n<p>●</p>\n<p>Political instability remains a potential risk that could negatively impact economic growth and foreign direct investment.</p>\n<p>●</p>\n<p>However, the discovery of oil reserves in the Gulf of Guinea presents a potential long-term opportunity to boost economic growth, if successfully developed.</p>\n<p>Reference: annual</p>\n<p><a href=\"https://tradingeconomics.com/sao-tome-and-principe/gdp-growth-2.2.5.Unemploymentrate\" target=\"_blank\" rel=\"noopener\">https://tradingeconomics.com/sao-tome-and-principe/gdp-growth-2.2.5.Unemploymentrate</a> ●</p>\n<p>Unemployment in São Tomé and Príncipe remains relatively stable, averaging around 9–10% between 2020 and 2025, with only slight fluctuations over time.</p>\n<p>●</p>\n<p>While there was a modest decline from approximately 9.7% in 2020 to around 9.0% in 2022, unemployment levels have since remained largely unchanged, indicating limited job creation.</p>\n<p>●</p>\n<p>A key structural challenge is the large informal sector (estimated at around 68% of the workforce), which distorts official unemployment figures and reflects widespread underemployment and job insecurity.</p>\n<p>●</p>\n<p>As a result, the labor market is characterized by low productivity, weak job quality, and limited formal employment opportunities, despite relatively stable unemployment rates.</p>\n<p>Reference: <a href=\"https://data.worldbank.org/indicator/SL.UEM.TOTL.ZS?end=2025&amp;locations=ST&amp;start=2020&amp;view=chart2025\" target=\"_blank\" rel=\"noopener\">https://data.worldbank.org/indicator/SL.UEM.TOTL.ZS?end=2025&amp;locations=ST&amp;start=2020&amp;view=chart2025</a></p>"}], "tables": []}, {"num": "2.3", "title": "Social", "content": "2.3 Social\n2.3.1 Demographics\n● Capital: São Tomé\n● Total Population: 247,000\n● Coastline: 209 km around a land area of 1,001 km2\nReference: https://www.wacaprogram.org/country/sao-tome-and-principe\nPopulation of Sao Tome and Principe. 2026 demographics: density, ratios, growth rate,\nclock, rate of men to women.\n2.3.2 General country information\n●\n●\n●\n●\n●\n●\n\nFull name of country: Democratic Republic of São Tomé and Principe\nRegion: Africa\nOfficial language: Portuguese\nNationality: Sao Tomean(s) (noun), Sao Tomean (adjective)\nLand area: 964 sq km (372 sq miles)\nNational anthem: \"Independencia total\" (Total Independence), by Alda Neves\nDa Graca Do Espirito Santo/Manuel Dos Santos Barreto De Sousa E Almeida\n● National holiday: Independence Day, July 12 (1975)\n● Time zone: UTC +0\n\n\f● Flag: The flag of the Democratic Republic of São Tomé and Príncipe consists\nof a horizontal triband (green-yellow-green) design with a scarlet isosceles\ntriangle based on the hoist (left) side. The central yellow band is one and a\nhalf times wider than the other two green bands. In the center stripe are two\nfive-pointed black stars, which represent the two islands. Symbolically, the\ncolor red stands for the country’s struggle for freedom and independence.\nThe other colors—black, yellow, and green—are pan-African colors.\n● Motto: “Unidade, Disciplina, Trabalho” (Unity, Discipline, Work)\n● Independence: July 12, 1975 (from Portugal)\n● Government type: semi-presidential republic\n● Suffrage: 18 years of age; universal\nReference: https://www.ebsco.com/research-starters/social-sciences-andhumanities/sao-tome-and-principe\n2.3.2.1 People\n● Nationality: Noun and adjective--Sao Tomean(s).\n● Population (2026 est.): 247,000\n● Annual growth rate (2026 est.): 2.0-2.1%.\n● Ethnic groups: Mixed African, Portuguese-African.\n● Religions: Christian (Roman Catholic, Evangelical Protestant, Seventh-day\nAdventist) 80%.\n● Language: Portuguese (official).\n● Education: Literacy (census 2001)--68.1%. Years compulsory--to secondary\nlevel.\n● Health: Life expectancy (2008 est.)--68 yrs. Infant mortality rate (2008 est.)-38.36/1,000.\n● Work force (by household, 2000 UN Development Program est.):\nAgriculture--15.3%; industry, commerce, services--36.5%; government-11.5%.\nReference: https://20092017.state.gov/outofdate/bgn/saotomeandprincipe/106168.htm\n2.3.2.2 Demographics and population\n● Population growth:\nSão Tomé and Príncipe's population is growing steadily at about 2.0-2.1%\nannually, reaching around 247,000 in 2026 from 242,000 in 2025.\nGrowth Drivers\n● High fertility rates (around 3.95 children per woman) and a youthful\ndemographic fuel natural increase of about 5,000 people yearly, outpacing\nnet migration losses of roughly 900.\n● This continues a decades-long trend from 2.0% in the 1990s to peaks near\n2.7% in the 1970s, with density rising to 258 people per km².\n\n\f2.3.2.3 Future Projections\n● Projections show sustained growth to 268,000 by 2030 and 380,000 by 2050\nat 1.6-2.0%, shifting toward an aging profile with median age climbing from\n24.0 to 28.4 years.\nUrbanization accelerates, hitting 70% by 2030, pressuring infrastructure amid\nVision 2030 goals for sustainable development.\nReference: ENDS-2026-2040-Executive-Summary.pdf\n2.3.2.4 Age distribution:\n● São Tomé and Príncipe has a youthful population with a median age around\n20.3-20.5 years, reflecting a classic expansive pyramid typical of developing\nisland nations.\n2.3.2.5 Broad Age Groups\nThe population splits into three main categories based on recent 2025-2026\nestimates for roughly 236,000-240,000 people.\n●\n\n0-14 years (youth): 37.8-42.4% (about 90,000-100,000 people), with the\nlargest shares in 0-4 (13.2%), 5-9 (12.2%), and 10-14 (12.1%) groups.\n\n●\n\n15-64 years (working age): 58.3-68.4%, peaking in younger adults like 15-19\n(11.5%) and declining gradually to 1-2% per group in 50s-60s.\n\n●\n\n65+ years (elderly): 3.9-7.4%, with low concentrations (under 1% per 5-year\nband) and a slight female skew.\n\nReference: Sao Tome and Principe Population Pyramid 2025 - Demographics & Birth\nStatistics | 15 Daily Births | Population Pyramids\n2.3.2.6 Dependency Insights\n● A high young-age dependency ratio (64.9%) underscores needs for education\nand youth jobs, while old-age dependency remains low at 6.7%. This\nstructure supports Vision 2030 goals like human capital investment.\nReference: Sao Tome demographics data 1960-2026: Median Age Growth\nPopulation of Sao Tome and Principe. 2026 demographics: density, ratios, growth\nrate, clock, rate of men to women.\nSao Tome and Principe Population Pyramid 2025 - Demographics & Birth Statistics |\n15 Daily Births | Population Pyramids\n2.3.3 culture lifestyle attitudes\n● São Tomé and Príncipe residents embrace a relaxed \"Leve Leve\" lifestyle,\nemphasizing simplicity, community harmony, and resilience shaped by their\nisland paradise and Luso-African heritage.\n\n\f2.3.3.1 Core Values\n● People prioritize elder respect, social unity, and strength in adversity, rooted\nin colonial and slavery histories that fostered mutual support.\nPeaceful coexistence prevails in a mestizo society blending Portuguese,\nAfrican, and creole influences, with Christianity dominant but coexisting with\ntraditional practices.\nReference: São Tomé and Príncipe Heritage: Museums, Landmarks & Culture\nLeve Leve Lifestyle in São Tomé: Culture, Gastronomy & Traditions\nSão Tomé and Príncipe Values | NationValues\nSão Tomé and Príncipe - Freedom of Thought Report\n2.3.3.2 Daily Attitudes\n● A laid-back approach—\"go slowly\"—defines routines, with strong family\nbonds, communal living in rural areas, and growing gender equality in\nmodern sectors.\n● Lifestyle revolves around fresh seafood, tropical fruits, music/dance like\ntchiloli, and festivals celebrating independence or saints, reflecting optimism\nand cultural pride\nReference: Cultural Experiences on São Tomé and Príncipe | Principe Collection\nThe Culture Of Sao Tome And Principe\n2.3.4 Educational levels\n● Educational Outcomes and Human Capital\n● In 2024, São Tomé and Príncipe, like many other African countries, is facing a\nlearning crisis. In sub-Saharan Africa, learning poverty, defined as the share of\nchildren unable to read and understand an age-appropriate text by age 10, is\nestimated at 89 percent by the World Bank,\nReference: https://www.iicba.unesco.org/en/sao-tome-and-principe\n● In 2023, São Tomé and Príncipe has made strides in education, with primary\nenrollment near 98% and adult literacy at 93%, but challenges persist in\ncompletion rates and quality.\n2.3.4.1 Literacy and Access\n● Adult literacy rose from 74.9% a decade ago to 93% by 2023, driven by the\nQuality Education for All Project since 2014, which boosted teacher training\nand infrastructure.\n● Youth (15-24) literacy nears universality, though 2% have no formal\neducation and 36% incomplete primary, per older EPDC data.\n2.3.4.2 Enrollment Breakdown\n● Primary completion stands at 87%, with 96% net enrollment, but secondary\ntransition dips below 60% and completion lower, especially in rural areas.\n\n\f● The 6-3-3 system sees high primary access but dropouts due to poverty;\nhigher education remains limited, aligning with Vision 2030 human capital\ngoals.\nSao Tomeans segment their education into pre-primary, primary, secondary and\ntertiary levels, and while education is legally mandated for children between 6\nand 14 years old, many children, particularly young girls, face challenges in\nattending school. Often, people encourage them to stay home and learn the\ntraditional role of women rather than skills to join the workforce.\nReference: ENDS-2026-2040-Executive-Summary.pdf\nEPDC_NEP_2018_SaoTomeandPrincipe.pdf\nImproving Education in Sao Tome and Principe - The Borgen Project\nAddressing Comprehensive Educational Challenges in São Tomé and Príncipe –\nBroken Chalk\nhttps://borgenproject.org/womens-rights-in-sao-tome-and-principe/\n2.3.5-Buying habits\n● São Tomé and Príncipe residents prioritize essential goods amid economic\npressures, with household consumption dominating at 81.4% of GDP and\nheavy reliance on imported food, fuel, and staples.\nSpending Priorities\n● High inflation (peaking above 20% recently) squeezes purchasing power,\ndriving focus on necessities like rice, fish, vegetables, and price-controlled\nbasics, with government exemptions aiding affordability.\n● Limited disposable income (GDP per capita ~$2,400) favors informal markets,\nlocal produce, and subsistence in rural areas, while urban households\nallocate more to utilities and remittances. Consumption Patterns\n● Imports dwarf exports (35% vs. 3.6% of GDP), reflecting import-dependent\nhabits for consumer goods, with low savings and debt distress curbing luxury\nor durable purchases.\n● Emerging tourism boosts demand for services, but inequality (Gini 40.7)\nmeans poorer 44.6% live near poverty lines, emphasizing value-for-money\nand community sharing.\n\nReference: Spotlighting The World Factbook as We Bid a Fond Farewell - CIA\nCDP-PL-2025-STP.pdf\nSão Tomé and Príncipe - STP\n\n\f2.3.6-Religion\n\nReference: https://www.worldatlas.com/articles/religion-in-sao-tome-andprincipe.html\n2.3.7-Leaders and Cabinet Members\n● Type: Republic.\n● Independence: July 12, 1975 (from Portugal).\n● Constitution: November 5, 1975; revised September 1990, following a\nnational referendum, -revised again January 2003.\n● Branches: Executive--president and prime minister. Legislative--National Assembly. Judicial--Supreme Court.\n● Administrative subdivisions: Seven counties, six on Sao Tome and one on\nPrincipe.\n● Political parties: Movement for the Liberation of Sao Tome and Principe\n(MLSTP), Party of -Democratic Convergence (PCD), Independent Democratic\nAction (ADI), Democratic Movement Force of Change (MDFM), Christian\nDemocratic Front-Socialist Union Party (FDC-PSU), Santomean Workers Party\n(PTS); Popular Party of Progress (PPP), and National Union for Democracy and\nProgress (UNDP).\n● Suffrage: Universal adult.\nReference: https://20092017.state.gov/outofdate/bgn/saotomeandprincipe/106168.htm\nGovernment\nLast Updated: 2/9/2026\n●\n●\n●\n\nPresident: Carlos Manuel VILA NOVA\nPrime Minster: Americo RAMOS\nMin. of Agriculture, Fisheries, & Rural Development: Nilton Garrido de\nSousa PONTES\n\n\f●\n●\n●\n●\n●\n●\n\n●\n●\n●\n●\n●\n\nMin. of Defense & Home Affairs: Horacio Castro da Trindade DE SOUSA, Brig.\nGen.\nMin. of Economy & Finance: Gareth Haddad do Espirito Santo\nGUADALUPE, Dr.\nMin. of Education, Culture, Science, & Higher Education: Isabel Maria\nCorreia Viegas DE ABREU, Dr.\nMin. of Environment, Youth, & Sustainable Tourism: Nilda Borges DA\nMATA, Dr.\nMin. for Foreign Affairs, Cooperation, & Communities: Ilza Maria dos Santos\nAmado VAZ, Dr.\nMin. of Health: Celso Vaz do Nascimento MATOS, Dr.\nMin. of Infrastructure & Natural Resources: Nelson Mario de Carvalho Rosa\nCARDOSO\nMin. of Justice, Parliamentary Affairs, & Women's Rights: Vera Maria\nAssuncao Gomes CRAVID, Dr.\nMin. of Labor, Solidarity, & Social Security: Joucerli Tiny dos RAMOS, Dr.\nGovernor, Bank of Sao Tome & Principe: Americo BARROS\nAttorney General: Carlos STOCK\n\nReference: https://www.cia.gov/resources/world-leaders/foreign-governments/saotome-and-principe/\n2.3.8-Saõ Tóme and Príncipe Holidays and Festivals\n●\n\nInternational Workers’ Day, or Labor Day as it is locally known, takes place on\nMay 1 every year\n\n●\n\nOn July 12, São Tomé e Príncipe celebrates the attainment of full sovereignty\nfrom the colonial rule of the Portuguese. This public holiday is filled with\ndisplays of tradition and culture in many different cities.\n\n●\n\nEvery year on November 26, São Tomé celebrates the national holiday of\nArgel Accord Day. Prior to the nation being granted independence, the Argel\nAccords\n\n●\n\nSão Tomé has a large Christian population, accounting for about 80 percent\nof people in the country. Understandably then, Christian religious holidays\nlike Christmas Day on December 25 are a big deal. Christmas marks the birth\nof the Christian messiah Jesus. The day is celebrated by going to mass and the\nenjoyment of feasts with friends and family. The day has taken on a cultural\naspect as well as it is considered a non-working day and most people in the\ncountry, religious or not, partake in the festivities.\n\n●\n\nIn São Tomé and Príncipe, the weekend days are Saturday and Sunday and\nthe Workweek is from Monday to Friday\n\n●\n\nGlobally, some progress on women’s rights has been achieved. In Sao Tome\nand Principe, the adolescent birth rate is 0.4 per 1,000 women aged 15–19 as\nof 2018, down from 93.47 per 1,000 in 2017. In 2019, 57.7% of women of\n\n\freproductive age (15-49 years) had their need for family planning satisfied\nwith modern methods.\nReference: https://www.iexplore.com/articles/travel-guides/africa/sao-tome-andprincipe/festivals-and-events\nhttps://data.unwomen.org/country/sao-tome-and-principe\n\n2.3.9. Health and Healthcare System\n2.3.9.1 What is healthcare in Sao Tome and Principe like?\nHealth consciousness:\n● São Tomé and Príncipe shows mixed health consciousness, with rising\nawareness of some risks but persistent unhealthy behaviors amid NCD\nprogram efforts.\nKey Trends (2008-2019)\n● Overweight/obesity climbed to 51%, especially among women (58.1%),\nsignaling low focus on diet control despite better fruit/vegetable intake\n(down to 53.3%).\n● Physical inactivity doubled to 30.9%, with women more affected, while\ntobacco use (8.8%) and hypertension (33.5%) stayed stable.\n● Positive shifts include reduced frequent alcohol (24.8%) and diabetes (1.2%),\nmore among men, tied to partial NCD integration in primary care.\nAwareness Factors\n● Higher education links to less alcohol and poor diets but more obesity,\nsuggesting nutrition knowledge gaps in urban/educated groups.\n● Limited campaigns on activity, tobacco, and diet hinder progress, per WHO\nreports, despite STEPS surveys boosting data-driven interventions.\nWhat about the medical facilities?\n● Medical facilities in São Tomé and Príncipe are extremely limited. There is\none hospital in the country on the island of São Tomé, Hospital Central Ayres\nde Menezes, phone number 239 2-221-222. A few clinics also exist, but the\nservice provided is very basic. For all but minor medical needs, it is necessary\nto travel to Libreville (Gabon), Lisbon (Portugal), or elsewhere. You should\ncarry an ample supply of properly labeled prescription drugs and other\nmedications with you; an adequate supply of prescription or over-thecounter drugs in local stores or pharmacies is generally not available.\n● Tap water may not be potable and you should drink and cook with bottled\nwater only. Schistosomiasis, also known as bilharzia, is endemic to São Tomé\nand Príncipe. Schistosomiasisis a parasite that can penetrate intact skin of\nthose swimming or bathing in fresh water from lakes, rivers and streams. It is\n\n\frecommended to avoid contact with untreated fresh water to prevent\nschistosomiasis infection.\nReference:\nhttps://www.countryreports.org/country/SaoTomeandPrincipe/health.htm\nFrontiers | Trends in bio-behavioural risk factors of non-communicable diseases\namong adults in Sao Tome and Principe\n2.3.9.2 The Four Most Common Diseases in Sao Tome and Principe:\n1. Tuberculosis (TB) is a bacterial disease easily communicable in the first few\nweeks of visible symptoms.\n2. Malaria, spread through mosquitoes, is an endemic for most impoverished\nAfrican countries, including Sao Tome Principe.\n3. Cholera is actively transmitted in many impoverished countries, including Sao\nTome and Principe.\n4. Necrotizing cellulitis is a rare disease, but an outbreak earlier this year has\nleft Sao Tome and Principe vulnerable.\nNote: More than 1,300 cases of necrotizing cellulitis, a severe skin infection known\nfor intense pain and swollen tissues, have been reported since September 2016. To\ndate, every health district in the country has reported cases, and the country’s\n190,000 inhabitants are at risk. Cases have been increasing but no deaths directly\nlinked to the disease have been recorded.\n2.3.9.3 Healthcare Infrastructure in São Tomé and Príncipe\n1.Hospital Central de São Tomé (São Tomé Central Hospital)\n●\n●\n●\n●\n●\n\nLocation: São Tomé, São Tomé and Príncipe\nSpecialties: General Surgery, Pediatrics, Obstetrics, Emergency Care\nAccreditations: National Health System Certified\nNumber of Beds: 200+\nNumber of Doctors: 80+\n\n2. Hospital Dr. Ayres de Menezes\n●\n●\n●\n●\n●\n\nLocation: São Tomé, São Tomé and Príncipe\nSpecialties: Cardiology, Internal Medicine, Dermatology, Ophthalmology\nAccreditations: ISO Certified\nNumber of Beds: 150\nNumber of Doctors: 60+\n\n3. Hospital de Caué\n●\n●\n●\n●\nLocation: Caué, São Tomé and Príncipe\nSpecialties: General Medicine, Surgery, Maternity Services, Pediatrics\nAccreditations: National Health System Certified\nNumber of Beds: 100+\n\n\f●\n\nNumber of Doctors: 40+\n\n4. Ospedale de São João\nLocation: São João, São Tomé and Príncipe\nSpecialties: Urology, Gastroenterology, Dermatology\nAccreditations: National Health System Certified\nNumber of Beds: 80+\nNumber of Doctors: 35+\nReference: https://www.mymedicplus.com/blog/best-hospitals-in-sao-tome-andprincipe/\nhttps://www.borgenmagazine.com/common-diseases-in-sao-tome-and-principe/\n●\n●\n●\n●\n●\n\n2.3.10. Transportation and Daily Life\nTaxis and Car Rental\n● Car rentals are available in the country and there are a few international\ncompanies that have a presence but the more popular options are often\nthrough local companies, which are cheaper and offer equally reliable\nservices. The network of roads in the country is extensive, adding up to about\n230 miles. That said, most of the roads are in poor condition and several are\nunpaved. If travelers are intent on renting a vehicle, they should consider a\nfour-wheel drive, which is far better equipped to deal with the unpredictable\nnature of many routes in the country.\n● There are a few private taxi services in the country, mainly operating the\nroute between São Tomé International Airport and the city center. There are\nalso shared taxis in most of the cities, which are identifiable by their bright\nyellow color and can simply be flagged down at the side of the road. Journeys\nwithin cities have fixed prices and travelers simply need to pass the money to\nthe front of the taxi at some point during the journey. The prices of journeys\noutside of the city need to be negotiated beforehand.\nTrains and Buses\n● São Tomé once had a thriving railway system but this network has since been\nabandoned. Today, there are no rail services in the country and while\nsightseeing, travelers may even stumble upon the ruins of a few old railway\nstations and abandoned carriages.\n● There are no private bus companies or coach services in the country. The\nonly way to navigate between regions is to take a minibus taxi, which can be\nflagged down in cities or found waiting at communal taxi ranks. The fares for\nlong distance trips should be agreed upon prior to departure as there are no\nset routes. Travelers who wish to navigate their way between islands can do\nso either by ferry or local airline.\nReference: https://www.iexplore.com/articles/travel-guides/africa/sao-tome-andprincipe/transportation\nRenting a Car in Sao Tome Island with No Security Deposit\n\f● When you pick up the car, you'll often be required to leave a deposit on your\ncredit card or debit card. Deposits vary significantly subject to the size of the\nvehicle and the excess amount. Car rental Security deposits in Sao Tome\nIsland can be anywhere between £100 and £2,500.\nReference: https://www.stressfreecarrental.com/en/car-hire-locations/sao-tomeand-principe/sao-tome-island\n2.3.11 Current Situation of Existing Inequalities in São Tomé and Príncipe\nPost-Independence Evolution (1975-Present)After independence in 1975, São Tomé and Príncipe struggled to address historical\ninequalities. The Forros, composed of approximately 50% of the population,\ncontinued to dominate political and economic life, while the serviçais (30%) and\nAngolares (10%) remained marginalized.\nEconomic Disparities:\nThe 2021 Annual Report by the Central Bank of São Tomé and Príncipe noted high\npoverty rates, with about half the population living below the poverty line,\nparticularly in rural areas. The decline of cocoa production exacerbated economic\nchallenges, leaving rural communities—primarily comprised of serviçais and\nAngolares—with limited access to infrastructure and economic opportunities. Urban\nareas, where Forros are more concentrated, enjoy better access to services and\nhigher income levels, as highlighted in a 2012 study by the São Tomé and Príncipe\nInstitute for Social and Economic Research (INEP), which showed educational and\nincome disparities between forros and other groups.\nEthnic and Social Inequalities:\nCultural values among the Forro population, such as clientelism and corruption, have\nbeen cited as persistent obstacles to development. Serviçais, descendants of\ncontract laborers, often work in informal economies as \"candongueiros\" (informal\ntraders), while Angolares, primarily involved in fishing, continue to face challenges\ndue to their geographic isolation in southern areas like São João dos Angolares. The\nland reforms of the 1990s, supported by the World Bank, aimed to redistribute land\nto ex-serviçais but did not entirely alleviate socioeconomic disparities, particularly\nfor rural ex-serviçais and Angolares.\nUrban-Rural Divide:\nA significant urban-rural divide exists in the country, with about 60% of the\npopulation living in urban areas that have better access to education, healthcare,\nand economic opportunities. Rural populations, disproportionately comprising\nserviçais and Angolares, suffer from higher poverty rates, with a 2020 poverty\nheadcount ratio at $1.90 a day (2011 PPP) standing at 35.6%. This divide is\nexacerbated by the vulnerability of rural agricultural communities to external shocks,\nincluding climate change.\n\fGender and Regional Disparities:\nA 2019 UNDP report highlights gender inequalities, noting that women in São Tomé\nand Príncipe have lower literacy rates and limited access to economic opportunities.\nRegional disparities also persist, particularly with Príncipe being less developed than\nSão Tomé. Rural women, often from serviçais or Angolares backgrounds, face\ncompounded disadvantages due to these intersecting factors.\nReference: Inequalities in São Tomé and Príncipe", "references": [{"source": "wacaprogram.org", "url": "https://www.wacaprogram.org/country/sao-tome-and-principePopulationofSaoTomeandPrincipe.2026demographics:density,ratios,growthrate,clock,rateofmentowomen.2.3.2Generalcountryinformation"}, {"source": "ebsco.com", "url": "https://www.ebsco.com/research-starters/social-sciences-andhumanities/sao-tome-and-principe2.3.2.1People"}, {"source": "20092017.state.gov", "url": "https://20092017.state.gov/outofdate/bgn/saotomeandprincipe/106168.htm2.3.2.2Demographicsandpopulation"}, {"source": "iicba.unesco.org", "url": "https://www.iicba.unesco.org/en/sao-tome-and-principe"}, {"source": "borgenproject.org", "url": "https://borgenproject.org/womens-rights-in-sao-tome-and-principe/2.3.5-Buyinghabits"}, {"source": "worldatlas.com", "url": "https://www.worldatlas.com/articles/religion-in-sao-tome-andprincipe.html2.3.7-LeadersandCabinetMembers"}, {"source": "20092017.state.gov", "url": "https://20092017.state.gov/outofdate/bgn/saotomeandprincipe/106168.htmGovernmentLastUpdated:2/9/2026"}, {"source": "cia.gov", "url": "https://www.cia.gov/resources/world-leaders/foreign-governments/saotome-and-principe/2.3.8-SaõTómeandPríncipeHolidaysandFestivals"}, {"source": "iexplore.com", "url": "https://www.iexplore.com/articles/travel-guides/africa/sao-tome-andprincipe/festivals-and-eventshttps://data.unwomen.org/country/sao-tome-and-principe2.3.9.HealthandHealthcareSystem2.3.9.1WhatishealthcareinSaoTomeandPrincipelike?Healthconsciousness:"}, {"source": "countryreports.org", "url": "https://www.countryreports.org/country/SaoTomeandPrincipe/health.htmFrontiers"}, {"source": "mymedicplus.com", "url": "https://www.mymedicplus.com/blog/best-hospitals-in-sao-tome-andprincipe/https://www.borgenmagazine.com/common-diseases-in-sao-tome-and-principe/"}, {"source": "iexplore.com", "url": "https://www.iexplore.com/articles/travel-guides/africa/sao-tome-andprincipe/transportationRentingaCarinSaoTomeIslandwithNoSecurityDeposit"}, {"source": "stressfreecarrental.com", "url": "https://www.stressfreecarrental.com/en/car-hire-locations/sao-tomeand-principe/sao-tome-island2.3.11CurrentSituationofExistingInequalitiesinSãoToméandPríncipePost-IndependenceEvolution"}], "contentBlocks": [{"type": "text", "html": "<h3 class=\"content-h\">2.3 Social</h3>"}, {"type": "text", "html": "<h3 class=\"content-h\">2.3.1 Demographics</h3>\n<ul class=\"bullets\">\n<li>● Capital: São Tomé</li>\n<li>● Total Population: 247,000</li>\n<li>● Coastline: 209 km around a land area of 1,001 km2</li>\n<p>Reference: <a href=\"https://www.wacaprogram.org/country/sao-tome-and-principePopulationofSaoTomeandPrincipe.2026demographics:density,ratios,growthrate,clock,rateofmentowomen\" target=\"_blank\" rel=\"noopener\">https://www.wacaprogram.org/country/sao-tome-and-principePopulationofSaoTomeandPrincipe.2026demographics:density,ratios,growthrate,clock,rateofmentowomen</a></p>\n</ul>"}, {"type": "text", "html": "<h3 class=\"content-h\">2.3.2 General country information</h3>\n<p>● ● ● ● ● ●</p>\n<p>Full name of country: Democratic Republic of São Tomé and Principe Region: Africa Official language: Portuguese Nationality: Sao Tomean(s) (noun), Sao Tomean (adjective) Land area: 964 sq km (372 sq miles) National anthem: \"Independencia total\" (Total Independence), by Alda Neves Da Graca Do Espirito Santo/Manuel Dos Santos Barreto De Sousa E Almeida</p>\n<ul class=\"bullets\">\n<li>● National holiday: Independence Day, July 12 (1975)</li>\n<li>● Time zone: UTC +0</li>\n</ul>\n<ul class=\"bullets\">\n<li>● Flag: The flag of the Democratic Republic of São Tomé and Príncipe consists</li>\n<p>of a horizontal triband (green-yellow-green) design with a scarlet isosceles triangle based on the hoist (left) side. The central yellow band is one and a half times wider than the other two green bands. In the center stripe are two five-pointed black stars, which represent the two islands. Symbolically, the color red stands for the country’s struggle for freedom and independence. The other colors—black, yellow, and green—are pan-African colors.</p>\n<li>● Motto: “Unidade, Disciplina, Trabalho” (Unity, Discipline, Work)</li>\n<li>● Independence: July 12, 1975 (from Portugal)</li>\n<li>● Government type: semi-presidential republic</li>\n<li>● Suffrage: 18 years of age; universal</li>\n<p>Reference: <a href=\"https://www.ebsco.com/research-starters/social-sciences-andhumanities/sao-tome-and-principe\" target=\"_blank\" rel=\"noopener\">https://www.ebsco.com/research-starters/social-sciences-andhumanities/sao-tome-and-principe</a></p>\n</ul>"}, {"type": "text", "html": "<h3 class=\"content-h\">2.3.2.1 People</h3>\n<ul class=\"bullets\">\n<li>● Nationality: Noun and adjective--Sao Tomean(s).</li>\n<li>● Population (2026 est.): 247,000</li>\n<li>● Annual growth rate (2026 est.): 2.0-2.1%.</li>\n<li>● Ethnic groups: Mixed African, Portuguese-African.</li>\n<li>● Religions: Christian (Roman Catholic, Evangelical Protestant, Seventh-day</li>\n<p>Adventist) 80%.</p>\n<li>● Language: Portuguese (official).</li>\n<li>● Education: Literacy (census 2001)--68.1%. Years compulsory--to secondary</li>\n<p>level.</p>\n<li>● Health: Life expectancy (2008 est.)--68 yrs. Infant mortality rate (2008 est.)-38.36/1,000.</li>\n<li>● Work force (by household, 2000 UN Development Program est.):</li>\n<p>Agriculture--15.3%; industry, commerce, services--36.5%; government-11.5%. Reference: <a href=\"https://20092017.state.gov/outofdate/bgn/saotomeandprincipe/106168.htm\" target=\"_blank\" rel=\"noopener\">https://20092017.state.gov/outofdate/bgn/saotomeandprincipe/106168.htm</a></p>\n</ul>"}, {"type": "text", "html": "<h3 class=\"content-h\">2.3.2.2 Demographics and population</h3>\n<ul class=\"bullets\">\n<li>● Population growth:</li>\n<p>São Tomé and Príncipe's population is growing steadily at about 2.0-2.1% annually, reaching around 247,000 in 2026 from 242,000 in 2025. Growth Drivers</p>\n<li>● High fertility rates (around 3.95 children per woman) and a youthful</li>\n<p>demographic fuel natural increase of about 5,000 people yearly, outpacing net migration losses of roughly 900.</p>\n<li>● This continues a decades-long trend from 2.0% in the 1990s to peaks near</li>\n<p>2.7% in the 1970s, with density rising to 258 people per km².</p>\n</ul>"}, {"type": "text", "html": "<h3 class=\"content-h\">2.3.2.3 Future Projections</h3>\n<ul class=\"bullets\">\n<li>● Projections show sustained growth to 268,000 by 2030 and 380,000 by 2050</li>\n<p>at 1.6-2.0%, shifting toward an aging profile with median age climbing from</p>\n</ul>"}, {"type": "text", "html": "<h3 class=\"content-h\">24.0 to 28.4 years.</h3>\n<p>Urbanization accelerates, hitting 70% by 2030, pressuring infrastructure amid Vision 2030 goals for sustainable development. Reference: ENDS-2026-2040-Executive-Summary.pdf</p>"}, {"type": "text", "html": "<h3 class=\"content-h\">2.3.2.4 Age distribution:</h3>\n<ul class=\"bullets\">\n<li>● São Tomé and Príncipe has a youthful population with a median age around</li>\n<p>20.3-20.5 years, reflecting a classic expansive pyramid typical of developing island nations.</p>\n</ul>"}, {"type": "text", "html": "<h3 class=\"content-h\">2.3.2.5 Broad Age Groups</h3>\n<p>The population splits into three main categories based on recent 2025-2026 estimates for roughly 236,000-240,000 people. ●</p>\n<p>0-14 years (youth): 37.8-42.4% (about 90,000-100,000 people), with the largest shares in 0-4 (13.2%), 5-9 (12.2%), and 10-14 (12.1%) groups.</p>\n<p>●</p>\n<p>15-64 years (working age): 58.3-68.4%, peaking in younger adults like 15-19 (11.5%) and declining gradually to 1-2% per group in 50s-60s.</p>\n<p>●</p>\n<p>65+ years (elderly): 3.9-7.4%, with low concentrations (under 1% per 5-year band) and a slight female skew.</p>\n<p>Reference: Sao Tome and Principe Population Pyramid 2025 - Demographics & Birth Statistics | 15 Daily Births | Population Pyramids</p>"}, {"type": "text", "html": "<h3 class=\"content-h\">2.3.2.6 Dependency Insights</h3>\n<ul class=\"bullets\">\n<li>● A high young-age dependency ratio (64.9%) underscores needs for education</li>\n<p>and youth jobs, while old-age dependency remains low at 6.7%. This structure supports Vision 2030 goals like human capital investment. Reference: Sao Tome demographics data 1960-2026: Median Age Growth Population of Sao Tome and Principe. 2026 demographics: density, ratios, growth rate, clock, rate of men to women. Sao Tome and Principe Population Pyramid 2025 - Demographics & Birth Statistics |</p>\n</ul>"}, {"type": "text", "html": "<h3 class=\"content-h\">15 Daily Births | Population Pyramids</h3>"}, {"type": "text", "html": "<h3 class=\"content-h\">2.3.3 culture lifestyle attitudes</h3>\n<ul class=\"bullets\">\n<li>● São Tomé and Príncipe residents embrace a relaxed \"Leve Leve\" lifestyle,</li>\n<p>emphasizing simplicity, community harmony, and resilience shaped by their island paradise and Luso-African heritage.</p>\n</ul>"}, {"type": "text", "html": "<h3 class=\"content-h\">2.3.3.1 Core Values</h3>\n<ul class=\"bullets\">\n<li>● People prioritize elder respect, social unity, and strength in adversity, rooted</li>\n<p>in colonial and slavery histories that fostered mutual support. Peaceful coexistence prevails in a mestizo society blending Portuguese, African, and creole influences, with Christianity dominant but coexisting with traditional practices. Reference: São Tomé and Príncipe Heritage: Museums, Landmarks & Culture Leve Leve Lifestyle in São Tomé: Culture, Gastronomy & Traditions São Tomé and Príncipe Values | NationValues São Tomé and Príncipe - Freedom of Thought Report</p>\n</ul>"}, {"type": "text", "html": "<h3 class=\"content-h\">2.3.3.2 Daily Attitudes</h3>\n<ul class=\"bullets\">\n<li>● A laid-back approach—\"go slowly\"—defines routines, with strong family</li>\n<p>bonds, communal living in rural areas, and growing gender equality in modern sectors.</p>\n<li>● Lifestyle revolves around fresh seafood, tropical fruits, music/dance like</li>\n<p>tchiloli, and festivals celebrating independence or saints, reflecting optimism and cultural pride Reference: Cultural Experiences on São Tomé and Príncipe | Principe Collection The Culture Of Sao Tome And Principe</p>\n</ul>"}, {"type": "text", "html": "<h3 class=\"content-h\">2.3.4 Educational levels</h3>\n<ul class=\"bullets\">\n<li>● Educational Outcomes and Human Capital</li>\n<li>● In 2024, São Tomé and Príncipe, like many other African countries, is facing a</li>\n<p>learning crisis. In sub-Saharan Africa, learning poverty, defined as the share of children unable to read and understand an age-appropriate text by age 10, is estimated at 89 percent by the World Bank, Reference: <a href=\"https://www.iicba.unesco.org/en/sao-tome-and-principe\" target=\"_blank\" rel=\"noopener\">https://www.iicba.unesco.org/en/sao-tome-and-principe</a></p>\n<li>● In 2023, São Tomé and Príncipe has made strides in education, with primary</li>\n<p>enrollment near 98% and adult literacy at 93%, but challenges persist in completion rates and quality.</p>\n</ul>"}, {"type": "text", "html": "<h3 class=\"content-h\">2.3.4.1 Literacy and Access</h3>\n<ul class=\"bullets\">\n<li>● Adult literacy rose from 74.9% a decade ago to 93% by 2023, driven by the</li>\n<p>Quality Education for All Project since 2014, which boosted teacher training and infrastructure.</p>\n<li>● Youth (15-24) literacy nears universality, though 2% have no formal</li>\n<p>education and 36% incomplete primary, per older EPDC data.</p>\n</ul>"}, {"type": "text", "html": "<h3 class=\"content-h\">2.3.4.2 Enrollment Breakdown</h3>\n<ul class=\"bullets\">\n<li>● Primary completion stands at 87%, with 96% net enrollment, but secondary</li>\n<p>transition dips below 60% and completion lower, especially in rural areas.</p>\n</ul>\n<ul class=\"bullets\">\n<li>● The 6-3-3 system sees high primary access but dropouts due to poverty;</li>\n<p>higher education remains limited, aligning with Vision 2030 human capital goals. Sao Tomeans segment their education into pre-primary, primary, secondary and tertiary levels, and while education is legally mandated for children between 6 and 14 years old, many children, particularly young girls, face challenges in attending school. Often, people encourage them to stay home and learn the traditional role of women rather than skills to join the workforce. Reference: ENDS-2026-2040-Executive-Summary.pdf EPDC_NEP_2018_SaoTomeandPrincipe.pdf Improving Education in Sao Tome and Principe - The Borgen Project Addressing Comprehensive Educational Challenges in São Tomé and Príncipe – Broken Chalk <a href=\"https://borgenproject.org/womens-rights-in-sao-tome-and-principe/2.3.5-Buyinghabits\" target=\"_blank\" rel=\"noopener\">https://borgenproject.org/womens-rights-in-sao-tome-and-principe/2.3.5-Buyinghabits</a></p>\n<li>● São Tomé and Príncipe residents prioritize essential goods amid economic</li>\n<p>pressures, with household consumption dominating at 81.4% of GDP and heavy reliance on imported food, fuel, and staples. Spending Priorities</p>\n<li>● High inflation (peaking above 20% recently) squeezes purchasing power,</li>\n<p>driving focus on necessities like rice, fish, vegetables, and price-controlled basics, with government exemptions aiding affordability.</p>\n<li>● Limited disposable income (GDP per capita ~$2,400) favors informal markets,</li>\n<p>local produce, and subsistence in rural areas, while urban households allocate more to utilities and remittances. Consumption Patterns</p>\n<li>● Imports dwarf exports (35% vs. 3.6% of GDP), reflecting import-dependent</li>\n<p>habits for consumer goods, with low savings and debt distress curbing luxury or durable purchases.</p>\n<li>● Emerging tourism boosts demand for services, but inequality (Gini 40.7)</li>\n<p>means poorer 44.6% live near poverty lines, emphasizing value-for-money and community sharing.</p>\n</ul>\n<p>Reference: Spotlighting The World Factbook as We Bid a Fond Farewell - CIA CDP-PL-2025-STP.pdf São Tomé and Príncipe - STP</p>\n<p>2.3.6-Religion</p>\n<p>Reference: <a href=\"https://www.worldatlas.com/articles/religion-in-sao-tome-andprincipe.html2.3.7-LeadersandCabinetMembers\" target=\"_blank\" rel=\"noopener\">https://www.worldatlas.com/articles/religion-in-sao-tome-andprincipe.html2.3.7-LeadersandCabinetMembers</a></p>\n<ul class=\"bullets\">\n<li>● Type: Republic.</li>\n<li>● Independence: July 12, 1975 (from Portugal).</li>\n<li>● Constitution: November 5, 1975; revised September 1990, following a</li>\n<p>national referendum, -revised again January 2003.</p>\n<li>● Branches: Executive--president and prime minister. Legislative--National Assembly. Judicial--Supreme Court.</li>\n<li>● Administrative subdivisions: Seven counties, six on Sao Tome and one on</li>\n<p>Principe.</p>\n<li>● Political parties: Movement for the Liberation of Sao Tome and Principe</li>\n<p>(MLSTP), Party of -Democratic Convergence (PCD), Independent Democratic Action (ADI), Democratic Movement Force of Change (MDFM), Christian Democratic Front-Socialist Union Party (FDC-PSU), Santomean Workers Party (PTS); Popular Party of Progress (PPP), and National Union for Democracy and Progress (UNDP).</p>\n<li>● Suffrage: Universal adult.</li>\n<p>Reference: <a href=\"https://20092017.state.gov/outofdate/bgn/saotomeandprincipe/106168.htmGovernmentLastUpdated:2/9/2026\" target=\"_blank\" rel=\"noopener\">https://20092017.state.gov/outofdate/bgn/saotomeandprincipe/106168.htmGovernmentLastUpdated:2/9/2026</a> ● ● ●</p>\n</ul>\n<p>President: Carlos Manuel VILA NOVA Prime Minster: Americo RAMOS Min. of Agriculture, Fisheries, & Rural Development: Nilton Garrido de Sousa PONTES</p>\n<p>● ● ● ● ● ●</p>\n<p>● ● ● ● ●</p>\n<p>Min. of Defense & Home Affairs: Horacio Castro da Trindade DE SOUSA, Brig. Gen. Min. of Economy & Finance: Gareth Haddad do Espirito Santo GUADALUPE, Dr. Min. of Education, Culture, Science, & Higher Education: Isabel Maria Correia Viegas DE ABREU, Dr. Min. of Environment, Youth, & Sustainable Tourism: Nilda Borges DA MATA, Dr. Min. for Foreign Affairs, Cooperation, & Communities: Ilza Maria dos Santos Amado VAZ, Dr. Min. of Health: Celso Vaz do Nascimento MATOS, Dr. Min. of Infrastructure & Natural Resources: Nelson Mario de Carvalho Rosa CARDOSO Min. of Justice, Parliamentary Affairs, & Women's Rights: Vera Maria Assuncao Gomes CRAVID, Dr. Min. of Labor, Solidarity, & Social Security: Joucerli Tiny dos RAMOS, Dr. Governor, Bank of Sao Tome & Principe: Americo BARROS Attorney General: Carlos STOCK</p>\n<p>Reference: <a href=\"https://www.cia.gov/resources/world-leaders/foreign-governments/saotome-and-principe/2.3.8-SaõTómeandPríncipeHolidaysandFestivals\" target=\"_blank\" rel=\"noopener\">https://www.cia.gov/resources/world-leaders/foreign-governments/saotome-and-principe/2.3.8-SaõTómeandPríncipeHolidaysandFestivals</a> ●</p>\n<p>International Workers’ Day, or Labor Day as it is locally known, takes place on May 1 every year</p>\n<p>●</p>\n<p>On July 12, São Tomé e Príncipe celebrates the attainment of full sovereignty from the colonial rule of the Portuguese. This public holiday is filled with displays of tradition and culture in many different cities.</p>\n<p>●</p>\n<p>Every year on November 26, São Tomé celebrates the national holiday of Argel Accord Day. Prior to the nation being granted independence, the Argel Accords</p>\n<p>●</p>\n<p>São Tomé has a large Christian population, accounting for about 80 percent of people in the country. Understandably then, Christian religious holidays like Christmas Day on December 25 are a big deal. Christmas marks the birth of the Christian messiah Jesus. The day is celebrated by going to mass and the enjoyment of feasts with friends and family. The day has taken on a cultural aspect as well as it is considered a non-working day and most people in the country, religious or not, partake in the festivities.</p>\n<p>●</p>\n<p>In São Tomé and Príncipe, the weekend days are Saturday and Sunday and the Workweek is from Monday to Friday</p>\n<p>●</p>\n<p>Globally, so
