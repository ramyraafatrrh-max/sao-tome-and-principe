rm or other accounts for approximately 97% of the total population's religious affiliation— making it an overwhelmingly Christian society with deep historical roots in Roman Catholicism inherited from five centuries of Portuguese colonial presence. Reference: Opera News / WorldAtlas. African Countries Where Christianity is the Largest Religion. Retrieved March 2026.</p>\n</ul>"}, {"type": "text", "html": "<h3 class=\"content-h\">4.1.1 Roman Catholicism — The Dominant Faith</h3>\n<ul class=\"bullets\">\n<li>● Roman Catholicism is the single largest religious denomination in São Tomé and</li>\n<p>Príncipe, constituting an estimated 55.7% of the national population according to the CIA World Factbook's 2012 census-based estimate. Earlier data pointed to higher figures: the nation's encyclopedia (Britannica) records that over threequarters of the population was Roman Catholic as of the year 2000, and the Nations Encyclopedia notes a figure of approximately 80% for 2002. The decline in the Catholic share since then reflects the significant growth of Protestant and evangelical denominations, not a general decline in Christian affiliation.</p>\n<li>● Catholicism was introduced to the islands by Portuguese colonists from the late</li>\n<p>15th century onward. The Diocese of São Tomé and Príncipe—one of Africa's oldest Catholic dioceses—was established by Pope Clement VII on 31 January 1533. At its height, its jurisdiction extended to Catholics in Angola and Mozambique. The first permanent church on the islands, Nossa Senhora da Graça (built in 1504 by Augustinian missionaries), still stands and serves as the Cathedral of São Tomé. Today, the single Catholic diocese is headquartered in São Tomé city. Reference:</p>\n</ul>\n<p>Index Mundi / CIA World Factbook. Sao Tome and Principe Religions. Available at: <a href=\"https://www.indexmundi.com/sao_tome_and_principe/religions.html\" target=\"_blank\" rel=\"noopener\">https://www.indexmundi.com/sao_tome_and_principe/religions.html</a> (Accessed: 7 May 2026).</p>\n<p>Encyclopedia.com. Worldmark Encyclopaedia of Religious Practices: São Tomé and Príncipe. Available at: <a href=\"https://www.encyclopedia.com/religion/encyclopediasalmanacs-transcripts-and-maps/sao-tome-and-principe\" target=\"_blank\" rel=\"noopener\">https://www.encyclopedia.com/religion/encyclopediasalmanacs-transcripts-and-maps/sao-tome-and-principe</a> (Accessed: 7 May 2026). Wikipedia contributors. Religion in São Tomé and Príncipe. Wikipedia, The Free Encyclopedia. Available at: <a href=\"https://en.wikipedia.org/wiki/Religion_in_São_Tomé_and_Príncipe\" target=\"_blank\" rel=\"noopener\">https://en.wikipedia.org/wiki/Religion_in_São_Tomé_and_Príncipe</a> (Accessed: 7 May 2026).</p>"}, {"type": "text", "html": "<h3 class=\"content-h\">4.1.2 Protestant and Evangelical Christianity</h3>\n<p>•</p>\n<p>Protestant Christianity constitutes the second-largest Christian grouping in the country. The CIA World Factbook (2012) records specific Protestant denominations as follows: Seventh-day Adventist (4.1%), Assembly of God (3.4%), New Apostolic Church (2.9%), Universal Kingdom of God (2%), and Jehovah's Witnesses (1.2%). Evangelical churches have shown significant growth in recent decades owing to active missionary work. By 2002, Protestants as a combined group were estimated to account for approximately 15% of the population, though some sources have placed this figure as high as 23% more recently.</p>"}, {"type": "text", "html": "<h3 class=\"content-h\">4.1.3 Seventh-day Adventist Church</h3>\n<p>•</p>\n<p>The Seventh-day Adventist Church operates one of only two private religious schools in the country (alongside a Catholic school), with both schools open to members and non-members alike and subject to Ministry of Education curriculum oversight. Protestant leaders, especially Seventh-day Adventist leaders, have demonstrated civic engagement—for example, participating in government COVID-19 awareness campaigns and broadcasting prevention messages.</p>\n<p>Reference: U.S. Department of State. 2020 Report on International Religious Freedom: São Tomé and Príncipe. <a href=\"https://www.state.gov/reports/2020-report-oninternational-religious-freedom/sao-tome-and-principe\" target=\"_blank\" rel=\"noopener\">https://www.state.gov/reports/2020-report-oninternational-religious-freedom/sao-tome-and-principe</a></p>"}, {"type": "text", "html": "<h3 class=\"content-h\">4.1.4 Islam</h3>\n<ul class=\"bullets\">\n<li>● The Muslim population of São Tomé and Príncipe is small but growing, estimated</li>\n<p>at between 1% and 3% of the total population depending on the source and year. The U.S. State Department's World Religion Profile estimates 3% Muslim, while a</p>\n</ul>"}, {"type": "text", "html": "<h3 class=\"content-h\">2012 CIA report records approximately 3% as well. Most Muslims are migrants</h3>\n<p>from Nigeria and Cameroon who have arrived over the last two decades. The proximity of the islands to the West African mainland has facilitated this immigration. Reference: Association of Religion Data Archives. National Profiles: World Religion. <a href=\"https://www.thearda.com/world-religion/national-profiles?u=195c\" target=\"_blank\" rel=\"noopener\">https://www.thearda.com/world-religion/national-profiles?u=195c</a></p>"}, {"type": "text", "html": "<h3 class=\"content-h\">4.1.5 Other Minor Faiths</h3>\n<ul class=\"bullets\">\n<li>● Small communities of the Bahá'í Faith, Judaism (historically present since the 15th</li>\n<p>century when thousands of Jewish children were forcibly deported to the island), Hinduism, and Buddhism also exist on the islands, comprising a combined share of approximately 0.1–1% each. The Jewish community, though demographically negligible at 0.1% of the population according to the Pew Research Center, has left a lasting cultural imprint on Creole customs and traditions. Reference: Religion in São Tomé and Príncipe. Wikipedia. Op. cit. Citing Pew Research Center data.</p>\n</ul>\n<p>RELIGIOUS BREAKDOWN — SÃO TOMÉ AND PRÍNCIPE (2012 CIA EST.) Roman Catholic: 55.7% Seventh-day Adventist: 4.1% Assembly of God: 3.4% New Apostolic: 2.9% Mana Church: 2.3% Universal Kingdom of God: 2.0% Jehovah's Witnesses: 1.2% Other Christian: 6.2% No religion / Unaffiliated: 21.2% Unspecified: 1.0%</p>\n<p>Reference: CIA World Factbook. Sao Tome and Principe: Demographics. Sourced from IndexMundi. <a href=\"https://www.indexmundi.com/sao_tome_and_principe/religions.html\" target=\"_blank\" rel=\"noopener\">https://www.indexmundi.com/sao_tome_and_principe/religions.html</a></p>"}, {"type": "text", "html": "<h3 class=\"content-h\">4.1.6 Syncretic and Traditional African Beliefs</h3>\n<ul class=\"bullets\">\n<li>● Despite over five centuries of Roman Catholic influence, traditional African beliefs</li>\n<p>and practices remain widespread, often coexisting with nominal Christian affiliation. Black slaves brought to the islands from Benin, Gabon, the Republic of the Congo, and Angola introduced animism, totemism, and mortuary cults. Over centuries, these merged with Catholicism to produce syncretic expressions of faith. For instance, the notion of Sum d'Océ (meaning 'Lord of the Heavens') combines the Christian creator God with a controller of wealth drawn from African cosmology. Small plantation-era chapels combined Catholic crosses with African charms.</p>\n</ul>\n<ul class=\"bullets\">\n<li>● A Melanesian belief system is also recorded, with followers constituting</li>\n<p>approximately 2.9% of the total population. Reports also indicate that witchcraftrelated persecution occurs on both islands—particularly targeting elderly women accused of 'fitxicêlu' (witchcraft in the Forro language)—suggesting a persistent undercurrent of African spiritual worldview that orthodox Christian catechesis has historically not addressed adequately. Reference: Freedom of Thought Report: São Tomé and Príncipe. Humanists International. <a href=\"https://fot.humanists.international/countries/africa-middle-africa/sao-tome-andprincipe/Encyclopedia.com.Op.cit\" target=\"_blank\" rel=\"noopener\">https://fot.humanists.international/countries/africa-middle-africa/sao-tome-andprincipe/Encyclopedia.com.Op.cit</a></p>\n</ul>"}], "tables": []}, {"num": "4.2", "title": "Size of Christian Population", "content": "4.2 Size of Christian Population\n4.2.1 Príncipe Island — Christian Population Estimate\n● Príncipe island has a much\nsmaller population—estimated at\n9,830 by the Instituto Nacional\nde Estatística in 2024. The\nAutonomous Region of Príncipe\nshares the national religious\nprofile, with Christianity\n(predominantly Catholic) as the\nfaith of the vast majority.\nApplying the national religious\nproportions, the estimated\nChristian population on Príncipe\nis approximately 9,500 persons.\n● While Príncipe's population is\nsmall, it is geographically isolated\nand has historically received less\nattention from any denomination.\nThe island has no airport with\nregular international connections\nand is accessible mainly via interisland flights from São Tomé. A\nCoptic mission on Príncipe—even\na periodic pastoral visit—would\nrepresent\na\nunique\nand\nuncontested Christian witness.\nThe isolation of Príncipe's\ncommunity, its strong rural and\n\fclose-knit identity, and the near-total absence of any non-Catholic Christian\ninstitution make it fertile ground for the Coptic Church's first outreach.\nReference: Autonomous Region of Príncipe. Government Portal. Op. cit. Príncipe.\nWikipedia. Op. cit.\n4.2.2 The Unchurched and Syncretical Believing Population\n● Approximately 21.2% of the population identifies as having 'no religion', according\nto the CIA's 2012 estimate. However, Encyclopedia Britannica notes that 'about\none-fifth of the population identifies as nonreligious'—these individuals, while not\nformally affiliated, often continue to participate in life-cycle rituals such as\nbaptisms, funerals, and communal celebrations. This cohort represents a\nsignificant population open to re-evangelization.\n● Additionally, those who practice syncretic blends of Catholicism and African\ntraditionalism represent a spiritually open demographic. The Coptic Orthodox\nChurch's ancient African roots, its non-colonial identity, its rich patristic tradition,\nand its distinctive liturgical practice could serve as powerful points of attraction\nfor both the unchurched and the disillusioned within the existing Catholic\ncommunity.\nReference: Britannica. Sao Tome and Principe. Retrieved March 2026.\nhttps://www.britannica.com/place/Sao-Tome-and-Principe", "references": [{"source": "britannica.com", "url": "https://www.britannica.com/place/Sao-Tome-and-Principe"}], "contentBlocks": [{"type": "text", "html": "<h3 class=\"content-h\">4.2 Size of Christian Population</h3>"}, {"type": "text", "html": "<h3 class=\"content-h\">4.2.1 Príncipe Island — Christian Population Estimate</h3>\n<ul class=\"bullets\">\n<li>● Príncipe island has a much</li>\n<p>smaller population—estimated at 9,830 by the Instituto Nacional de Estatística in 2024. The Autonomous Region of Príncipe shares the national religious profile, with Christianity (predominantly Catholic) as the faith of the vast majority. Applying the national religious proportions, the estimated Christian population on Príncipe is approximately 9,500 persons.</p>\n<li>● While Príncipe's population is</li>\n<p>small, it is geographically isolated and has historically received less attention from any denomination. The island has no airport with regular international connections and is accessible mainly via interisland flights from São Tomé. A Coptic mission on Príncipe—even a periodic pastoral visit—would represent a unique and uncontested Christian witness. The isolation of Príncipe's community, its strong rural and</p>\n</ul>\n<p>close-knit identity, and the near-total absence of any non-Catholic Christian institution make it fertile ground for the Coptic Church's first outreach. Reference: Autonomous Region of Príncipe. Government Portal. Op. cit. Príncipe. Wikipedia. Op. cit.</p>"}, {"type": "text", "html": "<h3 class=\"content-h\">4.2.2 The Unchurched and Syncretical Believing Population</h3>\n<ul class=\"bullets\">\n<li>● Approximately 21.2% of the population identifies as having 'no religion', according</li>\n<p>to the CIA's 2012 estimate. However, Encyclopedia Britannica notes that 'about one-fifth of the population identifies as nonreligious'—these individuals, while not formally affiliated, often continue to participate in life-cycle rituals such as baptisms, funerals, and communal celebrations. This cohort represents a significant population open to re-evangelization.</p>\n<li>● Additionally, those who practice syncretic blends of Catholicism and African</li>\n<p>traditionalism represent a spiritually open demographic. The Coptic Orthodox Church's ancient African roots, its non-colonial identity, its rich patristic tradition, and its distinctive liturgical practice could serve as powerful points of attraction for both the unchurched and the disillusioned within the existing Catholic community. Reference: Britannica. Sao Tome and Principe. Retrieved March 2026. <a href=\"https://www.britannica.com/place/Sao-Tome-and-Principe\" target=\"_blank\" rel=\"noopener\">https://www.britannica.com/place/Sao-Tome-and-Principe</a></p>\n</ul>"}], "tables": []}, {"num": "4.3", "title": "Existing Mission Efforts & Organizations", "content": "4.3 Existing Mission Efforts & Organizations\n4.3.1 Roman Catholic Church\nThe Roman Catholic Church remains the dominant and best-resourced religious\norganization in São Tomé and Príncipe. The country has a single diocese—the Diocese\nof São Tomé and Príncipe—headquartered in São Tomé city. The diocese was\noriginally established in 1534 as part of Portugal's Metropolitan Archdiocese of\nFunchal. The main Catholic church is the Cathedral of Our Lady of Grace in São Tomé,\nwhich bears the Cross of São Tomé as its ecclesiastical symbol. Since independence in\n1975, the Church has been run primarily by expatriate priests. Catholic institutions\ninclude one private school (open to all). The Church exercises significant cultural\ninfluence through baptism, funerary rites, and patron saint festivals across all districts.\n\n\fReference: WorldAtlas. Religion In Sao Tome And Principe.\nhttps://www.worldatlas.com/articles/religion-in-sao-tome-and-principe.html\n\n4.3.2 Protestant and Evangelical Organizations\nProtestant Christianity has grown markedly since independence. Key organizations\ncurrently operating in São Tomé and Príncipe include:\n•\n\nSeventh-day Adventist Church (SDA): One of the two recognized private religious\nschools; active in healthcare messaging and public awareness campaigns.\n• Assembly of God: 3.4% of the national population; evangelical Pentecostal\nbackground.\n• New Apostolic Church: 2.9% of the population; increasingly active in urban areas.\n• Universal Church of the Kingdom of God (UCKG): Has faced some incidents of\nvandalism (2019); services resumed and facilities repaired by 2020.\n• Jehovah's Witnesses: 1.2% of population; regular door-to-door outreach\nactivities.\n• Thokoist Church, Evangelical Assembly of Christ, Universal Church of Christ:\nSmaller groups with a combined following of approximately 8,000 persons.\nReference: U.S. Department of State. 2020 Report on International Religious\nFreedom: São Tomé and Príncipe. Op. cit.\n4.3.3 Mana Church\n● The Mana Church, which originated in Lisbon, Portugal in 1984, has an established\npresence in São Tomé and Príncipe representing approximately 2.3% of the\npopulation. The movement believes in supernatural forces and powers attributed\nto persons, spirits, and natural objects, drawing on a syncretic blend of African\ntraditionalism and Christian elements. It was brought to the islands by the\nPortuguese colonial network in a manner analogous to Catholicism. The Mana\nChurch's appeal to supernatural and ancestral dimensions indicates that São\nToméan Christians remain spiritually receptive to traditions that engage the\n\f● mystical and transcendent—a dimension in which the Coptic Orthodox liturgical\nand ascetic tradition is exceptionally strong.\nReference: WorldAtlas. Religion In Sao Tome And Principe. Op. cit.\n4.3.4 Bahá'í Faith\n● The Bahá'í community in São Tomé and Príncipe has been growing steadily since\nthe late 20th century. Bahá'í missionaries have been active in the country,\nemphasizing education, social development, and interfaith dialogue. The Bahá'í\ncommunity's model of community-building and its lack of formal clergy make its\npresence non-competitive with the Coptic Orthodox mission model.\n4.3.5 Absence of Orthodox Christian Presence\n● Neither the Coptic Orthodox Church (Oriental Orthodox) nor the Greek Orthodox\nPatriarchate of Alexandria and All Africa (Eastern Orthodox) have any established\npresence in São Tomé and Príncipe. This is a remarkable gap, given that the\nPatriarchate of Alexandria has canonical jurisdiction over all African nations. The\nnearest Coptic Orthodox mission points are in Nigeria (Lagos and Calabar,\nestablished 2005) and Cameroon (covered by the Metropolitan of Accra, who has\njurisdiction over 22 West African countries). The Greek Orthodox Patriarchate of\nAlexandria has active missions in Ghana, Nigeria, and Cameroon but no presence\nrecorded in São Tomé and Príncipe.\nReference: Coptic Mission. About Us: Country Missions. https://copticmission.org/about-us\nOrthodox Mission in Tropical Africa. Missions Institute of Orthodox Christianity.\nhttps://missions.hchc.edu/articles/articles/orthodox-mission-in-tropical-africa", "references": [{"source": "worldatlas.com", "url": "https://www.worldatlas.com/articles/religion-in-sao-tome-and-principe.html4.3.2ProtestantandEvangelicalOrganizationsProtestantChristianityhasgrownmarkedlysinceindependence.KeyorganizationscurrentlyoperatinginSãoToméandPríncipeinclude:"}, {"source": "copticmission.org", "url": "https://copticmission.org/about-usOrthodoxMissioninTropicalAfrica.MissionsInstituteofOrthodoxChristianity.https://missions.hchc.edu/articles/articles/orthodox-mission-in-tropical-africa"}], "contentBlocks": [{"type": "text", "html": "<h3 class=\"content-h\">4.3 Existing Mission Efforts & Organizations</h3>"}, {"type": "text", "html": "<h3 class=\"content-h\">4.3.1 Roman Catholic Church</h3>\n<p>The Roman Catholic Church remains the dominant and best-resourced religious organization in São Tomé and Príncipe. The country has a single diocese—the Diocese of São Tomé and Príncipe—headquartered in São Tomé city. The diocese was originally established in 1534 as part of Portugal's Metropolitan Archdiocese of Funchal. The main Catholic church is the Cathedral of Our Lady of Grace in São Tomé, which bears the Cross of São Tomé as its ecclesiastical symbol. Since independence in 1975, the Church has been run primarily by expatriate priests. Catholic institutions include one private school (open to all). The Church exercises significant cultural influence through baptism, funerary rites, and patron saint festivals across all districts.</p>\n<p>Reference: WorldAtlas. Religion In Sao Tome And Principe. <a href=\"https://www.worldatlas.com/articles/religion-in-sao-tome-and-principe.html\" target=\"_blank\" rel=\"noopener\">https://www.worldatlas.com/articles/religion-in-sao-tome-and-principe.html</a></p>"}, {"type": "text", "html": "<h3 class=\"content-h\">4.3.2 Protestant and Evangelical Organizations</h3>\n<p>Protestant Christianity has grown markedly since independence. Key organizations currently operating in São Tomé and Príncipe include: •</p>\n<p>Seventh-day Adventist Church (SDA): One of the two recognized private religious schools; active in healthcare messaging and public awareness campaigns.</p>\n<ul class=\"bullets\">\n<li>• Assembly of God: 3.4% of the national population; evangelical Pentecostal</li>\n<p>background.</p>\n<li>• New Apostolic Church: 2.9% of the population; increasingly active in urban areas.</li>\n<li>• Universal Church of the Kingdom of God (UCKG): Has faced some incidents of</li>\n<p>vandalism (2019); services resumed and facilities repaired by 2020.</p>\n<li>• Jehovah's Witnesses: 1.2% of population; regular door-to-door outreach</li>\n<p>activities.</p>\n<li>• Thokoist Church, Evangelical Assembly of Christ, Universal Church of Christ:</li>\n<p>Smaller groups with a combined following of approximately 8,000 persons. Reference: U.S. Department of State. 2020 Report on International Religious Freedom: São Tomé and Príncipe. Op. cit.</p>\n</ul>"}, {"type": "text", "html": "<h3 class=\"content-h\">4.3.3 Mana Church</h3>\n<ul class=\"bullets\">\n<li>● The Mana Church, which originated in Lisbon, Portugal in 1984, has an established</li>\n<p>presence in São Tomé and Príncipe representing approximately 2.3% of the population. The movement believes in supernatural forces and powers attributed to persons, spirits, and natural objects, drawing on a syncretic blend of African traditionalism and Christian elements. It was brought to the islands by the Portuguese colonial network in a manner analogous to Catholicism. The Mana Church's appeal to supernatural and ancestral dimensions indicates that São Toméan Christians remain spiritually receptive to traditions that engage the</p>\n</ul>\n<ul class=\"bullets\">\n<li>● mystical and transcendent—a dimension in which the Coptic Orthodox liturgical</li>\n<p>and ascetic tradition is exceptionally strong. Reference: WorldAtlas. Religion In Sao Tome And Principe. Op. cit.</p>\n</ul>"}, {"type": "text", "html": "<h3 class=\"content-h\">4.3.4 Bahá'í Faith</h3>\n<ul class=\"bullets\">\n<li>● The Bahá'í community in São Tomé and Príncipe has been growing steadily since</li>\n<p>the late 20th century. Bahá'í missionaries have been active in the country, emphasizing education, social development, and interfaith dialogue. The Bahá'í community's model of community-building and its lack of formal clergy make its presence non-competitive with the Coptic Orthodox mission model.</p>\n</ul>"}, {"type": "text", "html": "<h3 class=\"content-h\">4.3.5 Absence of Orthodox Christian Presence</h3>\n<ul class=\"bullets\">\n<li>● Neither the Coptic Orthodox Church (Oriental Orthodox) nor the Greek Orthodox</li>\n<p>Patriarchate of Alexandria and All Africa (Eastern Orthodox) have any established presence in São Tomé and Príncipe. This is a remarkable gap, given that the Patriarchate of Alexandria has canonical jurisdiction over all African nations. The nearest Coptic Orthodox mission points are in Nigeria (Lagos and Calabar, established 2005) and Cameroon (covered by the Metropolitan of Accra, who has jurisdiction over 22 West African countries). The Greek Orthodox Patriarchate of Alexandria has active missions in Ghana, Nigeria, and Cameroon but no presence recorded in São Tomé and Príncipe. Reference: Coptic Mission. About Us: Country Missions. <a href=\"https://copticmission.org/about-usOrthodoxMissioninTropicalAfrica.MissionsInstituteofOrthodoxChristianity.https://missions.hchc.edu/articles/articles/orthodox-mission-in-tropical-africa\" target=\"_blank\" rel=\"noopener\">https://copticmission.org/about-usOrthodoxMissioninTropicalAfrica.MissionsInstituteofOrthodoxChristianity.https://missions.hchc.edu/articles/articles/orthodox-mission-in-tropical-africa</a></p>\n</ul>"}], "tables": []}, {"num": "4.4", "title": "COPTIC ORTHODOX CHURCH — AFRICAN MISSION PRECEDENT", "content": "4.4 COPTIC ORTHODOX CHURCH — AFRICAN MISSION PRECEDENT\n4.4.1 Historical Overview of Coptic Missions in Sub-Saharan Africa\nThe Coptic Orthodox Church of Alexandria holds canonical and historical primacy over\nall of Africa, having been founded by St. Mark the Evangelist in Alexandria in\napproximately AD 61. Since the demise of the Latin North African Archdiocese of\nCarthage in the 8th century, Alexandria has been the sole Apostolic See with\njurisdiction over the entire continent. The modern era of active Coptic mission in subSaharan Africa began in earnest in 1976 when His Grace Bishop Antonius Markos\n(Anthony Mark) was consecrated by Pope Shenouda III as General Bishop for African\nAffairs and Patriarchal Exarch in West and South Africa. A second bishop, His Grace\nBishop Paul (Boulos), was consecrated in the 1990s as General Bishop for Evangelism\nand Mission and Patriarchal Exarch in East and Central Africa.\nReference: Coptic Orthodox Church in Africa. Wikipedia.\nhttps://en.wikipedia.org/wiki/Coptic_Orthodox_Church_in_Africa\nCoptic Mission. About Us. Op. cit.\n4.4.2 Current Coptic Presence in West Africa — Closest Neighbors\nThe Coptic Church's closest established mission to São Tomé and Príncipe is in Nigeria,\nwhere the first Coptic Orthodox Church was established in Lagos in 2005. In 2006, four\nadditional churches were established in Calabar, which has become the heart of the\n\fNigerian Coptic community. The mission in Nigeria is served by rotating priests and\ndeacons, with a dedicated Coptic Centre built in Calabar. Nigeria is geographically the\nclosest jurisdiction to São Tomé and Príncipe (approximately 800 km), making it the\nmost logical platform from which to support and sustain a new mission in São Tomé\nand Príncipe.\nReference: Coptic Mission. About Us: Nigeria. Op. cit.\n4.4.3 Parallels from Comparable Island Missions\nThe Coptic Church's successful establishment of missions in geographically isolated\ncontexts offers instructive precedent for São Tomé and Príncipe. The mission in\nMadagascar—an island nation of comparable remoteness—was pioneered by\nArchimandrite Nectarios Kellis in 1994, who began by personally visiting towns and\nvillages to explain the Orthodox Christian faith. Within a short period, new\ncongregations were established, liturgical services were translated into local\nlanguages, and a local priest was ordained. The Madagascar model—personal\nevangelism, liturgical inculturation, and rapid development of local clergy—is directly\napplicable to São Tomé and Príncipe.\nReference: Hayes, Stephen. Orthodox Mission in Tropical Africa. Missions Institute of\nOrthodox Christianity. Op. cit.\n4.4.4 The Organization of African Instituted Churches (OAIC) Connection\n● The Organization of African Instituted Churches (OAIC) was founded in 1978 at an\nhistoric conference in Cairo convened by His Holiness Pope Shenouda III, upon the\ninitiative of His Grace Bishop Markos. With chapters now operating in Kenya,\nUganda, Tanzania, Botswana, Zimbabwe, Western Cape, Eastern Cape, Ghana,\nMadagascar, Nigeria, and the Democratic Republic of Congo, the OAIC constitutes\na pan-African ecumenical network through which the Coptic Church can make\ninitial contact with local African Instituted Churches in São Tomé and Príncipe and\nuse them as bridges for contextual outreach.\nReference: World Council of Churches. Organization of African Instituted Churches.", "references": [{"source": "en.wikipedia.org", "url": "https://en.wikipedia.org/wiki/Coptic_Orthodox_Church_in_AfricaCopticMission.AboutUs.Op.cit.4.4.2CurrentCopticPresenceinWestAfrica"}], "contentBlocks": [{"type": "text", "html": "<h3 class=\"content-h\">4.4 COPTIC ORTHODOX CHURCH — AFRICAN MISSION PRECEDENT</h3>"}, {"type": "text", "html": "<h3 class=\"content-h\">4.4.1 Historical Overview of Coptic Missions in Sub-Saharan Africa</h3>\n<p>The Coptic Orthodox Church of Alexandria holds canonical and historical primacy over all of Africa, having been founded by St. Mark the Evangelist in Alexandria in approximately AD 61. Since the demise of the Latin North African Archdiocese of Carthage in the 8th century, Alexandria has been the sole Apostolic See with jurisdiction over the entire continent. The modern era of active Coptic mission in subSaharan Africa began in earnest in 1976 when His Grace Bishop Antonius Markos (Anthony Mark) was consecrated by Pope Shenouda III as General Bishop for African Affairs and Patriarchal Exarch in West and South Africa. A second bishop, His Grace Bishop Paul (Boulos), was consecrated in the 1990s as General Bishop for Evangelism and Mission and Patriarchal Exarch in East and Central Africa. Reference: Coptic Orthodox Church in Africa. Wikipedia. <a href=\"https://en.wikipedia.org/wiki/Coptic_Orthodox_Church_in_AfricaCopticMission.AboutUs.Op.cit\" target=\"_blank\" rel=\"noopener\">https://en.wikipedia.org/wiki/Coptic_Orthodox_Church_in_AfricaCopticMission.AboutUs.Op.cit</a></p>"}, {"type": "text", "html": "<h3 class=\"content-h\">4.4.2 Current Coptic Presence in West Africa — Closest Neighbors</h3>\n<p>The Coptic Church's closest established mission to São Tomé and Príncipe is in Nigeria, where the first Coptic Orthodox Church was established in Lagos in 2005. In 2006, four additional churches were established in Calabar, which has become the heart of the</p>\n<p>Nigerian Coptic community. The mission in Nigeria is served by rotating priests and deacons, with a dedicated Coptic Centre built in Calabar. Nigeria is geographically the closest jurisdiction to São Tomé and Príncipe (approximately 800 km), making it the most logical platform from which to support and sustain a new mission in São Tomé and Príncipe. Reference: Coptic Mission. About Us: Nigeria. Op. cit.</p>"}, {"type": "text", "html": "<h3 class=\"content-h\">4.4.3 Parallels from Comparable Island Missions</h3>\n<p>The Coptic Church's successful establishment of missions in geographically isolated contexts offers instructive precedent for São Tomé and Príncipe. The mission in Madagascar—an island nation of comparable remoteness—was pioneered by Archimandrite Nectarios Kellis in 1994, who began by personally visiting towns and villages to explain the Orthodox Christian faith. Within a short period, new congregations were established, liturgical services were translated into local languages, and a local priest was ordained. The Madagascar model—personal evangelism, liturgical inculturation, and rapid development of local clergy—is directly applicable to São Tomé and Príncipe. Reference: Hayes, Stephen. Orthodox Mission in Tropical Africa. Missions Institute of Orthodox Christianity. Op. cit.</p>"}, {"type": "text", "html": "<h3 class=\"content-h\">4.4.4 The Organization of African Instituted Churches (OAIC) Connection</h3>\n<ul class=\"bullets\">\n<li>● The Organization of African Instituted Churches (OAIC) was founded in 1978 at an</li>\n<p>historic conference in Cairo convened by His Holiness Pope Shenouda III, upon the initiative of His Grace Bishop Markos. With chapters now operating in Kenya, Uganda, Tanzania, Botswana, Zimbabwe, Western Cape, Eastern Cape, Ghana, Madagascar, Nigeria, and the Democratic Republic of Congo, the OAIC constitutes a pan-African ecumenical network through which the Coptic Church can make initial contact with local African Instituted Churches in São Tomé and Príncipe and use them as bridges for contextual outreach. Reference: World Council of Churches. Organization of African Instituted Churches.</p>\n</ul>"}], "tables": []}]}, "5": {"name": "SWOT Analysis", "num": 5, "sections": [{"num": "5", "title": "SWOT Analysis", "content": "Chapter 5: SWOT Analysis\n\nStrengths\n\nWeaknesses\n\nCan provide the Bible in their local language\nPortuguese-language liturgical alignment\nPortuguese Speaking servants\nPope Shenouda III mission legacy\nExceptional History in attracting young men and\nChildren to the church\nFlexibility in Resource Allocation\nA Coptic parish offering structured sacramental\nrecords\nAbility to Combine Service + Sustainability\nGood fluency and profession in English and\nFrench languages\nAbility to Use Simple Digital Tools Effectively\nAbility to Combine Online / Offline Models\nfamiliarity with the diseases they are facing\nAbility to Work Through Informal Networks\nExperience in creating Awareness\nThe presence of church farms in Egypt\n\nLimited Portuguese Digital Content\nUnfamiliarity with the country’s traditions\nThere are no previous Coptic missions to this\ncountry\nThere is no sister church in the country\nThere are no local Coptic clergy\nCost Inefficiency for Travel & Logistics\nHigh single-parenthood creates financial strain\non community giving\n\n\fOpportunities\n\nThreats\n\nlow income, high need for jobs and Limited job\nopportunities\nVery large sector of youth\nAbility to Build Deep Personal Relationships\nChurch-Based Entry Model\nEducation Gap (Learning Crisis)\nLimited Healthcare Awareness\nWeak civil registration\nSimple Lifestyle (Leve Leve)\nHigh Poverty = High Need for Services\nSmall Economy = Easy Influence\nThe presence of many catholic churches in the\ncapital\nGrowing Internet Penetration (~61.5%), high\nmobile usage 64% ⁠Rapid growth of internet access and social media\naccess\nThe outbreaks of many diseases, Weak health\nservices and lack of resources - NGOs for medical\nPolitical Openness to External Support\nMultiparty System\nAdopting climate-smart agriculture.\nInternational Support (UNDP / World Bank)\nFocus on Renewable Energy & Sustainability\nTheir need to import food supplies\nWater Issues (Quality & Supply)\nHigh tourism potential due to natural beauty and\neco-tourism sites like Príncipe Island\nOpen Investment Environment‫ و‬Tax Incentives &\nSupport\nOIF / Lusophone institutional ties\n\nHigh Interest Rates (~10%)\nWeak Infrastructure\nDigital Inequality (Urban vs Rural)\nLand Concession System\nNo Registered Entity Yet & Registration\nRequirements\nPolitical Instability\nHigh immigration rates\nPolygamous household structures create canon\nlaw conflict at scale\nExtreme female poverty may trigger dependency\nrather than discipleship\nVisa and residency constraints for clergy\nCatholic Church institutional resistance", "references": [], "contentBlocks": [{"type": "text", "html": "<p>Chapter 5: SWOT Analysis</p>\n<p>Strengths</p>\n<p>Weaknesses</p>\n<p>Can provide the Bible in th ort OIF / Lusophone institutional ties</p>\n<p>High Interest Rates (~10%) Weak Infrastructure Digital Inequality (Urban vs Rural) Land Concession System No Registered Entity Yet & Registration Requirements Political Instability High immigration rates Polygamous household structures create canon law conflict at scale Extreme female poverty may trigger dependency rather than discipleship Visa and residency constraints for clergy Catholic Church institutional resistance</p>"}, {"type": "table", "html": "<div class=\"table-caption\">to 5.5 hours sunshine/day. Best for beaches, hiking, diving, and whale watching.</div><div class=\"table-wrap\"><table class=\"data-table\"><thead><tr><th></th><th>Season</th><th>Months</th><th>Climate &amp; Conditions</th></tr></thead><tbody><tr><td></td><td>Main Dry</td><td>June –</td><td>Best time to visit. August is the driest month. Ideal</td></tr><tr><td></td><td>Season</td><td>September</td><td>for moving around rural areas safely.</td></tr><tr><td></td><td>Short Wet</td><td>October –</td><td>Short bursts of rain. Averages 17 to 18 rainy days</td></tr><tr><td></td><td>Season</td><td>November</td><td>per month.</td></tr><tr><td></td><td>Short Dry</td><td>December –</td><td>Bright blue skies and clear weather. Highly</td></tr><tr><td></td><td>Season</td><td>February</td><td>recommended for outdoor work.</td></tr><tr><td>Long Wet Season</td><td>Long Wet March – May</td><td>March – May</td><td>Intense humidity and heavy rain. April is the</td></tr><tr><td></td><td>Season</td><td></td><td>wettest month, averaging 5.2 inches over 18.5</td></tr><tr><td></td><td></td><td></td><td>wet days.</td></tr></tbody></table></div>"}], "tables": [{"caption": "to 5.5 hours sunshine/day. Best for beaches, hiking, diving, and whale watching.", "headers": ["", "Season", "Months", "Climate & Conditions"], "rows": [["", "Main Dry", "June –", "Best time to visit. August is the driest month. Ideal"], ["", "Season", "September", "for moving around rural areas safely."], ["", "Short Wet", "October –", "Short bursts of rain. Averages 17 to 18 rainy days"], ["", "Season", "November", "per month."], ["", "Short Dry", "December –", "Bright blue skies and clear weather. Highly"], ["", "Season", "February", "recommended for outdoor work."], ["Long Wet Season", "Long Wet March – May", "March – May", "Intense humidity and heavy rain. April is the"], ["", "Season", "", "wettest month, averaging 5.2 inches over 18.5"], ["", "", "", "wet days."]]}]}]}, "6": {"name": "Stakeholders Mapping", "num": 6, "sections": [{"num": "6.1", "title": "Non-Governmental Organizations (NGOs)", "content": "6.1. Non-Governmental Organizations (NGOs)\nKey NGOs operating in STP with potential for partnership in mission work — social\nservices, healthcare, education, and community development.\n6.1.1 Caritas São Tomé and Príncipe\nField\n\nDetails\n\nContact\n\n+239 2222 565 | caritas_stp@cstome.net | caritas-africa.org\n\nSpecialty\n\nCharity — food programs, agricultural training, child welfare\n\nLocation\n(HQ)\n\nNo. 438, Via Portugal, São Tomé e Príncipe\n\nEstablishe\nd\n\n1981 (45 years operating in STP)\n\nKey\nImpact\n\nContributed to cancellation of STP's $317M external debt (2007).\nPrograms: food aid for the poor, agricultural youth training, sewing\nclasses, 'Maison des petits enfants' (child home for under-7s). Current\nproject: 'Bridge of Hope' — remote child sponsorship.\n\nDiocese\nStructure\n\nSingle diocese covering the whole country with 14 parishes (13 on\nSão Tomé, 1 on Príncipe)\n\nMission\nRelevanc\ne\n\nHigh — Catholic NGO with established community trust; potential for\nrespectful dialogue and joint social service projects\n\n6.1.2 Fundação Príncipe\nField\n\nDetails\n\nContact\n\n+239 9803640 | INFO@FUNDACAOPRINCIPE.ORG |\nfundacaoprincipe.org\n\nSpecialty\n\nMarine & terrestrial conservation; community engagement\n\nEstablish\ned\n\nApril 2015\n\n\fField\n\nDetails\n\nKey\nImpact\n\nFlora of Príncipe (plant documentation, rare species protection);\nPríncipe Thrush conservation; Obô Giant Snail protection; COBIO-NET\nmarine research; fisheries data & marine protection zones;\nalternative income & vocational training for local communities\n\nLinked To\n\nFounded through Mark Shuttleworth's HBD Príncipe initiative; also\nlinked to MOVE MOVE and Missão Dimix\n\nMission\nRelevanc\ne\n\nMedium — key partner for any Príncipe Island mission activity; strong\ncommunity credibility\n\n6.1.3 IFRC — São Tomé and Príncipe Red Cross\nField\n\nDetails\n\nWebsite\n\nifrc.org/national-societies-directory/sao-tome-and-principe-redcross\n\nSpecialty\n\nMedical and public health\n\nEstablishe\nd\n\n1976\n\n5 Regional\nBranches\n\nÁgua Grande · Lembá · Cantagalo · Caué · Príncipe\n\nKey Impact\n\nDisease awareness (dengue, HIV, COVID); emergency response\nteams; elderly medical center (20+ years) providing food, care and\npsychological support; direct collaboration with Ministry of Health\n\nMission\nRelevance\n\nHigh — healthcare mission partnership opportunities; covers all\ndistricts including Príncipe\n\n\f6.1.4 FAO — Food and Agriculture Organization\nField\n\nDetails\n\nContact\n\n(+39) 06 57051\n\nSpecialty\n\nAgriculture — sustainable farming, farmer training, food quality,\nincome improvement\n\nHQ\n(Regional)\n\nSubregional Office for Central Africa, Libreville, Gabon\n\nKey\nPrograms\n\nOrganic farming / agroecology; farmer skills training; food quality\nand nutrition improvement; agricultural income support\n\nMission\nRelevance\n\nLow-medium — useful for agricultural or food security components\nof mission social programs\n\n6.1.5 MOVE MOVE\nField\n\nDetails\n\nContact\n\nmoveong.pt\n\nSpecialty\n\nEntrepreneurship — fighting poverty through sustainable income\ngeneration\n\nHQ\n\nLisbon, Portugal (international NGO)\n\nEstablished\n\n2011\n\nMethodolog\ny\n\n3-phase: WAKE (ideate) → SHAKE (develop) → MAKE (launch and\nsustain)\n\nStatistics\n\n+1,300 people trained; +200 projects launched; operates via\nground-level volunteers\n\nMission\nRelevance\n\nMedium — vocational and entrepreneurship angle; useful for\neconomic empowerment within mission community outreach\n\n\f6.1.6 IMVF — Instituto Marquês de Valle Flôr\nField\n\nDetails\n\nContact\n\n+239 2222 199 (António Lima) | imvf.stp@imvf.org | imvf.org\n\nAddress\n\nAvenida Marginal 12 de Julho, Casa nr. 100Z, Caixa Postal 280\n\nEstablishe\nd in STP\n\n1988 (founded 1951 as Portuguese public utility institution)\n\nSpeciality\n\nDevelopment cooperation — healthcare, agriculture, education,\nenvironment\n\nHealthcare\nImpact\n\n'Health for All' (Saúde para Todos): national coverage from 2007;\ntelemedicine platform; ~1,282 health providers trained; NCD\nprotocols for diabetes and hypertension\n\nAgriculture\nImpact\n\nOrganic farming export support (cocoa, coffee); ~25% of agricultural\nland now organic; school feeding policy linked to local production\n\nEducation\nImpact\n\n~400 teachers supported; indirectly impacting 20,000+ students\n\nCOVID\nResponse\n\nKey implementation partner; secured €500,000+ for emergency\nresponse\n\nMission\nRelevance\n\nVery High — longest-standing and most impactful NGDO in STP;\nideal first partner contact; strong institutional track record\n\n6.1.7 Additional International Bodies\nOrganizatio\nn\n\nSpecialty\n\nContact / Website\n\nMission\nRelevance\n\nWACA\nProgram\n(World\nBank)\n\nCoastal\nadaptation,\ncommunity\nresilience,\nfisheries safety\n\nwaca@worldbank.org |\nwacaprogram.org\n\nLow —\nenvironmental\nfocus\n\nUNFPA São\nTomé\n\nReproductive\nhealth, family\n\n239 222 1529 | unfpa.org\n| facebook: unfpasaotome\n\nMedium —\nyouth and\nwomen's\n\n\fOrganizatio\nn\n\nSpecialty\n\nContact / Website\n\nplanning, gender\n& youth\n\nMission\nRelevance\nprogramming\nalignment\n\nUN MultiPartner\nTrust Fund\n\nSDG pooled\nfunding; $8.4M\ninvested since\n2016\n\nmptf.undp.org/country/saotome-and-principe\n\nLow-medium —\nfunding\nintelligence only\n\nUNICEF São\nTomé\n\nChild rights,\neducation,\nhealth\n\nunicef.stp@gmail.com |\nfacebook:\nunicefsaotomeeprincipe |\n9.7K followers\n\nMedium — child\nwelfare\nalignment\n\nUNDP /\nPNUD STP\n\nDevelopment;\nSDGs\n\nregistry.st@undp.org | 239\n984 8158 | 7.8K followers\n\nLow —\ninstitutional\nawareness only\n\n\f6.2. Public Figures and Key Individuals\nInfluential individuals and families whose engagement may facilitate mission entry,\ncommunity trust, and civic dialogue.\n\nName /\nEntity\n\nLink / Contact\n\nSpeciality\n\nKey Notes\n\nMission\nRelevan\nce\n\nEntreprene\nurship Gov.\nPortal (STP)\n\nempreendedorismo.go\nv.st | 2392223024 |\ngeral@empreendedori\nsmostp.st\n\nTourism /\nEntreprene\nurship\n\nState body;\nfunded 26\nprojects up to\n$5,000 each;\nestablished\n2021 on Av.\nMarginal 12 de\nJulho\n\nMedium\n—\npotentia\nl\ninterloc\nutor for\nmission\neconom\nic\nprojects\n\nMark\nShuttlewort\nh (HBD\nPríncipe)\n\nhbdprincipe.com |\ngeral@hbdprincipe.co\nm\n\nTourism /\nConservatio\nn\n\nSouth African\nbillionaire; first\nAfrican space\ntourist;\nfounded HBD\nPríncipe and\nFundação\nPríncipe;\nNatural\nDividend\nproject (60%\ncommunity\nparticipation).\nDescribed by\nresidents as\n'the man on the\nmoon'.\n\nHigh\n(Príncip\ne) —\nmost\ninfluenti\nal\nforeign\nfigure\non\nPríncipe\nIsland\n\nREINA São\nTomé\n\ninstagram: reina.stp |\n2223024 |\nreina.stp@gmail.com\n\nInnovation\nHub\n\nPhysical coworking space,\nincubator,\ntraining centre\nand event\nvenue;\n\nMedium\n—\ncommu\nnity hub\nfor\nnetwork\n\n\fName /\nEntity\n\nLink / Contact\n\nSpeciality\n\nKey Notes\n\nMission\nRelevan\nce\n\nestablished\n2022 in capital\n\ning;\nuseful\nfor\nhosting\nevents\n\nConceição\nLima\n\nfacebook:\nconceicao.lima.967\n\nCulture /\nLiterature\n\nContemporary\npoet; one of the\nmost important\nliterary voices\nin STP; also\njournalist\n\nMedium\n—\npotentia\nl guest\nspeaker,\ncultural\nbridge\n\nOlinda Beja\n\nfacebook: Olinda-Beja\n\nCulture /\nLiterature\n\nSantomean\nwriter and\npoet; lives\nbetween STP\nand Europe\n\nMedium\n—\nstorytell\ning and\ncultural\nsessions\n\nTropicalme\nnte São\nTomé\n\ninstagram:\ntropicalmente_sao_to\nme\n\nSocial\nMedia\nInfluencer\n\nOne of the\nmost prominent\nSTP social\nmedia\ninfluencers;\n22.8K followers;\nruns\ndescubrasaoto\nme.com\n\nHigh —\nfirst\ncontact\nfor\ndigital\nvisibility\n; can\ndocume\nnt\nmission\nactivitie\ns\n\nTrovoada\nFamily\n\nfacebook:\npatrice.trovoada.oficia\nl\n\nPolitical\nPower\n\nMost powerful\npolitical family\nin STP;\ncurrently in\ngovernment\n\nHigh —\nofficial\nfacilitati\non,\noperatio\nnal\n\n\fName /\nEntity\n\nLink / Contact\n\nSpeciality\n\nKey Notes\n\nMission\nRelevan\nce\nprotecti\non\n\nVila Nova\nFamily\n\nFacebook:\ncarlosvilanovapresiden\nte\n\nPolitical\nPower\n\nPresidential\nfamily; very\nhigh political\ninfluence\n\nMedium\n—\ninstituti\nonal\nawaren\ness;\napproac\nh via\nformal\nchannel\ns\n\nMestiços /\nFilhos da\nTerra\n\nLinked to REINA,\nEmpreende+, MOVE\n\nSocial Fabric\n\nMixed AfricanPortuguese\ndescent; known\nas 'sons of the\nland';\nfoundational\nsocial group\n\nHigh —\nprimary\ncommu\nnity to\nwork\nwith\n\nForros\n\nLinked to REINA,\nEmpreende+, MOVE\n\nSocial Fabric\n\nDescendants of\nfreed slaves;\nindigenous\npopulation core\n\nHigh —\nthe\ncommu\nnity that\nwill\npractical\nly be\nengaged\n\n\f6.3. Healthcare Infrastructure\nMapped healthcare facilities across both islands. Contacts marked N/A are to be\ngathered during the first mission visit.\n\n📌 Data to be gathered during the first mission visit. Fields marked N/A or left\nblank will be verified and completed on-site.", "references": [], "contentBlocks": [{"type": "text", "html": "<p>6.1. Non-Governmental Organizations (NGOs) Key NGOs operating in STP with potential for partnership in mission work — social services, healthcare, education, and community development.</p>"}, {"type": "text", "html": "<h3 class=\"content-h\">6.1.1 Caritas São Tomé and Príncipe</h3>\n<p>Field</p>\n<p>Details </p>"}], "tables": [{"caption": "6.7. Media and Social Media Landscape", "headers": ["Name", "Platform / Contact", "Specialty", "Follow", "Mission"], "rows": [["", "", "", "ing", "Use"], ["TVS – Televisão Santomen se TVS –", "Facebook: tvs.st | +239 222 1041 | tvs.st Facebook: tvs.st | +239 222", "National TV broadcaster National TV 58K Faceb ook", "58K", "High —"], ["Televisão", "1041 | tvs.st", "broadcaster", "Faceb", "primary"], ["Santomen", "", "", "ook", "broadcast"], ["se", "", "", "", "medium in"], ["", "", "", "", "STP;"], ["", "", "", "", "approach"], ["", "", "", "", "for mission"]]}]}]}, "7": {"name": "Biblical and Spiritual Mapping", "num": 7, "sections": [{"num": "7.1", "title": "Overview: Dominant Beliefs", "content": "7.1. Overview: Dominant Beliefs\nSão Tomé and Príncipe presents a layered religious landscape shaped by five\ncenturies of Portuguese colonialism, the forced migration of West and Central\nAfrican slaves, post-independence secularism, and a recent wave of evangelical\nProtestant missions. The following demographic picture is the essential baseline for\nany mission strategy.\nReligious Group\n\nEstimated Share\n\nRoman Catholic\n\n63 – 85% (varies by source)\n\nProtestant / Evangelical\n\n8 – 23%\n\nMuslim\n\n1 – 3% (growing)\n\nBahá'í\n\n~2%\n\nAtheist / Non-religious\n\n~2 – 18%\n\nJewish (historical heritage)\n\n<1%\n\nAfrican Traditional (as primary identity)\n\n<2% formal, but widespread as\noverlay\n\nNote: Figures vary significantly across sources and survey years (2002–2023). The\ngap between self-declared affiliation and actual practice is especially wide in this\ncountry due to deep-rooted syncretism.", "references": [], "contentBlocks": [{"type": "text", "html": "<p>7.1. Overview: Dominant Beliefs São Tomé and Príncipe presents a layered religious landscape shaped by five centuries of Portuguese colonialism, the forced migration of West and Central African slaves, post-independence secularism, and a recent wave of evangelical Protestant missions. The following demographic picture is the essential baseline for any mission strategy. Religious Group</p>\n<p>Estimated Share</p>\n<p>Roman Catholic</p>"}, {"type": "table", "html": "<div class=\"table-caption\">7.1. Overview: Dominant Beliefs</div><div class=\"table-wrap\"><table class=\"data-table\"><thead><tr><th></th><th>Religious Group</th><th>Estimated Share</th></tr></thead><tbody><tr><td></td><td>Roman Catholic</td><td>63 – 85% (varies by source)</td></tr><tr><td></td><td>Protestant / Evangelical</td><td>8 – 23%</td></tr><tr><td></td><td>Muslim</td><td>1 – 3% (growing)</td></tr><tr><td></td><td>Bahá&#x27;í</td><td>~2%</td></tr><tr><td></td><td>Atheist / Non-religious</td><td>~2 – 18%</td></tr><tr><td></td><td>Jewish (historical heritage)</td><td>&lt;1%</td></tr><tr><td>African Traditional (as primary identity)</td><td>African Traditional (as primary identity)</td><td>&lt;2% formal, but widespread as</td></tr><tr><td></td><td></td><td>overlay</td></tr></tbody></table></div>"}, {"type": "text", "html": "<h3 class=\"content-h\">63 – 85% (varies by source)</h3>\n<p>Protestant / Evangelical</p>"}, {"type": "text", "html": "<h3 class=\"content-h\">8 – 23%</h3>\n<p>Muslim</p>"}, {"type": "text", "html": "<h3 class=\"content-h\">1 – 3% (growing)</h3>\n<p>Bahá'í</p>\n<p>~2%</p>\n<p>Atheist / Non-religious</p>\n<p>~2 – 18%</p>\n<p>Jewish (historical heritage)</p>\n<p><1%</p>\n<p>African Traditional (as primary identity)</p>\n<p><2% formal, but widespread as overlay</p>\n<p>Note: Figures vary significantly across sources and survey years (2002–2023). The gap between self-declared affiliation and actual practice is especially wide in this country due to deep-rooted syncretism.</p>"}], "tables": [{"caption": "7.1. Overview: Dominant Beliefs", "headers": ["", "Religious Group", "Estimated Share"], "rows": [["", "Roman Catholic", "63 – 85% (varies by source)"], ["", "Protestant / Evangelical", "8 – 23%"], ["", "Muslim", "1 – 3% (growing)"], ["", "Bahá'í", "~2%"], ["", "Atheist / Non-religious", "~2 – 18%"], ["", "Jewish (historical heritage)", "<1%"], ["African Traditional (as primary identity)", "African Traditional (as primary identity)", "<2% formal, but widespread as"], ["", "", "overlay"]]}]}, {"num": "7.2", "title": "Non-Christian Religions: What People Worship and Their Rites", "content": "7.2. Non-Christian Religions: What People Worship and Their Rites\nDespite the overwhelming nominal Christianity, several distinct non-Christian or\npara-Christian religious traditions are present and mission-relevant.\n7.2.1 African Traditional Religion (ATR) — Animism, Totemism, Ancestral Cult\nThe African religious substrate of São Tomé and Príncipe was introduced through\ncenturies of slave imports from Benin, the Congo Basin, Angola, and coastal West\nAfrica. Although most adherents today would identify simultaneously as Catholic or\nProtestant, African Traditional Religion persists as a living system — not merely a\nrelic.\nWhat they worship:\nAncestral spirits (the dead, called Nén ké Mu) — believed to protect the\nliving, guide decisions, and require propitiation through offerings of food,\nwine, and clothing.\n● Nature spirits inhabiting sacred spaces (rivers, trees, specific geographic sites)\n— these spirits are consulted for fertility, healing, and protection.\n●\n\n\f●\n\nA supreme creator figure identified in the creole tradition as Sum d'Océ\n(\"Lord of the Heavens\") — syncretized with the Christian God but also\ncontrolling wealth and social order.\n\nTheir rites and rituals:\nOfferings and libations: food, fermented beverages, tobacco, and clothing\nplaced at shrines or grave sites to honour ancestors and solicit their\nintervention.\n● Consultation of traditional medicine men (ritual specialists / diviners) — still\nactive and publicly accepted — for healing, divination, and protection from\nmalevolent spirits.\n● Witchcraft and sorcery: widely believed in across all social classes, practiced\nprivately, and not regarded by most practitioners as incompatible with\nChristian identity.\n● Mortuary cult: elaborate funeral rites, prolonged mourning ceremonies, and\ngrave-site rituals are critical to maintaining the bond between the living and\nthe ancestral world.\n●\n\n⚑ Key Mission Observation\nAfrican Traditional Religion in São Tomé is rarely practiced as a separate formal\nsystem. It operates as an invisible layer beneath Catholic or Protestant\nprofession. People attend Mass or Sunday worship, then consult a traditional\nhealer or hold an ancestral rite the same week. This dual-track spirituality is the\ndefining pastoral challenge for any mission presence.\n\n\f7.2.2 Islam\nIslam represents a small but measurably growing community, concentrated among\nrecent migrants.\n●\n●\n●\n\n●\n●\n\nEstimated 1–3% of the total population (~2,000–6,000 people as of 2020s).\nComposition: almost entirely migrants from Nigeria and Cameroon; very\nlimited conversion of indigenous Santomeans.\nPractice: predominantly Sunni, basic mosque observance (Friday prayer,\nRamadan fasting, halal dietary practice). No evidence of Sufi or syncretic submovements.\nSocial profile: economically concentrated in trade and petty commerce in São\nTomé city; generally well-integrated but culturally distinct.\nInstitutional presence: small mosques exist; the community has grown\nnotably in the last decade but remains without significant political or cultural\ninfluence.\n\n⚑ Mission Context\nThe Muslim population is almost entirely immigrant and transient. No significant\nhistorical Islamic rooting exists in Santomean culture. Evangelistic sensitivity\nshould acknowledge the community's migrant vulnerability rather than treating\nIslam as a structurally embedded opponent.\n\n7.2.3 Bahá’í Faith\nThe Bahá'í community, at approximately 2% of the population, is notable given the\nsmall total population (~230,000). The faith arrived through deliberate 20th-century\nmissionary expansion into small island nations. Its emphasis on unity of religions,\nracial equality, and community education gives it particular appeal among educated\nurban Santomeans.\nWorship: community gatherings (devotional meetings), study circles, and\nchildren's classes. No temples; worship is home/community based.\n● Belief: God is one; all major prophets (including Christ and Muhammad) are\nmanifestations of one divine reality; Bahá'u'lláh is the most recent. Progressive\nrevelation is the core theological framework.\n●\n\n\f●\n\nNo liturgical priesthood; elected local and national administrative bodies\ngovern community life.\n\n7.2.4 Mana — An Afro-Creole Belief System\nA less well-documented but historically present belief in São Tomé is the so-called\nMana belief system — a term referring to an impersonal supernatural force or\nenergy that can reside in persons, objects, and natural places. This concept, possibly\nintroduced through contact with Polynesian-influenced Portuguese colonial\nnetworks, posits:\nSupernatural power (mana) that attaches to certain individuals, spirits, and\nsacred objects.\n● Ritual practice designed to channel or appease this force, often overlapping\nwith African animist practice.\n● It functions not as an organized religion but as a cosmological background\nassumption shared across ATR practitioners and some syncretized Catholics.\n●\n\n\f7.3. Syncretism: The Central Religious Reality of São Tomé\nSyncretism is not a marginal phenomenon in São Tomé and Príncipe — it is the\ndominant religious reality. This is the single most important fact for the Coptic\nOrthodox mission to understand and engage.", "references": [], "contentBlocks": [{"type": "text", "html": "<p>7.2. Non-Christian Religions: What People Worship and Their Rites Despite the overwhelming nominal Christianity, several distinct non-Christian or para-Christian religious traditions are present and mission-relevant.</p>"}, {"type": "text", "html": "<h3 class=\"content-h\">7.2.1 African Traditional Religion (ATR) — Animism, Totemism, Ancestral Cult</h3>\n<p>The African religious substrate of São Tomé and Príncipe was introduced through centuries of slave imports from Benin, the Congo Basin, Angola, and coastal West Africa. Although most adherents today would identify simultaneously as Catholic or Protestant, African Traditional Religion persists as a living system — not merely a relic. What they worship: Ancestral spirits (the dead, called Nén ké Mu) — believed to protect the living, guide decisions, and require propitiation through offerings of food, wine, and clothing.</p>\n<ul class=\"bullets\">\n<li>● Nature spirits inhabiting sacred spaces (rivers, trees, specific geographic sites)</li>\n<p>— these spirits are consulted for fertility, healing, and protection. ●</p>\n</ul>\n<p>●</p>\n<p>A supreme creator figure identified in the creole tradition as Sum d'Océ (\"Lord of the Heavens\") — syncretized with the Christian God but also controlling wealth and social order.</p>\n<p>Their rites and rituals: Offerings and libations: food, fermented beverages, tobacco, and clothing placed at shrines or grave sites to honour ancestors and solicit their intervention.</p>\n<ul class=\"bullets\">\n<li>● Consultation of traditional medicine men (ritual specialists / diviners) — still</li>\n<p>active and publicly accepted — for healing, divination, and protection from malevolent spirits.</p>\n<li>● Witchcraft and sorcery: widely believed in across all social classes, practiced</li>\n<p>privately, and not regarded by most practitioners as incompatible with Christian identity.</p>\n<li>● Mortuary cult: elaborate funeral rites, prolonged mourning ceremonies, and</li>\n<p>grave-site rituals are critical to maintaining the bond between the living and the ancestral world. ●</p>\n</ul>\n<p>⚑ Key Mission Observation African Traditional Religion in São Tomé is rarely practiced as a separate formal system. It operates as an invisible layer beneath Catholic or Protestant profession. People attend Mass or Sunday worship, then consult a traditional healer or hold an ancestral rite the same week. This dual-track spirituality is the defining pastoral challenge for any mission presence.</p>"}, {"type": "text", "html": "<h3 class=\"content-h\">7.2.2 Islam</h3>\n<p>Islam represents a small but measurably growing community, concentrated among recent migrants. ● ● ●</p>\n<p>● ●</p>\n<p>Estimated 1–3% of the total population (~2,000–6,000 people as of 2020s). Composition: almost entirely migrants from Nigeria and Cameroon; very limited conversion of indigenous Santomeans. Practice: predominantly Sunni, basic mosque observance (Friday prayer, Ramadan fasting, halal dietary practice). No evidence of Sufi or syncretic submovements. Social profile: economically concentrated in trade and petty commerce in São Tomé city; generally well-integrated but culturally distinct. Institutional presence: small mosques exist; the community has grown notably in the last decade but remains without significant political or cultural influence.</p>\n<p>⚑ Mission Context The Muslim population is almost entirely immigrant and transient. No significant historical Islamic rooting exists in Santomean culture. Evangelistic sensitivity should acknowledge the community's migrant vulnerability rather than treating Islam as a structurally embedded opponent.</p>"}, {"type": "text", "html": "<h3 class=\"content-h\">7.2.3 Bahá’í Faith</h3>\n<p>The Bahá'í community, at approximately 2% of the population, is notable given the small total population (~230,000). The faith arrived through deliberate 20th-century missionary expansion into small island nations. Its emphasis on unity of religions, racial equality, and community education gives it particular appeal among educated urban Santomeans. Worship: community gatherings (devotional meetings), study circles, and children's classes. No temples; worship is home/community based.</p>\n<ul class=\"bullets\">\n<li>● Belief: God is one; all major prophets (including Christ and Muhammad) are</li>\n<p>manifestations of one divine reality; Bahá'u'lláh is the most recent. Progressive revelation is the core theological framework. ●</p>\n</ul>\n<p>●</p>\n<p>No liturgical priesthood; elected local and national administrative bodies govern community life.</p>"}, {"type": "text", "html": "<h3 class=\"content-h\">7.2.4 Mana — An Afro-Creole Belief System</h3>\n<p>A less well-documented but historically present belief in São Tomé is the so-called Mana belief system — a term referring to an impersonal supernatural force or energy that can reside in persons, objects, and natural places. This concept, possibly introduced through contact with Polynesian-influenced Portuguese colonial networks, posits: Supernatural power (mana) that attaches to certain individuals, spirits, and sacred objects.</p>\n<ul class=\"bullets\">\n<li>● Ritual practice designed to channel or appease this force, often overlapping</li>\n<p>with African animist practice.</p>\n<li>● It functions not as an organized religion but as a cosmological background</li>\n<p>assumption shared across ATR practitioners and some syncretized Catholics. ●</p>\n</ul>\n<p>7.3. Syncretism: The Central Religious Reality of São Tomé Syncretism is not a marginal phenomenon in São Tomé and Príncipe — it is the dominant religious reality. This is the single most important fact for the Coptic Orthodox mission to understand and engage.</p>"}], "tables": []}, {"num": "7.3", "title": "Syncretism: The Central Religious Reality", "content": "7.3.1 The Historical Formation of Syncretism\nSyncretism emerged because:\nSlaves brought from across West and Central Africa retained animist,\nancestral, and totemic beliefs even after forced Catholic baptism.\n● The islands' geographic isolation from Lisbon and Rome allowed Catholic\npractice to evolve independently for centuries without close doctrinal\nsupervision.\n● Early colonial chapel-building by plantation labourers combined rough-cut\ncrosses with African charms — a physical embodiment of the syncretic fusion.\n● Catholic missionaries often chose not to confront traditional practices,\nespecially among contract labourers. Conversion was nominal; indigenous\nspirituality was never fully displaced.\n●\n\n7.3.2 How Syncretism Manifests Today\nContemporary Santomean syncretism is best understood through three observable\npatterns:\nPattern 1: Dual Allegiance (Catholic + ATR)\nThe majority of Santomeans who identify as Catholic simultaneously hold beliefs in:\nAncestral spirits that must be propitiated at family rites and funerals.\n● Witchcraft, sorcery, and evil-eye as real forces requiring protective rituals.\n● Traditional medicine men as legitimate healers operating alongside medical\nand clerical authority.\n●\n\nThe Catholic Church's veneration of saints was historically interpreted through an\nAfrican lens: saints were mapped onto ancestral spirits and African deities. The Virgin\nMary (Nossa Senhora Mãe de Deus) occupies a particularly prominent place, likely\nbecause her mediating role resonated with ancestral spirit intercession theology.\nPattern 2: The Djambí Ritual (Spirit Possession)\nThe most documented and visible expression of syncretic practice in São Tomé is the\nDjambí — a communal healing and ancestral appeasement ritual performed by the\nForro ethnic group (the largest indigenous ethnic group, whose name derives from\nthe Portuguese for 'freed slave').\nDimension\n\nDescription\n\nPurpose\n\nHealing the sick; appeasing ancestral spirits; collective grief\nprocessing and communal restoration.\n\n\fStructure\n\nMulti-day ceremony beginning with a Catholic Mass in a church,\nfollowed by a procession, community gathering, sustained\ndrumming and dancing, trance/possession states, and collective\nexhaustion — a two-day embodied process, not a single\nperformance.\n\nOfferings\n\nFood, alcoholic beverages, tobacco, and sweets presented to the\nancestral spirits during the ritual. Music is integral to the sacred\natmosphere.\n\nPossession\n\nParticipants enter trance states induced by rhythmic drumming;\nancestral spirits are believed to possess individuals who become\nvessels for spirit communication and healing. Witnessed by the\nentire community.\n\nCatholic\nIntegration\n\nCeremony begins inside a Catholic church. Participants identify as\nCatholic. The ritual is not perceived as a contradiction of their\nChristian identity — it is experienced as a complementary sacred\npractice.\n\n⚑ Theological Significance for the Coptic Mission\nDjambí represents a direct biblical point of engagement: the Scriptures speak\nextensively about the reality of the spirit world, the dangers of consulting spirits\nof the dead (Deuteronomy 18:10–12; Isaiah 8:19), and the liberating power of\nChrist over spiritual bondage. The Coptic tradition's rich pneumatology,\nexorcistic liturgy, and patristic teaching on spiritual warfare (particularly in the\ndesert father tradition and St. Athanasius's De Incarnatione) offer theological\nresources that directly address — rather than dismiss — the spiritual experience\nunderlying Djambí.\n\nPattern 3: Religio-Social Brotherhoods\nMost Santomeans — across denominations — belong to local religious brotherhoods\nor sisterhoods (confraternities) that organize patron saint festivals, community\nmutual aid, and social control. These bodies blend Catholic parish structure with\nAfrican communal solidarity traditions, and their festivals typically combine liturgical\ncelebration with music, dance, and communal feasting that carries ATR resonances.", "references": [], "contentBlocks": [{"type": "text", "html": "<h3 class=\"content-h\">7.3.1 The Historical Formation of Syncretism</h3>\n<p>Syncretism emerged because: Slaves brought from across West and Central Africa retained animist, ancestral, and totemic beliefs even after forced Catholic baptism.</p>\n<ul class=\"bullets\">\n<li>● The islands' geographic isolation from Lisbon and Rome allowed Catholic</li>\n<p>practice to evolve independently for centuries without close doctrinal supervision.</p>\n<li>● Early colonial chapel-building by plantation labourers combined rough-cut</li>\n<p>crosses with African charms — a physical embodiment of the syncretic fusion.</p>\n<li>● Catholic missionaries often chose not to confront traditional practices,</li>\n<p>especially among contract labourers. Conversion was nominal; indigenous spirituality was never fully displaced. ●</p>\n</ul>"}, {"type": "text", "html": "<h3 class=\"content-h\">7.3.2 How Syncretism Manifests Today</h3>\n<p>Contemporary Santomean syncretism is best understood through three observable patterns: Pattern 1: Dual Allegiance (Catholic + ATR) The majority of Santomeans who identify as Catholic simultaneously hold beliefs in: Ancestral spirits that must be propitiated at family rites and funerals.</p>\n<ul class=\"bullets\">\n<li>● Witchcraft, sorcery, and evil-eye as real forces requiring protective rituals.</li>\n<li>● Traditional medicine men as legitimate healers operating alongside medical</li>\n<p>and clerical authority. ●</p>\n</ul>\n<p>The Catholic Church's veneration of saints was historically interpreted through an African lens: saints were mapped onto ancestral spirits and African deities. The Virgin Mary (Nossa Senhora Mãe de Deus) occupies a particularly prominent place, likely because her mediating role resonated with ancestral spirit intercession theology. Pattern 2: The Djambí Ritual (Spirit Possession) The most documented and visible expression of syncretic practice in São Tomé is the Djambí — a communal healing and ancestral appeasement ritual performed by the Forro ethnic group (the largest indigenous ethnic group, whose name derives from the Portuguese for 'freed slave'). Dimension</p>\n<p>Description</p>\n<p>Purpose</p>\n<p>Healing the sick; appeasing ancestral spirits; collective grief processing and communal restoration.</p>\n<p>Structure</p>\n<p>Multi-day ceremony beginning with a Catholic Mass in a church, followed by a procession, community gathering, sustained drumming and dancing, trance/possession states, and collective exhaustion — a two-day embodied process, not a single performance.</p>\n<p>Offerings</p>\n<p>Food, alcoholic beverages, tobacco, and sweets presented to the ancestral spirits during the ritual. Music is integral to the sacred atmosphere.</p>\n<p>Possession</p>\n<p>Participants enter trance states induced by rhythmic drumming; ancestral spirits are believed to possess individuals who become vessels for spirit communication and healing. Witnessed by the entire community.</p>\n<p>Catholic Integration</p>\n<p>Ceremony begins inside a Catholic church. Participants identify as Catholic. The ritual is not perceived as a contradiction of their Christian identity — it is experienced as a complementary sacred practice.</p>\n<p>⚑ Theological Significance for the Coptic Mission Djambí represents a direct biblical point of engagement: the Scriptures speak extensively about the reality of the spirit world, the dangers of consulting spirits of the dead (Deuteronomy 18:10–12; Isaiah 8:19), and the liberating power of Christ over spiritual bondage. The Coptic tradition's rich pneumatology, exorcistic liturgy, and patristic teaching on spiritual warfare (particularly in the desert father tradition and St. Athanasius's De Incarnatione) offer theological resources that directly address — rather than dismiss — the spiritual experience underlying Djambí.</p>\n<p>Pattern 3: Religio-Social Brotherhoods Most Santomeans — across denominations — belong to local religious brotherhoods or sisterhoods (confraternities) that organize patron saint festivals, community mutual aid, and social control. These bodies blend Catholic parish structure with African communal solidarity traditions, and their festivals typically combine liturgical celebration with music, dance, and communal feasting that carries ATR resonances.</p>"}, {"type": "table", "html": "<div class=\"table-caption\">7.3.2</div><div class=\"table-wrap\"><table class=\"data-table\"><thead><tr><th></th><th>Dimension</th><th>Description</th></tr></thead><tbody><tr><td>Purpose</td><td>Purpose</td><td>Healing the sick; appeasing ancestral spirits; collective grief</td></tr><tr><td></td><td></td><td>processing and communal restoration.</td></tr></tbody></table></div>"}], "tables": [{"caption": "7.3.2", "headers": ["", "Dimension", "Description"], "rows": [["Purpose", "Purpose", "Healing the sick; appeasing ancestral spirits; collective grief"], ["", "", "processing and communal restoration."]]}]}, {"num": "7.4", "title": "Are People Genuinely Christian or Christian by Name Only?", "content": "7.4. Are People Genuinely Christian or Christian by Name Only?\nThis is the most theologically sensitive and practically decisive question for\nmissionary planning. The honest answer, based on available evidence, is: the\npopulation is substantially Christian by name and cultural inheritance, but unevenly\nChristian by transformative personal faith and consistent practice.\n\n\f7.4.1 Indicators of Genuine Christian Practice\nChurch attendance is high and socially normative. In many communities,\nSunday worship, baptism, marriage in church, and funeral Mass are\nconsidered obligatory social acts — not merely optional.\n● The Protestant and evangelical churches (Seventh-Day Adventists, Assemblies\nof God, Universal Church of Christ, Jehovah's Witnesses) have growing, often\nmore conversionist memberships with more explicit personal faith\ncommitment.\n● Local religious brotherhoods and sisterhoods organise active community\ncare, education, and social support through parish structures — evidence of\nlived Christian community.\n● The Catholic Church has been present continuously since the late 15th\ncentury; Christianity is deeply woven into the cultural memory and identity of\nthe indigenous Forro and Angolar ethnic groups.\n●\n\n7.4.2 Indicators of Nominal or Syncretic Christianity\nThe simultaneous practice of Djambí and Mass attendance by the same\nindividuals and families is well-documented. Many practicing Catholics\nconsult traditional healers, hold ancestral offering rites, and believe in\nwitchcraft as a real and operative force.\n● Doctrinal knowledge is typically shallow for the majority. Church membership\noften functions as inherited social identity (\"I am Catholic because my family\nis Catholic\") rather than catechetical formation.\n● The clergy are predominantly imported from Europe, with limited pastoral\npresence at the village level. For much of the island's history, mission to\nlabourers and the rural poor was neglected.\n● The growth of the non-religious/atheist segment (estimated 2–18% in\ndifferent surveys) may reflect disillusionment with nominal Catholicism\nwithout genuine evangelical conversion.\n●\n\n⚑ Assessment for Coptic Mission Planning\nThe field is not an unreached pagan population, but nor is it a doctrinally formed\nChristian community. It is a mission field characterised by: (1) strong nominal\nChristianity requiring deepening, (2) active ATR syncretism requiring biblical\npastoral response, (3) a growing Protestant evangelical presence offering\npotential partnership, and (4) a small Muslim community requiring culturally\nsensitive approach. The primary challenge is not initial evangelism but\ncatechesis, discipleship, and the pastoral dismantling of syncretic practices\nthrough loving, sustained community presence.\n\n\f7.5. Catholic churches distribution", "references": [], "contentBlocks": [{"type": "text", "html": "<p>7.4. Are People Genuinely Christian or Christian by Name Only? This is the most theologically sensitive and practically decisive question for missionary planning. The honest answer, based on available evidence, is: the population is substantially Christian by name and cultural inheritance, but unevenly Christian by transformative personal faith and consistent practice.</p>"}, {"type": "table", "html": "<div class=\"table-caption\">7.4</div><div class=\"table-wrap\"><table class=\"data-table\"><thead><tr><th>Structure</th><th>Multi-day ceremony beginning with a Catholic Mass in a church,</th></tr></thead><tbody><tr><td></td><td>followed by a procession, community gathering, sustained</td></tr><tr><td></td><td>drumming and dancing, trance/possession states, and collective</td></tr><tr><td></td><td>exhaustion — a two-day embodied process, not a single</td></tr><tr><td></td><td>performance.</td></tr><tr><td>Offerings Offerings</td><td>Food, alcoholic beverages, tobacco, and sweets presented to the</td></tr><tr><td></td><td>ancestral spirits during the ritual. Music is integral to the sacred</td></tr><tr><td></td><td>atmosphere.</td></tr><tr><td>Possession Possession</td><td>Participants enter trance states induced by rhythmic drumming;</td></tr><tr><td></td><td>ancestral spirits are believed to possess individuals who become</td></tr><tr><td></td><td>vessels for spirit communication and healing. Witnessed by the</td></tr><tr><td></td><td>entire community.</td></tr><tr><td>Catholic Integration Catholic</td><td>Ceremony begins inside a Catholic church. Participants identify as</td></tr><tr><td>Integration</td><td>Catholic. The ritual is not perceived as a contradiction of their</td></tr><tr><td></td><td>Christian identity — it is experienced as a complementary sacred</td></tr><tr><td></td><td>practice.</td></tr></tbody></table></div>"}, {"type": "text", "html": "<h3 class=\"content-h\">7.4.1 Indicators of Genuine Christian Practice</h3>\n<p>Church attendance is high and socially normative. In many communities, Sunday worship, baptism, marriage in church, and funeral Mass are considered obligatory social acts — not merely optional.</p>\n<ul class=\"bullets\">\n<li>● The Protestant and evangelical churches (Seventh-Day Adventists, Assemblies</li>\n<p>of God, Universal Church of Christ, Jehovah's Witnesses) have growing, often more conversionist memberships with more explicit personal faith commitment.</p>\n<li>● Local religious brotherhoods and sisterhoods organise active community</li>\n<p>care, education, and social support through parish structures — evidence of lived Christian community.</p>\n<li>● The Catholic Church has been present continuously since the late 15th</li>\n<p>century; Christianity is deeply woven into the cultural memory and identity of the indigenous Forro and Angolar ethnic groups. ●</p>\n</ul>"}, {"type": "text", "html": "<h3 class=\"content-h\">7.4.2 Indicators of Nominal or Syncretic Christianity</h3>\n<p>The simultaneous practice of Djambí and Mass attendance by the same individuals and families is well-documented. Many practicing Catholics consult traditional healers, hold ancestral offering rites, and believe in witchcraft as a real and operative force.</p>\n<ul class=\"bullets\">\n<li>● Doctrinal knowledge is typically shallow for the majority. Church membership</li>\n<p>often functions as inherited social identity (\"I am Catholic because my family is Catholic\") rather than catechetical formation.</p>\n<li>● The clergy are predominantly imported from Europe, with limited pastoral</li>\n<p>presence at the village level. For much of the island's history, mission to labourers and the rural poor was neglected.</p>\n<li>● The growth of the non-religious/atheist segment (estimated 2–18% in</li>\n<p>different surveys) may reflect disillusionment with nominal Catholicism without genuine evangelical conversion. ●</p>\n</ul>\n<p>⚑ Assessment for Coptic Mission Planning The field is not an unreached pagan population, but nor is it a doctrinally formed Christian community. It is a mission field characterised by: (1) strong nominal Christianity requiring deepening, (2) active ATR syncretism requiring biblical pastoral response, (3) a growing Protestant evangelical presence offering potential partnership, and (4) a small Muslim community requiring culturally sensitive approach. The primary challenge is not initial evangelism but catechesis, discipleship, and the pastoral dismantling of syncretic practices through loving, sustained community presence.</p>\n<p>7.5. Catholic churches distribution</p>"}], "tables": [{"caption": "7.4", "headers": ["Structure", "Multi-day ceremony beginning with a Catholic Mass in a church,"], "rows": [["", "followed by a procession, community gathering, sustained"], ["", "drumming and dancing, trance/possession states, and collective"], ["", "exhaustion — a two-day embodied process, not a single"], ["", "performance."], ["Offerings Offerings", "Food, alcoholic beverages, tobacco, and sweets presented to the"], ["", "ancestral spirits during the ritual. Music is integral to the sacred"], ["", "atmosphere."], ["Possession Possession", "Participants enter trance states induced by rhythmic drumming;"], ["", "ancestral spirits are believed to possess individuals who become"], ["", "vessels for spirit communication and healing. Witnessed by the"], ["", "entire community."], ["Catholic Integration Catholic", "Ceremony begins inside a Catholic church. Participants identify as"], ["Integration", "Catholic. The ritual is not perceived as a contradiction of their"], ["", "Christian identity — it is experienced as a complementary sacred"], ["", "practice."]]}]}, {"num": "7.6", "title": "Key Conclusions and Mission Implications", "content": "7.6. Key Conclusions and Mission Implications\nFinding\n\nMission Implication\n\nDominant nominal\nCatholicism with active\nATR syncretism\n\nPriority is catechesis and pastoral formation, not only\nevangelism. A presence-based, community-rooted\nmodel is required.\n\nDjambí ritual involves\nspirit possession within a\nCatholic framework\n\nCoptic liturgical and patristic resources on spiritual\nwarfare, liberation, and discernment of spirits are\ndirectly applicable. The Coptic tradition has unique\ncredibility here.\n\nGrowing evangelical\nProtestant presence\n\nPotential for
