"<h3 class=\"content-h\">2.6.2 Investments in Sao Tome and Principe</h3>\n<p>Three Investment Regimes: 1. Simplified Regime (€50,000 to €249,999): Projects receive 50% of the incentives described in the Tax Benefits Code 2. General Regime (€250,000 to €4,999,999): Full access to standard incentives 3. Special Regime (€5,000,000 or more): Maximum incentive package with negotiated terms To access these benefits, investors must enter into an Administrative Investment Contract (AIC) with the state. This contract requires several elements: investors must possess at least 20% of the proposed capital available, demonstrate stable financial</p>\n<p>standing, present clearance certificates showing no debts with the state or social security, and provide a feasibility study demonstrating job creation and social responsibility. Core Investment Guarantees The Investment Code provides fundamental protections that address investors' primary concerns: Equal Treatment: The law guarantees non-discriminatory treatment between nationals and foreigners, regardless of capital origin. Importantly, there are no legal restrictions on foreign ownership of São Toméan companies—100% foreign ownership is permitted in most sectors.</p>\n<ul class=\"bullets\">\n<li>● Expropriation Protection: The state guarantees that investment assets will not</li>\n<p>be nationalized, expropriated, or requisitioned except for weighty public interest reasons. Even then, fair, prior, and effective compensation must be paid.</p>\n<li>● Management Autonomy: Public non-interference in private enterprise</li>\n<p>management is guaranteed, except in cases expressly provided by law.</p>\n<li>● International Arbitration: STP is a signatory to the ICSID Convention</li>\n<p>(Washington Convention of 1965) and the New York Convention on arbitration, providing independent dispute resolution mechanisms and reducing political risk. ●</p>\n</ul>\n<p>The Administrative Investment Contract (CAI): The CAI is a formal contract between you (the investor) and the State of São Tomé and Príncipe. Think of it as a bilateral agreement where both parties make binding commitments: You commit to: ● ● ● ●</p>\n<p>Investing a specific amount of capital Meeting implementation timelines Creating jobs and training local workers Achieving defined economic and social objectives</p>\n<p>The government commits to: ● ● ● ●</p>\n<p>Granting specific tax incentives and benefits Protecting your investment against expropriation Allowing profit repatriation (subject to forex rules) Not interfering in your business management</p>\n<p>This mutual commitment structure is what makes the CAI powerful. Unlike general laws that can be changed by parliament, your CAI is a contract—it can only be altered by mutual agreement or if you violate its terms. Policies toward Foreign Direct Investment According to Article 4 of the Investment Code, both domestic and foreign investors are free to establish and own business enterprises, as well as engage in all forms of business activity in São Tomé and Príncipe, except in the sectors defined by law as</p>\n<p>reserved for the state, specifically military and paramilitary activities, and Central Bank operations. Reference : São Tomé and Príncipe - United States Department of State According to Article 6 of the Investment Code (Decree-Law No. 19/2016) , it identifies some areas for investment. ● ● ● ● ●</p>\n<p>Both citizens and foreigners can invest (while preserving and guarantying the following Investor’s Protection against discrimination (foreign and local investors are treated equally). Investments will not be unfairly taken away (“expropriated”) without proper compensation. Investments can be in areas like agriculture, tourism, energy, infrastructure, and services. The government encourages projects that bring technology, training, and innovation.</p>\n<p>Reference : Sao Tome and Principe - Investment Law 2016 | Investment Laws Navigator | UNCTAD Investment Policy Hub</p>"}, {"type": "text", "html": "<h3 class=\"content-h\">2.6.3 Land Access in Sao Tome and Principe</h3>\n<p>Land access is often the most complex issue for foreign investors—and São Tomé and Príncipe is no exception After independence. The state became the dominant landowner & much of the country's productive land remains state-owned. The restriction: São Toméan law prohibits foreign investors from possessing state lands. The general limit: Foreign nationals can own maximum two hectares of private land. Land access in São Tomé and Príncipe is possible through renewable concessions, but success depends less on paperwork and more on community engagement and careful due diligence. The legal rights are clear, but the “social license to operate” is what determines whether a project can move forward smoothly. Concession System Mechanism: Investors don’t own land outright; they receive 20-year concessions, renewable automatically.</p>\n<ul class=\"bullets\">\n<li>● Rights granted: Possession, use, and enjoyment of land; lease agreements;</li>\n<p>exploitation rights.</p>\n<li>● Termination: Either party can end with 2 years’ notice.</li>\n<li>● Fees: Agricultural concessions cost about $10–20 per hectare/year;</li>\n<p>tourism/infrastructure fees are negotiated. ●</p>\n</ul>\n<p>Reference: Access to Land:: SaoTomeExpert</p>\n<p>Article 17. from the General Constitutional Provisions: Foreigners in São Tomé and Príncipe ●</p>\n<p>The exercise of public office only will be permitted to foreigners provided it has a predominantly technical nature.</p>\n<p>●</p>\n<p>Subject to reciprocal terms, the law may grant foreign citizens resident in the national territory active and passive electoral capacity for the election of the holders of the organs of local government.</p>\n<p>●</p>\n<p>Article 17 of the Constitution protects the rights and integrity of foreigners. Foreigners and displaced persons who reside or stay in São Tomé and Príncipe enjoy the same rights and are subject to the same obligations as a São Tomean citizen, except insofar as are concerned political rights, the exercise of public office, and other rights and obligations expressly reserved by law for the national citizen.</p>\n<p>Article 15. Principles of Equality ●</p>\n<p>All citizens are equal before the law, enjoy the same rights and are subject to the same obligations</p>\n<p>●</p>\n<p>Woman is equal to man in rights and obligations, being guaranteed to her full participation in political, economic, social and cultural life.</p>\n<p>Reference :São Tomé and Príncipe Legal System and Research - Globalex</p>"}, {"type": "text", "html": "<h3 class=\"content-h\">2.6.4 Regulatory Authority for Supplying Medicines</h3>\n<p>●</p>\n<p>The Central Supply of Medicines (Central de Aprovisionamento de Medicamentos) (CAME) is an institution under the Ministry of Health to supply the Sao Tomean market with medicines and hospital consumables. The CAME in connection with the National Medicines Fund (Fundo Nacional de Medicamentos) (FNM), a semi-autonomous governmental organization, is responsible for procuring, stocking and distributing essential medicines for the public sector on behalf of Ministry of Health (Ministry of Health of STP, n.d.-b).</p>\n<p>●</p>\n<p>All medicines in Sao Tome and Principe are imported (Martinho do Rosário, 2008). As of 2007, drugs are procured through the International Dispensary Association (IDA). The IDA ensures quality, though prices are low (Martinho do Rosário, 2008).</p>\n<p>Reference: Sao Tome principe | AUDA-NEPAD- AMRH</p>"}, {"type": "text", "html": "<h3 class=\"content-h\">2.6.5 Residence Visa</h3>\n<p>For longer stays, this visa leads to residency and is categorized by purpose. It requires a valid travel document and, for minors, parental authorization. Applications are submitted at STP embassies or consulates, with processing up to 30 days.</p>\n<p>●</p>\n<p>For Subordinate Professional Activity: Submit an employment contract with a favorable opinion from the Ministry of Labor (issued within 20 days), verifying contractual terms and lack of suitable local candidates. Foreign worker quotas apply (preference for locals).</p>\n<p>●</p>\n<p>For Independent Professional Activity: Prove foreign investment or sufficient funds for self-employment, plus qualifications where needed.</p>\n<p>●</p>\n<p>For Research or Highly Qualified Positions: Affiliation with recognized research centers, a job offer, and return guarantees if stay becomes irregular.</p>\n<p>●</p>\n<p>For Study, Exchange, Internship, or Volunteer: Valid travel document; minors need parental consent.</p>\n<p>●</p>\n<p>For Family Reunification: SMF notifies the Ministry of Foreign Affairs for immediate issuance post-approval.</p>\n<p>Authorizations and Procedures for Obtaining Residency Temporary Residence Certificate:Permanent Residence Certificate: Once in STP on a residence visa, apply for a residence certificate at the SMF office or through a legal representative. General conditions include a valid visa, police clearance, health certificate, and proof of accommodation/funds. Processing takes 15-30 days, with fees around STN 5,000-10,000 ($220-450). Temporary Residence Certificate:Valid for one year from issuance, renewable annually or upon changes in details. Allows work/study as per visa. Permanent Residence Certificate:No expiry but renew every five years or on changes. Granted after several years of temporary residency, demonstrating integration (e.g., language, contributions). Exceptional Regimes Per a Government Decree from April 2017, citizens of certain countries (e.g., EU, USA, Canada) enjoy visa-free entry for up to 15 days for tourism/business. US citizens can stay up to 30 days visa-free. Chinese holders of diplomatic/special passports get 15 days exemption, following diplomatic reestablishment. Recent visa waivers (ratified 2025) with Ghana, Mozambique, Colombia, and Dominica allow reciprocal 15-day stays, enhancing regional ties. Extensions are possible via SMF for justified reasons. Reference: Visa and Residency for Foreigners in São Tomé and Príncipe :: SaoTomeExpert</p>"}, {"type": "text", "html": "<h3 class=\"content-h\">2.6.6 Religious Freedom Laws</h3>"}, {"type": "text", "html": "<h3 class=\"content-h\">2.6.6.1 Constitutional Guarantees</h3>\n<p>The Constitution of the Democratic Republic of São Tomé and Príncipe, in its most recent revision of 2003, provides robust guarantees of religious freedom. Article 27 explicitly declares that freedom of conscience, religion, and worship is inviolable specifying that no citizen may be persecuted, deprived of rights, or exempted from civic duties on account of religious conviction or practice. Article 8 establishes São Tomé and Príncipe as a secular (lay) state, stipulating a clear separation between state institutions and all religious institutions. Article 265 criminalizes 'religious coercion', defined as compelling a person to participate or abstain from religious worship, and provides for up to six months' imprisonment for violations. Reference: ● ●</p>\n<p>Constitute Project. Constitution of São Tomé and Príncipe (2003). Freedom of Thought Report: São Tomé and Príncipe. Op. cit. Humanists International.</p>"}, {"type": "text", "html": "<h3 class=\"content-h\">2.6.6.2 Religious Registration Process</h3>\n<p>Religious groups must register with the government of São Tomé and Príncipe; however, the process is not onerous or discriminatory. The U.S. State Department's</p>"}, {"type": "text", "html": "<h3 class=\"content-h\">2019 and 2020 Religious Freedom Reports confirm that no group has ever been denied</h3>\n<p>registration, and no unregistered group has been restricted from operation. The registration procedure requires: • • • • •</p>\n<p>Submission of a written letter requesting authorization from the Ministry of Justice and Human Rights. Submission of the group's statutes and meeting minutes to a notary public, signed by the president and secretary. Certification from the Registrar's Office that no existing organization bears the same name. Payment of notarial fees (historically approximately USD 45–50). Publication of approval in the official government gazette.</p>\n<p>Once registered, a religious group enjoys the same tax-exempt status as registered nonprofit organizations and need not re-register. Foreign religious groups that fail to register are subject to fines and possible expulsion, making timely registration a priority for the Coptic mission team.</p>\n<p>References : U.S. Department of State. 2019 Report on International Religious Freedom: São Tomé and Príncipe.</p>"}], "tables": []}]}, "3": {"name": "Country Segmentation", "num": 3, "sections": [{"num": "3.1", "title": "Population Overview (2024–2026 Estimates)", "content": "3.1 Population Overview (2024–2026 Estimates)\nThe population of São Tomé and Príncipe is characterized by steady growth and a\nhigh level of urbanization.\nTotal Population (2026 projection): ~244,994\n● Total Population (2024 estimate): ~235,536\n● Annual Growth Rate: ~1.97% to 2.02%\n● Population Density: 255 people per km² – the ideal healthy density is 100-150\nper km²\n● Urban Population: 78.9% (approximately 193,300 people)\n● Population density: 257.7 per km2\n● The demographics of Sao Tome and Principe ( 2025 )\nConstitutes of ~124,000 women and 123,000 men, which means there are 992 men\nper 1000 women.\n●\n\nAge distribution:\n50.2% of population (123,994) is 19 or younger,\n46.5% of population (114,756) is between age 20 and 64 and\n3.1% of population (7,583) is over 65.\n●\n\nReference: Population of Sao Tome and Principe. 2026 demographics: density,\nratios, growth rate, clock, rate of men to women.", "references": [], "contentBlocks": [{"type": "text", "html": "<h3 class=\"content-h\">3.1 Population Overview (2024–2026 Estimates)</h3>\n<p>The population of São Tomé and Príncipe is characterized by steady growth and a high level of urbanization. Total Population (2026 projection): ~244,994</p>\n<ul class=\"bullets\">\n<li>● Total Population (2024 estimate): ~235,536</li>\n<li>● Annual Growth Rate: ~1.97% to 2.02%</li>\n<li>● Population Density: 255 people per km² – the ideal healthy density is 100-150</li>\n<p>per km²</p>\n<li>● Urban Population: 78.9% (approximately 193,300 people)</li>\n<li>● Population density: 257.7 per km2</li>\n<li>● The demographics of Sao Tome and Principe ( 2025 )</li>\n<p>Constitutes of ~124,000 women and 123,000 men, which means there are 992 men per 1000 women. ●</p>\n</ul>\n<p>Age distribution: 50.2% of population (123,994) is 19 or younger, 46.5% of population (114,756) is between age 20 and 64 and 3.1% of population (7,583) is over 65. ●</p>\n<p>Reference: Population of Sao Tome and Principe. 2026 demographics: density, ratios, growth rate, clock, rate of men to women.</p>"}], "tables": []}, {"num": "3.2", "title": "Age Structure and Youth Demographics", "content": "3.2 Age Structure and Youth Demographics\nThe country has one of the youngest populations in the world, with a median age of\napproximately 19.7 to 20.5 years.\n\fAge Group\n\nPercentage of Population\n\n0–14 years\n\n~37% to 39%\n\n15–64 years\n\n~57% to 59%\n\n65+ years\n\n~2.9% to 4%\n\nKey Characteristics\nRepresents a high \"youth\nbulge\" and future labor force.\nThe primary working-age\npopulation.\nA very small elderly cohort.\n\nDetailed 5-Year Cohorts\nAge Range\n\nShare of\nPopulation\n\nNotable Trends\n\n0–4 years\n\n13.2%\n\nThe largest cohort; reflects high birth rates (~22–23 per\n1,000).\n\n5–9 years\n\n12.2%\n\nHigh demand for primary education infrastructure.\n\n10–14 years\n\n12.1%\n\nSignificant \"youth momentum\" for the coming decade.\n\n15–19 years\n\n11.5%\n\nTransition into the labor market and higher education.\n\n20–24 years\n\n9.5%\n\nPrimary group for internal migration to urban centers.\n\n25–34 years\n\n13.8%\n\n35–49 years\n\n14.2%\n\n50–64 years\n\n9.6%\n\n65+ years\n\n3.9%\n\nCore of the young professional and parenting\ndemographic.\nEstablished workforce; population starts to thin\nsignificantly here.\nTransition toward senior status; lower life expectancy in\npast decades.\nVery small percentage compared to global averages\n(World avg ~10%).\n\nFertility Rate: 3.5 to 3.6 children born per woman (declining from over 6.0 in\nthe 1970s).\n● Life Expectancy: 70.3 years total (Female: 74.3, Male: 66.7).\n●", "references": [], "contentBlocks": [{"type": "text", "html": "<h3 class=\"content-h\">3.2 Age Structure and Youth Demographics</h3>\n<p>The country has one of the youngest populations in the world, with a median age of approximately 19.7 to 20.5 years.</p>\n<p>Age Group</p>\n<p>Percentage of Population</p>\n<p>0–14 years</p>\n<p>~37% to 39%</p>\n<p>15–64 years</p>\n<p>~57% to 59%</p>\n<p>65+ years</p>\n<p>~2.9% to 4%</p>\n<p>Key Characteristics Represents a high \"youth bulge\" and future labor force. The primary working-age population. A very small elderly cohort.</p>\n<p>Detailed 5-Year Cohorts Age Range</p>\n<p>Share of Population</p>\n<p>Notable Trends</p>\n<p>0–4 years</p>\n<p>13.2%</p>\n<p>The largest cohort; reflects high birth rates (~22–23 per 1,000).</p>\n<p>5–9 years</p>\n<p>12.2%</p>\n<p>High demand for primary education infrastructure.</p>\n<p>10–14 years</p>\n<p>12.1%</p>\n<p>Significant \"youth momentum\" for the coming decade.</p>\n<p>15–19 years</p>\n<p>11.5%</p>\n<p>Transition into the labor market and higher education.</p>\n<p>20–24 years</p>\n<p>9.5%</p>\n<p>Primary group for internal migration to urban centers.</p>\n<p>25–34 years</p>\n<p>13.8%</p>\n<p>35–49 years</p>\n<p>14.2%</p>\n<p>50–64 years</p>\n<p>9.6%</p>\n<p>65+ years</p>\n<p>3.9%</p>\n<p>Core of the young professional and parenting demographic. Established workforce; population starts to thin significantly here. Transition toward senior status; lower life expectancy in past decades. Very small percentage compared to global averages (World avg ~10%).</p>\n<p>Fertility Rate: 3.5 to 3.6 children born per woman (declining from over 6.0 in the 1970s).</p>\n<ul class=\"bullets\">\n<li>● Life Expectancy: 70.3 years total (Female: 74.3, Male: 66.7).</li>\n<p>●</p>\n</ul>"}], "tables": []}, {"num": "3.3", "title": "Race and Ethnic Groups", "content": "3.3 Race and Ethnic Groups\nThe population is overwhelmingly of African and mixed-race descent, stemming from\ncenturies of migration and the legacy of the plantation (roça) system.\nRacial Breakdown: African: ~70%\n● Mixed (Mestiço): ~30% (primarily of Portuguese and African ancestry)\nIdentifiable Ethnic Groups:\n●\n\n\f●\n●\n●\n●\n●\n●\n\nMestiços: Descendants of Portuguese colonists and African slaves.\nAngolares: Descendants of Angolan shipwreck survivors (traditionally fishers).\nForros: Descendants of freed slaves from the era of abolition.\nServiçais: Contract laborers from Angola, Mozambique, and Cape Verde.\nTongas: Children of serviçais born on the islands.\nEuropeans: Primarily Portuguese", "references": [], "contentBlocks": [{"type": "text", "html": "<h3 class=\"content-h\">3.3 Race and Ethnic Groups</h3>\n<p>The population is overwhelmingly of African and mixed-race descent, stemming from centuries of migration and the legacy of the plantation (roça) system. Racial Breakdown: African: ~70%</p>\n<ul class=\"bullets\">\n<li>● Mixed (Mestiço): ~30% (primarily of Portuguese and African ancestry)</li>\n<p>Identifiable Ethnic Groups: ●</p>\n</ul>\n<p>● ● ● ● ● ●</p>\n<p>Mestiços: Descendants of Portuguese colonists and African slaves. Angolares: Descendants of Angolan shipwreck survivors (traditionally fishers). Forros: Descendants of freed slaves from the era of abolition. Serviçais: Contract laborers from Angola, Mozambique, and Cape Verde. Tongas: Children of serviçais born on the islands. Europeans: Primarily Portuguese</p>"}, {"type": "table", "html": "<div class=\"table-caption\">3.3</div><div class=\"table-wrap\"><table class=\"data-table\"><thead><tr><th>Age Group</th><th>Percentage of Population</th><th>Key Characteristics</th></tr></thead><tbody><tr><td>0–14 years</td><td>~37% to 39%</td><td>Represents a high &quot;youth bulge&quot; and future labor force.</td></tr><tr><td>15–64 years</td><td>~57% to 59%</td><td>The primary working-age</td></tr><tr><td></td><td></td><td>population.</td></tr><tr><td>65+ years</td><td>~2.9% to 4%</td><td>A very small elderly cohort.</td></tr></tbody></table></div>"}], "tables": [{"caption": "3.3", "headers": ["Age Group", "Percentage of Population", "Key Characteristics"], "rows": [["0–14 years", "~37% to 39%", "Represents a high \"youth bulge\" and future labor force."], ["15–64 years", "~57% to 59%", "The primary working-age"], ["", "", "population."], ["65+ years", "~2.9% to 4%", "A very small elderly cohort."]]}]}, {"num": "3.4", "title": "Population Distribution", "content": "3.4 Population Distribution\n●\n\nCapital City (São Tomé): The largest urban center, holding nearly 150,000\nresidents.\n\n●\n\nPríncipe Island: Home to approximately 4% of the population (~9,800 people).\n\n●\n\nRegional Trends: * Urbanization: Growth is concentrated in the capital and\nsurrounding districts (such as Água Grande).\n\n●\n\nPríncipe Status: Príncipe is an autonomous region with its own local government.", "references": [], "contentBlocks": [{"type": "text", "html": "<h3 class=\"content-h\">3.4 Population Distribution</h3>\n<p>●</p>\n<p>Capital City (São Tomé): The largest urban center, holding nearly 150,000 residents.</p>\n<p>●</p>\n<p>Príncipe Island: Home to approximately 4% of the population (~9,800 people).</p>\n<p>●</p>\n<p>Regional Trends: * Urbanization: Growth is concentrated in the capital and surrounding districts (such as Água Grande).</p>\n<p>●</p>\n<p>Príncipe Status: Príncipe is an autonomous region with its own local government.</p>"}], "tables": []}, {"num": "3.5", "title": "Vital Statistics & Family Composition", "content": "3.5 Vital Statistics & Family Composition\n3.5.1. Birth Rate\nThe crude birth rate for São Tomé and Príncipe in 2024 was approximately 30.0\nbirths per 1,000 population, rising 6.4% from the 2023 figure of 28.2 per 1,000.\n[Macrotrends / World Bank, 2024]\n3.5.2. Death Rate\nIn 2022, the crude death rate for São Tomé and Príncipe was 5.8 deaths per 1,000\npopulation, having declined steadily from 12.1 per 1,000 in 1973.\n[Knoema / World Bank, 2022]\nFor comparison, a 2021 CIA World Factbook estimate placed the death rate at 6.33\ndeaths per 1,000 population.\n[IndexMundi / CIA World Factbook, 2021 est.]\n3.5.3. Marriage Rate\nFormal civil marriages are not common in São Tomé and are practiced mainly by the\neducated elite; the conventional conjugal bond is the customary or informal union.\nPolygamy is also widespread, with a legally wedded man often being romantically\ninvolved with several other women.\n[Transcontinental Times, 2022]\nNo internationally standardized crude marriage rate (marriages per 1,000\npopulation) is currently published for São Tomé and Príncipe by the UN or World\nBank, due to incomplete civil registration data. UNICEF has noted that the civil\n\fregistration system in São Tomé and Príncipe is still developing its capacity to reliably\nrecord all vital events including marriages and deaths.\n[UNICEF CRVS Country Profile]\n3.5.4. Divorce Rate\nNo standalone national divorce rate statistic is available for São Tomé and Príncipe\nfrom major international databases, primarily due to gaps in civil registration.\nDivorce data for sub-Saharan African countries are limited, but where data exist,\ndivorce rates are substantially lower than in Western nations.\n[Healthy Marriage Info / National Fatherhood Initiative, Marriage Trends in Africa]\nUnder the country's Family Code, both husband and wife have equal rights to file for\ndivorce, which can be granted based on mutual consent or fault of one spouse;\nparental responsibility is shared after divorce is finalized.\n[Marry on Chain / São Tomé and Príncipe Family Law, 2025]\n3.5.5. Single Mother / Female-Headed Household Rate\nAccording to World Bank data, 39% of households in São Tomé and Príncipe were\nheaded by women as of 2009 — the most recent internationally reported figure\navailable.\n[CEIC Data / World Bank, 2009]\nA Pew Research Center global survey found that approximately 19% of children in\nSão Tomé and Príncipe live in single-parent households, placing the country among\nthe highest globally — ranking third worldwide after the United States and the\nUnited Kingdom.\n[Pew Research Center, 2019 (via Finances Online)]\nA São Tomé social protection registry found that of families living in extreme\npoverty, 73% are headed by women and 27% by men — a pattern directly attributed\nto the high number of single mothers responsible for their families.\n[Rio Times Online / São Tomé Social Protection Registry, 2023]\nMore than 71.3% of women-led households in São Tomé and Príncipe experience\nextreme poverty, compared to 64.3% of male-led households.\n[The Borgen Project, Women's Rights in São Tomé and Príncipe]\n3.5.6 Summary Table\n\nIndicator\n\nValue\n\nYear\n\nSource\n\nBirth Rate\n\n~30.0 per 1,000\n\n2024\n\nWorld Bank / Macrotrends\n\nDeath Rate\n\n~5.8 per 1,000\n\n2022\n\nWorld Bank / Knoema\n\n\fIndicator\n\nValue\n\nYear\n\nSource\n\nMarriage Rate\n\nNot standardized\n\n—\n\nUNICEF CRVS\n\nDivorce Rate\n\nNot standardized\n\n—\n\nCivil reg. gaps\n\nFemale-Headed Households\n\n~39% of HH\n\n2009\n\nWorld Bank / CEIC\n\nChildren in Single-Parent HH\n\n~19% of children\n\n2019\n\nPew Research Center\n\nFemale-Headed HH in Extreme\nPoverty\n\n73% of poor\nfamilies\n\n2023\n\nSTP Social Protection\nRegistry\n\nNote:\nStandardized marriage and divorce rates per 1,000 population are not reliably\navailable for São Tomé and Príncipe due to gaps in the country's civil registration\nsystem, as acknowledged by UNICEF. Figures from different sources may vary slightly\nbased on methodology and year", "references": [], "contentBlocks": [{"type": "text", "html": "<h3 class=\"content-h\">3.5 Vital Statistics & Family Composition</h3>\n<p>3.5.1. Birth Rate The crude birth rate for São Tomé and Príncipe in 2024 was approximately 30.0 births per 1,000 population, rising 6.4% from the 2023 figure of 28.2 per 1,000. [Macrotrends / World Bank, 2024] 3.5.2. Death Rate In 2022, the crude death rate for São Tomé and Príncipe was 5.8 deaths per 1,000 population, having declined steadily from 12.1 per 1,000 in 1973. [Knoema / World Bank, 2022] For comparison, a 2021 CIA World Factbook estimate placed the death rate at 6.33 deaths per 1,000 population. [IndexMundi / CIA World Factbook, 2021 est.] 3.5.3. Marriage Rate Formal civil marriages are not common in São Tomé and are practiced mainly by the educated elite; the conventional conjugal bond is the customary or informal union. Polygamy is also widespread, with a legally wedded man often being romantically involved with several other women. [Transcontinental Times, 2022] No internationally standardized crude marriage rate (marriages per 1,000 population) is currently published for São Tomé and Príncipe by the UN or World Bank, due to incomplete civil registration data. UNICEF has noted that the civil</p>\n<p>registration system in São Tomé and Príncipe is still developing its capacity to reliably record all vital events including marriages and deaths. [UNICEF CRVS Country Profile] 3.5.4. Divorce Rate No standalone national divorce rate statistic is available for São Tomé and Príncipe from major international databases, primarily due to gaps in civil registration. Divorce data for sub-Saharan African countries are limited, but where data exist, divorce rates are substantially lower than in Western nations. [Healthy Marriage Info / National Fatherhood Initiative, Marriage Trends in Africa] Under the country's Family Code, both husband and wife have equal rights to file for divorce, which can be granted based on mutual consent or fault of one spouse; parental responsibility is shared after divorce is finalized. [Marry on Chain / São Tomé and Príncipe Family Law, 2025] 3.5.5. Single Mother / Female-Headed Household Rate According to World Bank data, 39% of households in São Tomé and Príncipe were headed by women as of 2009 — the most recent internationally reported figure available. [CEIC Data / World Bank, 2009] A Pew Research Center global survey found that approximately 19% of children in São Tomé and Príncipe live in single-parent households, placing the country among the highest globally — ranking third worldwide after the United States and the United Kingdom. [Pew Research Center, 2019 (via Finances Online)] A São Tomé social protection registry found that of families living in extreme poverty, 73% are headed by women and 27% by men — a pattern directly attributed to the high number of single mothers responsible for their families. [Rio Times Online / São Tomé Social Protection Registry, 2023] More than 71.3% of women-led households in São Tomé and Príncipe experience extreme poverty, compared to 64.3% of male-led households. [The Borgen Project, Women's Rights in São Tomé and Príncipe]</p>"}, {"type": "text", "html": "<h3 class=\"content-h\">3.5.6 Summary Table</h3>\n<p>Indicator</p>\n<p>Value</p>\n<p>Year</p>\n<p>Source</p>\n<p>Birth Rate</p>\n<p>~30.0 per 1,000</p>\n<p>2024</p>\n<p>World Bank / Macrotrends</p>\n<p>Death Rate</p>\n<p>~5.8 per 1,000</p>\n<p>2022</p>\n<p>World Bank / Knoema</p>\n<p>Indicator</p>\n<p>Value</p>\n<p>Year</p>\n<p>Source</p>\n<p>Marriage Rate</p>\n<p>Not standardized</p>\n<p>—</p>\n<p>UNICEF CRVS</p>\n<p>Divorce Rate</p>\n<p>Not standardized</p>\n<p>—</p>\n<p>Civil reg. gaps</p>\n<p>Female-Headed Households</p>\n<p>~39% of HH</p>\n<p>2009</p>\n<p>World Bank / CEIC</p>\n<p>Children in Single-Parent HH</p>\n<p>~19% of children</p>\n<p>2019</p>\n<p>Pew Research Center</p>\n<p>Female-Headed HH in Extreme Poverty</p>\n<p>73% of poor families</p>\n<p>2023</p>\n<p>STP Social Protection Registry</p>\n<p>Note: Standardized marriage and divorce rates per 1,000 population are not reliably available for São Tomé and Príncipe due to gaps in the country's civil registration system, as acknowledged by UNICEF. Figures from different sources may vary slightly based on methodology and year</p>"}, {"type": "table", "html": "<div class=\"table-caption\">3.5.6 Summary Table</div><div class=\"table-wrap\"><table class=\"data-table\"><thead><tr><th>Indicator</th><th>Value</th><th>Year</th><th>Source</th></tr></thead><tbody><tr><td>Birth Rate</td><td>~30.0 per 1,000</td><td>2024</td><td>World Bank / Macrotrends</td></tr><tr><td>Death Rate</td><td>~5.8 per 1,000</td><td>2022</td><td>World Bank / Knoema</td></tr></tbody></table></div>"}], "tables": [{"caption": "3.5.6 Summary Table", "headers": ["Indicator", "Value", "Year", "Source"], "rows": [["Birth Rate", "~30.0 per 1,000", "2024", "World Bank / Macrotrends"], ["Death Rate", "~5.8 per 1,000", "2022", "World Bank / Knoema"]]}]}, {"num": "3.6", "title": "Migration Trends", "content": "3.6 Migration Trends\n● São Tomé and Príncipe (STP) has experienced rising emigration over 2020–2025.\nBy 2023 about 18–20% of the population lived abroad[1][2]. Outflow surged after\n2020’s Covid dip: departures by air fell ~55% in 2020 vs. 2019 but then\nrebounded to ~24,200 in 2023[3] (over +100% relative to 2019).\n● Migration is balanced by sex and skewed young. Recent data show roughly 49–\n51% male vs. female[4]. Over half of emigrants are under age 30 (52% in 2023 vs.\n31% in 2018)[5], reflecting STP’s youthful population.\n● Portugal is the primary destination (~52% of emigrants), followed by Angola\n(17%), Gabon (16%), Cabo Verde (5%), and Equatorial Guinea (5%)[6][7].\nTogether these five countries host ~95% of the diaspora. Immigration into STP is\nminimal (<1% of population)[8].\n● Remittances are very low and falling. Inflows to STP dropped from US$25.2 m in\n2014 to only US$7.7 m in 2022[9]. On average a São Toméan migrant sends just\n≈US$266/year[10]. High transfer costs and lack of formal channels limit\nremittances’ impact.\n● Economic factors drive migration. High youth unemployment (~21% in 2022) and\nlack of jobs/power to grow the economy are cited by migrants[11][12].\nEnvironmental risks (e.g. floods in 2021) and political stability are noted but less\nprominent.\n● STP has no asylum policy or refugee system[13][14]. In late 2022 it joined the\nCPLP visa-free mobility pact, easing migration to Portugal[15]. Government steps\ninclude new tax incentives for emigrants[16]. However, comprehensive migration\nmanagement remains limited.\n\f3.6.1 Migration Flows and Trends\nSão Tomé and Príncipe’s migration is dominated by outflows. In 2020 the diaspora\n(São Toméans living abroad) was ~39,600 people (18.1% of 2020 population)[7].\nRemoteness and lack of local jobs mean net migration is strongly negative. Official\nflight data (STP Customs) show 11,714 departures in 2019, plunging to 5,281 in 2020\n(Covid year) and then rebounding to 24,156 in 2023[3]. (Preliminary Jan–Feb 2024\ndata show 18,641 departures, already exceeding 2019’s total[17].) This trend is\nillustrated below: departures have more than doubled from pre-pandemic levels[3].\n(No up-to-date 2024–2025 totals are yet published by STP or KNOMAD.)\n\nYear\n\nOutbound Departures\n\n% Change vs 2019\n\nNotes\n\n2019\n\n11,714\n\nBaseline\n\nPre-COVID\nbaseline\n\n2020\n\n5,281\n\n–55%\n\nCOVID-19 impact\n\n2021\n\n9,487\n\n–19%\n\nPartial recovery\n\n2022\n\n16,332\n\n+39%\n\nStrong rebound\n\n2023\n\n24,156\n\n+106%\n\nSignificant\nincrease\n\nDespite the surge in departures, official data on immigration inflows are negligible:\nin 2020 only 2,139 foreign residents were recorded (<1% of population)[8], mainly\nfrom Lusophone neighbors. Thus, net migration has been persistently negative\n(more people leaving than arriving) throughout 2020–2023.\n3.6.2 Demographic Profile of Migrants\n● Gender: Migration is nearly gender-balanced. For example, 2020 data show\n52.5% of emigrants were women[7]. Surveys and customs records find ~49%\nmale vs. 51% female[4]. In STP’s small sample surveys, households report\nsimilarly sized shares of male and female migrants[4].\n● Age: Migrants are overwhelmingly young. Customs data show more than half of\ntravelers are under age 30 as of 2023[5] (up from 31% in 2018). This aligns with\nSTP’s population (median age ≈18.6)[18]. Focus groups cite “youth\nunemployment” and desire for education or work abroad. The peak emigrant age\nrange is roughly 20–34.\n● Household role: Most migrants are children of household heads. In surveyed\nmigrant households, migrants were usually sons or daughters[19]. When one\nparent migrates, the other typically remains. Consequences include “care gaps”\nfor the left-behind generation[20][19].\n\f● Internal migration: More than 50% of STP families report at least one internal\nmover (often to the capital)[21]. Rural youth also relocate seasonally (e.g.,\nfishermen). However, STP’s internal flows are modest compared to international\nmigration.\n3.6.3 Destinations and Origins\nSão Toméan emigrants concentrate in a few countries. Destinations: As of 2021,\nabout 51.7% of the diaspora lived in Portugal, 17.2% in Angola, 16.4% in Gabon, with\nCabo Verde and Equatorial Guinea at ~4–5% each[6]. These five countries combined\nhost ~95% of all emigrants[7][6]. (Other destinations, including France and various\nAfrican or European nations, account for the remaining ~5%.) See Table below for\nthe latest shares and estimated counts.\nYear\n\nDestination\n\nShare\n(%)\n\nEst.\nnumber\n\nNotes (Source)\n\n2020\n\nPortugal\n\n51.9%\n\n20,557\n\nIOM/Migrants&Refugees\n(2023)[7]\n\n2020\n\nAngola\n\n17.3%\n\n6,852\n\nIOM/Migrants&Refugees\n(2023)[7]\n\n2020\n\nGabon\n\n16.5%\n\n6,535\n\nIOM/Migrants&Refugees\n(2023)[7]\n\n2020\n\nCabo Verde\n\n4.6%\n\n1,822\n\nIOM/Migrants&Refugees\n(2023)[7]\n\n2020\n\nEquatorial\nGuinea\n\n4.5%\n\n1,782\n\nIOM/Migrants&Refugees\n(2023)[7]\n\n2020\n\nOthers\n\n5.2%\n\n2,053\n\n(remainder)\n\n2021\n\nPortugal\n\n51.7%\n\n20,552\n\nWorld Bank (2025)[6]\n\n2021\n\nAngola\n\n17.2%\n\n6,852\n\nWorld Bank (2025)[6]\n\n2021\n\nGabon\n\n16.4%\n\n6,539\n\nWorld Bank (2025)[6]\n\n2021\n\nCabo Verde\n\n4.5%\n\n1,809\n\nWorld Bank (2025)[6]\n\n2021\n\nEquatorial\nGuinea\n\n4.5%\n\n1,794\n\nWorld Bank (2025)[6]\n\n2021\n\nOthers\n\n5.7%\n\n2,106\n\n(remainder)\n\nCaption: Shares of São Tomé emigrants in top destinations. 2020 data come from an\nIOM/Vatican profile (citing 2020 figures)[7]; 2021 data from World Bank\n(KNOMAD)[6]. “Others” includes all remaining countries.\n\n\f3.6.4 Migration Types and Status\n● Economic and labor migration: Virtually all international emigration is economic\nor family-related. São Toméan migrants generally depart by plane on legal visas\n(work, study, reunification). There is no major guest-worker program; many\nobtain work/residence in Portugal under CPLP terms. Seasonal irregular labor\n(e.g. fishing) is minimal due to no open borders by sea[22].\n● Immigration: Immigration into STP is very low (2,139 in 2020)[8]. Most\nimmigrants are from neighboring lusophone countries (Cape Verde, Angola,\nGabon, Equatorial Guinea) as noted above[23]. There is no formal refugee intake\nor asylum processing[13]; STP does not grant asylum status.\n● Asylum/Refugees: STP signed the 1951 Refugee Convention but has no domestic\nasylum law[14]. UNHCR records show zero registered refugees or asylum-seekers\nin STP as of 2021[24]. Any São Toméans needing protection generally seek it\nabroad (not within STP).\n● Irregular migration: Cases are negligible. STP’s island geography means nearly all\nmovements are documented at airports. The only irregular pattern is visaoverstay, and Frontex reports only a single known irregular São Toméan entry\ninto the EU in 15 years[25]. STP is not a significant transit route or trafficking\nsource (TIP reports have no entries).\n● Internal displacement: Internal (internal) migration mainly follows rural→urban\npaths. Heavy rains/flooding displaced ~500 people in 2021[26], but such\nenvironmental displacement is rare. There is no large-scale displacement crisis.\n3.6.5 Remittances\n● Trends: Remittance inflows to STP are very small and falling. The World Bank\nreports STP received only US$7.7 million in remittances in 2022, down from\nUS$25.2 m in 2014[9] (a >70% drop). Outflows (money sent abroad by emigrants)\ngrew modestly to US$4.38 m in 2022[27].\n● Net flows: As of 2023, STP was still a slight net receiver (net +US$3.3 m)[28].\nGiven GDP ≈US$500 m, remittances contribute only ~1–2% of GDP. The decline is\nattributed to weaker economic ties and possibly tighter banking controls[29].\n● Per-migrant: São Toméan migrants remit far less than peers. A 2025 blog notes\nSão Tomé’s diaspora remits ~US$266 per capita annually, compared to US$1,525\nfor Cabo Verdeans[10]. (Remittance portal data rank STP’s average cost of\nsending at ~12%, higher than regional average[30].)\n● Channels: Remittances in STP are mostly informal cash transfers; formal banking\nnetworks are limited. High fees and lack of access mean many rural families rely\non visitors or postal services. The costly and irregular nature of transfers likely\ndepresses remittance volumes[31][9].\n\f● Household impact: For the poorest households, even small remittances matter\n(e.g. for food or school fees). But overall migration to date has yielded scant\ninvestment in São Tomé’s economy. Social research finds most remittances are\nused for immediate consumption in vulnerable households[9][32].\n3.6.6 Drivers of Migration\n● Economic factors: By far the largest drivers are economic. STP’s economy was\nstagnant (~0% growth in 2022[33]) and offers few formal jobs. Youth\nunemployment (~21% in 2023[11]) and underemployment push young people to\nseek work abroad. Focus groups cited “high food prices and low wages” as key\npush factors[12]. Two-thirds of São Toméans are under 35[11], creating high job\ncompetition.\n● Social and educational factors: Education opportunities motivate migration.\nLimited tertiary education on the islands means many students study abroad and\nstay on. Language/cultural ties to Portugal (colonial legacy) and CPLP channels\nserve as pull factors. Portuguese consular data show many family and student\nvisa applications to Europe.\n● Environmental factors: STP is vulnerable to climate (cyclones, sea-level rise) but\nso far migration for environmental reasons is minimal. The notable event was\nfloods in mid-2021 (500 people displaced)[26]. Some agricultural decline (e.g.\ncocoa shocks) may indirectly push families to diversify through migration, but no\nlarge-scale climate-driven migration has been documented yet.\n● Political context: São Tomé has been politically stable (no conflict-driven\ndiaspora). The main political influences on migration have been policy changes,\ne.g. Angola’s 2000s labor pacts and the 2022 CPLP visa-free agreement[15].\nThere was also minor political unrest in the 1990s-2000s, but not on a scale to\ncreate refugees.\ntimeline\ntitle Key Migration Events (2020–2025)\n2020 : COVID-19 travel restrictions cause ~55% drop in departures[3]\n2021 : Diaspora ~18% of population; internal floods displace 500[7] [26]\n2022 : CPLP visa-free mobility pact signed[15]\n2023 : Departures exceed pre-COVID levels (+106% vs 2019) [3]\n2024 : Preliminary data (Jan–Feb) show continued high outflows[17]\n\n3.6.8 Data Gaps and Resources\n● Coverage: There are no annual official migration statistics published by the STP\ngovernment. Most data come from infrequent surveys or external sources. We\n\n\frely on the 2020 census-based migration profile[7] and a World Bank 2025 study\n(using customs and survey data up to 2023)[2][3].\n● Recent years: Data for 2024–2025 are largely unavailable. We have only early\n2024 border data[17]. The diaspora share for 2023 is projected (World Bank) but\nnot from a new census.\n● Discrepancies: Minor inconsistencies exist between sources. For example, the\nIOM profile[7] and the World Bank 2025 report[6] give virtually identical\ndistributions for 2020 vs. 2021 (differing by ~0.2–0.5% in each category). We\nprioritized the most recent (World Bank 2025) for trend analysis, and used the\nIOM profile for 2020 baselines.\n● Sources checked: We examined STP’s census, IOM/UN migration profiles, World\nBank data portals, UN DESA (KNOMAD), and major development reports. We\nfound no standalone Portuguese-language official migration statistics beyond\ncensus figures. Key data (flows, remittances) come from World Bank and IMF\ndatabases[9][28].\n[1] [13] migrants-refugees.va\nhttps://migrants-refugees.va/it/wp-content/uploads/sites/3/2023/02/2022-CP-SaoTome-and-Principe-.pdf\n[2] [3] [4] [5] [6] [9] [12] [15] [17] [18] [19] [20] [22] [25] [27] [28] [29] [30] [31] [32]\n[33] World Bank Document\nhttps://openknowledge.worldbank.org/bitstreams/ef660a2c-15a3-43c6-abc0940369e16fac/download\n[7] [8] [14] [16] [21] [23] [24] [26] São Tomé and Príncipe - Migrants & Refugees\nSection\nhttps://migrants-refugees.va/country-profile/sao-tome-and-principe/\n[10] [11] Falling Short: Rethinking Migration in São Tomé and Príncipe\nhttps://blogs.worldbank.org/en/peoplemove/falling-short--rethinking-migration-insao-tome-and-principe", "references": [{"source": "migrants-refugees.va", "url": "https://migrants-refugees.va/it/wp-content/uploads/sites/3/2023/02/2022-CP-SaoTome-and-Principe-.pdf"}, {"source": "openknowledge.worldbank.org", "url": "https://openknowledge.worldbank.org/bitstreams/ef660a2c-15a3-43c6-abc0940369e16fac/download"}, {"source": "migrants-refugees.va", "url": "https://migrants-refugees.va/country-profile/sao-tome-and-principe/"}, {"source": "blogs.worldbank.org", "url": "https://blogs.worldbank.org/en/peoplemove/falling-short--rethinking-migration-insao-tome-and-principe"}], "contentBlocks": [{"type": "text", "html": "<h3 class=\"content-h\">3.6 Migration Trends</h3>\n<ul class=\"bullets\">\n<li>● São Tomé and Príncipe (STP) has experienced rising emigration over 2020–2025.</li>\n<p>By 2023 about 18–20% of the population lived abroad[1][2]. Outflow surged after 2020’s Covid dip: departures by air fell ~55% in 2020 vs. 2019 but then rebounded to ~24,200 in 2023[3] (over +100% relative to 2019).</p>\n<li>● Migration is balanced by sex and skewed young. Recent data show roughly 49–</li>\n<p>51% male vs. female[4]. Over half of emigrants are under age 30 (52% in 2023 vs. 31% in 2018)[5], reflecting STP’s youthful population.</p>\n<li>● Portugal is the primary destination (~52% of emigrants), followed by Angola</li>\n<p>(17%), Gabon (16%), Cabo Verde (5%), and Equatorial Guinea (5%)[6][7]. Together these five countries host ~95% of the diaspora. Immigration into STP is minimal (<1% of population)[8].</p>\n<li>● Remittances are very low and falling. Inflows to STP dropped from US$25.2 m in</li>\n</ul>"}, {"type": "text", "html": "<h3 class=\"content-h\">2014 to only US$7.7 m in 2022[9]. On average a São Toméan migrant sends just</h3>\n<p>≈US$266/year[10]. High transfer costs and lack of formal channels limit remittances’ impact.</p>\n<ul class=\"bullets\">\n<li>● Economic factors drive migration. High youth unemployment (~21% in 2022) and</li>\n<p>lack of jobs/power to grow the economy are cited by migrants[11][12]. Environmental risks (e.g. floods in 2021) and political stability are noted but less prominent.</p>\n<li>● STP has no asylum policy or refugee system[13][14]. In late 2022 it joined the</li>\n<p>CPLP visa-free mobility pact, easing migration to Portugal[15]. Government steps include new tax incentives for emigrants[16]. However, comprehensive migration management remains limited.</p>\n</ul>"}, {"type": "text", "html": "<h3 class=\"content-h\">3.6.1 Migration Flows and Trends</h3>\n<p>São Tomé and Príncipe’s migration is dominated by outflows. In 2020 the diaspora (São Toméans living abroad) was ~39,600 people (18.1% of 2020 population)[7]. Remoteness and lack of local jobs mean net migration is strongly negative. Official flight data (STP Customs) show 11,714 departures in 2019, plunging to 5,281 in 2020 (Covid year) and then rebounding to 24,156 in 2023[3]. (Preliminary Jan–Feb 2024 data show 18,641 departures, already exceeding 2019’s total[17].) This trend is illustrated below: departures have more than doubled from pre-pandemic levels[3]. (No up-to-date 2024–2025 totals are yet published by STP or KNOMAD.)</p>\n<p>Year</p>\n<p>Outbound Departures</p>\n<p>% Change vs 2019</p>\n<p>Notes</p>\n<p>2019</p>\n<p>11,714</p>\n<p>Baseline</p>\n<p>Pre-COVID baseline</p>\n<p>2020</p>\n<p>5,281</p>\n<p>–55%</p>\n<p>COVID-19 impact</p>\n<p>2021</p>\n<p>9,487</p>\n<p>–19%</p>\n<p>Partial recovery</p>\n<p>2022</p>\n<p>16,332</p>\n<p>+39%</p>\n<p>Strong rebound</p>\n<p>2023</p>\n<p>24,156</p>\n<p>+106%</p>\n<p>Significant increase</p>\n<p>Despite the surge in departures, official data on immigration inflows are negligible: in 2020 only 2,139 foreign residents were recorded (<1% of population)[8], mainly from Lusophone neighbors. Thus, net migration has been persistently negative (more people leaving than arriving) throughout 2020–2023.</p>"}, {"type": "text", "html": "<h3 class=\"content-h\">3.6.2 Demographic Profile of Migrants</h3>\n<ul class=\"bullets\">\n<li>● Gender: Migration is nearly gender-balanced. For example, 2020 data show</li>\n<p>52.5% of emigrants were women[7]. Surveys and customs records find ~49% male vs. 51% female[4]. In STP’s small sample surveys, households report similarly sized shares of male and female migrants[4].</p>\n<li>● Age: Migrants are overwhelmingly young. Customs data show more than half of</li>\n<p>travelers are under age 30 as of 2023[5] (up from 31% in 2018). This aligns with STP’s population (median age ≈18.6)[18]. Focus groups cite “youth unemployment” and desire for education or work abroad. The peak emigrant age range is roughly 20–34.</p>\n<li>● Household role: Most migrants are children of household heads. In surveyed</li>\n<p>migrant households, migrants were usually sons or daughters[19]. When one parent migrates, the other typically remains. Consequences include “care gaps” for the left-behind generation[20][19].</p>\n</ul>\n<ul class=\"bullets\">\n<li>● Internal migration: More than 50% of STP families report at least one internal</li>\n<p>mover (often to the capital)[21]. Rural youth also relocate seasonally (e.g., fishermen). However, STP’s internal flows are modest compared to international migration.</p>\n</ul>"}, {"type": "text", "html": "<h3 class=\"content-h\">3.6.3 Destinations and Origins</h3>\n<p>São Toméan emigrants concentrate in a few countries. Destinations: As of 2021, about 51.7% of the diaspora lived in Portugal, 17.2% in Angola, 16.4% in Gabon, with Cabo Verde and Equatorial Guinea at ~4–5% each[6]. These five countries combined host ~95% of all emigrants[7][6]. (Other destinations, including France and various African or European nations, account for the remaining ~5%.) See Table below for the latest shares and estimated counts. Year</p>\n<p>Destination</p>\n<p>Share (%)</p>\n<p>Est. number</p>\n<p>Notes (Source)</p>\n<p>2020</p>\n<p>Portugal</p>\n<p>51.9%</p>\n<p>20,557</p>\n<p>IOM/Migrants&Refugees (2023)[7]</p>\n<p>2020</p>\n<p>Angola</p>\n<p>17.3%</p>\n<p>6,852</p>\n<p>IOM/Migrants&Refugees (2023)[7]</p>\n<p>2020</p>\n<p>Gabon</p>\n<p>16.5%</p>\n<p>6,535</p>\n<p>IOM/Migrants&Refugees (2023)[7]</p>\n<p>2020</p>\n<p>Cabo Verde</p>\n<p>4.6%</p>\n<p>1,822</p>\n<p>IOM/Migrants&Refugees (2023)[7]</p>\n<p>2020</p>\n<p>Equatorial Guinea</p>\n<p>4.5%</p>\n<p>1,782</p>\n<p>IOM/Migrants&Refugees (2023)[7]</p>\n<p>2020</p>\n<p>Others</p>\n<p>5.2%</p>\n<p>2,053</p>\n<p>(remainder)</p>\n<p>2021</p>\n<p>Portugal</p>\n<p>51.7%</p>\n<p>20,552</p>\n<p>World Bank (2025)[6]</p>\n<p>2021</p>\n<p>Angola</p>\n<p>17.2%</p>\n<p>6,852</p>\n<p>World Bank (2025)[6]</p>\n<p>2021</p>\n<p>Gabon</p>\n<p>16.4%</p>\n<p>6,539</p>\n<p>World Bank (2025)[6]</p>\n<p>2021</p>\n<p>Cabo Verde</p>\n<p>4.5%</p>\n<p>1,809</p>\n<p>World Bank (2025)[6]</p>\n<p>2021</p>\n<p>Equatorial Guinea</p>\n<p>4.5%</p>\n<p>1,794</p>\n<p>World Bank (2025)[6]</p>\n<p>2021</p>\n<p>Others</p>\n<p>5.7%</p>\n<p>2,106</p>\n<p>(remainder)</p>\n<p>Caption: Shares of São Tomé emigrants in top destinations. 2020 data come from an IOM/Vatican profile (citing 2020 figures)[7]; 2021 data from World Bank (KNOMAD)[6]. “Others” includes all remaining countries.</p>"}, {"type": "text", "html": "<h3 class=\"content-h\">3.6.4 Migration Types and Status</h3>\n<ul class=\"bullets\">\n<li>● Economic and labor migration: Virtually all international emigration is economic</li>\n<p>or family-related. São Toméan migrants generally depart by plane on legal visas (work, study, reunification). There is no major guest-worker program; many obtain work/residence in Portugal under CPLP terms. Seasonal irregular labor (e.g. fishing) is minimal due to no open borders by sea[22].</p>\n<li>● Immigration: Immigration into STP is very low (2,139 in 2020)[8]. Most</li>\n<p>immigrants are from neighboring lusophone countries (Cape Verde, Angola, Gabon, Equatorial Guinea) as noted above[23]. There is no formal refugee intake or asylum processing[13]; STP does not grant asylum status.</p>\n<li>● Asylum/Refugees: STP signed the 1951 Refugee Convention but has no domestic</li>\n<p>asylum law[14]. UNHCR records show zero registered refugees or asylum-seekers in STP as of 2021[24]. Any São Toméans needing protection generally seek it abroad (not within STP).</p>\n<li>● Irregular migration: Cases are negligible. STP’s island geography means nearly all</li>\n<p>movements are documented at airports. The only irregular pattern is visaoverstay, and Frontex reports only a single known irregular São Toméan entry into the EU in 15 years[25]. STP is not a significant transit route or trafficking source (TIP reports have no entries).</p>\n<li>● Internal displacement: Internal (internal) migration mainly follows rural→urban</li>\n<p>paths. Heavy rains/flooding displaced ~500 people in 2021[26], but such environmental displacement is rare. There is no large-scale displacement crisis.</p>\n</ul>"}, {"type": "text", "html": "<h3 class=\"content-h\">3.6.5 Remittances</h3>\n<ul class=\"bullets\">\n<li>● Trends: Remittance inflows to STP are very small and falling. The World Bank</li>\n<p>reports STP received only US$7.7 million in remittances in 2022, down from US$25.2 m in 2014[9] (a >70% drop). Outflows (money sent abroad by emigrants) grew modestly to US$4.38 m in 2022[27].</p>\n<li>● Net flows: As of 2023, STP was still a slight net receiver (net +US$3.3 m)[28].</li>\n<p>Given GDP ≈US$500 m, remittances contribute only ~1–2% of GDP. The decline is attributed to weaker economic ties and possibly tighter banking controls[29].</p>\n<li>● Per-migrant: São Toméan migrants remit far less than peers. A 2025 blog notes</li>\n<p>São Tomé’s diaspora remits ~US$266 per capita annually, compared to US$1,525 for Cabo Verdeans[10]. (Remittance portal data rank STP’s average cost of sending at ~12%, higher than regional average[30].)</p>\n<li>● Channels: Remittances in STP are mostly informal cash transfers; formal banking</li>\n<p>networks are limited. High fees and lack of access mean many rural families rely on visitors or postal services. The costly and irregular nature of transfers likely depresses remittance volumes[31][9].</p>\n</ul>\n<ul class=\"bullets\">\n<li>● Household impact: For the poorest households, even small remittances matter</li>\n<p>(e.g. for food or school fees). But overall migration to date has yielded scant investment in São Tomé’s economy. Social research finds most remittances are used for immediate consumption in vulnerable households[9][32].</p>\n</ul>"}, {"type": "text", "html": "<h3 class=\"content-h\">3.6.6 Drivers of Migration</h3>\n<ul class=\"bullets\">\n<li>● Economic factors: By far the largest drivers are economic. STP’s economy was</li>\n<p>stagnant (~0% growth in 2022[33]) and offers few formal jobs. Youth unemployment (~21% in 2023[11]) and underemployment push young people to seek work abroad. Focus groups cited “high food prices and low wages” as key push factors[12]. Two-thirds of São Toméans are under 35[11], creating high job competition.</p>\n<li>● Social and educational factors: Education opportunities motivate migration.</li>\n<p>Limited tertiary education on the islands means many students study abroad and stay on. Language/cultural ties to Portugal (colonial legacy) and CPLP channels serve as pull factors. Portuguese consular data show many family and student visa applications to Europe.</p>\n<li>● Environmental factors: STP is vulnerable to climate (cyclones, sea-level rise) but</li>\n<p>so far migration for environmental reasons is minimal. The notable event was floods in mid-2021 (500 people displaced)[26]. Some agricultural decline (e.g. cocoa shocks) may indirectly push families to diversify through migration, but no large-scale climate-driven migration has been documented yet.</p>\n<li>● Political context: São Tomé has been politically stable (no conflict-driven</li>\n<p>diaspora). The main political influences on migration have been policy changes, e.g. Angola’s 2000s labor pacts and the 2022 CPLP visa-free agreement[15]. There was also minor political unrest in the 1990s-2000s, but not on a scale to create refugees. timeline title Key Migration Events (2020–2025)</p>\n</ul>"}, {"type": "text", "html": "<h3 class=\"content-h\">2020 : COVID-19 travel restrictions cause ~55% drop in departures[3]</h3>"}, {"type": "text", "html": "<h3 class=\"content-h\">2021 : Diaspora ~18% of population; internal floods displace 500[7] [26]</h3>"}, {"type": "text", "html": "<h3 class=\"content-h\">2022 : CPLP visa-free mobility pact signed[15]</h3>"}, {"type": "text", "html": "<h3 class=\"content-h\">2023 : Departures exceed pre-COVID levels (+106% vs 2019) [3]</h3>"}, {"type": "text", "html": "<h3 class=\"content-h\">2024 : Preliminary data (Jan–Feb) show continued high outflows[17]</h3>"}, {"type": "text", "html": "<h3 class=\"content-h\">3.6.8 Data Gaps and Resources</h3>\n<ul class=\"bullets\">\n<li>● Coverage: There are no annual official migration statistics published by the STP</li>\n<p>government. Most data come from infrequent surveys or external sources. We</p>\n</ul>\n<p>rely on the 2020 census-based migration profile[7] and a World Bank 2025 study (using customs and survey data up to 2023)[2][3].</p>\n<ul class=\"bullets\">\n<li>● Recent years: Data for 2024–2025 are largely unavailable. We have only early</li>\n</ul>"}, {"type": "text", "html": "<h3 class=\"content-h\">2024 border data[17]. The diaspora share for 2023 is projected (World Bank) but</h3>\n<p>not from a new census.</p>\n<ul class=\"bullets\">\n<li>● Discrepancies: Minor inconsistencies exist between sources. For example, the</li>\n<p>IOM profile[7] and the World Bank 2025 report[6] give virtually identical distributions for 2020 vs. 2021 (differing by ~0.2–0.5% in each category). We prioritized the most recent (World Bank 2025) for trend analysis, and used the IOM profile for 2020 baselines.</p>\n<li>● Sources checked: We examined STP’s census, IOM/UN migration profiles, World</li>\n<p>Bank data portals, UN DESA (KNOMAD), and major development reports. We found no standalone Portuguese-language official migration statistics beyond census figures. Key data (flows, remittances) come from World Bank and IMF databases[9][28]. [1] [13] migrants-refugees.va <a href=\"https://migrants-refugees.va/it/wp-content/uploads/sites/3/2023/02/2022-CP-SaoTome-and-Principe-.pdf\" target=\"_blank\" rel=\"noopener\">https://migrants-refugees.va/it/wp-content/uploads/sites/3/2023/02/2022-CP-SaoTome-and-Principe-.pdf</a> [2] [3] [4] [5] [6] [9] [12] [15] [17] [18] [19] [20] [22] [25] [27] [28] [29] [30] [31] [32] [33] World Bank Document <a href=\"https://openknowledge.worldbank.org/bitstreams/ef660a2c-15a3-43c6-abc0940369e16fac/download\" target=\"_blank\" rel=\"noopener\">https://openknowledge.worldbank.org/bitstreams/ef660a2c-15a3-43c6-abc0940369e16fac/download</a> [7] [8] [14] [16] [21] [23] [24] [26] São Tomé and Príncipe - Migrants & Refugees Section <a href=\"https://migrants-refugees.va/country-profile/sao-tome-and-principe/\" target=\"_blank\" rel=\"noopener\">https://migrants-refugees.va/country-profile/sao-tome-and-principe/</a> [10] [11] Falling Short: Rethinking Migration in São Tomé and Príncipe <a href=\"https://blogs.worldbank.org/en/peoplemove/falling-short--rethinking-migration-insao-tome-and-principe\" target=\"_blank\" rel=\"noopener\">https://blogs.worldbank.org/en/peoplemove/falling-short--rethinking-migration-insao-tome-and-principe</a></p>\n</ul>"}], "tables": []}, {"num": "3.7", "title": "Employment Segmentation", "content": "3.7 Employment Segmentation\nThe labor force is segmented into three primary areas, with a notable shift toward\nthe service sector in recent years,\nThe Main employment sectors are services, agriculture, and tourism.\n3.7.1 Sector Breakdown\nSector\nEstimated % of Labor Force\n\nKey Activities\n\n\fServices\n\n~60-65%\n\nAgriculture\n\n~15-20%\n\nIndustry\n\n~15-19%\n\nPublic administration, tourism, retail, and\nsmall-scale trade.\nCocoa (the main export), coffee, palm oil,\nand subsistence fishing.\nConstruction, light manufacturing (textiles,\nsoap, beer), and energy.\n\n3.7.2 Labor Indicators\nUnemployment Rate: Currently hovering around 9.2%.\n● Youth Unemployment (15–24): Relatively stable compared to regional neighbors\nat approximately 8.6%, though underemployment remains a challenge.\n● Informal Economy: A significant portion (estimated over 40%) of workers are\nself-employed or work in the informal sector, often in street vending or artisanal\nfishing.\n● Gender: The labor force is nearly evenly split by gender (approx. 49.7% female),\nthough women are more frequently found in the informal trade and service\nsectors.\n3.7.3 Cost Of Living\n●\n\n● Wages and Salaries by Sector: To combat inflation, the statutory minimum\nwage was increased to 3,000 STN (approximately $123 USD) per month as of\nOctober 2025.1 Salaries vary significantly by sector: public sector professionals\ntypically earn between €400 and €800 per month, tourism and hospitality\nworkers earn between €300 and €600, and agricultural workers earn the lowest\nformal wages at around €200 to €400.2\n● Cost of Living and Daily Expenses: Because the island imports most of its\nmanufactured goods and food, living expenses can be high.3 A 3-bedroom city\napartment costs around $650 per month, monthly utilities for a family are about\n$70, and basic groceries range from $250 to $300. Dining out at a local\nrestaurant generally costs between €10 and €20 for a meal.\n● Labor Market and the Informal Economy: The island faces a severe\nunemployment crisis, with a national rate of 15.7%.4 This disproportionately\naffects youth (21.3%) and women (14.6%).4 Consequently, many residents are\nforced into the \"informal sector\" (unregistered daily labor or street retail),\nwhich is quite large and accounts for roughly 28.7% of the GDP, leaving many\nworkers with unstable incomes and no social safety nets.5\n\nReferences\nMinimum Wage in Sao Tome and Principe for 2026 - Remote People, accessed\nMarch 19, 2026, https://remotepeople.com/countries/sao-tome-andprincipe/employer-of-record/minimum-wage/\n\fWork in São Tomé and Príncipe - VisitWorld.Today, accessed March 19, 2026,\nhttps://visitworld.today/sao-tome-and-principe/work/info\nSao Tome and Principe | Economic Indicators | Moody's Analytics - Economy.com,\naccessed March 19, 2026, https://www.economy.com/sao-tome-andprincipe/indicators\nSão Tomé and Príncipe Economic Outlook, accessed March 19, 2026,\nhttps://www.afdb.org/en/countries-southern-africa-republic-sao-tome-andprincipe/sao-tome-and-principe-economic-outlook\nSão Tomé and Príncipe - ISS African Futures, accessed March 19, 2026,\nhttps://futures.issafrica.org/geographic/countries/sao-tome-and-principe/\nSao Tome and Principe graduates from least developed country ..., accessed\nMarch 19, 2026, https://unctad.org/news/sao-tome-and-principe-graduates-leastdeveloped-country-status", "references": [{"source": "remotepeople.com", "url": "https://remotepeople.com/countries/sao-tome-andprincipe/employer-of-record/minimum-wage/WorkinSãoToméandPríncipe-VisitWorld.Today,accessedMarch19,2026,https://visitworld.today/sao-tome-and-principe/work/infoSaoTomeandPrincipe"}, {"source": "economy.com", "url": "https://www.economy.com/sao-tome-andprincipe/indicatorsSãoToméandPríncipeEconomicOutlook,accessedMarch19,2026,https://www.afdb.org/en/countries-southern-africa-republic-sao-tome-andprincipe/sao-tome-and-principe-economic-outlookSãoToméandPríncipe-ISSAfricanFutures,accessedMarch19,2026,https://futures.issafrica.org/geographic/countries/sao-tome-and-principe/SaoTomeandPrincipegraduatesfromleastdevelopedcountry...,accessedMarch19,2026,https://unctad.org/news/sao-tome-and-principe-graduates-leastdeveloped-country-status"}], "contentBlocks": [{"type": "text", "html": "<h3 class=\"content-h\">3.7 Employment Segmentation</h3>\n<p>The labor force is segmented into three primary areas, with a notable shift toward the service sector in recent years, The Main employment sectors are services, agriculture, and tourism.</p>"}, {"type": "text", "html": "<h3 class=\"content-h\">3.7.1 Sector Breakdown</h3>\n<p>Sector Estimated % of Labor Force</p>\n<p>Key Activities</p>\n<p>Services</p>\n<p>~60-65%</p>\n<p>Agriculture</p>\n<p>~15-20%</p>\n<p>Industry</p>\n<p>~15-19%</p>\n<p>Public administration, tourism, retail, and small-scale trade. Cocoa (the main export), coffee, palm oil, and subsistence fishing. Construction, light manufacturing (textiles, soap, beer), and energy.</p>"}, {"type": "text", "html": "<h3 class=\"content-h\">3.7.2 Labor Indicators</h3>\n<p>Unemployment Rate: Currently hovering around 9.2%.</p>\n<ul class=\"bullets\">\n<li>● Youth Unemployment (15–24): Relatively stable compared to regional neighbors</li>\n<p>at approximately 8.6%, though underemployment remains a challenge.</p>\n<li>● Informal Economy: A significant portion (estimated over 40%) of workers are</li>\n<p>self-employed or work in the informal sector, often in street vending or artisanal fishing.</p>\n<li>● Gender: The labor force is nearly evenly split by gender (approx. 49.7% female),</li>\n<p>though women are more frequently found in the informal trade and service sectors.</p>\n</ul>"}, {"type": "text", "html": "<h3 class=\"content-h\">3.7.3 Cost Of Living</h3>\n<p>●</p>\n<ul class=\"bullets\">\n<li>● Wages and Salaries by Sector: To combat inflation, the statutory minimum</li>\n<p>wage was increased to 3,000 STN (approximately $123 USD) per month as of October 2025.1 Salaries vary significantly by sector: public sector professionals typically earn between €400 and €800 per month, tourism and hospitality workers earn between €300 and €600, and agricultural workers earn the lowest formal wages at around €200 to €400.2</p>\n<li>● Cost of Living and Daily Expenses: Because the island imports most of its</li>\n<p>manufactured goods and food, living expenses can be high.3 A 3-bedroom city apartment costs around $650 per month, monthly utilities for a family are about $70, and basic groceries range from $250 to $300. Dining out at a local restaurant generally costs between €10 and €20 for a meal.</p>\n<li>● Labor Market and the Informal Economy: The island faces a severe</li>\n<p>unemployment crisis, with a national rate of 15.7%.4 This disproportionately affects youth (21.3%) and women (14.6%).4 Consequently, many residents are forced into the \"informal sector\" (unregistered daily labor or street retail), which is quite large and accounts for roughly 28.7% of the GDP, leaving many workers with unstable incomes and no social safety nets.5</p>\n</ul>\n<p>References Minimum Wage in Sao Tome and Principe for 2026 - Remote People, accessed March 19, 2026, <a href=\"https://remotepeople.com/countries/sao-tome-andprincipe/employer-of-record/minimum-wage/WorkinSãoToméandPríncipe-VisitWorld.Today,accessedMarch19,2026,https://visitworld.today/sao-tome-and-principe/work/infoSaoTomeandPrincipe\" target=\"_blank\" rel=\"noopener\">https://remotepeople.com/countries/sao-tome-andprincipe/employer-of-record/minimum-wage/WorkinSãoToméandPríncipe-VisitWorld.Today,accessedMarch19,2026,https://visitworld.today/sao-tome-and-principe/work/infoSaoTomeandPrincipe</a> | Economic Indicators | Moody's Analytics - Economy.com, accessed March 19, 2026, <a href=\"https://www.economy.com/sao-tome-andprincipe/indicatorsSãoToméandPríncipeEconomicOutlook,accessedMarch19,2026,https://www.afdb.org/en/countries-southern-africa-republic-sao-tome-andprincipe/sao-tome-and-principe-economic-outlookSãoToméandPríncipe-ISSAfricanFutures,accessedMarch19,2026,https://futures.issafrica.org/geographic/countries/sao-tome-and-principe/SaoTomeandPrincipegraduatesfromleastdevelopedcountry...,accessedMarch19,2026,https://unctad.org/news/sao-tome-and-principe-graduates-leastdeveloped-country-status\" target=\"_blank\" rel=\"noopener\">https://www.economy.com/sao-tome-andprincipe/indicatorsSãoToméandPríncipeEconomicOutlook,accessedMarch19,2026,https://www.afdb.org/en/countries-southern-africa-republic-sao-tome-andprincipe/sao-tome-and-principe-economic-outlookSãoToméandPríncipe-ISSAfricanFutures,accessedMarch19,2026,https://futures.issafrica.org/geographic/countries/sao-tome-and-principe/SaoTomeandPrincipegraduatesfromleastdevelopedcountry...,accessedMarch19,2026,https://unctad.org/news/sao-tome-and-principe-graduates-leastdeveloped-country-status</a></p>"}], "tables": []}, {"num": "3.8", "title": "Education", "content": "3.8 Education\n3.8.1 System Structure, Access and Enrollment\nThe system follows a 6-3-3 model & Portuguese is the language of instruction at all\nlevels\n● 6 years of compulsory primary (ages 6–11)\n● 3 years of lower secondary\n● 3 years of upper secondary\nPrimary enrollment is very high (95%–98%) One of the highest rates in Sub-Saharan\nAfrica & Only about 70% complete primary school whereas Less than 60% transition\nto lower secondary\n3.8.2 Literacy, Enrollment & Key Demographics\nAdult literacy rose from 74.9% a decade ago to 93% by 2023, driven by the Quality\nEducation for All Project since 2014, which boosted teacher training and\ninfrastructure.\nYouth (15-24) literacy nears universality, though 2% have no formal education and\n36% incomplete primary, per older EPDC data.\nEnrollment Breakdown\nPrimary completion stands at 87%, with 96% net enrollment, but secondary\ntransition dips below 60% and completion lower, especially in rural areas\nKey Educational Demographics (2026 Estimates)\nMetric\n\nStatistic\n\nContext\n\n\fLiteracy Rate\n\n~94%\n\nYouth Literacy (15–\n24)\n\n~98%\n\nTertiary Enrollment\n\n~16-18%\n\nVocational Share\n\n~25-30%\n\nOne of the highest in Africa, though\nfunctional literacy in Portuguese varies.\nReflects the success of recent primary\neducation initiatives.\nAccess to university remains a bottleneck\nfor most of the population.\nGrowing emphasis on trades (electricity,\nmechanics, tourism) at the secondary\nlevel.\n\nReference: São Tomé and Príncipe: Education Country Brief | International Institute\nfor Capacity Building in Africa\nhttps://www.aacrao.org/edge/country/sao-tome-and-principe", "references": [{"source": "aacrao.org", "url": "https://www.aacrao.org/edge/country/sao-tome-and-principe"}], "contentBlocks": [{"type": "text", "html": "<h3 class=\"content-h\">3.8 Education</h3>"}, {"type": "text", "html": "<h3 class=\"content-h\">3.8.1 System Structure, Access and Enrollment</h3>\n<p>The system follows a 6-3-3 model & Portuguese is the language of instruction at all levels</p>\n<ul class=\"bullets\">\n<li>● 6 years of compulsory primary (ages 6–11)</li>\n<li>● 3 years of lower secondary</li>\n<li>● 3 years of upper secondary</li>\n<p>Primary enrollment is very high (95%–98%) One of the highest rates in Sub-Saharan Africa & Only about 70% complete primary school whereas Less than 60% transition to lower secondary</p>\n</ul>"}, {"type": "text", "html": "<h3 class=\"content-h\">3.8.2 Literacy, Enrollment & Key Demographics</h3>\n<p>Adult literacy rose from 74.9% a decade ago to 93% by 2023, driven by the Quality Education for All Project since 2014, which boosted teacher training and infrastructure. Youth (15-24) literacy nears universality, though 2% have no formal education and 36% incomplete primary, per older EPDC data. Enrollment Breakdown Primary completion stands at 87%, with 96% net enrollment, but secondary transition dips below 60% and completion lower, especially in rural areas Key Educational Demographics (2026 Estimates) Metric</p>\n<p>Statistic</p>\n<p>Context</p>\n<p>Literacy Rate</p>\n<p>~94%</p>\n<p>Youth Literacy (15– 24)</p>\n<p>~98%</p>\n<p>Tertiary Enrollment</p>\n<p>~16-18%</p>\n<p>Vocational Share</p>\n<p>~25-30%</p>\n<p>One of the highest in Africa, though functional literacy in Portuguese varies. Reflects the success of recent primary education initiatives. Access to university remains a bottleneck for most of the population. Growing emphasis on trades (electricity, mechanics, tourism) at the secondary level.</p>\n<p>Reference: São Tomé and Príncipe: Education Country Brief | International Institute for Capacity Building in Africa <a href=\"https://www.aacrao.org/edge/country/sao-tome-and-principe\" target=\"_blank\" rel=\"noopener\">https://www.aacrao.org/edge/country/sao-tome-and-principe</a></p>"}], "tables": []}]}, "4": {"name": "Religious Overview", "num": 4, "sections": [{"num": "4.1", "title": "Dominant Religions & Beliefs", "content": "4.1 Dominant Religions & Beliefs\n● São Tomé and Príncipe is one of Africa's most thoroughly Christianized nations.\nAccording to multiple authoritative sources, Christianity in one form or other\naccounts for approximately 97% of the total population's religious affiliation—\nmaking it an overwhelmingly Christian society with deep historical roots in Roman\nCatholicism inherited from five centuries of Portuguese colonial presence.\nReference: Opera News / WorldAtlas. African Countries Where Christianity is the\nLargest Religion. Retrieved March 2026.\n4.1.1 Roman Catholicism — The Dominant Faith\n● Roman Catholicism is the single largest religious denomination in São Tomé and\nPríncipe, constituting an estimated 55.7% of the national population according to\nthe CIA World Factbook's 2012 census-based estimate. Earlier data pointed to\nhigher figures: the nation's encyclopedia (Britannica) records that over threequarters of the population was Roman Catholic as of the year 2000, and the\nNations Encyclopedia notes a figure of approximately 80% for 2002. The decline in\nthe Catholic share since then reflects the significant growth of Protestant and\nevangelical denominations, not a general decline in Christian affiliation.\n● Catholicism was introduced to the islands by Portuguese colonists from the late\n15th century onward. The Diocese of São Tomé and Príncipe—one of Africa's\noldest Catholic dioceses—was established by Pope Clement VII on 31 January\n1533. At its height, its jurisdiction extended to Catholics in Angola and\nMozambique. The first permanent church on the islands, Nossa Senhora da Graça\n(built in 1504 by Augustinian missionaries), still stands and serves as the Cathedral\nof São Tomé. Today, the single Catholic diocese is headquartered in São Tomé city.\nReference:\n\nIndex Mundi / CIA World Factbook. Sao Tome and Principe Religions. Available at:\nhttps://www.indexmundi.com/sao_tome_and_principe/religions.html (Accessed: 7\nMay 2026).\n\n\fEncyclopedia.com. Worldmark Encyclopaedia of Religious Practices: São Tomé and\nPríncipe. Available at: https://www.encyclopedia.com/religion/encyclopediasalmanacs-transcripts-and-maps/sao-tome-and-principe (Accessed: 7 May 2026).\nWikipedia contributors. Religion in São Tomé and Príncipe. Wikipedia, The Free\nEncyclopedia. Available at:\nhttps://en.wikipedia.org/wiki/Religion_in_São_Tomé_and_Príncipe (Accessed: 7\nMay 2026).\n4.1.2 Protestant and Evangelical Christianity\n•\n\nProtestant Christianity constitutes the second-largest Christian grouping in the\ncountry. The CIA World Factbook (2012) records specific Protestant\ndenominations as follows: Seventh-day Adventist (4.1%), Assembly of God\n(3.4%), New Apostolic Church (2.9%), Universal Kingdom of God (2%), and\nJehovah's Witnesses (1.2%). Evangelical churches have shown significant growth\nin recent decades owing to active missionary work. By 2002, Protestants as a\ncombined group were estimated to account for approximately 15% of the\npopulation, though some sources have placed this figure as high as 23% more\nrecently.\n\n4.1.3 Seventh-day Adventist Church\n•\n\nThe Seventh-day Adventist Church operates one of only two private religious\nschools in the country (alongside a Catholic school), with both schools open to\nmembers and non-members alike and subject to Ministry of Education curriculum\noversight. Protestant leaders, especially Seventh-day Adventist leaders, have\ndemonstrated civic engagement—for example, participating in government\nCOVID-19 awareness campaigns and broadcasting prevention messages.\n\nReference: U.S. Department of State. 2020 Report on International Religious\nFreedom: São Tomé and Príncipe. https://www.state.gov/reports/2020-report-oninternational-religious-freedom/sao-tome-and-principe\n4.1.4 Islam\n● The Muslim population of São Tomé and Príncipe is small but growing, estimated\nat between 1% and 3% of the total population depending on the source and year.\nThe U.S. State Department's World Religion Profile estimates 3% Muslim, while a\n2012 CIA report records approximately 3% as well. Most Muslims are migrants\nfrom Nigeria and Cameroon who have arrived over the last two decades. The\nproximity of the islands to the West African mainland has facilitated this\nimmigration.\nReference: Association of Religion Data Archives. National Profiles: World Religion.\nhttps://www.thearda.com/world-religion/national-profiles?u=195c\n\n\f4.1.5 Other Minor Faiths\n● Small communities of the Bahá'í Faith, Judaism (historically present since the 15th\ncentury when thousands of Jewish children were forcibly deported to the island),\nHinduism, and Buddhism also exist on the islands, comprising a combined share of\napproximately 0.1–1% each. The Jewish community, though demographically\nnegligible at 0.1% of the population according to the Pew Research Center, has left\na lasting cultural imprint on Creole customs and traditions.\nReference: Religion in São Tomé and Príncipe. Wikipedia. Op. cit. Citing Pew\nResearch\nCenter data.\n\nRELIGIOUS BREAKDOWN — SÃO TOMÉ AND PRÍNCIPE (2012 CIA EST.)\nRoman Catholic: 55.7%\nSeventh-day Adventist: 4.1%\nAssembly of God: 3.4%\nNew Apostolic: 2.9%\nMana Church: 2.3%\nUniversal Kingdom of God: 2.0%\nJehovah's Witnesses: 1.2%\nOther Christian: 6.2%\nNo religion / Unaffiliated: 21.2%\nUnspecified: 1.0%\n\nReference: CIA World Factbook. Sao Tome and Principe: Demographics. Sourced\nfrom IndexMundi.\nhttps://www.indexmundi.com/sao_tome_and_principe/religions.html\n4.1.6 Syncretic and Traditional African Beliefs\n● Despite over five centuries of Roman Catholic influence, traditional African beliefs\nand practices remain widespread, often coexisting with nominal Christian\naffiliation. Black slaves brought to the islands from Benin, Gabon, the Republic of\nthe Congo, and Angola introduced animism, totemism, and mortuary cults. Over\ncenturies, these merged with Catholicism to produce syncretic expressions of\nfaith. For instance, the notion of Sum d'Océ (meaning 'Lord of the Heavens')\ncombines the Christian creator God with a controller of wealth drawn from African\ncosmology. Small plantation-era chapels combined Catholic crosses with African\ncharms.\n\f● A Melanesian belief system is also recorded, with followers constituting\napproximately 2.9% of the total population. Reports also indicate that witchcraftrelated persecution occurs on both islands—particularly targeting elderly women\naccused of 'fitxicêlu' (witchcraft in the Forro language)—suggesting a persistent\nundercurrent of African spiritual worldview that orthodox Christian catechesis has\nhistorically not addressed adequately.\nReference: Freedom of Thought Report: São Tomé and Príncipe. Humanists\nInternational.\nhttps://fot.humanists.international/countries/africa-middle-africa/sao-tome-andprincipe/\nEncyclopedia.com. Op. cit.", "references": [{"source": "indexmundi.com", "url": "https://www.indexmundi.com/sao_tome_and_principe/religions.html"}, {"source": "encyclopedia.com", "url": "https://www.encyclopedia.com/religion/encyclopediasalmanacs-transcripts-and-maps/sao-tome-and-principe"}, {"source": "en.wikipedia.org", "url": "https://en.wikipedia.org/wiki/Religion_in_São_Tomé_and_Príncipe"}, {"source": "state.gov", "url": "https://www.state.gov/reports/2020-report-oninternational-religious-freedom/sao-tome-and-principe4.1.4Islam"}, {"source": "thearda.com", "url": "https://www.thearda.com/world-religion/national-profiles?u=195c4.1.5OtherMinorFaiths"}, {"source": "indexmundi.com", "url": "https://www.indexmundi.com/sao_tome_and_principe/religions.html4.1.6SyncreticandTraditionalAfricanBeliefs"}, {"source": "fot.humanists.international", "url": "https://fot.humanists.international/countries/africa-middle-africa/sao-tome-andprincipe/Encyclopedia.com.Op.cit"}], "contentBlocks": [{"type": "text", "html": "<h3 class=\"content-h\">4.1 Dominant Religions & Beliefs</h3>\n<ul class=\"bullets\">\n<li>● São Tomé and Príncipe is one of Africa's most thoroughly Christianized nations.</li>\n<p>According to multiple authoritative sources, Christianity in one fo
