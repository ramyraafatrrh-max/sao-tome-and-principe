me progress on women’s rights has been achieved. In Sao Tome and Principe, the adolescent birth rate is 0.4 per 1,000 women aged 15–19 as of 2018, down from 93.47 per 1,000 in 2017. In 2019, 57.7% of women of</p>\n<p>reproductive age (15-49 years) had their need for family planning satisfied with modern methods. Reference: <a href=\"https://www.iexplore.com/articles/travel-guides/africa/sao-tome-andprincipe/festivals-and-eventshttps://data.unwomen.org/country/sao-tome-and-principe2.3.9.HealthandHealthcareSystem\" target=\"_blank\" rel=\"noopener\">https://www.iexplore.com/articles/travel-guides/africa/sao-tome-andprincipe/festivals-and-eventshttps://data.unwomen.org/country/sao-tome-and-principe2.3.9.HealthandHealthcareSystem</a></p>"}, {"type": "text", "html": "<h3 class=\"content-h\">2.3.9.1 What is healthcare in Sao Tome and Principe like?</h3>\n<p>Health consciousness:</p>\n<ul class=\"bullets\">\n<li>● São Tomé and Príncipe shows mixed health consciousness, with rising</li>\n<p>awareness of some risks but persistent unhealthy behaviors amid NCD program efforts. Key Trends (2008-2019)</p>\n<li>● Overweight/obesity climbed to 51%, especially among women (58.1%),</li>\n<p>signaling low focus on diet control despite better fruit/vegetable intake (down to 53.3%).</p>\n<li>● Physical inactivity doubled to 30.9%, with women more affected, while</li>\n<p>tobacco use (8.8%) and hypertension (33.5%) stayed stable.</p>\n<li>● Positive shifts include reduced frequent alcohol (24.8%) and diabetes (1.2%),</li>\n<p>more among men, tied to partial NCD integration in primary care. Awareness Factors</p>\n<li>● Higher education links to less alcohol and poor diets but more obesity,</li>\n<p>suggesting nutrition knowledge gaps in urban/educated groups.</p>\n<li>● Limited campaigns on activity, tobacco, and diet hinder progress, per WHO</li>\n<p>reports, despite STEPS surveys boosting data-driven interventions. What about the medical facilities?</p>\n<li>● Medical facilities in São Tomé and Príncipe are extremely limited. There is</li>\n<p>one hospital in the country on the island of São Tomé, Hospital Central Ayres de Menezes, phone number 239 2-221-222. A few clinics also exist, but the service provided is very basic. For all but minor medical needs, it is necessary to travel to Libreville (Gabon), Lisbon (Portugal), or elsewhere. You should carry an ample supply of properly labeled prescription drugs and other medications with you; an adequate supply of prescription or over-thecounter drugs in local stores or pharmacies is generally not available.</p>\n<li>● Tap water may not be potable and you should drink and cook with bottled</li>\n<p>water only. Schistosomiasis, also known as bilharzia, is endemic to São Tomé and Príncipe. Schistosomiasisis a parasite that can penetrate intact skin of those swimming or bathing in fresh water from lakes, rivers and streams. It is</p>\n</ul>\n<p>recommended to avoid contact with untreated fresh water to prevent schistosomiasis infection. Reference: <a href=\"https://www.countryreports.org/country/SaoTomeandPrincipe/health.htmFrontiers\" target=\"_blank\" rel=\"noopener\">https://www.countryreports.org/country/SaoTomeandPrincipe/health.htmFrontiers</a> | Trends in bio-behavioural risk factors of non-communicable diseases among adults in Sao Tome and Principe</p>"}, {"type": "text", "html": "<h3 class=\"content-h\">2.3.9.2 The Four Most Common Diseases in Sao Tome and Principe:</h3>\n<p>1. Tuberculosis (TB) is a bacterial disease easily communicable in the first few weeks of visible symptoms. 2. Malaria, spread through mosquitoes, is an endemic for most impoverished African countries, including Sao Tome Principe. 3. Cholera is actively transmitted in many impoverished countries, including Sao Tome and Principe. 4. Necrotizing cellulitis is a rare disease, but an outbreak earlier this year has left Sao Tome and Principe vulnerable. Note: More than 1,300 cases of necrotizing cellulitis, a severe skin infection known for intense pain and swollen tissues, have been reported since September 2016. To date, every health district in the country has reported cases, and the country’s 190,000 inhabitants are at risk. Cases have been increasing but no deaths directly linked to the disease have been recorded.</p>"}, {"type": "text", "html": "<h3 class=\"content-h\">2.3.9.3 Healthcare Infrastructure in São Tomé and Príncipe</h3>\n<p>1.Hospital Central de São Tomé (São Tomé Central Hospital) ● ● ● ● ●</p>\n<p>Location: São Tomé, São Tomé and Príncipe Specialties: General Surgery, Pediatrics, Obstetrics, Emergency Care Accreditations: National Health System Certified Number of Beds: 200+ Number of Doctors: 80+</p>\n<p>2. Hospital Dr. Ayres de Menezes ● ● ● ● ●</p>\n<p>Location: São Tomé, São Tomé and Príncipe Specialties: Cardiology, Internal Medicine, Dermatology, Ophthalmology Accreditations: ISO Certified Number of Beds: 150 Number of Doctors: 60+</p>\n<p>3. Hospital de Caué ● ● ● ● Location: Caué, São Tomé and Príncipe Specialties: General Medicine, Surgery, Maternity Services, Pediatrics Accreditations: National Health System Certified Number of Beds: 100+</p>\n<p>●</p>\n<p>Number of Doctors: 40+</p>\n<p>4. Ospedale de São João Location: São João, São Tomé and Príncipe Specialties: Urology, Gastroenterology, Dermatology Accreditations: National Health System Certified Number of Beds: 80+ Number of Doctors: 35+ Reference: <a href=\"https://www.mymedicplus.com/blog/best-hospitals-in-sao-tome-andprincipe/https://www.borgenmagazine.com/common-diseases-in-sao-tome-and-principe/\" target=\"_blank\" rel=\"noopener\">https://www.mymedicplus.com/blog/best-hospitals-in-sao-tome-andprincipe/https://www.borgenmagazine.com/common-diseases-in-sao-tome-and-principe/</a> ● ● ● ● ●</p>\n<p>2.3.10. Transportation and Daily Life Taxis and Car Rental</p>\n<ul class=\"bullets\">\n<li>● Car rentals are available in the country and there are a few international</li>\n<p>companies that have a presence but the more popular options are often through local companies, which are cheaper and offer equally reliable services. The network of roads in the country is extensive, adding up to about</p>\n</ul>"}, {"type": "text", "html": "<h3 class=\"content-h\">230 miles. That said, most of the roads are in poor condition and several are</h3>\n<p>unpaved. If travelers are intent on renting a vehicle, they should consider a four-wheel drive, which is far better equipped to deal with the unpredictable nature of many routes in the country.</p>\n<ul class=\"bullets\">\n<li>● There are a few private taxi services in the country, mainly operating the</li>\n<p>route between São Tomé International Airport and the city center. There are also shared taxis in most of the cities, which are identifiable by their bright yellow color and can simply be flagged down at the side of the road. Journeys within cities have fixed prices and travelers simply need to pass the money to the front of the taxi at some point during the journey. The prices of journeys outside of the city need to be negotiated beforehand. Trains and Buses</p>\n<li>● São Tomé once had a thriving railway system but this network has since been</li>\n<p>abandoned. Today, there are no rail services in the country and while sightseeing, travelers may even stumble upon the ruins of a few old railway stations and abandoned carriages.</p>\n<li>● There are no private bus companies or coach services in the country. The</li>\n<p>only way to navigate between regions is to take a minibus taxi, which can be flagged down in cities or found waiting at communal taxi ranks. The fares for long distance trips should be agreed upon prior to departure as there are no set routes. Travelers who wish to navigate their way between islands can do so either by ferry or local airline. Reference: <a href=\"https://www.iexplore.com/articles/travel-guides/africa/sao-tome-andprincipe/transportationRentingaCarinSaoTomeIslandwithNoSecurityDeposit\" target=\"_blank\" rel=\"noopener\">https://www.iexplore.com/articles/travel-guides/africa/sao-tome-andprincipe/transportationRentingaCarinSaoTomeIslandwithNoSecurityDeposit</a></p>\n</ul>\n<ul class=\"bullets\">\n<li>● When you pick up the car, you'll often be required to leave a deposit on your</li>\n<p>credit card or debit card. Deposits vary significantly subject to the size of the vehicle and the excess amount. Car rental Security deposits in Sao Tome Island can be anywhere between £100 and £2,500. Reference: <a href=\"https://www.stressfreecarrental.com/en/car-hire-locations/sao-tomeand-principe/sao-tome-island\" target=\"_blank\" rel=\"noopener\">https://www.stressfreecarrental.com/en/car-hire-locations/sao-tomeand-principe/sao-tome-island</a></p>\n</ul>"}, {"type": "text", "html": "<h3 class=\"content-h\">2.3.11 Current Situation of Existing Inequalities in São Tomé and Príncipe</h3>\n<p>Post-Independence Evolution (1975-Present)After independence in 1975, São Tomé and Príncipe struggled to address historical inequalities. The Forros, composed of approximately 50% of the population, continued to dominate political and economic life, while the serviçais (30%) and Angolares (10%) remained marginalized. Economic Disparities: The 2021 Annual Report by the Central Bank of São Tomé and Príncipe noted high poverty rates, with about half the population living below the poverty line, particularly in rural areas. The decline of cocoa production exacerbated economic challenges, leaving rural communities—primarily comprised of serviçais and Angolares—with limited access to infrastructure and economic opportunities. Urban areas, where Forros are more concentrated, enjoy better access to services and higher income levels, as highlighted in a 2012 study by the São Tomé and Príncipe Institute for Social and Economic Research (INEP), which showed educational and income disparities between forros and other groups. Ethnic and Social Inequalities: Cultural values among the Forro population, such as clientelism and corruption, have been cited as persistent obstacles to development. Serviçais, descendants of contract laborers, often work in informal economies as \"candongueiros\" (informal traders), while Angolares, primarily involved in fishing, continue to face challenges due to their geographic isolation in southern areas like São João dos Angolares. The land reforms of the 1990s, supported by the World Bank, aimed to redistribute land to ex-serviçais but did not entirely alleviate socioeconomic disparities, particularly for rural ex-serviçais and Angolares. Urban-Rural Divide: A significant urban-rural divide exists in the country, with about 60% of the population living in urban areas that have better access to education, healthcare, and economic opportunities. Rural populations, disproportionately comprising serviçais and Angolares, suffer from higher poverty rates, with a 2020 poverty headcount ratio at $1.90 a day (2011 PPP) standing at 35.6%. This divide is exacerbated by the vulnerability of rural agricultural communities to external shocks, including climate change.</p>\n<p>Gender and Regional Disparities: A 2019 UNDP report highlights gender inequalities, noting that women in São Tomé and Príncipe have lower literacy rates and limited access to economic opportunities. Regional disparities also persist, particularly with Príncipe being less developed than São Tomé. Rural women, often from serviçais or Angolares backgrounds, face compounded disadvantages due to these intersecting factors. Reference: Inequalities in São Tomé and Príncipe</p>"}], "tables": []}, {"num": "2.4", "title": "Technological", "content": "2.4 Technological\n2.4.1 Level of Technology at schools\n● Technology in schools in São Tomé and Príncipe is still developing. According to\nthe World Bank, many schools have limited access to computers and internet,\nand teachers often lack digital training. However, international organizations like\nUNICEF and UNESCO are helping improve the situation by introducing digital\nlearning programs, training teachers, and supporting modern education systems.\nAt the university level, institutions such as the University of São Tomé and\nPríncipe offer technology-related courses, helping students gain digital skills.\nOverall, technology in education is growing but still faces challenges like\ninfrastructure and access.\n2.4.2 Main Challenges\n●\n\nLimited internet access in schools\n\n●\n\nLack of devices (computers/tablets)\n\n●\n\nTeachers need more ICT training\n\n●\n\nWeak infrastructure\n\n●\n\nImprovements Happening\n\n●\n\nDigital classrooms (UNICEF)\n\n●\n\nTeacher training programs\n\n●\n\nGovernment digital education strategies\n\n●\n\nGrowing access to internet\n\nReference: https://www.unicef.org/innocenti/stories/transforming-educationthrough-digital-learning-s%C3%A3o-tom%C3%A9-and-pr%C3%ADncipe\n\n\f2.4.3 Digital Transformation in Sao Tome & Principe\nRanking according to international reports\n● When it comes to e-government, Sao Tome and Principe’s position is\ndishearteningly low, ranking 154th globally in e-government and a dismal 187th\nin e-participation according to the UN’s metrics. This reflects not just a deficiency\nin online service provision but a systemic lag in harnessing digital tools for\ngovernance and citizen engagement. Such rankings show a glaring gap between\ninfrastructure development and the capacity to effectively utilize it for public\nbenefit.\nReference: E-Government Survey 2022 The Future of Digital Government – a Study\nby the the United Nations- Department of Economic and Social Affairs\nThe “Digital State” in São Tomé and Príncipe by end of 2025 :\n●\n\nWhile many people rely mainly on mobile phones rather than advanced\ntechnologies like computers or broadband internet, reports from the Internet\nSociety indicate that the country has low digital infrastructure capacity and\nlimited internet service options, which affects the quality and availability of\ntechnology. Overall, this shows that while technology is growing and\nbecoming more common, it is not yet fully developed or accessible to\neveryone, especially in rural or low-income areas.\n\n●\n\nA total of 154 thousand cellular mobile connections were active in São Tomé\nand Príncipe in late 2025, equivalent to 63.9 percent of the total population.\nHowever, note that some of these connections may only include services\nsuch as voice and SMS, and some may not include access to the internet.\n\n●\n\nThere were 148 thousand individuals using the internet in São Tomé and\nPríncipe at the end of 2025, when online penetration stood at 61.5 percent.\n\n●\n\nSão Tomé and Príncipe was home to 73.2 thousand social media user\nidentities in October 2025, equating to 30.3 percent of the total population.\n\nMobile connections in São Tomé and Príncipe in late 2025:\n●\n\nData from GSMA Intelligence shows that there were 154 thousand cellular\nmobile connections in São Tomé and Príncipe at the end of 2025.\n\n●\n\nGSMA Intelligence’s numbers indicate that mobile connections in São Tomé\nand Príncipe were equivalent to 63.9 percent of the total population in\nOctober 2025.\n\n●\n\nLooking at trends over time, the number of mobile connections in São Tomé\nand Príncipe increased by 4,826 (+3.2 percent) between the end of 2024 and\nthe end of 2025.\n\nReference: Digital 2026: São Tomé & Príncipe — DataReportal – Global Digital\nInsights\n\n\fWith insights from The ITU (the International Telecommunication Union), which is\nthe United Nations’ specialized agency for digital technologies\n&GSMA a global organization that represents the mobile Communication Industry\nand its members\nAnother Statistics By the end of 2024 :\nBased on the Digital Development Dashboard for São Tomé and Príncipe:\nConnectivity and Access\n●\n\nMobile broadband subscriptions: 44.6 per 100 people (2024).\n\n●\n\nMobile phone ownership: 70.9% of individuals (2024).\n\n●\n\nHousehold internet access: No recent data available.\n\nInternet Use\n●\n\nIndividuals using the Internet: 59.1% of the population (2024).\n\n●\n\nFixed broadband traffic: 2.9K GB per subscription (2005 data, no recent\nupdates).\n\n●\n\nMobile broadband traffic: 38 GB per subscription (2024).\n\nNetwork Coverage\n●\n\nPopulation coverage by mobile networks (2024):\n●\n\nAt least 2G: 97%\n\n●\n\nAt least 3G: 96%\n\n●\n\nAt least LTE/WiMAX: 96%\n\n●\n\nAt least 5G: No data\n\nKey Observations\n●\n\nSão Tomé and Príncipe has high mobile phone ownership and strong mobile\nnetwork coverage (almost universal for 2G–LTE).\n\n●\n\nInternet use is growing, with over half the population online.\n\n●\n\nBroadband traffic data is limited, but mobile broadband usage shows steady\ngrowth.\n\n●\n\nHousehold-level internet access data is missing, which makes it harder to\nmeasure digital inclusion at the family level.\n\nReference: Sao Tome and Principe data - ITU DataHub\nInternet use in São Tomé and Príncipe in Late 2025\n\n\f● At the time of report production, Kepios’s analysis of the latest available data\nindicated that there were 148 thousand internet users in São Tomé and\nPríncipe in October 2025.\n● São Tomé and Príncipe’s internet penetration rate stood at 61.5 percent of\nthe total population at the end of the year.\n● Kepios’s analysis of this data indicates that the number of internet users in\nSão Tomé and Príncipe increased by 2,904 (+2.0 percent) between\nOctober 2024 and October 2025.\n● And for added perspective, São Tomé and Príncipe’s internet adoption\nrate (i.e. the percentage of the total population that uses the internet)\nremained unchanged during the same period.\n● But these user figures also suggest that 93.0 thousand people in São Tomé\nand Príncipe did not use the internet at the end of 2025, suggesting\nthat 38.5 percent of the population\n2.4.4 Social media statistics for São Tomé and Príncipe in Late 2025\n● Proprietary analysis indicates that there were 73.2 thousand active social\nmedia user identities in São Tomé and Príncipe in October 2025.\n● For perspective, this figure was equivalent to 30.3 percent of São Tomé and\nPríncipe’s total population at the end of 2025.\n● Analysis shows that social media user identities in São Tomé and\nPríncipe increased by 8,050 (+12.4 percent) between late 2024 and the end\nof 2025.\n● Turning our attention to user demographics, data published in the ad\nplanning tools of top social media platforms indicates that there\nwere 72.6 thousand user identities aged 18 and above using social media in\nSão Tomé and Príncipe at the end of 2025, which was equivalent\nto 54.1 percent of the total population aged 18 and above.\n● At that time, 44.7 percent of São Tomé and Príncipe’s social media user\nidentities were female, while 55.3 percent were male.\n● And for added context, it may be helpful to know that 49.3 percent of São\nTomé and Príncipe’s total internet user base (regardless of age) used at least\none social media platfo\nReference: Digital 2026: São Tomé & Príncipe — DataReportal – Global Digital\nInsights\nFacebook users in São Tomé and Príncipe in Late 2025\nData published in Meta’s advertising resources indicate\nthat Facebook had 73.2 thousand users in São Tomé and Príncipe in late\n2025.\n● It may be useful to know that the company’s data indicates\nthat 54.1 percent of adults aged 18 and above in São Tomé and Príncipe used\nFacebook at the end of 2025.\n●\n\n\fAnd for additional context, Facebook’s ad reach in São Tomé and Príncipe\nwas equivalent to 49.3 percent of the local internet user base (regardless of\nage) in October 2025.\n● At the end of 2025, 47.3 percent of Facebook’s adult ad audience in São\nTomé and Príncipe was female, while 52.7 percent was male.\n●\n\nInstagram users in São Tomé and Príncipe in 2026\n●\n\n●\n\n●\n\n●\n\n●\n\n●\n\nNumbers published in Meta’s advertising tools indicate\nthat Instagram had 10.8 thousand users in São Tomé and Príncipe in late\n2025.\nThe company’s regularly revised figures suggest that Instagram’s ad reach in\nSão Tomé and Príncipe was equivalent to 4.5 percent of the total population\nat the end of the year.\nHowever, Meta only allows people aged 13 and above to use Instagram, so\nit’s also worth highlighting that 6.6 percent of the “eligible” audience in São\nTomé and Príncipe used Instagram at the time of report production.\nMeanwhile, data published in the company’s ad tools indicate\nthat 8.0 percent of adults aged 18 and above in São Tomé and Príncipe used\nInstagram at the end of 2025.\nSimilarly, it may be helpful to know that Instagram’s ad reach in São Tomé\nand Príncipe at the end of 2025 was equivalent to 7.2 percent of the local\ninternet user base (regardless of age).\nIn late 2025, 43.5 percent of Instagram’s adult ad audience in São Tomé and\nPríncipe was female, while 54.6 percent was male.\n\nReference: Digital 2026: São Tomé & Príncipe — DataReportal – Global Digital\nInsights\nTikTok users in São Tomé and Príncipe in Late 2025\nFigures published in TikTok’s advertising resources indicate\nthat TikTok had 62.0 thousand users aged 18 and above in São Tomé and\nPríncipe in late 2025.\n● Note that TikTok allows marketers to target TikTok ads to users aged 13 and\nabove via its advertising tools, but these tools only show audience data for\nusers aged 18 and above.\n● And for context, TikTok’s figures indicate that TikTok ads\nreached 46.2 percent of all adults aged 18 and above in São Tomé and\nPríncipe at the end of 2025.\n● In late 2025, 30.6 percent of TikTok’s adult ad audience in São Tomé and\nPríncipe was female, whereas 69.4 percent was male.\n●\n\n\fLinkedIn users in São Tomé and Príncipe in Late 2025:\n● Figures published in LinkedIn’s advertising resources indicate\nthat LinkedIn had 15.0 thousand “members” in São Tomé and Príncipe in late\n2025.\n● Note that LinkedIn’s advertising tools publish audience reach data based\non total registered members, rather than the monthly active users that form\nthe basis of the ad reach figures published by most other social media\nplatforms.\n● As a result, these LinkedIn figures are not directly comparable with the\nfigures for other social media platforms published on this page, or those\nshown in our Digital 2026 reports.\n● But caveats aside, the company’s own advertising reach figures suggest that\nLinkedIn’s audience in São Tomé and Príncipe was equivalent\nto 6.2 percent of the total population at the end of 2025.\n● LinkedIn’s advertising tools only publish data for users aged 18 and\nabove though, so it may be more representative to state that LinkedIn’s ads\nreached 11.2 percent of São Tomé and Príncipe’s population aged 18 and\nabove in late 2025.\n● Meanwhile, LinkedIn’s ad reach in São Tomé and Príncipe was equivalent\nto 10.1 percent of the local internet user base (regardless of age) at the end\nof the year.\n● In late 2025, 33.0 percent of LinkedIn’s ad audience in São Tomé and Príncipe\nwas female, while 67.0 percent was male.\nReference: Digital 2026: São Tomé & Príncipe — DataReportal – Global Digital\nInsights\n2.4.5 Summary\nThe Country of Sao Tome and Principe has undergone a TNA ( Technology\nNeeds Assessment) that was completed by the end of 2023 to Identify\nwhat kind of technologies are best suited to a country’s specific climate\nchange situation and assess and analyse the country’s specific needs, as\nrelates to its specific set of circumstances and utilize this data to set priorities\nand identify appropriate technologies.\n● The Main Findings and Conclusions of the study can be summarized in the\nfollowing points:\n●\n\n●\n\nFocus sectors: Energy and Transport, chosen for their high emissions and\nstrategic importance.\n\n●\n\nSão Tomé and Príncipe remains a net carbon sink but faces rising emissions in\nenergy and transport.\n\n●\n\nPrioritized technologies will guide future mitigation projects and support the\ntransition to a low-carbon, climate-resilient economy.\n\n\fThe chosen sectors for adaptation were agroforestry and water, and for mitigation,\nenergy and transport. The corresponding prioritised technologies for these sectors\nwere:\n●\n\nAgroforestry: protected cultivation integrated in greenhouses, sustainable\nagricultural land management, agro-silvo-pastoral system\n\n●\n\nWater: integrated management of hydrographic basins, water safety plan,\nconstruction and maintenance of existing dams and water reservoirs\n\n●\n\nEnergy: solar photovoltaic power plant, hydroelectric power, efficient\nmanagement of the electricity system\n\n●\n\nTransport: electric light cars, electric motorcycles, electric public transport\nwith photovoltaic roofs\n\nReference: São Tomé and Principe - Technology Needs Assessment ( Could Support\nin Enviromental too)\n\n\f2.5 Environmental", "references": [{"source": "unicef.org", "url": "https://www.unicef.org/innocenti/stories/transforming-educationthrough-digital-learning-s%C3%A3o-tom%C3%A9-and-pr%C3%ADncipe2.4.3DigitalTransformationinSaoTome&PrincipeRankingaccordingtointernationalreports"}], "contentBlocks": [{"type": "text", "html": "<h3 class=\"content-h\">2.4 Technological</h3>"}, {"type": "text", "html": "<h3 class=\"content-h\">2.4.1 Level of Technology at schools</h3>\n<ul class=\"bullets\">\n<li>● Technology in schools in São Tomé and Príncipe is still developing. According to</li>\n<p>the World Bank, many schools have limited access to computers and internet, and teachers often lack digital training. However, international organizations like UNICEF and UNESCO are helping improve the situation by introducing digital learning programs, training teachers, and supporting modern education systems. At the university level, institutions such as the University of São Tomé and Príncipe offer technology-related courses, helping students gain digital skills. Overall, technology in education is growing but still faces challenges like infrastructure and access.</p>\n</ul>"}, {"type": "text", "html": "<h3 c nd people in São Tomé</li>\n<p>and Príncipe did not use the internet at the end of 2025, suggesting that 38.5 percent of the population</p>\n</ul>"}, {"type": "text", "html": "<h3 class=\"content-h\">2.4.4 Social media statistics for São Tomé and Príncipe in Late 2025</h3>\n<ul class=\"bullets\">\n<li>● Proprietary analysis indicates that there were 73.2 thousand active social</li>\n<p>media user identities in São Tomé and Príncipe in October 2025.</p>\n<li>● For perspective, this figure was equivalent to 30.3 percent of São Tomé and</li>\n<p>Príncipe’s total population at the end of 2025.</p>\n<li>● Analysis shows that social media user identities in São Tomé and</li>\n<p>Príncipe increased by 8,050 (+12.4 percent) between late 2024 and the end of 2025.</p>\n<li>● Turning our attention to user demographics, data published in the ad</li>\n<p>planning tools of top social media platforms indicates that there were 72.6 thousand user identities aged 18 and above using social media in São Tomé and Príncipe at the end of 2025, which was equivalent to 54.1 percent of the total population aged 18 and above.</p>\n<li>● At that time, 44.7 percent of São Tomé and Príncipe’s social media user</li>\n<p>identities were female, while 55.3 percent were male.</p>\n<li>● And for added context, it may be helpful to know that 49.3 percent of São</li>\n<p>Tomé and Príncipe’s total internet user base (regardless of age) used at least one social media platfo Reference: Digital 2026: São Tomé & Príncipe — DataReportal – Global Digital Insights Facebook users in São Tomé and Príncipe in Late 2025 Data published in Meta’s advertising resources indicate that Facebook had 73.2 thousand users in São Tomé and Príncipe in late 2025.</p>\n<li>● It may be useful to know that the company’s data indicates</li>\n<p>that 54.1 percent of adults aged 18 and above in São Tomé and Príncipe used Facebook at the end of 2025. ●</p>\n</ul>\n<p>And for additional context, Facebook’s ad reach in São Tomé and Príncipe was equivalent to 49.3 percent of the local internet user base (regardless of age) in October 2025.</p>\n<ul class=\"bullets\">\n<li>● At the end of 2025, 47.3 percent of Facebook’s adult ad audience in São</li>\n<p>Tomé and Príncipe was female, while 52.7 percent was male. ●</p>\n</ul>\n<p>Instagram users in São Tomé and Príncipe in 2026 ●</p>\n<p>●</p>\n<p>●</p>\n<p>●</p>\n<p>●</p>\n<p>●</p>\n<p>Numbers published in Meta’s advertising tools indicate that Instagram had 10.8 thousand users in São Tomé and Príncipe in late 2025. The company’s regularly revised figures suggest that Instagram’s ad reach in São Tomé and Príncipe was equivalent to 4.5 percent of the total population at the end of the year. However, Meta only allows people aged 13 and above to use Instagram, so it’s also worth highlighting that 6.6 percent of the “eligible” audience in São Tomé and Príncipe used Instagram at the time of report production. Meanwhile, data published in the company’s ad tools indicate that 8.0 percent of adults aged 18 and above in São Tomé and Príncipe used Instagram at the end of 2025. Similarly, it may be helpful to know that Instagram’s ad reach in São Tomé and Príncipe at the end of 2025 was equivalent to 7.2 percent of the local internet user base (regardless of age). In late 2025, 43.5 percent of Instagram’s adult ad audience in São Tomé and Príncipe was female, while 54.6 percent was male.</p>\n<p>Reference: Digital 2026: São Tomé & Príncipe — DataReportal – Global Digital Insights TikTok users in São Tomé and Príncipe in Late 2025 Figures published in TikTok’s advertising resources indicate that TikTok had 62.0 thousand users aged 18 and above in São Tomé and Príncipe in late 2025.</p>\n<ul class=\"bullets\">\n<li>● Note that TikTok allows marketers to target TikTok ads to users aged 13 and</li>\n<p>above via its advertising tools, but these tools only show audience data for users aged 18 and above.</p>\n<li>● And for context, TikTok’s figures indicate that TikTok ads</li>\n<p>reached 46.2 percent of all adults aged 18 and above in São Tomé and Príncipe at the end of 2025.</p>\n<li>● In late 2025, 30.6 percent of TikTok’s adult ad audience in São Tomé and</li>\n<p>Príncipe was female, whereas 69.4 percent was male. ●</p>\n</ul>\n<p>LinkedIn users in São Tomé and Príncipe in Late 2025:</p>\n<ul class=\"bullets\">\n<li>● Figures published in LinkedIn’s advertising resources indicate</li>\n<p>that LinkedIn had 15.0 thousand “members” in São Tomé and Príncipe in late 2025.</p>\n<li>● Note that LinkedIn’s advertising tools publish audience reach data based</li>\n<p>on total registered members, rather than the monthly active users that form the basis of the ad reach figures published by most other social media platforms.</p>\n<li>● As a result, these LinkedIn figures are not directly comparable with the</li>\n<p>figures for other social media platforms published on this page, or those shown in our Digital 2026 reports.</p>\n<li>● But caveats aside, the company’s own advertising reach figures suggest that</li>\n<p>LinkedIn’s audience in São Tomé and Príncipe was equivalent to 6.2 percent of the total population at the end of 2025.</p>\n<li>● LinkedIn’s advertising tools only publish data for users aged 18 and</li>\n<p>above though, so it may be more representative to state that LinkedIn’s ads reached 11.2 percent of São Tomé and Príncipe’s population aged 18 and above in late 2025.</p>\n<li>● Meanwhile, LinkedIn’s ad reach in São Tomé and Príncipe was equivalent</li>\n<p>to 10.1 percent of the local internet user base (regardless of age) at the end of the year.</p>\n<li>● In late 2025, 33.0 percent of LinkedIn’s ad audience in São Tomé and Príncipe</li>\n<p>was female, while 67.0 percent was male. Reference: Digital 2026: São Tomé & Príncipe — DataReportal – Global Digital Insights</p>\n</ul>"}, {"type": "text", "html": "<h3 class=\"content-h\">2.4.5 Summary</h3>\n<p>The Country of Sao Tome and Principe has undergone a TNA ( Technology Needs Assessment) that was completed by the end of 2023 to Identify what kind of technologies are best suited to a country’s specific climate change situation and assess and analyse the country’s specific needs, as relates to its specific set of circumstances and utilize this data to set priorities and identify appropriate technologies.</p>\n<ul class=\"bullets\">\n<li>● The Main Findings and Conclusions of the study can be summarized in the</li>\n<p>following points: ●</p>\n</ul>\n<p>●</p>\n<p>Focus sectors: Energy and Transport, chosen for their high emissions and strategic importance.</p>\n<p>●</p>\n<p>São Tomé and Príncipe remains a net carbon sink but faces rising emissions in energy and transport.</p>\n<p>●</p>\n<p>Prioritized technologies will guide future mitigation projects and support the transition to a low-carbon, climate-resilient economy.</p>\n<p>The chosen sectors for adaptation were agroforestry and water, and for mitigation, energy and transport. The corresponding prioritised technologies for these sectors were: ●</p>\n<p>Agroforestry: protected cultivation integrated in greenhouses, sustainable agricultural land management, agro-silvo-pastoral system</p>\n<p>●</p>\n<p>Water: integrated management of hydrographic basins, water safety plan, construction and maintenance of existing dams and water reservoirs</p>\n<p>●</p>\n<p>Energy: solar photovoltaic power plant, hydroelectric power, efficient management of the electricity system</p>\n<p>●</p>\n<p>Transport: electric light cars, electric motorcycles, electric public transport with photovoltaic roofs</p>\n<p>Reference: São Tomé and Principe - Technology Needs Assessment ( Could Support in Enviromental too)</p>"}, {"type": "text", "html": "<h3 class=\"content-h\">2.5 Environmental</h3>"}], "tables": []}, {"num": "2.5", "title": "Environmental", "content": "2.5.1 Overview\n\nSão Tomé and Príncipe is the second smallest country in Africa and is a Small\nIsland Developing State. The country faces significant challenges in the face of\nclimate change including land degradation caused by commercial logging,\nunsustainable agriculture and competing demands for food, energy, and space,\nand increasing ocean acidification, coastal floods, and marine degradation\n● The NDC identified the most vulnerable sectors as agriculture, fisheries, and\nlivestock. Horticultural and vegetable production are highly exposed to extreme\nweather events, such as floods, droughts, and heavy rains.\n● These crops are drastically affected by pests, requiring substantial agricultural\ninputs and agrochemicals, which increases land-based waste that ends up in\ngroundwater layers and the sea.\n● The country consists of an archipelago with two main islands, São Tomé Island\nwhich is 50 km long and 30 km wide, and Príncipe Island which is about 30 km\nlong and 6 km wide. The coastal zone includes the slopes of extinct volcanoes,\nwithin which the environment is under stress from soil degradation and coastal\nerosion.\n●\n\nA Multi-Sector Investment Plan (MSIP) was developed for the country which\nemphasized the need for policy reforms that promote more sustainable and adaptive\nmanagement of the coastal zones, a new institutional framework for disaster risk\nmanagement, and a strong community engagement for coastal protection.\nReference: https://www.adaptation-undp.org/projects/scala-sao-tome-and-principe\nMulti-Sector Investment Plan (MSIP)\n\n\f2.5.2 WACA Interventions\n●\n\nOngoing activities focus on natural-based solutions through community\napproaches and hybrid solutions, when hard solutions are indispensable, beach\nnourishment, drainage, breakwaters, and coastal and riverbank revetments. On\npolicy interventions, a new law on sand extraction is being supported.\nCommunity-based adaptation is a center of the approach in Sao Tome and\nPrincipe, including support to schemes for routine maintenance of coastal\nprotection infrastructure in collaboration with district governments.\n\nKey agencies\n●\n\nThe Ministry of Infrastructure, Natural Resources and Environment is the lead\nagency for coastal resilience efforts. It has established a project implementation\nunit to coordinate project activities supported by multiple partners.\n\nReference: https://www.wacaprogram.org/country/sao-tome-and-principe\n2.5.3 Geography\n●\n●\n●\n●\n●\n\nLocation: Western Africa; islands straddling the equator in the Gulf of Guinea\nwest of Gabon.\nArea: 1,001 sq. km. (386 sq. mi.); about the size of metropolitan Indianapolis, or\none-third the size of Rhode Island.\nCities: Capital--Sao Tome. Other cities--Trinidade, Santana, Angolares, Neves,\nSanto Antonio.\nTerrain: Two small, volcanic islands.\nClimate: Tropical, with wet and dry seasons, influenced by the mountainous\ntopography.\n\nThe islands of Sao Tome and Principe, situated in the equatorial Atlantic about 300\nand 250 kilometres (200 mi. and 150 mi.), respectively, off the northwest coast of\nGabon, constitute Africa's smallest country. Both are part of an extinct volcanic\nmountain range, which also includes the island of Bioko in Equatorial Guinea to the\nnorth and Mount Cameroon on the African west coast. Sao Tome is 50 kilometres\n(31 mi.) long and 32 kilometres (20 mi.) wide and the more mountainous of the two\nislands. Its peaks reach 2,024 meters (6,640 ft.). Principe is about 30 kilometres (19\nmi.) long and 6 kilometres (4 mi.) wide. Swift streams radiating down the mountains\nthrough lush forest and cropland to the sea cross both islands.\nAt sea level, the climate is tropical--hot and humid with average yearly temperatures\nof about 27oC (80oF) and little daily variation. At the interior's higher altitudes, the\naverage yearly temperature is 20oC (68oF), and nights are generally cool. Annual\nrainfall varies from 500 centimetres (200 in.) on the southwestern slopes to 100\ncentimetres (40 in.) in the northern lowlands. The rainy season runs from October to\nMay.\nReference: https://20092017.state.gov/outofdate/bgn/saotomeandprincipe/106168.htm\n\f2.5.4 Climate:\nSão Tomé's climate is classified as tropical. The winter months are much rainier\nthan the summer months in São Tomé. This location is classified as by Köppen\nand Geiger. The average annual temperature in São Tomé is 24.7 °C | 76.4 °F.\nApproximately 1382 mm | 54.4 inch of rainfall occurs on a yearly basis.\n● São Tomé is situated close to the equator and therefore the summers are not\neasy to define. It is recommended that the optimal period for embarking on a\njourney would be during January, February, April, May, June, July, August,\nSeptember.\n●\n\nReference: https://en.climate-data.org/africa/sao-tome-and-principe/sao-tomeprovince/sao-tome-3633/\n2.5.5 What are the challenges that Sao tome and Principe facing in climate?\n1. Sea-level rise and coastal erosion\n●\n\nRising sea levels are causing coastal erosion and flooding along beaches and\nsettlements.\n\n●\n\nMany villages, roads, and infrastructure are located near the coast, making\nthem vulnerable to storms and higher waves.\n\n●\n\nCoastal erosion also threatens fishing areas, tourism sites, and homes.\n\nReference:https://www.gfdrr.org/fr/sao-tome-et-principe?utm_source=chatgpt.com\n2. More frequent floods and heavy rainfall\n●\n\nClimate change has increased intense rainfall, which leads to flash floods\nand landslides.\n\n●\n\nCities like São Tomé and Santo António often experience flooding because\ndrainage systems were not built to handle heavy rain.\n\n●\n\nFloods damage houses, roads, bridges, and crops.\n\n\fReference: https://www.worldbank.org/en/news/feature/2024/05/06/climatesmart-road-rehab-a-crucial-upgrade-for-afe-sao-tome-andprincipe?utm_source=chatgpt.com\n3. Threats to agriculture and food security\n●\n\nAgriculture is a key livelihood for many people in the country.\n\n●\n\nClimate changes such as drought, soil erosion, and unpredictable rainfall\naffect crops like cocoa and coffee.\n\n●\n\nThese changes can lead to lower food production and income for farmers.\n\nReference: https://unfccc.int/topics/resilience/workstreams/national-adaptationprogrammes-of-action/ldc-portal/country-experiences-with-napa-process/SaoTome-and-Principe?utm_source=chatgpt.com\n4. Water supply and water quality problems\n●\n\nHeavy rainfall increases runoff and sediment in rivers, making water\ntreatment difficult.\n\n●\n\nAs a result, water systems sometimes shut down, causing water shortages\nfor many people.\n\nReference: https://www.adaptation-undp.org/projects/enhance-adaptive-capacityfloods-and-water-security-sao-tome-and-principe?utm_source=chatgpt.com\n5. Limited resources to adapt to\n●\n\nAs a small developing island nation, São Tomé and Príncipe has limited\nfinancial and technical capacity to deal with climate impacts.\n\n●\n\nInfrastructure such as roads and drainage systems often cannot withstand\nstronger storms and floods.\n\nReference: https://www.worldbank.org/en/news/feature/2024/05/06/climatesmart-road-rehab-a-crucial-upgrade-for-afe-sao-tome-andprincipe?utm_source=chatgpt.com\nSão Tomé and Príncipe has started solving some of these climate problems:\nbut most solutions are still ongoing and not fully solved yet. The country is working\nwith organizations like the World Bank, UNDP, and African Development Bank to\nadapt to climate change.\n1. Coastal protection projects\nThe government built and planned projects to protect the coast from erosion and\nflooding.\n\n\f●\n\nCoastal defenses and reconstruction along the Marginal Road in São Tomé\ncity help protect the shoreline from erosion and strong waves.\n\n●\n\nThese projects include coastal barriers, road upgrades, and better\ninfrastructure to make the capital more climate resilient.\n\nThey are also restoring mangroves and beaches, which act as natural barriers\nagainst waves and floods.\nReference: https://irdeng.com/2025/07/28/project-update-agua-grande-coastalprotection-and-reconstruction-of-the-marginal-road-sao-tome-eprincipe/?utm_source=chatgpt.com\n2. Flood control and water management\nProjects are being implemented to reduce flooding and improve water systems.\n●\n\nA UNDP project is helping cities like São Tomé and Santo António improve\ndrainage systems and manage water better.\n\n●\n\nThis includes better waste management, stronger drainage, and improved\nwater supply systems.\n\nReference: https://www.adaptation-undp.org/projects/enhance-adaptive-capacityfloods-and-water-security-sao-tome-and-principe?utm_source=chatgpt.com\n3. Climate-resilient roads and infrastructure\nThe government is rebuilding roads so they can survive heavy rains and floods.\n●\n\nThe EN-1 road between São Tomé and Guadalupe was rebuilt with better\ndrainage and stronger materials.\n\n●\n\nThese roads are designed to handle strong rainfall and landslides caused by\nclimate change.\n\nReference: https://www.worldbank.org/en/news/feature/2024/05/06/climatesmart-road-rehab-a-crucial-upgrade-for-afe-sao-tome-andprincipe?utm_source=chatgpt.com\nhttps://www.cia.gov/resources/world-leaders/foreign-governments/sao-tome-andprincipe/\n\n\f2.6 Legal", "references": [{"source": "adaptation-undp.org", "url": "https://www.adaptation-undp.org/projects/scala-sao-tome-and-principeMulti-SectorInvestmentPlan"}, {"source": "wacaprogram.org", "url": "https://www.wacaprogram.org/country/sao-tome-and-principe2.5.3Geography"}, {"source": "20092017.state.gov", "url": "https://20092017.state.gov/outofdate/bgn/saotomeandprincipe/106168.htm2.5.4Climate:SãoTomé's"}, {"source": "en.climate-data.org", "url": "https://en.climate-data.org/africa/sao-tome-and-principe/sao-tomeprovince/sao-tome-3633/2.5.5WhatarethechallengesthatSaotomeandPrincipefacinginclimate?1.Sea-levelriseandcoastalerosion"}, {"source": "gfdrr.org", "url": "https://www.gfdrr.org/fr/sao-tome-et-principe?utm_source=chatgpt.com2.Morefrequentfloodsandheavyrainfall"}, {"source": "worldbank.org", "url": "https://www.worldbank.org/en/news/feature/2024/05/06/climatesmart-road-rehab-a-crucial-upgrade-for-afe-sao-tome-andprincipe?utm_source=chatgpt.com3.Threatstoagricultureandfoodsecurity"}, {"source": "unfccc.int", "url": "https://unfccc.int/topics/resilience/workstreams/national-adaptationprogrammes-of-action/ldc-portal/country-experiences-with-napa-process/SaoTome-and-Principe?utm_source=chatgpt.com4.Watersupplyandwaterqualityproblems"}, {"source": "adaptation-undp.org", "url": "https://www.adaptation-undp.org/projects/enhance-adaptive-capacityfloods-and-water-security-sao-tome-and-principe?utm_source=chatgpt.com5.Limitedresourcestoadaptto"}, {"source": "worldbank.org", "url": "https://www.worldbank.org/en/news/feature/2024/05/06/climatesmart-road-rehab-a-crucial-upgrade-for-afe-sao-tome-andprincipe?utm_source=chatgpt.comSãoToméandPríncipehasstartedsolvingsomeoftheseclimateproblems:butmostsolutionsarestillongoingandnotfullysolvedyet.ThecountryisworkingwithorganizationsliketheWorldBank,UNDP,andAfricanDevelopmentBanktoadapttoclimatechange.1.CoastalprotectionprojectsThegovernmentbuiltandplannedprojectstoprotectthecoastfromerosionandflooding"}, {"source": "irdeng.com", "url": "https://irdeng.com/2025/07/28/project-update-agua-grande-coastalprotection-and-reconstruction-of-the-marginal-road-sao-tome-eprincipe/?utm_source=chatgpt.com2.FloodcontrolandwatermanagementProjectsarebeingimplementedtoreducefloodingandimprovewatersystems"}, {"source": "adaptation-undp.org", "url": "https://www.adaptation-undp.org/projects/enhance-adaptive-capacityfloods-and-water-security-sao-tome-and-principe?utm_source=chatgpt.com3.Climate-resilientroadsandinfrastructureThegovernmentisrebuildingroadssotheycansurviveheavyrainsandfloods"}, {"source": "worldbank.org", "url": "https://www.worldbank.org/en/news/feature/2024/05/06/climatesmart-road-rehab-a-crucial-upgrade-for-afe-sao-tome-andprincipe?utm_source=chatgpt.comhttps://www.cia.gov/resources/world-leaders/foreign-governments/sao-tome-andprincipe/2.6Legal"}], "contentBlocks": [{"type": "text", "html": "<h3 class=\"content-h\">2.5.1 Overview</h3>\n<p>São Tomé and Príncipe is the second smallest country in Africa and is a Small Island Developing State. The country faces significant challenges in the face of climate change including land degradation caused by commercial logging, unsustainable agriculture and competing demands for food, energy, and space, and increasing ocean acidification, coastal floods, and marine degradation</p>\n<ul class=\"bullets\">\n<li>● The NDC identified the most vulnerable sectors as agriculture, fisheries, and</li>\n<p>livestock. Horticultural and vegetable production are highly exposed to extreme weather events, such as floods, droughts, and heavy rains.</p>\n<li>● These crops are drastically affected by pests, requiring substantial agricultural</li>\n<p>inputs and agrochemicals, which increases land-based waste that ends up in groundwater layers and the sea.</p>\n<li>● The country consists of an archipelago with two main islands, São Tomé Island</li>\n<p>which is 50 km long and 30 km wide, and Príncipe Island which is about 30 km long and 6 km wide. The coastal zone includes the slopes of extinct volcanoes, within which the environment is under stress from soil degradation and coastal erosion. ●</p>\n</ul>\n<p>A Multi-Sector Investment Plan (MSIP) was developed for the country which emphasized the need for policy reforms that promote more sustainable and adaptive management of the coastal zones, a new institutional framework for disaster risk management, and a strong community engagement for coastal protection. Reference: <a href=\"https://www.adaptation-undp.org/projects/scala-sao-tome-and-principeMulti-SectorInvestmentPlan\" target=\"_blank\" rel=\"noopener\">https://www.adaptation-undp.org/projects/scala-sao-tome-and-principeMulti-SectorInvestmentPlan</a> (MSIP)</p>"}, {"type": "text", "html": "<h3 class=\"content-h\">2.5.2 WACA Interventions</h3>\n<p>●</p>\n<p>Ongoing activities focus on natural-based solutions through community approaches and hybrid solutions, when hard solutions are indispensable, beach nourishment, drainage, breakwaters, and coastal and riverbank revetments. On policy interventions, a new law on sand extraction is being supported. Community-based adaptation is a center of the approach in Sao Tome and Principe, including support to schemes for routine maintenance of coastal protection infrastructure in collaboration with district governments.</p>\n<p>Key agencies ●</p>\n<p>The Ministry of Infrastructure, Natural Resources and Environment is the lead agency for coastal resilience efforts. It has established a project implementation unit to coordinate project activities supported by multiple partners.</p>\n<p>Reference: <a href=\"https://www.wacaprogram.org/country/sao-tome-and-principe\" target=\"_blank\" rel=\"noopener\">https://www.wacaprogram.org/country/sao-tome-and-principe</a></p>"}, {"type": "text", "html": "<h3 class=\"content-h\">2.5.3 Geography</h3>\n<p>● ● ● ● ●</p>\n<p>Location: Western Africa; islands straddling the equator in the Gulf of Guinea west of Gabon. Area: 1,001 sq. km. (386 sq. mi.); about the size of metropolitan Indianapolis, or one-third the size of Rhode Island. Cities: Capital--Sao Tome. Other cities--Trinidade, Santana, Angolares, Neves, Santo Antonio. Terrain: Two small, volcanic islands. Climate: Tropical, with wet and dry seasons, influenced by the mountainous topography.</p>\n<p>The islands of Sao Tome and Principe, situated in the equatorial Atlantic about 300 and 250 kilometres (200 mi. and 150 mi.), respectively, off the northwest coast of Gabon, constitute Africa's smallest country. Both are part of an extinct volcanic mountain range, which also includes the island of Bioko in Equatorial Guinea to the north and Mount Cameroon on the African west coast. Sao Tome is 50 kilometres (31 mi.) long and 32 kilometres (20 mi.) wide and the more mountainous of the two islands. Its peaks reach 2,024 meters (6,640 ft.). Principe is about 30 kilometres (19 mi.) long and 6 kilometres (4 mi.) wide. Swift streams radiating down the mountains through lush forest and cropland to the sea cross both islands. At sea level, the climate is tropical--hot and humid with average yearly temperatures of about 27oC (80oF) and little daily variation. At the interior's higher altitudes, the average yearly temperature is 20oC (68oF), and nights are generally cool. Annual rainfall varies from 500 centimetres (200 in.) on the southwestern slopes to 100 centimetres (40 in.) in the northern lowlands. The rainy season runs from October to May. Reference: <a href=\"https://20092017.state.gov/outofdate/bgn/saotomeandprincipe/106168.htm\" target=\"_blank\" rel=\"noopener\">https://20092017.state.gov/outofdate/bgn/saotomeandprincipe/106168.htm</a></p>"}, {"type": "text", "html": "<h3 class=\"content-h\">2.5.4 Climate:</h3>\n<p>São Tomé's climate is classified as tropical. The winter months are much rainier than the summer months in São Tomé. This location is classified as by Köppen and Geiger. The average annual temperature in São Tomé is 24.7 °C | 76.4 °F. Approximately 1382 mm | 54.4 inch of rainfall occurs on a yearly basis.</p>\n<ul class=\"bullets\">\n<li>● São Tomé is situated close to the equator and therefore the summers are not</li>\n<p>easy to define. It is recommended that the optimal period for embarking on a journey would be during January, February, April, May, June, July, August, September. ●</p>\n</ul>\n<p>Reference: <a href=\"https://en.climate-data.org/africa/sao-tome-and-principe/sao-tomeprovince/sao-tome-3633/\" target=\"_blank\" rel=\"noopener\">https://en.climate-data.org/africa/sao-tome-and-principe/sao-tomeprovince/sao-tome-3633/</a></p>"}, {"type": "text", "html": "<h3 class=\"content-h\">2.5.5 What are the challenges that Sao tome and Principe facing in climate?</h3>\n<p>1. Sea-level rise and coastal erosion ●</p>\n<p>Rising sea levels are causing coastal erosion and flooding along beaches and settlements.</p>\n<p>●</p>\n<p>Many villages, roads, and infrastructure are located near the coast, making them vulnerable to storms and higher waves.</p>\n<p>●</p>\n<p>Coastal erosion also threatens fishing areas, tourism sites, and homes.</p>\n<p>Reference:<a href=\"https://www.gfdrr.org/fr/sao-tome-et-principe?utm_source=chatgpt.com2.Morefrequentfloodsandheavyrainfall\" target=\"_blank\" rel=\"noopener\">https://www.gfdrr.org/fr/sao-tome-et-principe?utm_source=chatgpt.com2.Morefrequentfloodsandheavyrainfall</a> ●</p>\n<p>Climate change has increased intense rainfall, which leads to flash floods and landslides.</p>\n<p>●</p>\n<p>Cities like São Tomé and Santo António often experience flooding because drainage systems were not built to handle heavy rain.</p>\n<p>●</p>\n<p>Floods damage houses, roads, bridges, and crops.</p>\n<p>Reference: <a href=\"https://www.worldbank.org/en/news/feature/2024/05/06/climatesmart-road-rehab-a-crucial-upgrade-for-afe-sao-tome-andprincipe?utm_source=chatgpt.com3.Threatstoagricultureandfoodsecurity\" target=\"_blank\" rel=\"noopener\">https://www.worldbank.org/en/news/feature/2024/05/06/climatesmart-road-rehab-a-crucial-upgrade-for-afe-sao-tome-andprincipe?utm_source=chatgpt.com3.Threatstoagricultureandfoodsecurity</a> ●</p>\n<p>Agriculture is a key livelihood for many people in the country.</p>\n<p>●</p>\n<p>Climate changes such as drought, soil erosion, and unpredictable rainfall affect crops like cocoa and coffee.</p>\n<p>●</p>\n<p>These changes can lead to lower food production and income for farmers.</p>\n<p>Reference: <a href=\"https://unfccc.int/topics/resilience/workstreams/national-adaptationprogrammes-of-action/ldc-portal/country-experiences-with-napa-process/SaoTome-and-Principe?utm_source=chatgpt.com4.Watersupplyandwaterqualityproblems\" target=\"_blank\" rel=\"noopener\">https://unfccc.int/topics/resilience/workstreams/national-adaptationprogrammes-of-action/ldc-portal/country-experiences-with-napa-process/SaoTome-and-Principe?utm_source=chatgpt.com4.Watersupplyandwaterqualityproblems</a> ●</p>\n<p>Heavy rainfall increases runoff and sediment in rivers, making water treatment difficult.</p>\n<p>●</p>\n<p>As a result, water systems sometimes shut down, causing water shortages for many people.</p>\n<p>Reference: <a href=\"https://www.adaptation-undp.org/projects/enhance-adaptive-capacityfloods-and-water-security-sao-tome-and-principe?utm_source=chatgpt.com5.Limitedresourcestoadaptto\" target=\"_blank\" rel=\"noopener\">https://www.adaptation-undp.org/projects/enhance-adaptive-capacityfloods-and-water-security-sao-tome-and-principe?utm_source=chatgpt.com5.Limitedresourcestoadaptto</a> ●</p>\n<p>As a small developing island nation, São Tomé and Príncipe has limited financial and technical capacity to deal with climate impacts.</p>\n<p>●</p>\n<p>Infrastructure such as roads and drainage systems often cannot withstand stronger storms and floods.</p>\n<p>Reference: <a href=\"https://www.worldbank.org/en/news/feature/2024/05/06/climatesmart-road-rehab-a-crucial-upgrade-for-afe-sao-tome-andprincipe?utm_source=chatgpt.comSãoToméandPríncipehasstartedsolvingsomeoftheseclimateproblems:butmostsolutionsarestillongoingandnotfullysolvedyet.ThecountryisworkingwithorganizationsliketheWorldBank,UNDP,andAfricanDevelopmentBanktoadapttoclimatechange.1.CoastalprotectionprojectsThegovernmentbuiltandplannedprojectstoprotectthecoastfromerosionandflooding\" target=\"_blank\" rel=\"noopener\">https://www.worldbank.org/en/news/feature/2024/05/06/climatesmart-road-rehab-a-crucial-upgrade-for-afe-sao-tome-andprincipe?utm_source=chatgpt.comSãoToméandPríncipehasstartedsolvingsomeoftheseclimateproblems:butmostsolutionsarestillongoingandnotfullysolvedyet.ThecountryisworkingwithorganizationsliketheWorldBank,UNDP,andAfricanDevelopmentBanktoadapttoclimatechange.1.CoastalprotectionprojectsThegovernmentbuiltandplannedprojectstoprotectthecoastfromerosionandflooding</a></p>\n<p>●</p>\n<p>Coastal defenses and reconstruction along the Marginal Road in São Tomé city help protect the shoreline from erosion and strong waves.</p>\n<p>●</p>\n<p>These projects include coastal barriers, road upgrades, and better infrastructure to make the capital more climate resilient.</p>\n<p>They are also restoring mangroves and beaches, which act as natural barriers against waves and floods. Reference: <a href=\"https://irdeng.com/2025/07/28/project-update-agua-grande-coastalprotection-and-reconstruction-of-the-marginal-road-sao-tome-eprincipe/?utm_source=chatgpt.com2.FloodcontrolandwatermanagementProjectsarebeingimplementedtoreducefloodingandimprovewatersystems\" target=\"_blank\" rel=\"noopener\">https://irdeng.com/2025/07/28/project-update-agua-grande-coastalprotection-and-reconstruction-of-the-marginal-road-sao-tome-eprincipe/?utm_source=chatgpt.com2.FloodcontrolandwatermanagementProjectsarebeingimplementedtoreducefloodingandimprovewatersystems</a> ●</p>\n<p>A UNDP project is helping cities like São Tomé and Santo António improve drainage systems and manage water better.</p>\n<p>●</p>\n<p>This includes better waste management, stronger drainage, and improved water supply systems.</p>\n<p>Reference: <a href=\"https://www.adaptation-undp.org/projects/enhance-adaptive-capacityfloods-and-water-security-sao-tome-and-principe?utm_source=chatgpt.com3.Climate-resilientroadsandinfrastructureThegovernmentisrebuildingroadssotheycansurviveheavyrainsandfloods\" target=\"_blank\" rel=\"noopener\">https://www.adaptation-undp.org/projects/enhance-adaptive-capacityfloods-and-water-security-sao-tome-and-principe?utm_source=chatgpt.com3.Climate-resilientroadsandinfrastructureThegovernmentisrebuildingroadssotheycansurviveheavyrainsandfloods</a> ●</p>\n<p>The EN-1 road between São Tomé and Guadalupe was rebuilt with better drainage and stronger materials.</p>\n<p>●</p>\n<p>These roads are designed to handle strong rainfall and landslides caused by climate change.</p>\n<p>Reference: <a href=\"https://www.worldbank.org/en/news/feature/2024/05/06/climatesmart-road-rehab-a-crucial-upgrade-for-afe-sao-tome-andprincipe?utm_source=chatgpt.comhttps://www.cia.gov/resources/world-leaders/foreign-governments/sao-tome-andprincipe/\" target=\"_blank\" rel=\"noopener\">https://www.worldbank.org/en/news/feature/2024/05/06/climatesmart-road-rehab-a-crucial-upgrade-for-afe-sao-tome-andprincipe?utm_source=chatgpt.comhttps://www.cia.gov/resources/world-leaders/foreign-governments/sao-tome-andprincipe/</a></p>"}, {"type": "text", "html": "<h3 class=\"content-h\">2.6 Legal</h3>"}], "tables": []}, {"num": "2.6", "title": "Legal", "content": "2.6.1 2023 Report on International Religious Freedom\nSao Tome and Principe\n●\n\nThe constitution and the law on religious freedom provide for freedom of\nreligion and worship and equality for all, irrespective of religious belief, and\nprovide for judicial protection to all religious denominations. Both the\nconstitution and the religious freedom law grant religious groups\nautonomy and the right to teach their religion. Religious groups must register\nwith the government. Registration requires at least 500 member signatures and\nMinistry of Justice approval\n\nReligious education is not a part of the official public-school curriculum. There\nare two schools run by religious groups, one Catholic and one Seventh-day\nAdventist; both provide a general education and require all students to take\nreligion classes and the The Ministry of Education provides oversight on the\ncurricula of religious schools.\n● Article 8 from the General Constitutional Provisions enshrines the separation of\nthe state from religion.\n●\n\nReference: Sao Tome and Principe - United States Department of State\n2.6.2 The legal system in São Tomé and Príncipe\n●\n\nFormal legislation molded in diverse ways–namely as laws, law decrees, decrees,\nregulations, regional decrees, and executive regional decrees–are the primary\ninternal sources of law in São Tomé. Customary Laws also play a role in certain\nmatters, mostly to explain or go beyond the plain meaning, but only if not in\ncontradiction with the formal laws (secundum legis).\n\n●\n\nIt plays a crucial role in upholding the principles of governance and ensuring a\njust society. As a fundamental framework, it is designed to maintain order,\nsafeguard individual rights, and provide a mechanism for resolving disputes\namong individuals, organizations, and the state. The legal system is anchored in\nthe country’s Constitution, which establishes the rule of law as a cornerstone for\ndemocratic governance and civil rights.\n\n●\n\nThe Legal system is heavily influenced by Portuguese law, due to its colonial\npast, and incorporates other elements pertinent to the unique context of the\nislands. This blend of legal traditions creates a system that is both complex and\nadaptable, allowing for the evolution of legal norms in response to contemporary\nsocietal needs.\n\n●\n\nThe legal framework in São Tomé and Príncipe comprises several court types,\neach with defined functions and jurisdictions that form the backbone of the\njudiciary. The primary courts include the Constitutional Court, Administrative\nCourt, and Ordinary Courts, each serving unique roles in the legal system.\n\n\fReference: A Comprehensive Overview of the Legal System in São Tomé and Príncipe\nDiário da República of São Tomé and Príncipe (28 February 2025)\n●\n\nIt’s a Decree-Law (No. 02/2025) that sets out the structure and organization of\nthe 19th Constitutional Government of São Tomé and Príncipe. In simple terms,\nit explains how the government is arranged, which ministries exist, ( as\npreviously Stated in the Political Section) and what each one is responsible for.\n\nThe Modern Legal Foundation for Investment\nSince 2016, São Tomé and Príncipe has fundamentally overhauled its investment\nframework, creating one of the more progressive legal structures in the region. Two\ncornerstone laws define the current environment:\nInvestment Code (Decree-Law No. 19/2016) establishes the terms, conditions, and\nguarantees for all investments in STP.\nTax Benefits Code (Decree-Law No. 15/2016) details the financial and fiscal\nincentives available to investors, defining exceptional measures that reduce or\neliminate taxes to encourage economic development in priority sectors.\nTogether, these laws create a clear regulatory foundation focused on attracting\nforeign capital while ensuring equal treatment between domestic and foreign\ninvestors guarantee enshrined in both legislation and the country's Constitution.\nThe types of investment that are subject to the Investment Code are broadly\ndefined. They should relate to economic activities that are developed by companies\nthat are organized under the laws of São Tomé or that are registered within the\njurisdiction.\nThe investment framework operates on a tiered system based on project value, with\ndifferent incentive levels corresponding to investment size:\nMinimum Threshold: To qualify for guarantees and tax incentives, investments must\nequal or exceed €50,000. This relatively low barrier makes STP accessible to small\nand medium-sized investors, not just major corporations.\n2.6.2 Investments in Sao Tome and Principe\nThree Investment Regimes:\n1. Simplified Regime (€50,000 to €249,999): Projects receive 50% of the\nincentives described in the Tax Benefits Code\n2. General Regime (€250,000 to €4,999,999): Full access to standard incentives\n3. Special Regime (€5,000,000 or more): Maximum incentive package with\nnegotiated terms\nTo access these benefits, investors must enter into an Administrative Investment\nContract (AIC) with the state. This contract requires several elements: investors must\npossess at least 20% of the proposed capital available, demonstrate stable financial\n\fstanding, present clearance certificates showing no debts with the state or social\nsecurity, and provide a feasibility study demonstrating job creation and social\nresponsibility.\nCore Investment Guarantees\nThe Investment Code provides fundamental protections that address investors'\nprimary concerns:\nEqual Treatment: The law guarantees non-discriminatory treatment between\nnationals and foreigners, regardless of capital origin. Importantly, there are no\nlegal restrictions on foreign ownership of São Toméan companies—100% foreign\nownership is permitted in most sectors.\n● Expropriation Protection: The state guarantees that investment assets will not\nbe nationalized, expropriated, or requisitioned except for weighty public interest\nreasons. Even then, fair, prior, and effective compensation must be paid.\n● Management Autonomy: Public non-interference in private enterprise\nmanagement is guaranteed, except in cases expressly provided by law.\n● International Arbitration: STP is a signatory to the ICSID Convention\n(Washington Convention of 1965) and the New York Convention on arbitration,\nproviding independent dispute resolution mechanisms and reducing political risk.\n●\n\nThe Administrative Investment Contract (CAI):\nThe CAI is a formal contract between you (the investor) and the State of São Tomé\nand Príncipe. Think of it as a bilateral agreement where both parties make binding\ncommitments:\nYou commit to:\n●\n●\n●\n●\n\nInvesting a specific amount of capital\nMeeting implementation timelines\nCreating jobs and training local workers\nAchieving defined economic and social objectives\n\nThe government commits to:\n●\n●\n●\n●\n\nGranting specific tax incentives and benefits\nProtecting your investment against expropriation\nAllowing profit repatriation (subject to forex rules)\nNot interfering in your business management\n\nThis mutual commitment structure is what makes the CAI powerful. Unlike general\nlaws that can be changed by parliament, your CAI is a contract—it can only be\naltered by mutual agreement or if you violate its terms.\nPolicies toward Foreign Direct Investment\nAccording to Article 4 of the Investment Code, both domestic and foreign investors\nare free to establish and own business enterprises, as well as engage in all forms of\nbusiness activity in São Tomé and Príncipe, except in the sectors defined by law as\n\freserved for the state, specifically military and paramilitary activities, and Central\nBank operations.\nReference : São Tomé and Príncipe - United States Department of State\nAccording to Article 6 of the Investment Code (Decree-Law No. 19/2016) , it\nidentifies some areas for investment.\n●\n●\n●\n●\n●\n\nBoth citizens and foreigners can invest (while preserving and guarantying the\nfollowing\nInvestor’s Protection against discrimination (foreign and local investors are\ntreated equally).\nInvestments will not be unfairly taken away (“expropriated”) without proper\ncompensation.\nInvestments can be in areas like agriculture, tourism, energy, infrastructure, and\nservices.\nThe government encourages projects that bring technology, training, and\ninnovation.\n\nReference : Sao Tome and Principe - Investment Law 2016 | Investment Laws\nNavigator | UNCTAD Investment Policy Hub\n2.6.3 Land Access in Sao Tome and Principe\nLand access is often the most complex issue for foreign investors—and São Tomé\nand Príncipe is no exception\nAfter independence. The state became the dominant landowner & much of the\ncountry's productive land remains state-owned.\nThe restriction: São Toméan law prohibits foreign investors from possessing state\nlands.\nThe general limit: Foreign nationals can own maximum two hectares of private land.\nLand access in São Tomé and Príncipe is possible through renewable concessions,\nbut success depends less on paperwork and more on community engagement and\ncareful due diligence. The legal rights are clear, but the “social license to operate” is\nwhat determines whether a project can move forward smoothly.\nConcession System\nMechanism: Investors don’t own land outright; they receive 20-year\nconcessions, renewable automatically.\n● Rights granted: Possession, use, and enjoyment of land; lease agreements;\nexploitation rights.\n● Termination: Either party can end with 2 years’ notice.\n● Fees: Agricultural concessions cost about $10–20 per hectare/year;\ntourism/infrastructure fees are negotiated.\n●\n\nReference: Access to Land:: SaoTomeExpert\n\fArticle 17. from the General Constitutional Provisions: Foreigners in São Tomé and\nPríncipe\n●\n\nThe exercise of public office only will be permitted to foreigners provided it has a\npredominantly technical nature.\n\n●\n\nSubject to reciprocal terms, the law may grant foreign citizens resident in the\nnational territory active and passive electoral capacity for the election of the\nholders of the organs of local government.\n\n●\n\nArticle 17 of the Constitution protects the rights and integrity of foreigners.\nForeigners and displaced persons who reside or stay in São Tomé and Príncipe\nenjoy the same rights and are subject to the same obligations as a São Tomean\ncitizen, except insofar as are concerned political rights, the exercise of public\noffice, and other rights and obligations expressly reserved by law for the national\ncitizen.\n\nArticle 15. Principles of Equality\n●\n\nAll citizens are equal before the law, enjoy the same rights and are subject to the\nsame obligations\n\n●\n\nWoman is equal to man in rights and obligations, being guaranteed to her full\nparticipation in political, economic, social and cultural life.\n\nReference :São Tomé and Príncipe Legal System and Research - Globalex\n2.6.4 Regulatory Authority for Supplying Medicines\n●\n\nThe Central Supply of Medicines (Central de Aprovisionamento de\nMedicamentos) (CAME) is an institution under the Ministry of Health to supply\nthe Sao Tomean market with medicines and hospital consumables. The CAME in\nconnection with the National Medicines Fund (Fundo Nacional de\nMedicamentos) (FNM), a semi-autonomous governmental organization, is\nresponsible for procuring, stocking and distributing essential medicines for the\npublic sector on behalf of Ministry of Health (Ministry of Health of STP, n.d.-b).\n\n●\n\nAll medicines in Sao Tome and Principe are imported (Martinho do Rosário,\n2008). As of 2007, drugs are procured through the International Dispensary\nAssociation (IDA). The IDA ensures quality, though prices are low (Martinho do\nRosário, 2008).\n\nReference: Sao Tome principe | AUDA-NEPAD- AMRH\n2.6.5 Residence Visa\nFor longer stays, this visa leads to residency and is categorized by purpose. It\nrequires a valid travel document and, for minors, parental authorization.\nApplications are submitted at STP embassies or consulates, with processing up to 30\ndays.\n\f●\n\nFor Subordinate Professional Activity: Submit an employment contract with\na favorable opinion from the Ministry of Labor (issued within 20 days),\nverifying contractual terms and lack of suitable local candidates. Foreign\nworker quotas apply (preference for locals).\n\n●\n\nFor Independent Professional Activity: Prove foreign investment or sufficient\nfunds for self-employment, plus qualifications where needed.\n\n●\n\nFor Research or Highly Qualified Positions: Affiliation with recognized\nresearch centers, a job offer, and return guarantees if stay becomes irregular.\n\n●\n\nFor Study, Exchange, Internship, or Volunteer: Valid travel document;\nminors need parental consent.\n\n●\n\nFor Family Reunification: SMF notifies the Ministry of Foreign Affairs for\nimmediate issuance post-approval.\n\nAuthorizations and Procedures for Obtaining Residency\nTemporary Residence Certificate:Permanent Residence Certificate:\nOnce in STP on a residence visa, apply for a residence certificate at the SMF office or\nthrough a legal representative. General conditions include a valid visa, police\nclearance, health certificate, and proof of accommodation/funds. Processing takes\n15-30 days, with fees around STN 5,000-10,000 ($220-450).\nTemporary Residence Certificate:Valid for one year from issuance, renewable\nannually or upon changes in details. Allows work/study as per visa.\nPermanent Residence Certificate:No expiry but renew every five years or on\nchanges. Granted after several years of temporary residency, demonstrating\nintegration (e.g., language, contributions).\nExceptional Regimes\nPer a Government Decree from April 2017, citizens of certain countries (e.g., EU,\nUSA, Canada) enjoy visa-free entry for up to 15 days for tourism/business. US\ncitizens can stay up to 30 days visa-free. Chinese holders of diplomatic/special\npassports get 15 days exemption, following diplomatic reestablishment. Recent visa\nwaivers (ratified 2025) with Ghana, Mozambique, Colombia, and Dominica allow\nreciprocal 15-day stays, enhancing regional ties. Extensions are possible via SMF for\njustified reasons.\nReference: Visa and Residency for Foreigners in São Tomé and Príncipe ::\nSaoTomeExpert\n\n\f2.6.6 Religious Freedom Laws\n2.6.6.1 Constitutional Guarantees\nThe Constitution of the Democratic Republic of São Tomé and Príncipe, in its most\nrecent revision of 2003, provides robust guarantees of religious freedom. Article 27\nexplicitly declares that freedom of conscience, religion, and worship is inviolable\nspecifying that no citizen may be persecuted, deprived of rights, or exempted from\ncivic duties on account of religious conviction or practice. Article 8 establishes São\nTomé and Príncipe as a secular (lay) state, stipulating a clear separation between state\ninstitutions and all religious institutions. Article 265 criminalizes 'religious coercion',\ndefined as compelling a person to participate or abstain from religious worship, and\nprovides for up to six months' imprisonment for violations.\nReference:\n●\n●\n\nConstitute Project. Constitution of São Tomé and Príncipe (2003).\nFreedom of Thought Report: São Tomé and Príncipe. Op. cit. Humanists\nInternational.\n\n2.6.6.2 Religious Registration Process\nReligious groups must register with the government of São Tomé and Príncipe;\nhowever, the process is not onerous or discriminatory. The U.S. State Department's\n2019 and 2020 Religious Freedom Reports confirm that no group has ever been denied\nregistration, and no unregistered group has been restricted from operation. The\nregistration procedure requires:\n•\n•\n•\n•\n•\n\nSubmission of a written letter requesting authorization from the Ministry of\nJustice and Human Rights.\nSubmission of the group's statutes and meeting minutes to a notary public,\nsigned by the president and secretary.\nCertification from the Registrar's Office that no existing organization bears\nthe same name.\nPayment of notarial fees (historically approximately USD 45–50).\nPublication of approval in the official government gazette.\n\nOnce registered, a religious group enjoys the same tax-exempt status as registered\nnonprofit organizations and need not re-register. Foreign religious groups that fail to\nregister are subject to fines and possible expulsion, making timely registration a\npriority for the Coptic mission team.\n\n\fReferences :\nU.S. Department of State. 2019 Report on International Religious Freedom: São\nTomé and Príncipe.", "references": [], "contentBlocks": [{"type": "text", "html": "<h3 class=\"content-h\">2.6.1 2023 Report on International Religious Freedom</h3>\n<p>Sao Tome and Principe ●</p>\n<p>The constitution and the law on religious freedom provide for freedom of religion and worship and equality for all, irrespective of religious belief, and provide for judicial protection to all religious denominations. Both the constitution and the religious freedom law grant religious groups autonomy and the right to teach their religion. Religious groups must register with the government. Registration requires at least 500 member signatures and Ministry of Justice approval</p>\n<p>Religious education is not a part of the official public-school curriculum. There are two schools run by religious groups, one Catholic and one Seventh-day Adventist; both provide a general education and require all students to take religion classes and the The Ministry of Education provides oversight on the curricula of religious schools.</p>\n<ul class=\"bullets\">\n<li>● Article 8 from the General Constitutional Provisions enshrines the separation of</li>\n<p>the state from religion. ●</p>\n</ul>\n<p>Reference: Sao Tome and Principe - United States Department of State</p>"}, {"type": "text", "html": "<h3 class=\"content-h\">2.6.2 The legal system in São Tomé and Príncipe</h3>\n<p>●</p>\n<p>Formal legislation molded in diverse ways–namely as laws, law decrees, decrees, regulations, regional decrees, and executive regional decrees–are the primary internal sources of law in São Tomé. Customary Laws also play a role in certain matters, mostly to explain or go beyond the plain meaning, but only if not in contradiction with the formal laws (secundum legis).</p>\n<p>●</p>\n<p>It plays a crucial role in upholding the principles of governance and ensuring a just society. As a fundamental framework, it is designed to maintain order, safeguard individual rights, and provide a mechanism for resolving disputes among individuals, organizations, and the state. The legal system is anchored in the country’s Constitution, which establishes the rule of law as a cornerstone for democratic governance and civil rights.</p>\n<p>●</p>\n<p>The Legal system is heavily influenced by Portuguese law, due to its colonial past, and incorporates other elements pertinent to the unique context of the islands. This blend of legal traditions creates a system that is both complex and adaptable, allowing for the evolution of legal norms in response to contemporary societal needs.</p>\n<p>●</p>\n<p>The legal framework in São Tomé and Príncipe comprises several court types, each with defined functions and jurisdictions that form the backbone of the judiciary. The primary courts include the Constitutional Court, Administrative Court, and Ordinary Courts, each serving unique roles in the legal system.</p>\n<p>Reference: A Comprehensive Overview of the Legal System in São Tomé and Príncipe Diário da República of São Tomé and Príncipe (28 February 2025) ●</p>\n<p>It’s a Decree-Law (No. 02/2025) that sets out the structure and organization of the 19th Constitutional Government of São Tomé and Príncipe. In simple terms, it explains how the government is arranged, which ministries exist, ( as previously Stated in the Political Section) and what each one is responsible for.</p>\n<p>The Modern Legal Foundation for Investment Since 2016, São Tomé and Príncipe has fundamentally overhauled its investment framework, creating one of the more progressive legal structures in the region. Two cornerstone laws define the current environment: Investment Code (Decree-Law No. 19/2016) establishes the terms, conditions, and guarantees for all investments in STP. Tax Benefits Code (Decree-Law No. 15/2016) details the financial and fiscal incentives available to investors, defining exceptional measures that reduce or eliminate taxes to encourage economic development in priority sectors. Together, these laws create a clear regulatory foundation focused on attracting foreign capital while ensuring equal treatment between domestic and foreign investors guarantee enshrined in both legislation and the country's Constitution. The types of investment that are subject to the Investment Code are broadly defined. They should relate to economic activities that are developed by companies that are organized under the laws of São Tomé or that are registered within the jurisdiction. The investment framework operates on a tiered system based on project value, with different incentive levels corresponding to investment size: Minimum Threshold: To qualify for guarantees and tax incentives, investments must equal or exceed €50,000. This relatively low barrier makes STP accessible to small and medium-sized investors, not just major corporations.</p>"}, {"type": "text", "html":
