 to\ntime especially in districts with poor clear water supply\n● Malaria: there are hundreds of cases every year but low mortality rate\n- Uncomplicated malaria: usually can be treated locally if you reach a\nclinic or hospital.\n- Severe malaria or complications: more difficult, requires advanced\ncare and referral capacity are limited\n● Tuberculosis (TB):\n- Exists there at a notable rate, and treatment is accessible, but\nadherence and continuity of care remain a problem. According to the\nWorld Health Organization (WHO), in 2016, there was a 63% decrease\nin TB mortality since 2000, a 95% detection rate for the disease and a\n78% success rate in treating patients.\n9.2.3 Proposed Solutions:\nProposed solutions include a Mix between providing Vaccinations and Raising\nGeneral Hygienic awareness and precautions on the Short Term & enabling\nresidences through TOTs on basic nursing Skills and first Aids on the Long Term.\nProposed\nSolution\n\nTargeted Age\nGroup\n\nAwareness\nCampaigns\n\nAll Age\nGroups\n\nDesired Impact\n\nSustainability\n\n● Reducing Infections\n● Educate The public on the\nimportance of safety\n\nShort Term\n\n\f(Posters &\nVideos &\nTutorials on\nnecessary safety\nPrecautions)\n\nToT on Nursing\nSkills & Fist Aid\n\n(At schools,\npractices, encouraging\nOn Media\nthem to adopt safer\nPlatforms &\nbehaviors and protocols.\nthrough the\n● Foster and encourage\nDistribution\nbehavioral changes that\nof BTLs improve health outcomes\nPosters- in\nand safety practices.\nhospitals and\nHealthcare\nProviders &\nat Public\nSpaces)\n\n20+: 40\n\n● Equipping Residents from\nSTP with the Proper basic\nknowledge and skills on\nthe necessary\ncompetencies to handle\nvarious emergencies\neffectively which Leads to\nbetter response times and\noutcomes for patients in\nneed of immediate\nmedical attention,\nthereby enhancing the\nquality of healthcare\nservices.\n\nLong Term\n\n● Providing More Job\nOpportunities for those in\nneed.\nProviding\nVaccinations\nand proper\nMedications &\nTreatments as a\nMedical Mission\n\nAll Age\nGroups\n(From\nInfants to\nSeniors)\n\nShort Term*1\n● Prevention of Disease &\nReduced Outbreaks\n\nLong Term*2\n\n*1: Short Term – As part of a Medical Missions\n*2: Long Term – Through establishing mutual agreements between local Egyptian\nPharmaceuticals and the Ministry of Health in STP & The Central Supply of Medicines\n(Central de Aprovisionamento de Medicamentos) (CAME) to export and procure\nessential medicines (According to the Regulations in both Countries and Following\nthe proper legal Framework)\n\n\fOther Proposed solutions Include having Interactive Exercises and Workshops at\nschools or through Medical Facilities as per the following:\nIdeas\nTarget Age\nImpact\n\nSketch Idea\n\n5–12\n\nSuper Teeth Heroes\n\n5–10\n\nBone Builders\n\n6–12\n\nVaccine Defenders\n(Shield Up!)\nCancer Screening Saves\n(Early Is Powerful)\nProtect Your Mind &\nEyes\n\n30–70+\n\nClean Water Warriors\n\n12–25\n\nMalaria Shield\n\n10–25\n\nEat Smart, Stay Safe\n\n12–25\n\n(20 Seconds) That Save\nLives\n\nAll ages\n\nNatural soap Making\nWorkshops\n\n10–25\n(Under\nAdult Sup.)\n\n6–10\n\n13–19\n\nHighlights a common everyday problem:\nwanting to eat candy when hands are\ndirty (after playing, painting, gardening,\netc.)\nEncourages brushing and dental care, like\nbrushing our teeth until we finish happy\nbirthday song\nTeaches importance of calcium, milk, and\nexercise.\nExplains vaccines in a non-scary, childfriendly way.\nPromotes breast, colon, cervical\nscreening.\nTeaches healthy screen time, eye care,\nposture, and sleep balance.\nTeaches prevention of cholera through\nhygiene and safe water.\nRaises awareness about malaria\nprevention and mosquito control\nPrevents foodborne illness including\ncholera, typhoid, and diarrhea.\nPrevents spread of germs, diarrhea,\ncholera, flu, and infections.\nEncourage the Use of Natural resources\nto DIY homemade soap & encourage\nproper hand washing techniques using it.\n\n9.2.4 Mission Objectives: Healthcare and Capacity Building\nThe mission's goals are divided into immediate relief and long-term structural\nimprovement to address the country's limited medical facilities and basic care\nservices.\nShort-Term Objectives (Immediate Relief)\n●\n\nDisease Prevention and Outbreak Reduction: Provide essential vaccinations\nand proper medical treatments to all age groups (infants to seniors) to\nmitigate the spread of endemic diseases like Malaria, Cholera, and\nTuberculosis.\n\n\f●\n\nPublic Health Awareness: Launch multi-platform campaigns (posters, videos,\nand tutorials) in schools and public spaces to educate the public on safety\nprotocols and encourage behavioral changes that improve health outcomes.\n\n●\n\nSpecialized Youth Workshops: Implement interactive programs like \"Super\nTeeth Heroes\" (dental care) and \"Clean Water Warriors\" (cholera prevention)\nto engage children ages 5–12 in proactive hygiene habits.\n\nLong-Term Objectives (Sustainability)\n●\n\nLocal Empowerment through ToTs: Conduct \"Training of Trainers\" (ToT)\nprograms for residents aged 20–40 in basic nursing and first aid to ensure\nfaster emergency response times and local autonomy in healthcare.\n\n●\n\nPharmaceutical Supply Chain Integration: Establish formal legal agreements\nbetween Egyptian pharmaceutical providers and local STP authorities\n(Ministry of Health and CAME) to ensure the consistent procurement of\nessential medicines.\n\n●\n\nEconomic Opportunity: Create job opportunities for local residents by\nequipping them with recognized medical competencies and skills.\n\n9.2.5 Impact on Coptic Orthodox Church Evangelism\nThe medical mission serves as a practical expression of the Church’s ministry,\npotentially transforming its evangelistic reach in São Tomé and Príncipe through\nseveral key channels:\n1. Building Social Trust through Service\nBy addressing the \"Problem Statement\" of limited medical care, the Church\ndemonstrates a tangible commitment to the well-being of the Santomean people.\nThis \"mercy ministry\" can open doors for spiritual dialogue in communities that\nmight otherwise be hesitant to engage with a new ecclesiastical presence.\n2. Holistic Community Engagement\nThe mission targets every demographic—from children in schools to seniors in\nhospitals. This broad reach allows the Church to establish a presence across various\nsocial strata, moving beyond simple preaching to becoming a vital community\npartner in public health.\n3. Sustainable Presence and Integration\nThe focus on long-term solutions, such as ToT programs and pharmaceutical\nagreements, ensures that the Church’s impact is not seen as a \"one-off\" event. By\ninvesting in the local workforce and legal healthcare framework, the Church fosters\n\fdeep-rooted relationships with both the government and the citizenry, providing a\nstable platform for long-term evangelism.\n4. Direct Outreach via Educational Content\nInteractive workshops and \"Sketch Ideas\" provide a unique opportunity to blend\nhealth education with Christian values of stewardship and care for the body.\nPrograms like \"Protect Your Mind & Eyes\" for teens allow the Church to provide\nguidance on modern lifestyle challenges, positioning it as a relevant voice for the\nyounger generation.\n\nDraft reports as Provided by the WHO\n\n\fPage. 144\n\n\fPage. 145", "references": []}]}};

const CH_ICONS = {'1':'🌍','2':'📊','3':'👥','4':'⛪','5':'⚖️','6':'🤝','7':'✝️','8':'✈️','9':'💡'};

let state = { page:'home', chapter:null, section:null };

// ── PAGE TRANSITIONS ──────────────────────────────────────────────
const PAGES = { home:'homePage', chapter:'chapterPage', section:'sectionPage' };

function navigate(to) {
  const fromKey = state.page;
  const fromEl  = document.getElementById(PAGES[fromKey]);
  const toEl    = document.getElementById(PAGES[to]);

  const goingForward = (to === 'chapter' && fromKey === 'home')
                    || (to === 'section' && (fromKey === 'chapter' || fromKey === 'home'));

  // Remove stale classes
  Object.values(PAGES).forEach(id => {
    const el = document.getElementById(id);
    el.classList.remove('active','exit-left');
    el.style.transform = '';
    el.style.opacity   = '';
  });

  if (goingForward) {
    // current slides out to left
    fromEl.classList.add('exit-left');
    // incoming slides in from right (default transform:translateX(100%))
    // small delay so both animate simultaneously
    requestAnimationFrame(() => {
      toEl.classList.add('active');
    });
  } else {
    // going back — current slides right, incoming comes from left
    fromEl.style.transform = 'translateX(100%)';
    fromEl.style.opacity   = '0';
    fromEl.style.transition = `transform var(--dur) var(--ease), opacity var(--dur) var(--ease)`;

    toEl.style.transform = 'translateX(-6%)';
    toEl.style.opacity   = '0';
    toEl.style.transition = 'none';
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        toEl.style.transition = `transform var(--dur) var(--ease), opacity var(--dur) var(--ease)`;
        toEl.style.transform  = 'translateX(0)';
        toEl.style.opacity    = '1';
        toEl.classList.add('active');
      });
    });
  }

  state.page = to;
  toEl.scrollTop = 0;
}

  grid.innerHTML = Object.entries(DATA).map(([k, ch]) => {

    return `<div class="chapter-card" onclick="openChapter('${k}')">
      <div class="card-icon">${CH_ICONS[k]||'📄'}</div>
      <div class="card-title">${ch.name}</div>
      <div class="card-meta">${n} section${n!==1?'s':''}</div>
      <div class="card-arrow">Explore

          <path d="M5 12h14M12 5l7 7-7 7"/>

      </div>

}

  const ch = DATA[k];

  document.getElementById('chapterTitle').textContent = ch.name;
  document.getElementById('chapterCrumb').innerHTML =
    `<span class="breadcrumb-sep">›</span> ${ch.name}`;

  const grid = document.getElementById('sectionsGrid');
  let cards = ch.sections.map((sec, i) =>
    `<div class="section-card" onclick="openSection('${k}','${i}')">
      <div class="sec-title">${sec.title}</div>
      <div class="sec-arrow">View details →</div>

    cards.push(`<div class="section-card tool-card" onclick="openTravelTool('flights')">

      <div class="sec-title">Search Flights — Cairo to São Tomé</div>

// ── SECTION ───────────────────────────────────────────────────────
function openSection(k, idx) {
  state.chapter = k;
  state.section = idx;
  const ch  = DATA[k];

}

          <p><strong>Airbnb:</strong> Limited listings on Príncipe — Booking.com has the widest selection for both islands.</p>
        </div>
        <div class="btn-row" style="margin-top:16px">
          <a class="cta-btn ocean" href="https://www.booking.com/searchresults.html?ss=S%C3%A3o+Tom%C3%A9+and+Pr%C3%ADncipe" target="_blank" rel="noopener">🔍 All Accommodation in STP</a>
        </div>
      </div>
      ${buildRefs([])}`;
  }

  navigate('section');
}

// ── HELPERS ───────────────────────────────────────────────────────
function switchTab(btn, paneId) {
  const wrap = btn.closest('.section-body');
  wrap.querySelectorAll('.subtab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  wrap.querySelectorAll('.subtab-pane').forEach(p => p.classList.remove('active'));
  document.getElementById(paneId).classList.add('active');
}

function stripNums(s) {
  // Remove leading section numbers like "1.1", "2.3.4", "1.1." etc.
  return s.replace(/^\d+(\.\d+)+\.?\s+/, '').trim();
}

function fmtText(text) {
  if (!text) return '<p>No content available.</p>';
  const lines = text.split('\n').filter(l => !l.match(/^Page\.\s*\d+\s*$/));
  const paras = []; let cur = [];
  for (const line of lines) {
    const t = line.trim();
    if (!t) { if (cur.length){ paras.push(cur.join(' ')); cur=[]; } }
    else cur.push(t);
  }
  if (cur.length) paras.push(cur.join(' '));
  return paras.map(p => {
    if (!p) return '';
    const clean = stripNums(p);
    if (!clean) return '';
    // Sub-headings (formerly numbered) rendered bold
    if (p.match(/^\d+\.\d+/)) return `<p><strong style="color:var(--ocean-mid)">${clean}</strong></p>`;
    return `<p>${clean}</p>`;
  }).filter(Boolean).join('');
}

function renderSwot(text) {
  const r={s:[],w:[],o:[],t:[]}; let cur=null;
  for (const line of text.split('\n')) {
    const t=line.trim(); const l=t.toLowerCase();
    if(l.includes('strength')){cur='s';continue}
    if(l.includes('weakness')){cur='w';continue}
    if(l.includes('opportunit')){cur='o';continue}
    if(l.includes('threat')){cur='t';continue}
    if(cur&&t.length>3&&!t.match(/^Page\.\s*\d+/))r[cur].push(t.replace(/^[•●\-*]+\s*/,''));
  }
  return `<div class="swot-grid">
    <div class="swot-q swot-s"><h4>💪 Strengths</h4><ul>${r.s.map(x=>`<li>${x}</li>`).join('')}</ul></div>
    <div class="swot-q swot-w"><h4>⚠️ Weaknesses</h4><ul>${r.w.map(x=>`<li>${x}</li>`).join('')}</ul></div>
    <div class="swot-q swot-o"><h4>🌱 Opportunities</h4><ul>${r.o.map(x=>`<li>${x}</li>`).join('')}</ul></div>
    <div class="swot-q swot-t"><h4>🔴 Threats</h4><ul>${r.t.map(x=>`<li>${x}</li>`).join('')}</ul></div>
  </div>`;
}

function buildRefs(refs) {
  const noRefs = `<div class="no-refs">No references recorded for this section.</div>`;
  if (!refs||!refs.length) return `<div class="refs-wrap"><div class="refs-heading">References</div>${noRefs}</div>`;
  const rows = refs.map((r,i)=>{
    const src=(r.source||'').replace(/[<>]/g,'').substring(0,90);
    const url=r.url||''; const disp=url.length>60?url.substring(0,60)+'…':url;
    return `<tr><td>${i+1}</td><td>${src||'—'}</td><td>${url?`<a href="${url}" target="_blank" rel="noopener">${disp}</a>`:'—'}</td></tr>`;
  }).join('');
  return `<div class="refs-wrap">
    <div class="refs-heading">References</div>
    <table class="refs-table">
      <thead><tr><th>#</th><th>Source</th><th>URL</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;
}

buildHome();


// ===== GitHub Pages overlap fix: ensure only ONE .page is active =====
(function(){
  function showPage(id){
    document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
    const el = document.getElementById(id);
    if(el) el.classList.add('active');
    // reset scroll for consistent UX
    window.scrollTo(0,0);
  }
  // If navigate is defined earlier, override it safely.
  window.navigate = function(target){
    if(target === 'home') return showPage('homePage');
    if(target === 'chapter') return showPage('chapterPage');
    if(target === 'section') return showPage('sectionPage');
    // fallback: allow navigate('homePage') etc.
    return showPage(target);
  };
  // Expose showPage for internal use if needed
  window.__showPage = showPage;
})();
</script>
